    ['<div class="terminologyEntry">    <div class="term">τύραννος</div>    <div class="definitionNL"><b>Definition</b>: Απόλυτος άρχοντας που καταλαμβάνει την εξουσία με βίαια ή με παράνομα μέσα. Καταπιεστικός κυβερνήτης.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: tyrant (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Tyrant&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /role/, /an oppressive ruler/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Role&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 3</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>pyrrhus tyrant of syracuse</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>aristion tyrant of athens</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>machanidas tyrant of sparta</strong></div></div></div>'],

function show_selected() {
    var selector = document.getElementById('idTerm');
    var champ = dictionnaire[selector[selector.selectedIndex].value][0];
    document.getElementById('display').innerHTML = champ;
}
document.getElementById('idTerm').addEventListener('change', show_selected);

searchBox = document.querySelector("#searchBox");
entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});

</script>
