    ['<div class="terminologyEntry">    <div class="term">coin</div>    <div class="definitionNL"><b>Definition</b>: A small, flat, round piece of metal used as money. Coins are also valuable archaeological finds because they can provide important insights into the history, culture, economics, and politics of the societies that produced them.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: νόμισμα (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Coin&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/, /a material source/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Source&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">consul</div>    <div class="definitionNL"><b>Definition</b>: The highest-ranking magistrates in the Roman Republic. They were annually elected, ruled jointly, and played a crucial role in the political and military leadership of the state.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: ύπατος (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Consul&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /role/, /one of the two annually elected chiefs who ruled jointly the roman republic/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Role&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 7</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>marcus perpena roman consul</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>manius acilius roman consul</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>marcus antonius roman consul</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>pompey roman consul</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>marcus junius brutus roman consul</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>gnaeus fulvius centumalus roman consul</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>lucius aemilius paullus roman consul</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">coup</div>    <div class="definitionNL"><b>Definition</b>: A sudden, illegal, and often violent seizure of power from a government or ruler by a small group of conspirators.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: πραξικόπημα (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Coup&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /unlawful/, /violent/, /a violent and unlawful seizure of power from a ruler or political group/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political unlawful violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 1</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>coup of cleomenis III of sparta</strong></div></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">election</div>    <div class="definitionNL"><b>Definition</b>: A formal and lawful political process where citizens vote to choose a candidate for a political position or to express their preference on a specific issue.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: εκλογή (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Election&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /lawful/, /non-violent/, /formal choice by vote of a person for a political position /</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political lawful non-violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">emperor</div>    <div class="definitionNL"><b>Definition</b>: Ruler of an empire. A monarch who rules over an empire or a large territory composed of multiple nations, cultures, or kingdoms. </div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: αυτοκράτορας (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Emperor&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /role/, /ruler of an empire/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Role&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 1</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>gaius octavius roman emperor</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">event</div>    <div class="definitionNL"><b>Definition</b>: A planned public or social occasion that takes place at a specific time and location. In particular, a historical event is a significant occurrence that has shaped or influenced the course of human history, often leading to political, social, economic, or cultural changes.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: γεγονός (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 5</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>death of antigonus I</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>death of alexander the great</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>death of lysimachos</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>earthquake at rhodes</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>illyrian war ii</strong></div></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">historian</div>    <div class="definitionNL"><b>Definition</b>: A scholar who studies, researches, interprets, and writes about the past. Historians analyze and contextualize historical events, people, cultures, and processes to deepen our understanding of human experiences and societal changes over time. </div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: ιστορικός (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Historian&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/, /writer of source/, /studies about events and periods of history/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Author&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isAuthorOf</i></u>: &lt;Text&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 1</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>diodorus siculus</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/1/1d/Diodoro_siculo_-_storico_di_Agira.jpg" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/1/1d/Diodoro_siculo_-_storico_di_Agira.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/1/1d/Diodoro_siculo_-_storico_di_Agira.jpg</a></div></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">inscription</div>    <div class="definitionNL"><b>Definition</b>: A form of writing that is engraved, etched or otherwise permanently marked on a durable surface such as stone, metal, wood or clay. Inscriptions are often created to memorialize, document or transmit information in a enduring way. </div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: επιγραφή (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Inscription&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/, /a written source on stone/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Source&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">intellectual event</div>    <div class="definitionNL"><b>Definition</b>: An occurrence that influences, shapes, or transforms the way individuals or collective entities think, learn, reason, or understand the world.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: πνευματικό γεγονός (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event intellectual&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /intellectual/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div>    <div class="concept"><b>Comment</b>: An intellectual event can be a religional festival or the uploading of a theatrical play.</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">intellectual function</div>    <div class="definitionNL"><b>Definition</b>: A role or fuction affecting the intellectual life of a group or community.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: πνευματική λειτουργία (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Function intellectual&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /function/, /intellectual/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Function&gt;</div></div></div><div class="otherEntry"></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">location</div>    <div class="definitionNL"><b>Definition</b>: A specific place or position on the Earth&apos;s surface, defined by its geographical coordinates, address, or other identifying characteristics.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: τοποθεσία (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Location&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /location/</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isLocationOf</i></u>: &lt;Event&gt;, &lt;Location&gt;</div>    <div class="concept"><b>Comment</b>: The location of an event can take place on land or sea. A land location can be a city or an island, whereas a marine location can be an open sea. </div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 1</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>iran</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a8/Iran_%28orthographic_projection%29.svg" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/a/a8/Iran_%28orthographic_projection%29.svg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/a/a8/Iran_%28orthographic_projection%29.svg</a></div></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">military event multi-location multi-time</div>    <div class="definitionNL"><b>Definition</b>: A military event that is violent, occurs across multiple locations, and spans multiple time periods, such as a large-scale, prolonged conflict or a series of interconnected military operations.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: βίαιο στρατιωτικό γεγονός σε πολλά μέρη ταυτόχρονα (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event military violent multi-location multi-time&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /military/, /violent/, /multi-location/, /multi-time/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event military violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 11</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>invasion in syria and phoinicia</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>invasion of pyrrhus in italy</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>conquest of the parthians</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>illyrian war i</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/1/12/Queen_Teuta_orders_the_murder_of_Roman_ambassadors.jpg" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/1/12/Queen_Teuta_orders_the_murder_of_Roman_ambassadors.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/1/12/Queen_Teuta_orders_the_murder_of_Roman_ambassadors.jpg</a></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>antiochus III distracts land from pergamon</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>second punic war</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Map_of_Rome_and_Carthage_at_the_start_of_the_Second_Punic_War.svg" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/6/6a/Map_of_Rome_and_Carthage_at_the_start_of_the_Second_Punic_War.svg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/6/6a/Map_of_Rome_and_Carthage_at_the_start_of_the_Second_Punic_War.svg</a></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>temporary repossesion of the east satrapies by antiochus III</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>naval operations of phillip V in the aegean</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>mithidrates I distracts midia from the seleucid kingdom</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>occupation of cappadocia by mithidrates vi</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>reorganization of anatolia by pompey</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">military event multi-time single location</div>    <div class="definitionNL"><b>Definition</b>: A military event that is violent, occurs over multiple time periods, but is confined to a single location typically refers to a prolonged siege, a series of battles or campaigns focused on a specific geographical area, or a recurring conflict centered around a particular strategic site,</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: βίαιο στρατιωτικό γεγονός σε πολλούς χρόνους σε μια τοποθεσία (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event military multi-time single location&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /military/, /violent/, /multi-time/, /single-location/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event military violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">military event non-violent</div>    <div class="definitionNL"><b>Definition</b>: Activities or occurrences involving armed forces that do not entail combat or the use of force. </div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: μη βίαιο στρατιωτικό γεγονός (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event military non-violent&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /military/, /non-violent/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event military&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 1</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>romans withdrawal from greece</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">military event violent</div>    <div class="definitionNL"><b>Definition</b>: An occurrence or activity involving armed forces that results in the use of force, combat, and typically, casualties.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: βίαιο στρατιωτικό γεγονός (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event military violent&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /military/, /violent/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event military&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 2</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>murder of alexander balas in battle</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>captivity of mithidrates by tigranes of armenia</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">military function</div>    <div class="definitionNL"><b>Definition</b>: Roles, responsibilities, and activities performed by a person or a group belonging to the armed forces,</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: στρατιωτική λειτουργία (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Function military&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /function/, /military/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Function&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">monument</div>    <div class="definitionNL"><b>Definition</b>: A structure or statue created to commemorate a person, event, or significant historical moment.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: μνημείο  (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Monument&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/, /a structure in memory of event or person/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Source&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">mythological agent</div>    <div class="definitionNL"><b>Definition</b>: A character or entity from mythology that plays an active role in myths, legends, and similar narratives helping to explain the origins of the world, human experiences, and moral lessons within a particular culture.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: μυθολογικός παράγοντας (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Mythological Agent&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /agent/, /non human/, /mythological/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Agent non human&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">natural agent </div>    <div class="definitionNL"><b>Definition</b>: Entity or force in the natural world that causes change or has an effect on the environment or other living organisms. </div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: φυσικός παράγοντας (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Natural Agent&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /agent/, /non human/, /natural/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Agent non human&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">naval battle</div>    <div class="definitionNL"><b>Definition</b>: Battle taking place at sea.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: ναυμαχία (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event military violent single time single location sea&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /military/, /violent/, /single-time/, /single-location/, /battle taking place on sea /</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event military violent single time single location&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 3</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>naval battle of salamis (cyprus)</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>naval battle of kos</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>naval battle of andros</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">non human agent</div>    <div class="definitionNL"><b>Definition</b>: Any entity or force that influences events, processes, or outcomes without being a human being.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: μη ανθρώπινος παράγοντας (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Agent non human&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /agent/, /non human/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Agent&gt;</div>    <div class="concept"><b>Comment</b>: This concept determines an agent that is not human. This could be a natural, amythological </div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">non-violent demonstration</div>    <div class="definitionNL"><b>Definition</b>: A peaceful protest, where participants express their views, demands, or grievances without resorting to violence.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: μη βίαιη διαδήλωση  (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Non violent demonstration&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /unlawful/, /non-violent/, /a non-violent public meeting or protest /</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political unlawful non-violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">orator</div>    <div class="definitionNL"><b>Definition</b>: A person who is skilled in public speaking, particularly someone who delivers speeches in a formal or influential manner. </div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: ρήτορας (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Orator&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/, /writer of source/, /has skills in speaking in public/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Author&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isAuthorOf</i></u>: &lt;Text&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 2</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>athenian orator</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>hyperidis orator</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">papyrus</div>    <div class="definitionNL"><b>Definition</b>: A type of material that was used in ancient times as a writing surface, similar to paper. </div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: πάπυρος  (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Papyrus&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/, /a written source on papyrus/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Source&gt;</div></div></div><div class="otherEntry"></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">politcal lawful event</div>    <div class="definitionNL"><b>Definition</b>: An occurrence or action related to politics that is conducted within the boundaries of the law and adheres to legal norms and regulations.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: νόμιμο πολτικό γεγονός (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event political lawful&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /lawful/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 4</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>establishment of cassandria and thessaloniki</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>establishment of seleukeia of pieria and antioch</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>establishment of kingdom of pontus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>establishment of demetrias</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">political event</div>    <div class="definitionNL"><b>Definition</b>: Any occurrence or activity related to politics that involves the exercise, expression, or impact of political power, policy, or governance. </div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: πολιτικό γεγονός (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event political&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div>    <div class="concept"><b>Comment</b>: A political event can be lawful, such as an election event or unlawful, such as a coup. Also, a potical lawful event can be violent (ex. egal repression of a riotous crowd) or non-violent (ex. trial).</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">political event lawful non-violent</div>    <div class="definitionNL"><b>Definition</b>: A political activity or occurrence that is conducted in compliance with legal regulations and without the use of violence. </div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: πολιτικό γεγονός νόμιμο μη βίαιο (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event political lawful non-violent&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /lawful/, /non-violent/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political lawful&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 12</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>partition of triparadisus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>alexandria becomes capital of egypt</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>sale of aegina to attalus I</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>declaration of the freedom of the greeks from phillip V</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>restorement of the rights of the jews</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>reco     ['<div class="terminologyEntry">    <div class="term">primary source</div>    <div class="definitionNL"><b>Definition</b>: Original document or object created during the time of a historical event. They provide firsthand evidence and direct insights into the past.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: πρωτογενής πηγή (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Primary&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/, /original documents and objects created at the same time of the historical event/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Text&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>refersToEvent</i></u>: &lt;Event&gt;</div><div class="definitionFormal"> <u><i>hasAuthor</i></u>: &lt;Author&gt;</div>    <div class="concept"><b>Comment</b>: A source is thought to be primary when it is direct evidence of an event because it was created by people that were there at the time of the event.</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 26</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>agis</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>antiquities of the jews</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>antony</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>bibliotheca historica</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>life of cleomenes</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>demetrius</strong></div     ['<div class="terminologyEntry">    <div class="term">reform</div>    <div class="definitionNL"><b>Definition</b>: A lawful, non-violent process aimed at bringing about political, economic, or social changes to improve the state or society.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: μεταρρύθμιση (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Reform&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /lawful/, /non-violent/, /political economic or social changes for the improvement of the state/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political lawful non-violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">religious event</div>    <div class="definitionNL"><b>Definition</b>: A gathering, ceremony, or observance that holds spiritual significance for a particular religious community.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: θρησκευτικό γεγονός (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event religious&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /religious/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div>    <div class="concept"><b>Comment</b>: A religious event can be lawful, such as a festival or animal sacrifice in the context of ritual that takes place in a sacred temple or unlawful, such as teh sarifice of a human or a violent ritual.</div></div></div><div class="otherEntry"></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">religious function</div>    <div class="definitionNL"><b>Definition</b>: A specific position or function within a religious community or organization that carries responsibilities related to spiritual leadership, guidance, ritual performance, and the maintenance of religious traditions. </div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: θρησκευτική λειτουργία (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Function religious&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /function/, /religious/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Function&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">revolt</div>    <div class="definitionNL"><b>Definition</b>: An unlawful, violent, and often sudden overthrow of the existing social, political, or economic order, typically involving a significant change in power structures and governance.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: επανάσταση (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Revolt&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /unlawful/, /violent/, /a forcible overthrow of the social order in power/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political unlawful violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 8</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of athens</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of arthens and release of peiraias</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>maccabean revolt</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of messene against the achean league</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of the macedonians against rome</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"     ['<div class="terminologyEntry">    <div class="term">role</div>    <div class="definitionNL"><b>Definition</b>: A set of behaviors, duties, and expectations associated with a particular position or function in society, an organization, or a specific context.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: ιδιότητα/ρόλος (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Role&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /role/</div>    <div class="concept"><b>Comment</b>: The role of the human agent, for example if he is a king or a general. </div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 2</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>satrap of egypt</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>ruler of southern greece</strong></div></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">sea </div>    <div class="definitionNL"><b>Definition</b>: A large body of salt water partially or fully enclosed by land.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: θαλάσσια τοποθεσία (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Location sea&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /location/, /sea/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Location&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isLocationOf</i></u>: &lt;Event&gt;, &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 5</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>aegean sea</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Aegean_Sea_map.png" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/f/fe/Aegean_Sea_map.png" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/f/fe/Aegean_Sea_map.png</a></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>ionian sea</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6e/Ionian_sea_islands%2C_pic1.JPG" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/6/6e/Ionian_sea_islands%2C_pic1.JPG" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/6/6e/Ionian_sea_islands%2C_pic1.JPG</a><     ['<div class="terminologyEntry">    <div class="term">secondary source</div>    <div class="definitionNL"><b>Definition</b>: A written work that analyzes, interprets, or comments on primary sources or historical events.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: δευτερογενής πηγή (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Secondary &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/, /gives information about a primary source/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Text&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>refersToEvent</i></u>: &lt;Event&gt;</div><div class="definitionFormal"> <u><i>hasAuthor</i></u>: &lt;Author&gt;</div>    <div class="concept"><b>Comment</b>: A source is thought to be secondary when it constitutes a document that refers to an event that it has been referred first in an another source before.</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">sedition</div>    <div class="definitionNL"><b>Definition</b>: An unlawful, violent uprising in which people are called upon to rebel against established authority, typically a government or ruling power.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: στάση (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Sedition&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /unlawful/, /violent/, /call out to the people for rebellion/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political unlawful violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">siege</div>    <div class="definitionNL"><b>Definition</b>: A prolonged military operation in which enemy forces surround a city or fortified location with the aim of capturing it, often by cutting off supplies and communication until the defenders surrender or are defeated.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: πολιορκία (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event military multi-time single location city&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /military/, /violent/, /multi-time/, /single-location/, /military operation in which enemy forces surround a city/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event military multi-time single location&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 5</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>siege of athens by sulla</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>siege of macedonia</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>siege of athens by demetrius poliorcetes</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>siege of athens by cassander</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>siege of jeru     ['<div class="terminologyEntry">    <div class="term">slave</div>    <div class="definitionNL"><b>Definition</b>: A person forced to word for and obey another person, treated as their property, typically without compensation and under the threat of violence.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: δούλος (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Slave&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /role/, /a person forced to word for and obey another person and is considered their property /</div><div class="definitionFormal"><b>a kind of</b>: &lt;Role&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">source</div>    <div class="definitionNL"><b>Definition</b>: Any material or information that provides evidence or insights about past events, people, cultures, or societies. Sources are crucial for understanding and interpreting the past. </div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: πηγή (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Source&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/</div>    <div class="concept"><b>Comment</b>: This concept constitutes the kind, the type and the writer or a maker of the source that an event is reported in.</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">text</div>    <div class="definitionNL"><b>Definition</b>: A piece of written material, typically consisting of words, sentences, and paragraphs, that conveys information, ideas, or stories.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: κείμενο (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Text&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Source&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>refersToEvent</i></u>: &lt;Event&gt;</div><div class="definitionFormal"> <u><i>hasAuthor</i></u>: &lt;Author&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 2</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>alexander</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>the wars of the jews</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">trial</div>    <div class="definitionNL"><b>Definition</b>: A formal examination of evidence in order for a person to be judged guilty or innocent.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: δίκη (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Trial&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /lawful/, /non-violent/, /a formal examination of evidence in order a person to be judged guilty or innocent/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political lawful non-violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">truce</div>    <div class="definitionNL"><b>Definition</b>: A cease-fire, an agreement between opposite sides in a war to stop fighting for a certain period of time.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: εκεχειρία (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Truce&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /military/, /non-violent/, /an agreement between opposite sides in a war to stop fighting for a certain period of time/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event military non-violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 4</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>truce of phoenice</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>treaty of apamea</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>treaty between rome and rhodes</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>treaty of the roman empire with the aetolian league against phillip v</strong></div></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">violent event</div>    <div class="definitionNL"><b>Definition</b>: An event characterized by violence can take many forms, depending on the context, e.g. military (battle, skirmish, insurgency), criminal (assault, murder), social (civil unrest, lynching), domestic, interpersonal, political (revolution).</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: βίαιο γεγονός (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event violent&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /violent/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">violent military event single time</div>    <div class="definitionNL"><b>Definition</b>: A type of military event that is violent and occurs at a single point in time. This could be described as a military battle or engagement.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: βίαιο στρατιωτικό γεγονός που συνέβη μια φορά (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event military violent single time&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /military/, /violent/, /single-time/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event military violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 2</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>syria becomes a roman province</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>invasion of parthians in syria</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">war</div>    <div class="definitionNL"><b>Definition</b>: Military event multi-location multi-time a state of armed conflict between different nations or states or different groups within a country or state.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: πόλεμος (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Armed conflict&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /military/, /violent/, /multi-location/, /multi-time/, /a state of armed conflict between different nations or states or different groups within a country or state/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event military violent multi-location multi-time&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 36</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>end of the civil war in the ptolemaic dynasty</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>war of marcus antonius against the cilician pirates</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>mithidratic war i</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>social war/aetolian war</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>wars of the succesors</strong>< function show_selected() {
    var selector = document.getElementById('idTerm');
    var champ = dictionnaire[selector[selector.selectedIndex].value][0];
    document.getElementById('display').innerHTML = champ;
}
document.getElementById('idTerm').addEventListener('change', show_selected);

searchBox = document.querySelector("#searchBox");
entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});

</script>
