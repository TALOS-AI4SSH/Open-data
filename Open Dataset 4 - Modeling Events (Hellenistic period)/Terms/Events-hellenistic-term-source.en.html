    ['<div class="terminologyEntry">    <div class="term">philosopher</div>    <div class="definitionNL"><b>Definition</b>: A scholar who studies fundamental questions about the human existence and knowledge.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: φιλόσοφος (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Philosopher&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/, /writer of source/, /studies fundamental questions about the human existence and knowledge/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Author&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isAuthorOf</i></u>: &lt;Text&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 1</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>aristion philosopher</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">politician</div>    <div class="definitionNL"><b>Definition</b>: Someone who is actively involved in the governance of a country, state, or community, </div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: πολιτικός  (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Politician&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/, /writer of source/, /is involved in politics/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Author&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isAuthorOf</i></u>: &lt;Text&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 1</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>dinocrates messinian politician</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">primary source</div>    <div class="definitionNL"><b>Definition</b>: Original document or object created during the time of a historical event. They provide firsthand evidence and direct insights into the past.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: πρωτογενής πηγή (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Primary&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/, /original documents and objects created at the same time of the historical event/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Text&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>refersToEvent</i></u>: &lt;Event&gt;</div><div class="definitionFormal"> <u><i>hasAuthor</i></u>: &lt;Author&gt;</div>    <div class="concept"><b>Comment</b>: A source is thought to be primary when it is direct evidence of an event because it was created by people that were there at the time of the event.</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 26</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>agis</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>antiquities of the jews</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>antony</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>bibliotheca historica</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>life of cleomenes</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>demetrius</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>description of greece</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>geographica</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>historiae romanae</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>histories</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>life of crassus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>life of lucullus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>life of pyrrhus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>the history</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>the life of titus flamininus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>history of rome</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>the life of alexander</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>syrian wars</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>de bello alexandrino</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>commentaries on the civil war</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>the mithidratic wars</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>caesar</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>anabasis</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>eumenes</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>life of eumenes</strong></div></div><div class="objectEntry">     ['<div class="terminologyEntry">    <div class="term">roman historian</div>    <div class="definitionNL"><b>Definition</b>: Someone who studies, analyzes, and interprets the history of ancient Rome, its people, culture, political systems, and events.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: ρωμαίος ιστορικός (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Roman Historian&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/, /writer of source/, /studies about events and periods of history/, /roman/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Historian&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isAuthorOf</i></u>: &lt;Text&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 5</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>cornelius tacitus</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Wien-_Parlament-Tacitus.jpg/800px-Wien-_Parlament-Tacitus.jpg" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Wien-_Parlament-Tacitus.jpg/800px-Wien-_Parlament-Tacitus.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Wien-_Parlament-Tacitus.jpg/800px-Wien-_Parlament-Tacitus.jpg</a></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>lucius cassius dio</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/1/12/Dio_Cassius.jpg" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/1/12/Dio_Cassius.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/1/12/Dio_Cassius.jpg</a></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>titus livius</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d6/Titus-Livius-Austrian-Parliament-Building.jpg" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/d/d6/Titus-Livius-Austrian-Parliament-Building.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/d/d6/Titus-Livius-Austrian-Parliament-Building.jpg</a></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>pseudo-caesar</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>c julius caesar</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">secondary source</div>    <div class="definitionNL"><b>Definition</b>: A written work that analyzes, interprets, or comments on primary sources or historical events.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: δευτερογενής πηγή (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Secondary &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/, /gives information about a primary source/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Text&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>refersToEvent</i></u>: &lt;Event&gt;</div><div class="definitionFormal"> <u><i>hasAuthor</i></u>: &lt;Author&gt;</div>    <div class="concept"><b>Comment</b>: A source is thought to be secondary when it constitutes a document that refers to an event that it has been referred first in an another source before.</div></div></div><div class="otherEntry"></div></div>'],

function show_selected() {
    var selector = document.getElementById('idTerm');
    var champ = dictionnaire[selector[selector.selectedIndex].value][0];
    document.getElementById('display').innerHTML = champ;
}
document.getElementById('idTerm').addEventListener('change', show_selected);

searchBox = document.querySelector("#searchBox");
entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});

</script>
