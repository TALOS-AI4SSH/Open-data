    ['<div class="terminologyEntry">    <div class="term">demonstration</div>    <div class="definitionNL"><b>Definition</b>: A public display of goup opinion or protest expressing views on a political or social issue.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: διαδήλωση (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Demonstration&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /unlawful/, /violent/, /a public meeting or protest expressing views on a political or social issue/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political unlawful violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">election</div>    <div class="definitionNL"><b>Definition</b>: A formal and lawful political process where citizens vote to choose a candidate for a political position or to express their preference on a specific issue.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: εκλογή (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Election&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /lawful/, /non-violent/, /formal choice by vote of a person for a political position /</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political lawful non-violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">event</div>    <div class="definitionNL"><b>Definition</b>: A planned public or social occasion that takes place at a specific time and location. In particular, a historical event is a significant occurrence that has shaped or influenced the course of human history, often leading to political, social, economic, or cultural changes.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: γεγονός (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 5</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>death of antigonus I</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>death of alexander the great</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>death of lysimachos</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>earthquake at rhodes</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>illyrian war ii</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">expulsion</div>    <div class="definitionNL"><b>Definition</b>: The act of forcing someone out of a place, organization, or group, often as a punishment or consequence for violating rules, norms, or expectations.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: απέλαση (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Expulsion&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /lawful/, /violent/, /forcing someone to leave a place or organization/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political lawful violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">festival</div>    <div class="definitionNL"><b>Definition</b>: A time of celebration, commemoration, or observance that is rooted in the beliefs, traditions, and practices of a religious group.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: γιορτή  (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event religious lawful&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /religious/, /lawful/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event religious&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 3</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>eleutheria festival at delphi</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>new year festival of babylon</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>isthmia</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">intellectual event</div>    <div class="definitionNL"><b>Definition</b>: An occurrence that influences, shapes, or transforms the way individuals or collective entities think, learn, reason, or understand the world.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: πνευματικό γεγονός (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event intellectual&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /intellectual/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div>    <div class="concept"><b>Comment</b>: An intellectual event can be a religional festival or the uploading of a theatrical play.</div></div></div><div class="otherEntry"></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">legal repression</div>    <div class="definitionNL"><b>Definition</b>:  The use of laws and the legal system by a government or ruling authority to suppress dissent, restrict freedoms, and control or punish individuals or groups.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: νομική καταστολή (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Legal repression&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /lawful/, /violent/, /the lawful subdence of someone or something by force /</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political lawful violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">military event</div>    <div class="definitionNL"><b>Definition</b>: Any activity involving armed forces, typically related to warfare, defense, or strategic operations.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: στρατιωτικό γεγονός (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event military&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /military/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div>    <div class="concept"><b>Comment</b>: A military event can be violent, such as a war or the siege of a city or non-violent, such as the truce between two cities.</div></div></div><div class="otherEntry"></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">non-violent demonstration</div>    <div class="definitionNL"><b>Definition</b>: A peaceful protest, where participants express their views, demands, or grievances without resorting to violence.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: μη βίαιη διαδήλωση  (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Non violent demonstration&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /unlawful/, /non-violent/, /a non-violent public meeting or protest /</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political unlawful non-violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">politcal lawful event</div>    <div class="definitionNL"><b>Definition</b>: An occurrence or action related to politics that is conducted within the boundaries of the law and adheres to legal norms and regulations.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: νόμιμο πολτικό γεγονός (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event political lawful&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /lawful/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 4</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>establishment of cassandria and thessaloniki</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>establishment of seleukeia of pieria and antioch</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>establishment of kingdom of pontus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>establishment of demetrias</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">political event</div>    <div class="definitionNL"><b>Definition</b>: Any occurrence or activity related to politics that involves the exercise, expression, or impact of political power, policy, or governance. </div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: πολιτικό γεγονός (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event political&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div>    <div class="concept"><b>Comment</b>: A political event can be lawful, such as an election event or unlawful, such as a coup. Also, a potical lawful event can be violent (ex. egal repression of a riotous crowd) or non-violent (ex. trial).</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">political event lawful non-violent</div>    <div class="definitionNL"><b>Definition</b>: A political activity or occurrence that is conducted in compliance with legal regulations and without the use of violence. </div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: πολιτικό γεγονός νόμιμο μη βίαιο (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event political lawful non-violent&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /lawful/, /non-violent/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political lawful&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 12</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>partition of triparadisus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>alexandria becomes capital of egypt</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>sale of aegina to attalus I</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>declaration of the freedom of the greeks from phillip V</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>restorement of the rights of the jews</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>reco     ['<div class="terminologyEntry">    <div class="term">political event unlawful non-violent</div>    <div class="definitionNL"><b>Definition</b>: A political activity or occurrence that is not permitted by law but is conducted without the use of violence.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: πολιτικό γεγονός άνομο μη βίαιο (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event political unlawful non-violent&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /unlawful/, /non-violent/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political unlawful&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">reform</div>    <div class="definitionNL"><b>Definition</b>: A lawful, non-violent process aimed at bringing about political, economic, or social changes to improve the state or society.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: μεταρρύθμιση (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Reform&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /lawful/, /non-violent/, /political economic or social changes for the improvement of the state/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political lawful non-violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">religious event</div>    <div class="definitionNL"><b>Definition</b>: A gathering, ceremony, or observance that holds spiritual significance for a particular religious community.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: θρησκευτικό γεγονός (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event religious&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /religious/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div>    <div class="concept"><b>Comment</b>: A religious event can be lawful, such as a festival or animal sacrifice in the context of ritual that takes place in a sacred temple or unlawful, such as teh sarifice of a human or a violent ritual.</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">religious event unlawful</div>    <div class="definitionNL"><b>Definition</b>: An unlawful religious event refers to a gathering, ceremony, or observance that is conducted in violation of legal regulations or prohibitions.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: άνομο θρησκευτικό γεγονός (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event religious unlawful&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /religious/, /unlawful/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event religious&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">revolt</div>    <div class="definitionNL"><b>Definition</b>: An unlawful, violent, and often sudden overthrow of the existing social, political, or economic order, typically involving a significant change in power structures and governance.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: επανάσταση (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Revolt&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /unlawful/, /violent/, /a forcible overthrow of the social order in power/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political unlawful violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 8</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of athens</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of arthens and release of peiraias</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>maccabean revolt</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of messene against the achean league</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of the macedonians against rome</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of the acheans and the dissolution of the achean league</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of aristonicus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>athenians rebel against rome and becomes allies with mithidrates</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">sedition</div>    <div class="definitionNL"><b>Definition</b>: An unlawful, violent uprising in which people are called upon to rebel against established authority, typically a government or ruling power.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: στάση (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Sedition&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /unlawful/, /violent/, /call out to the people for rebellion/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political unlawful violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">siege</div>    <div class="definitionNL"><b>Definition</b>: A prolonged military operation in which enemy forces surround a city or fortified location with the aim of capturing it, often by cutting off supplies and communication until the defenders surrender or are defeated.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: πολιορκία (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event military multi-time single location city&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /military/, /violent/, /multi-time/, /single-location/, /military operation in which enemy forces surround a city/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event military multi-time single location&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 5</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>siege of athens by sulla</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>siege of macedonia</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>siege of athens by demetrius poliorcetes</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>siege of athens by cassander</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>siege of jerusalem by pompey</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">trial</div>    <div class="definitionNL"><b>Definition</b>: A formal examination of evidence in order for a person to be judged guilty or innocent.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: δίκη (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Trial&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /lawful/, /non-violent/, /a formal examination of evidence in order a person to be judged guilty or innocent/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political lawful non-violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">truce</div>    <div class="definitionNL"><b>Definition</b>: A cease-fire, an agreement between opposite sides in a war to stop fighting for a certain period of time.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: εκεχειρία (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Truce&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /military/, /non-violent/, /an agreement between opposite sides in a war to stop fighting for a certain period of time/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event military non-violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 4</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>truce of phoenice</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>treaty of apamea</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>treaty between rome and rhodes</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>treaty of the roman empire with the aetolian league against phillip v</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">violent event</div>    <div class="definitionNL"><b>Definition</b>: An event characterized by violence can take many forms, depending on the context, e.g. military (battle, skirmish, insurgency), criminal (assault, murder), social (civil unrest, lynching), domestic, interpersonal, political (revolution).</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: βίαιο γεγονός (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event violent&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /violent/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">violent military event single time</div>    <div class="definitionNL"><b>Definition</b>: A type of military event that is violent and occurs at a single point in time. This could be described as a military battle or engagement.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: βίαιο στρατιωτικό γεγονός που συνέβη μια φορά (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event military violent single time&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /military/, /violent/, /single-time/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event military violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 2</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>syria becomes a roman province</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>invasion of parthians in syria</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">war</div>    <div class="definitionNL"><b>Definition</b>: Military event multi-location multi-time a state of armed conflict between different nations or states or different groups within a country or state.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: πόλεμος (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Armed conflict&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /military/, /violent/, /multi-location/, /multi-time/, /a state of armed conflict between different nations or states or different groups within a country or state/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event military violent multi-location multi-time&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 36</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>end of the civil war in the ptolemaic dynasty</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>war of marcus antonius against the cilician pirates</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>mithidratic war i</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>social war/aetolian war</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>wars of the succesors</strong>< ];
function show_selected() {
    var selector = document.getElementById('idTerm');
    var champ = dictionnaire[selector[selector.selectedIndex].value][0];
    document.getElementById('display').innerHTML = champ;
}
document.getElementById('idTerm').addEventListener('change', show_selected);

searchBox = document.querySelector("#searchBox");
entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});

</script>
