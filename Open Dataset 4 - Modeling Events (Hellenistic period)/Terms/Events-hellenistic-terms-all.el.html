    ['<div class="terminologyEntry">    <div class="term">δίκη</div>    <div class="definitionNL"><b>Definition</b>: Η δικαστική διαδικασία. Στο πλαίσιο της παρούσας οντοορολογίας κατατάσσεται στην κατηγορία {πολιτικό γεγονός,  νόμιμο, μη βίαιο}.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: trial (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Trial&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /lawful/, /non-violent/, /a formal examination of evidence in order a person to be judged guilty or innocent/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political lawful non-violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">δούλος</div>    <div class="definitionNL"><b>Definition</b>: Άνθρωπος αναγκασμένος να λογοδοτεί και να υπακούει έναν άλλον άνθρωπο, του οποίου θεωρείται ιδιοκτησία.<br></div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: slave (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Slave&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /role/, /a person forced to word for and obey another person and is considered their property /</div><div class="definitionFormal"><b>a kind of</b>: &lt;Role&gt;</div></div></div><div class="otherEntry"></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">εβραίος ιστορικός</div>    <div class="definitionNL"><b>Definition</b>: Ιστορικός εβραϊκής καταγωγής.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: jewish historian (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Jewish Historian&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/, /writer of source/, /studies about events and periods of history/, /jewish/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Historian&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isAuthorOf</i></u>: &lt;Text&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 1</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>flavius josephus</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1c/Joseph%2C_son_of_Gorian%2C_called_Flavius_Josephus_%28NYPL_Hades-255854-430875%29_%28cropped%29.tiff/lossy-page1-800px-Joseph%2C_son_of_Gorian%2C_called_Flavius_Josephus_%28NYPL_Hades-255854-430875%29_%28cropped%29.tiff.jpg" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1c/Joseph%2C_son_of_Gorian%2C_called_Flavius_Josephus_%28NYPL_Hades-255854-430875%29_%28cropped%29.tiff/lossy-page1-800px-Joseph%2C_son_of_Gorian%2C_called_Flavius_Josephus_%28NYPL_Hades-255854-430875%29_%28cropped%29.tiff.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/1/1c/Joseph%2C_son_of_Gorian%2C_called_Flavius_Josephus_%28NYPL_Hades-255854-430875%29_%28c     ['<div class="terminologyEntry">    <div class="term">εκεχειρία</div>    <div class="definitionNL"><b>Definition</b>: Συμφωνία μεταξύ αντίθετων πλευρών σε ένα πόλεμο για να σταματήσουν οι μάχες για συγκεκριμένο χρονικό διάστημα. Στο πλαίσιο της παρούσας οντοορολογίας κατατάσσεται στην κατηγορία {μη βίαιο στρατιωτικό γεγονός}.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: truce (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Truce&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /military/, /non-violent/, /an agreement between opposite sides in a war to stop fighting for a certain period of time/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event military non-violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 4</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>truce of phoenice</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>treaty of apamea</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>treaty between rome and rhodes</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>treaty of the roman empire with the aetolian league against phillip v</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">εκλογή</div>    <div class="definitionNL"><b>Definition</b>: Ανάδειξη σε ένα αξίωμα μέσω ψηφοφορίας. Στο πλαίσιο της παρούσας οντοορολογίας κατατάσσεται στην κατηγορία {πολιτικό γεγονός, νόμιμο, μη βίαιο}.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: election (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Election&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /lawful/, /non-violent/, /formal choice by vote of a person for a political position /</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political lawful non-violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">εκστρατεία</div>    <div class="definitionNL"><b>Definition</b>: Σειρά πολεμικών επιχειρήσεων με σκοπό την εκπλήρωση συγκεκριμένου στόχου. Στο πλαίσιο της παρούσας οντοορολογίας εντάσσεται στην κατηγορία {βίαιο στρατιωτικό γεγονός σε πολλά μέρη ταυτόχρονα }.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: campaign (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Series of military operations&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /military/, /violent/, /multi-location/, /multi-time/, /a series of military operations intended to achieve a particular objective/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event military violent multi-location multi-time&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 1</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>campaign of antiochus vii in anatolia</strong></div></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">ενδοχώρα</div>    <div class="definitionNL"><b>Definition</b>: Χερσαία τοποθεσία που δεν βρέχεται από θάλασσα.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: inland  (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Inland Location&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /location/, /land/, /inland /</div><div class="definitionFormal"><b>a kind of</b>: &lt;Location land&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isLocationOf</i></u>: &lt;Event&gt;, &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 15</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>bithynia</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/c/ce/Roman_Empire_-_Bythinia_et_Pontus_%28125_AD%29.svg" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/c/ce/Roman_Empire_-_Bythinia_et_Pontus_%28125_AD%29.svg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/c/ce/Roman_Empire_-_Bythinia_et_Pontus_%28125_AD%29.svg</a></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>cilicia</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/8/85/Roman_Empire_-_Cilicia_%28125_AD%29.svg" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/8/85/Roman_Empire_-_Cilicia_%28125_AD%29.svg" target="_bl an_East_50_CE_Commagene_highlighted-en.svg</a></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>paphlagonia</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/7/74/Map_Anatolia_ancient_regions-en.svg" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/7/74/Map_Anatolia_ancient_regions-en.svg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/7/74/Map_Anatolia_ancient_regions-en.svg</a></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>lamia</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>corupedium</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e6/Plain_of_Corupedium.jpg" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/e/e6/Plain_of_Corupedium.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/e/e6/Plain_of_Corupedium.jpg</a></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>carrhae</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>cynoscephalae</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>gabiene</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>mantineia</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>megalopolis</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>nicopolis</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>dimallum</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">ένωση πόλεων</div>    <div class="definitionNL"><b>Definition</b>: Σύνδεση πόλεων ώστε να αποτελούν ένα ενιαίο πολιτικό σύνολο.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: political union of states (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Agent organised group union made of smaller political entities or states&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /agent/, /human/, /organised group/, /a union made of smaller political entities or states/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Agent human more than one person&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 5</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>achean league</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>aetolian league</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>thessalian league</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>boeotian league</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>acarnanian league</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">επανάσταση</div>    <div class="definitionNL"><b>Definition</b>: Το σύνολο των ιστορικών γεγονότων που συμβαίνουν σε μία κοινωνία, όταν ένα τμήμα της εξεγείρεται με σκοπό την κατάληψη της εξουσίας. Μια επανάσταση συνήθως συνεπάγεται μια ριζική και συχνά βίαιη αλλαγή στην πολιτική ή κοινωνική δομή μιας χώρας. Στο πλαίσιο της παρούσας οντοορολογίας εντάσσεται στην κατηγορία {πολιτικό γεγονός, άνομο, βίαιο, βίαιη εκτόπιση της κοινωνικής τάξης στην εξουσία}.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: revolt (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Revolt&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /unlawful/, /violent/, /a forcible overthrow of the social order in power/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political unlawful violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 8</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of athens</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of arthens and release of peiraias</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>maccabean revolt</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of messene against the achean league</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of the macedonians against rome</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of the acheans and the dissolution of the achean league</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of aristonicus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>athenians rebel against rome and becomes allies with mithidrates</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">επιγραφή</div>    <div class="definitionNL"><b>Definition</b>: Κείμενο ή σύμβολο χαραγμένο σε σκληρή επιφάνεια, όπως πέτρα, μέταλλο ή ξύλο, που συνήθως αποτυπώνει ένα μήνυμα, ένα όνομα ή μια σημαντική πληροφορία. </div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: inscription (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Inscription&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/, /a written source on stone/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Source&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">θαλάσσια τοποθεσία</div>    <div class="definitionNL"><b>Definition</b>: Γεωγραφική περιοχή που βρίσκεται μέσα σε μια θάλασσα.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: sea  (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Location sea&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /location/, /sea/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Location&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isLocationOf</i></u>: &lt;Event&gt;, &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 5</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>aegean sea</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Aegean_Sea_map.png" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/f/fe/Aegean_Sea_map.png" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/f/fe/Aegean_Sea_map.png</a></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>ionian sea</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6e/Ionian_sea_islands%2C_pic1.JPG" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/6/6e/Ionian_sea_islands%2C_pic1.JPG" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/6/6e/Ionian_sea_islands%2C_pic1.JPG</a></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>hellespont</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Dardanelles_map2.png" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/a/a5/Dardanelles_map2.png" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/a/a5/Dardanelles_map2.png</a></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>actium</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>mediterranean sea</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">θρησκευτική λειτουργία</div>    <div class="definitionNL"><b>Definition</b>: Συγκεκριμένη θέση ή ρόλος σε μια θρησκευτική κοινότητα ή οργανισμό που φέρει ευθύνες σχετικές με την πνευματική ηγεσία, την καθοδήγηση, την τέλεση τελετουργιών και τη διατήρηση των θρησκευτικών παραδόσεων.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: religious function (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Function religious&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /function/, /religious/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Function&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">θρησκευτικό γεγονός</div>    <div class="definitionNL"><b>Definition</b>: Εκδήλωση ή τελετή που έχει ιδιαίτερη σημασία για μια θρησκεία. Αυτά τα γεγονότα μπορεί να περιλαμβάνουν γιορτές, τελετές λατρείας, μυστήρια.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: religious event (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event religious&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /religious/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div>    <div class="concept"><b>Comment</b>: A religious event can be lawful, such as a festival or animal sacrifice in the context of ritual that takes place in a sacred temple or unlawful, such as teh sarifice of a human or a violent ritual.</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">ιδιότητα/ρόλος</div>    <div class="definitionNL"><b>Definition</b>: Λειτουργία ή καθήκοντα που αναλαμβάνει ένα άτομο μέσα σε μια πολιτική, στρατιωτική, κοινωνική ή επαγγελματική δομή.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: role (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Role&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /role/</div>    <div class="concept"><b>Comment</b>: The role of the human agent, for example if he is a king or a general. </div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 2</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>satrap of egypt</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>ruler of southern greece</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">ιερέας</div>    <div class="definitionNL"><b>Definition</b>: Ιδιότητα/ρόλος που εξουσιοδοτεί αυτόν που τον έχει να πραγματοποιεί τις ιερές τελετουργίες μιας θρησκείας ή λατρείας.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: priest (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Priest&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /role/, /authorized in performing the sacred rites of a religion or cult/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Role&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 6</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>judas maccabeus high priest of jerusalem</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>jason the high priest of the temple of jerusalem</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>jonathan high priest of jerusalem</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>simon thassi high priest of judae</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>john hypercanus high priest of judae</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>gaius julius caesar pontifex maximus</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">ιστορικός</div>    <div class="definitionNL"><b>Definition</b>: Συγγραφέας που μελετάει τα γεγονότα και τις περιόδους της ιστορίας.που μελετά, ερευνά και καταγράφει τα γεγονότα του παρελθόντος αναλύοντας πρωτογενείς και δευτερογενείς πηγές, όπως έγγραφα, αρχεία, μαρτυρίες και αντικείμενα. Με το έργο του συντελεί στη διατήρηση της ιστορικής μνήμης και στη διαμόρφωση της κατανόησης του παρελθόντος και επηρεάζει την λήψη αποφάσεων στο παρόν.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> --- new note --- A historian studies the chronological record of events, usually attempting, on the basis of a critical examination of source materials, to explain events. </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: historian (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Historian&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/, /writer of source/, /studies about events and periods of history/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Author&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isAuthorOf</i></u>: &lt;Text&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 1</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>diodorus siculus</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/1/1d/Diodoro_siculo_-_storico_di_Agira.jpg" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/1/1d/Diodoro_siculo_-_storico_di_Agira.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/1/1d/Diodoro_siculo_-_storico_di_Agira.jpg</a></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">ιστοριογράφος</div>    <div class="definitionNL"><b>Definition</b>: Συγγραφέας που έχει συγγράψει ιστορία της εποχής του ή της χώρας του.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> --- new context ---<br>--- should contain the term ---</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> --- new note ---A historiographer studies how history was written, who wrote it, and what factors influenced how it was written.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: historiographer (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Historiographer&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/, /writer of source/, /studies how historical events have been written/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Author&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isAuthorOf</i></u>: &lt;Text&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">κείμενο</div>    <div class="definitionNL"><b>Definition</b>: Στο πλαίσιο της παρούσας οντοορολολογίας το κείμενο είναι η γραπτή πηγή που χρησιμοποιείται για τη μελέτη των ιστορικών γεγονότων.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: text (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Text&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Source&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>refersToEvent</i></u>: &lt;Event&gt;</div><div class="definitionFormal"> <u><i>hasAuthor</i></u>: &lt;Author&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 2</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>alexander</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>the wars of the jews</strong></div></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">νησί</div>    <div class="definitionNL"><b>Definition</b>: Χερσαία τοποθεσία που περιβρέχεται από υγρό στοιχείο (θάλασσα, λίμνη, ποταμό).</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: island (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Island&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /location/, /land/, /island/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Location land&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isLocationOf</i></u>: &lt;Event&gt;, &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 5</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>cyprus</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a3/Republic_of_Cyprus_%28orthographic_projection%29.svg" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/a/a3/Republic_of_Cyprus_%28orthographic_projection%29.svg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/a/a3/Republic_of_Cyprus_%28orthographic_projection%29.svg</a></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>paxos</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>sicily</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>corsica</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/8/85/The_Mountainous_Spine_of_Corsica.jpeg" alt="unsupported format     ['<div class="terminologyEntry">    <div class="term">στρατιωτικό γεγονός</div>    <div class="definitionNL"><b>Definition</b>: Συμβάν που περιλαμβάνει τις ένοπλες δυνάμεις και συνήθως συνδέεται με πολεμικές επιχειρήσεις, συγκρούσεις ή στρατιωτικές ασκήσεις. Αυτά τα γεγονότα μπορεί να ποικίλουν σε κλίμακα και σημασία, από μικρές αψιμαχίες μέχρι μεγάλες μάχες, πολέμους ή στρατιωτικές επιχειρήσεις.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: military event (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event military&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /military/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div>    <div class="concept"><b>Comment</b>: A military event can be violent, such as a war or the siege of a city or non-violent, such as the truce between two cities.</div></div></div><div class="otherEntry"></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">συνέλευση</div>    <div class="definitionNL"><b>Definition</b>: Προγραμματισμένη συγκέντρωση συνόλου ανθρώπων, για να συζητήσουν κάποιο θέμα και για να πάρουν αποφάσεις. Στο πλαίσιο της παρούσας οντοορολογίας εντάσσεται στην κατηγορία {πολιτικό γεγονός, νόμιμο, μη βίαιο}.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: assembly (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Assembly vote&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /lawful/, /non-violent/, /peoples assembly by vote of a municipality/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political lawful non-violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">τεχνούργημα</div>    <div class="definitionNL"><b>Definition</b>: Αντικείμενο κατασκευασμένο με ιδιαίτερη φροντίδα και τέχνη. Αποτελεί βασική ιστορική πηγή.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: artefact (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Artifact&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/, /a material source/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Source&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">τοποθεσία</div>    <div class="definitionNL"><b>Definition</b>: Θέση όπου βρίσκεται ένας ορισμένος τόπος, άνθρωποι, κατασκευές, αντικείμενα του φυσικού ή του ανθρωπογενούς περιβάλλοντος.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: location (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Location&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /location/</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isLocationOf</i></u>: &lt;Event&gt;, &lt;Location&gt;</div>    <div class="concept"><b>Comment</b>: The location of an event can take place on land or sea. A land location can be a city or an island, whereas a marine location can be an open sea. </div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 1</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>iran</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a8/Iran_%28orthographic_projection%29.svg" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/a/a8/Iran_%28orthographic_projection%29.svg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/a/a8/Iran_%28orthographic_projection%29.svg</a></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">τύραννος</div>    <div class="definitionNL"><b>Definition</b>: Απόλυτος άρχοντας που καταλαμβάνει την εξουσία με βίαια ή με παράνομα μέσα. Καταπιεστικός κυβερνήτης.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: tyrant (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Tyrant&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /role/, /an oppressive ruler/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Role&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 3</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>pyrrhus tyrant of syracuse</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>aristion tyrant of athens</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>machanidas tyrant of sparta</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">ύπατος</div>    <div class="definitionNL"><b>Definition</b>: Ιδιότητα/ρόλος ενός από τους δύο ετησίως επιλεγμένους στρατηγούς που κυβερνούσαν από κοινού την ρωμαϊκή δημοκρατία.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: consul (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Consul&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /role/, /one of the two annually elected chiefs who ruled jointly the roman republic/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Role&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 7</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>marcus perpena roman consul</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>manius acilius roman consul</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>marcus antonius roman consul</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>pompey roman consul</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>marcus junius brutus roman consul</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>gnaeus fulvius centumalus roman consul</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>lucius aemilius paullus roman consul</strong></div></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">φαραώ</div>    <div class="definitionNL"><b>Definition</b>: Τίτλος των ηγεμόνων της αρχαίας Aιγύπτου, Στο πλαίσιο της παρούσας οντοορολογίας κατηγοριοποιείται ως {ιδιότητα/ρόλος του κυβερνήτη της Αιγύπτου}.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: pharaoh (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Pharaoh&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /role/, /the ruler of egypt/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Role&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 5</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>cleopatra III queen of egypt/pharaoh</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>phillip III arrhidaeus pharaoh of egypt</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>cleopatra vii queen of the ptolemaic kingdom</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>alexander iv king pharaoh of egypt</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>alexander iii pharaoh of egypt</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">φιλόσοφος</div>    <div class="definitionNL"><b>Definition</b>: Κάποιος που  μελετάει θεμελιώδη ζητήματα της ανθρώπινης ύπαρξης.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: philosopher (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Philosopher&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /source/, /writer of source/, /studies fundamental questions about the human existence and knowledge/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Author&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isAuthorOf</i></u>: &lt;Text&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 1</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>aristion philosopher</strong></div></div></div>'],

function show_selected() {
    var selector = document.getElementById('idTerm');
    var champ = dictionnaire[selector[selector.selectedIndex].value][0];
    document.getElementById('display').innerHTML = champ;
}
document.getElementById('idTerm').addEventListener('change', show_selected);

searchBox = document.querySelector("#searchBox");
entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});

</script>
