    ['<div class="terminologyEntry">    <div class="term">γεγονός</div>    <div class="definitionNL"><b>Definition</b>: Στο πλαίσιο της παρούσας οντοορολογίας, εξετάζονται ιστορικά γεγονότα και ο όρος &apos;γεγονός&apos; δηλώνει το ιστορικό γεγονός.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: event (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 5</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>death of antigonus I</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>death of alexander the great</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>death of lysimachos</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>earthquake at rhodes</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>illyrian war ii</strong></div></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">διαδήλωση</div>    <div class="definitionNL"><b>Definition</b>: Δημόσια συγκέντρωση ή διαμαρτυρία σχετικά με ένα πολιτικό ή κοινωνικό θέμα. Στο πλαίσιο της παρούσας οντοορολογίας κατατάσσεται στην κατηγορία {πολιτικό γεγονός, άνομο, &apos;βίαιο}.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: demonstration (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Demonstration&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /unlawful/, /violent/, /a public meeting or protest expressing views on a political or social issue/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political unlawful violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">δίκη</div>    <div class="definitionNL"><b>Definition</b>: Η δικαστική διαδικασία. Στο πλαίσιο της παρούσας οντοορολογίας κατατάσσεται στην κατηγορία {πολιτικό γεγονός,  νόμιμο, μη βίαιο}.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: trial (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Trial&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /lawful/, /non-violent/, /a formal examination of evidence in order a person to be judged guilty or innocent/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political lawful non-violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">δολοφονία</div>    <div class="definitionNL"><b>Definition</b>: Αφαίρεση της ζωής άλλου ανθρώπου με βίαιο τρόπο. Στο πλαίσιο της παρούσας οντοορολογίας ανήκει στην κατηγορία {πολιτικό γεγονός, άνομο, βίαιο, η πράξη του φόνου}.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: assasination (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Assasination&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /unlawful/, /violent/, /the action of murder /</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political unlawful violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 6</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>assasination of alexander iv</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>assasination of olympias</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>assasination of phillip iii arrhidaeus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>assasination of seleucus I</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>assasination of philopoemen</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Philopcemen_in_Prison.jpg" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/7/7e/Philopcemen_in_Prison.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/7/7e/Philopcemen_in_Prison.jpg</a></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>assasination of julius caesar</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/e/eb/Vincenzo_Camuccini_-_La_morte_di_Cesare.jpg" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/f/f7/Victor_Honor%C3%A9_Janssens_-_The_death_of_Caesar.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/f/f7/Victor_Honor%C3%A9_Janssens_-_The_death_of_Caesar.jpg</a></div>    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/8/81/Death_of_Julius_Caesar_2.png" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/8/81/Death_of_Julius_Caesar_2.png</a></div>    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/e/eb/Vincenzo_Camuccini_-_La_morte_di_Cesare.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/e/eb/Vincenzo_Camuccini_-_La_morte_di_Cesare.jpg</a></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">εκεχειρία</div>    <div class="definitionNL"><b>Definition</b>: Συμφωνία μεταξύ αντίθετων πλευρών σε ένα πόλεμο για να σταματήσουν οι μάχες για συγκεκριμένο χρονικό διάστημα. Στο πλαίσιο της παρούσας οντοορολογίας κατατάσσεται στην κατηγορία {μη βίαιο στρατιωτικό γεγονός}.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: truce (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Truce&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /military/, /non-violent/, /an agreement between opposite sides in a war to stop fighting for a certain period of time/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event military non-violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 4</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>truce of phoenice</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>treaty of apamea</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>treaty between rome and rhodes</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>treaty of the roman empire with the aetolian league against phillip v</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">εκλογή</div>    <div class="definitionNL"><b>Definition</b>: Ανάδειξη σε ένα αξίωμα μέσω ψηφοφορίας. Στο πλαίσιο της παρούσας οντοορολογίας κατατάσσεται στην κατηγορία {πολιτικό γεγονός, νόμιμο, μη βίαιο}.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: election (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Election&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /lawful/, /non-violent/, /formal choice by vote of a person for a political position /</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political lawful non-violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">εκστρατεία</div>    <div class="definitionNL"><b>Definition</b>: Σειρά πολεμικών επιχειρήσεων με σκοπό την εκπλήρωση συγκεκριμένου στόχου. Στο πλαίσιο της παρούσας οντοορολογίας εντάσσεται στην κατηγορία {βίαιο στρατιωτικό γεγονός σε πολλά μέρη ταυτόχρονα }.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: campaign (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Series of military operations&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /military/, /violent/, /multi-location/, /multi-time/, /a series of military operations intended to achieve a particular objective/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event military violent multi-location multi-time&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 1</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>campaign of antiochus vii in anatolia</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">επανάσταση</div>    <div class="definitionNL"><b>Definition</b>: Το σύνολο των ιστορικών γεγονότων που συμβαίνουν σε μία κοινωνία, όταν ένα τμήμα της εξεγείρεται με σκοπό την κατάληψη της εξουσίας. Μια επανάσταση συνήθως συνεπάγεται μια ριζική και συχνά βίαιη αλλαγή στην πολιτική ή κοινωνική δομή μιας χώρας. Στο πλαίσιο της παρούσας οντοορολογίας εντάσσεται στην κατηγορία {πολιτικό γεγονός, άνομο, βίαιο, βίαιη εκτόπιση της κοινωνικής τάξης στην εξουσία}.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: revolt (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Revolt&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /unlawful/, /violent/, /a forcible overthrow of the social order in power/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political unlawful violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 8</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of athens</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of arthens and release of peiraias</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>maccabean revolt</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of messene against the achean league</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of the macedonians against rome</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of the acheans and the dissolution of the achean league</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>revolt of aristonicus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>athenians rebel against rome and becomes allies with mithidrates</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">θρησκευτικό γεγονός</div>    <div class="definitionNL"><b>Definition</b>: Εκδήλωση ή τελετή που έχει ιδιαίτερη σημασία για μια θρησκεία. Αυτά τα γεγονότα μπορεί να περιλαμβάνουν γιορτές, τελετές λατρείας, μυστήρια.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: religious event (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event religious&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /religious/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div>    <div class="concept"><b>Comment</b>: A religious event can be lawful, such as a festival or animal sacrifice in the context of ritual that takes place in a sacred temple or unlawful, such as teh sarifice of a human or a violent ritual.</div></div></div><div class="otherEntry"></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">στάση</div>    <div class="definitionNL"><b>Definition</b>: Εξέγερση, αντίσταση απέναντι στην εξουσία. Βίαιο πολιτικό γεγονός, συχνά με σκοπό την ανατροπή της παρούσας διοίκησης και την κατάληψη της εξουσίας. </div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: sedition (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Sedition&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /unlawful/, /violent/, /call out to the people for rebellion/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political unlawful violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">στρατιωτικό γεγονός</div>    <div class="definitionNL"><b>Definition</b>: Συμβάν που περιλαμβάνει τις ένοπλες δυνάμεις και συνήθως συνδέεται με πολεμικές επιχειρήσεις, συγκρούσεις ή στρατιωτικές ασκήσεις. Αυτά τα γεγονότα μπορεί να ποικίλουν σε κλίμακα και σημασία, από μικρές αψιμαχίες μέχρι μεγάλες μάχες, πολέμους ή στρατιωτικές επιχειρήσεις.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: military event (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Event military&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /military/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div>    <div class="concept"><b>Comment</b>: A military event can be violent, such as a war or the siege of a city or non-violent, such as the truce between two cities.</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">συνέλευση</div>    <div class="definitionNL"><b>Definition</b>: Προγραμματισμένη συγκέντρωση συνόλου ανθρώπων, για να συζητήσουν κάποιο θέμα και για να πάρουν αποφάσεις. Στο πλαίσιο της παρούσας οντοορολογίας εντάσσεται στην κατηγορία {πολιτικό γεγονός, νόμιμο, μη βίαιο}.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: assembly (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Assembly vote&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /political/, /lawful/, /non-violent/, /peoples assembly by vote of a municipality/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event political lawful non-violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">υποχώρηση</div>    <div class="definitionNL"><b>Definition</b>: Στο πλαίσιο της παρούσας οντοορολογίας κατηγοριοποιείται ως μη βίαιο στρατιωτικό γεγονός που σημαίνει το τέλος στρατιωτικής δραστηριότητας.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: withdrawal (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Withdrawal&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /event/, /military/, /non-violent/, /being no longer involved in a military activity/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Event military non-violent&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>appearesInTheSourceOf</i></u>: &lt;Source&gt;</div><div class="definitionFormal"> <u><i>hasAgent</i></u>: &lt;Agent&gt;</div><div class="definitionFormal"> <u><i>hasLocation</i></u>: &lt;Location&gt;</div></div></div><div class="otherEntry"></div></div>'],
];
function show_selected() {
    var selector = document.getElementById('idTerm');
    var champ = dictionnaire[selector[selector.selectedIndex].value][0];
    document.getElementById('display').innerHTML = champ;
}
document.getElementById('idTerm').addEventListener('change', show_selected);

searchBox = document.querySelector("#searchBox");
entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});

</script>
