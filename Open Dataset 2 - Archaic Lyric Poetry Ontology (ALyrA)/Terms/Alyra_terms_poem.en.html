var dictionnaire = [
    ['<div class="terminologyEntry">    <div class="term">archaic lyric poem</div>    <div class="definitionNL"><b>Definition</b>: "Lyric poetry began as a fixture of ancient Greece, classified against other categories of poetry at the time of classical antiquity: dramas (written in verse) and epic poems. The lyric was far shorter, distinguished also by its focus on the poet’s state of mind and personal themes rather than narrative arc" (Academy of American Poets). So, an Archaic Lyric Poem is such poem written from 7th-early 5th century BCE.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Source</b>: Academy of American Poets. Lyric Poetry. Poets.Org. Retrieved 13 May 2024, from https://poets.org/glossary/lyric-poetry</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: αρχαϊκό λυρικό ποίημα (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">archaic lyric poem in ionic or doric or aeolic dialect performed by a chorus of no particular type</div>    <div class="definitionNL"><b>Definition</b>: An Archaic Lyric poem in Ionic or Doric or Aeolic dialect performed by a chorus of no particular type.</div>    <div class="textMediumMargin"><b>Status</b>: none</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: αρχαϊκό λυρικό ποίημα σε ιωνική ή δωρική ή αιολική διάλεκτο που εκτελείται από χορό μη συγκεκριμένου τύπου (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus performed by a non-specific type of chorus&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /in ionic or in doric or in aeolic dialect/, /performed by a chorus/, /performed by a non-specific type of chorus/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">archaic lyric poem in ionic or in doric or in aeolic dialect performed by a chorus</div>    <div class="definitionNL"><b>Definition</b>: Lyric song performed by a group (chorus) of people (women, men), which were dancing and singing.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: αρχαϊκό λυρικό ποίημα σε ιωνική ή δωρική ή αιολική διάλεκτο που εκτελείται από χορό (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /in ionic or in doric or in aeolic dialect/, /performed by a chorus/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 2</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>choral_ibycus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>choral_stesichorus</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">archaic lyric poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer</div>    <div class="definitionNL"><b>Definition</b>: Melos which was performed either by one person or by a chorus.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: αρχαϊκό λυρικό ποίημα σε ιωνική ή δωρική ή αιολική διάλεκτο που εκτελείται από χορό ή από έναν μόνο ερμηνευτή (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /in ionic or in doric or in aeolic dialect/, /performed by a chorus or by a single performer/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">archaic lyric poem only in ionic dialect</div>    <div class="definitionNL"><b>Definition</b>: Archaic Lyric poem written only in ionic dialect. Ionic greek dialect, a subset of Eastern Greek, originated on the mainland and spread during the Dorian invasions. By the 5th century BC, it was primarily spoken in Ionia, including Asia Minor, Chios, and Samos. It also extended to Euboea and through Ionian colonization to the northern Aegean, Black Sea, and western Mediterranean.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Source</b>: Ionian dialect. (n.d.). Θησαυρός Ανθρωπιστικών Επιστημών ΔΥΑΣ: HUMANITIES. Retrieved 13 May 2024, from https://humanitiesthesaurus.academyofathens.gr/dyas-resource/Concept/846</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: αρχαϊκό λυρικό ποίημα μόνο στην ιωνική διάλεκτο (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem only in ionic dialect&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /only in ionic dialect/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">dithyramb</div>    <div class="definitionNL"><b>Definition</b>: Devotional hymns of Dionysus. Bacchylides, Pindar and Simonides are known to have composed dithyrambs.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Source</b>: Κακριδής, Φάνης. (2012). 2.4.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 from https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: διθύραμβος (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to dionysus&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /in ionic or in doric or in aeolic dialect/, /performed by a chorus or by a single performer/, /dedicated to a god/, /dedicated to dionysus/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to a god&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 3</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>dithyrambs_bacchylides</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>dithyrambs_pindarus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>dithyrambs_simonides</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">elegy</div>    <div class="definitionNL"><b>Definition</b>: Elegies are poems written in elegiac couplets, with the first line in hexameter and the second line in pentameter, initially used for lamentation (but later had a wide range of themes) and possibly originating from Eastern mourning practices. They can be as short as a single couplet or longer sequences as needed.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Source</b>: Κακριδής, Φάνης. (2012). 2.4.Β.iii. Ελεγείες. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_024.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: ελεγεία (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /only in ionic dialect/, /in elegiac couplet/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem only in ionic dialect&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 3</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>elegies_anacreon</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>elegies_archilochus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>elegies_simonides</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">enkomion</div>    <div class="definitionNL"><b>Definition</b>: Lyric song of praise for living people. Pindar, Bacchylides and Ibicus are important figures in enkomion composition.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Source</b>: Κακριδής, Φάνης. (2012). 2.4.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 from https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: εγκώμιο (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to living&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /in ionic or in doric or in aeolic dialect/, /performed by a chorus or by a single performer/, /dedicated to mortal/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 3</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>enkomion_bacchylides</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>enkomion_ibycus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>enkomion_pindarus</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">epinikion</div>    <div class="definitionNL"><b>Definition</b>: Lyric song of praise winners of sports games. Pindar, Bacchylides and Ibicus are who composed epinikia.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Source</b>: Κακριδής, Φάνης. (2012). 2.4.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 from https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: επίνικος (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to winners in athletic events&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /in ionic or in doric or in aeolic dialect/, /performed by a chorus or by a single performer/, /dedicated to mortal/, /dedicated to winners in athletic events/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to living&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 3</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>epinikoi_bacchylides</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>epinikoi_pindarus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>epinikoi_simonides</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">epithalamion</div>    <div class="definitionNL"><b>Definition</b>: Epithalamium is a song dedicated to a wedding couple sung at the nuptial residence. Sappho is famous for her such songs.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Source</b>: Hymenaeus. (n.d.). Retrieved 13 May 2024, from https://www.hellenicaworld.com/Greece/Mythology/en/Hymenaeus.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: επιθαλάμιο (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to wedding couple&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /in ionic or in doric or in aeolic dialect/, /performed by a chorus or by a single performer/, /dedicated to mortal/, /dedicated to wedding couple/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to living&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 1</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>epithalamia_sappho</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">erotic elegy</div>    <div class="definitionNL"><b>Definition</b>: Elegy with erotic content. Famous poet who composed erotic elegies is Mimnermus.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: ερωτική ελεγεία (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet with erotic content&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /only in ionic dialect/, /in elegiac couplet/, /with specific content/, /with erotic content/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 1</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>erotic_elegies_mimnermus</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">gnomic elegy</div>    <div class="definitionNL"><b>Definition</b>: Elegy with gnomic, counseling, biosophical content. Known poets of gnomic elegies are Phocylides and Theognis.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: γνωμική ελεγεία (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet with gnomic content&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /only in ionic dialect/, /in elegiac couplet/, /with specific content/, /with gnomic content/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 2</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>gnomic_elegies_phocylides</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>gnomic_elegies_theognis</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">hymenaios</div>    <div class="definitionNL"><b>Definition</b>: A lyric song sung during the procession of the bride to the groom&apos;s house. Sappho is famous for her such songs.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Source</b>: Hymenaeus. (n.d.). Retrieved 13 May 2024, from https://www.hellenicaworld.com/Greece/Mythology/en/Hymenaeus.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: υμέναιος (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus during bride procession&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /in ionic or in doric or in aeolic dialect/, /performed by a chorus/, /performed by a non-specific type of chorus/, /during bride procession/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus performed by a non-specific type of chorus&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 1</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>hymenaios_sappho</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">hymn</div>    <div class="definitionNL"><b>Definition</b>: Lyric song dedicated to gods. Multiple poets has composed hymns, sych as Alcaeus, Terpander, Sappho, Alcman et. al.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Source</b>: Lyric Genres. (n.d.). Retrieved 13 May 2024, from https://www.reed.edu/humanities/110Tech/lyricDefinitions.html#Hyporcheme</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: ύμνος (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to a god&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /in ionic or in doric or in aeolic dialect/, /performed by a chorus or by a single performer/, /dedicated to a god/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 6</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>hymns_alcaeus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>hymns_alcman</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>hymns_anacreon</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>hymns_archilochus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>hymns_sappho</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>hymns_terpander</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">hyporcheme</div>    <div class="definitionNL"><b>Definition</b>: A lyric song accompanied by imitative movements. Bacchylides and Pindar are famous for composing hyporchemes.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Source</b>: Κακριδής, Φάνης. (2012). 2.4.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 from https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: υπόρχημα (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus with imitation expressions&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /in ionic or in doric or in aeolic dialect/, /performed by a chorus/, /performed by a non-specific type of chorus/, /with specific content/, /with imitation content/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus performed by a non-specific type of chorus&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 2</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>hyporcheme_bacchylides</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>hyporchemes_pindarus</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">iamb</div>    <div class="definitionNL"><b>Definition</b>: Initially associated with Dionysus, the iamb may have a pre-Hellenic origin as a poetic form. Typically composed in iambic trimeter or trochaic tetrameter, its Ionic version often adopts a first-person perspective, though its context can vary.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Source</b>: Elegy and Iambus. (n.d.). Archaic Period - Culture. Retrieved 13 May 2024, from https://www.ime.gr/chronos/04/en/culture/221lit_lyric_elegy_iambus.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: ίαμβος (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem only in ionic dialect in iambic or trochaic metre&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /only in ionic dialect/, /in iambic or trochaic metre/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem only in ionic dialect&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 5</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>iambs_anacreon</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>iambs_ananius</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>iambs_archilochus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>iambs_hipponax</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>iambs_semonides</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">melos</div>    <div class="definitionNL"><b>Definition</b>: Melos is the hypernym of the Archaic Lyric poems, which were written in ionic (except of the iamb and elegy), aeolic and doric dialect.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: μέλος (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /in ionic or in doric or in aeolic dialect/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">monody</div>    <div class="definitionNL"><b>Definition</b>: Monodies are characterized by solo performances, where the poet identifies with the singer and expresses personal thoughts and emotions, as they offer a direct and free expression of personality. For instance, in Sapphic odes, the poetess prioritizes her own voice over others.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Source</b>: Κακριδής, Φάνης. (2012). 2.4.Β.ii. Μονωδίες. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 from https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_021.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: μονωδία (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a single performer&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /in ionic or in doric or in aeolic dialect/, /performed by a single performer/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 7</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>erotic_odes_alcaeus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>erotic_odes_alcman</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>erotic_odes_anacreon</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>erotic_odes_sappho</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>sympotic_odes_alcaeus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>sympotic_odes_anacreon</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>warlike_odes_alcaeus</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">paean</div>    <div class="definitionNL"><b>Definition</b>: Lyric song dedicated to Ancient Greek god Apollo. Alcman, Pindar and Bacchylides are famous composers of paeans.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Source</b>: Κακριδής, Φάνης. (2012). 2.4.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 from https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: παιάνας (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to apollo&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /in ionic or in doric or in aeolic dialect/, /performed by a chorus or by a single performer/, /dedicated to a god/, /dedicated to apollo/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to a god&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 3</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>paeans_alcman</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>paeans_bacchylides</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>paeans_pindarus</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">partheneion</div>    <div class="definitionNL"><b>Definition</b>: A lyric song performed by a maidens chorus. Alcman, Pindar and Bacchylides are famous for composing Partheneia.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Source</b>: Lyric Genres. (n.d.). Retrieved 13 May 2024, from https://www.reed.edu/humanities/110Tech/lyricDefinitions.html#Hyporcheme</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: παρθένειο (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus performed by a maidens chorus&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /in ionic or in doric or in aeolic dialect/, /performed by a chorus/, /performed by a maidens chorus/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 3</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>partheneia_alcman</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>partheneia_bacchylides</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>partheneia_pindarus</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">political elegy</div>    <div class="definitionNL"><b>Definition</b>: Elegy with political content. Solon Atheniensis is a famous poet who composed such elegies.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: πολιτική ελεγεία (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet with political content&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /only in ionic dialect/, /in elegiac couplet/, /with specific content/, /with political content/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 1</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>political_elegies_solon</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">prosodion</div>    <div class="definitionNL"><b>Definition</b>: A lyric song performed on the way to an altar by a chorus. Alcman, Bacchylides and Pindar are famous prosodia composers.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Source</b>: Κακριδής, Φάνης. (2012). 2.4.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 from https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: προσόδιο (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus on the way to an altar&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /in ionic or in doric or in aeolic dialect/, /performed by a chorus/, /performed by a non-specific type of chorus/, /on the way to an altar/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus performed by a non-specific type of chorus&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 3</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>prosodia_alcman</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>prosodia_bacchylides</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>prosodia_pindarus</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">threnos</div>    <div class="definitionNL"><b>Definition</b>: Lyric song dedicated to a dead human being. Anacreon, Pindar and Simonides are famous for their such compositions.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Source</b>: Κακριδής, Φάνης. (2012). 2.4.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 from https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: θρήνος (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to dead&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /in ionic or in doric or in aeolic dialect/, /performed by a chorus or by a single performer/, /dedicated to mortal/, /dedicated to a dead being/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to living&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 3</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>threnoi_anacreon</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>threnoi_pindarus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>threnoi_simonides</strong></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">war elegy</div>    <div class="definitionNL"><b>Definition</b>: Elegy with war content. Tyrtaeus and Callinus are famous poets of such elegy.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: πολεμική ελεγεία (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet with war content&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric poem/, /only in ionic dialect/, /in elegiac couplet/, /with specific content/, /with war content/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>isWrittenBy</i></u>: &lt;Archaic Lyric Composer&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 2</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>war_elegies_tyrtaeus</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>war_elegy_callinus</strong></div></div></div>'],
];
function show_selected() {
    var selector = document.getElementById('idTerm');
    var champ = dictionnaire[selector[selector.selectedIndex].value][0];
    document.getElementById('display').innerHTML = champ;
}
document.getElementById('idTerm').addEventListener('change', show_selected);

searchBox = document.querySelector("#searchBox");
entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});

</script>
