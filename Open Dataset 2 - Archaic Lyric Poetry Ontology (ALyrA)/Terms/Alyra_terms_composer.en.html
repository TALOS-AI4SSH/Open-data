    ['<div class="terminologyEntry">    <div class="term">archaic lyric poetess</div>    <div class="definitionNL"><b>Definition</b>: An Archaic Lyric poetess (woman) is a person who lived during 7th-early 5th century BCE and wrote Archaic Lyric poetry.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: αρχαϊκή λυρική ποιήτρια (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Archaic Lyric Poetess&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /archaic lyric composer/, /female/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Archaic Lyric Composer&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>centuryOfLiving</i></u>: &lt;BCE century&gt;</div><div class="definitionFormal"> <u><i>stayedIn</i></u>: &lt;Ancient Location&gt;</div><div class="definitionFormal"> <u><i>bornIn</i></u>: &lt;Ancient Location&gt;</div><div class="definitionFormal"> <u><i>hasWritten</i></u>: &lt;Archaic Lyric Poem&gt;</div></div></div><div class="otherEntry"></div>    <div class="objectEntry"><div class="titleBlack"><strong>Objects of this type: 1</strong></div></div><div class="objectEntry">    <div class="textMediumMargin"><strong>sappho_lesbia</strong></div>    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b1/1877_Charles_Mengin_-_Sappho.jpg" alt="unsupported format"style="width=175px;height:175px;">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/b/b1/1877_Charles_Mengin_-_Sappho.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/b/b1/1877_Charles_Mengin_-_Sappho.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=P function show_selected() {
    var selector = document.getElementById('idTerm');
    var champ = dictionnaire[selector[selector.selectedIndex].value][0];
    document.getElementById('display').innerHTML = champ;
}
document.getElementById('idTerm').addEventListener('change', show_selected);

searchBox = document.querySelector("#searchBox");
entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});

</script>
