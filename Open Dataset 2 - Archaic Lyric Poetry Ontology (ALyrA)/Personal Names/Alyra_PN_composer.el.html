s.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D11%3Asection%3D1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D11%3Asection%3D1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D11%3Asection%3D2" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D11%3Asection%3D2</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ίβυκος ο Ρηγίνος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ακολούθησε το μοντέλο του Στησίχορου, συνθέτοντας αφηγηματικά μυθολογικά τραγούδια με τοπικές παραλλαγές. Σε ένα επτανησιακό περιβάλλον, τα έργα του πήραν έναν ερωτικό τόνο. Ένα σωζόμενο απόσπασμα κολακεύει τον οικοδεσπότη του και ταυτόχρονα εξυψώνει διακριτικά την τέχνη του, αντιμετωπίζοντας τον μύθο σε εγκωμιαστικό πλαίσιο, όπως φαίνεται στον πανηγυρικό του προς τον Πολυκράτη, μεταβαίνοντας από τον Τρωικό Πόλεμο στην ομορφιά της νιότης.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> IBYCUS Lyr. {0293}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0293&amp;wid=&amp;q=IBYCUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=5&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). 2.4.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 191).</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.760</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Ibycus Rheginus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: ibycus_rheginus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Heinrich Schwemminger - The Cranes of Ibycus, by Heinrich Schwemminger, illustrating Schiller&apos;s poem of that name<br>https://digital.belvedere.at/objects/2534/die-kraniche-des-ibykus, Public Domain, https://commons.wikimedia.org/w/index.php?curid=74330706</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/d/de/Heinrich_Schwemminger_-_Die_Kraniche_des_Ibykus_-_3739_-_Kunsthistorisches_Museum.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0293&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Χορική ποίηση του Ίβυκου του Ρηγίνου, Εγκωμιαστική ποίηση του Ιβύκου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Ρήγιο</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Σάμος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/d/de/Heinrich_Schwemminger_-_Die_Kraniche_des_Ibykus_-_3739_-_Kunsthistorisches_Museum.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/d/de/Heinrich_Schwemminger_-_Die_Kraniche_des_Ibykus_-_3739_-_Kunsthistorisches_Museum.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://web.archive.org/web/20120212233258/http://www.csad.ox.ac.uk/POXY/VExhibition/images/1790.jpg" target="_blank" rel="noopener">https://web.archive.org/web/20120212233258/http://www.csad.ox.ac.uk/POXY/VExhibition/images/1790.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Ibycus" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Ibycus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://quod.lib.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=ACL3129.0002.001;didno=ACL3129.0002.001;view=image;seq=00000567" target="_blank" rel="noopener">https://quod.lib.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=ACL3129.0002.001;didno=ACL3129.0002.001;view=image;seq=00000567</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.760" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.760</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0293.tlg001.opp-eng1" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0293.tlg001.opp-eng1</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ιππώναξ ο Εφέσιος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Ιππώναξ ο Ιαμβογράφος, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Hipponax Ephesius</div>    <div class="textMediumMarginBlue">- en: Hipponax Iambographus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: hipponax_ephesius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Published by Guillaume Rouille(1518?-1589) - Hipponax of Ephesus was an Ancient Greek iambic poet. "Promptuarii Iconum Insigniorum ", Public Domain, https://commons.wikimedia.org/w/index.php?curid=8660255</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/8/87/Hipponax_of_Ephesus.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Hipponax, fr. 68 West: Two days are sweetest for a woman, the day a man marries her and the day he carries her out dead. (Hawkins, L. (n.d.). Hipponax &amp; Misogyny in Ancient Greece. World History Encyclopedia. Retrieved 5 May 2024, from https://www.worldhistory.org/article/188/hipponax--misogyny-in-ancient-greece/)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0233&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Ιππώναξ, απ. 68 West μετ. Σ. Μενάρδος: Δυο μέρες της γυναίκας είν᾽ οι πιο γλυκές, του γάμου η μια κι η άλλη… της κηδείας της. (Τσέλικας, Σ. (επ.). ΙΠΠΩΝΑΞ: απ. 68 West. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=122)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Ίαμβοι του Ιππώνακτα</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Έφεσος</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Κλαζομενές</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/8/87/Hipponax_of_Ephesus.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/8/87/Hipponax_of_Ephesus.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikiquote.org/wiki/Hipponax" target="_blank" rel="noopener">https://en.wikiquote.org/wiki/Hipponax</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Hipponax" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Hipponax</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:entry=hipponax-bio-1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:entry=hipponax-bio-1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0233.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0233.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.741" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.741</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ιππώναξ ο Ιαμβογράφος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Ιππώναξ ο Εφέσιος, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Ιππόναξ, ποιητής από την Έφεσο, που αργότερα μετακόμισε στις Κλαζομενές, ήταν γνωστός για την εκφραστική σάτιρα και τη χυδαία γλώσσα του, απεικονίζοντας σκηνές φτώχειας, γελοιοποιώντας τους εχθρούς και εξερευνώντας θέματα κλοπής, καυγάδων και τολμηρών ρομαντικών περιπετειών. Οι στίχοι του περιλάμβαναν επίσης χονδροειδείς συγκρίσεις, μαγικά στοιχεία, παροιμιώδεις εκφράσεις και νύξεις μισογυνισμού, αναδεικνύοντας ένα μοναδικό μείγμα σάτιρας και ιδιότυπης γλώσσας.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Ίαμβοι. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_022.html</div>    <div class="textItalicSmallMargin"><b>2)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 185).</div>    <div class="textItalicSmallMargin"><b>3)</b> HIPPONAX Iamb. {0233}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0233&amp;wid=&amp;q=HIPPONAX&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=8&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.741</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Hipponax Ephesius</div>    <div class="textMediumMarginBlue">- en: Hipponax Iambographus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: hipponax_ephesius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Published by Guillaume Rouille(1518?-1589) - Hipponax of Ephesus was an Ancient Greek iambic poet. "Promptuarii Iconum Insigniorum ", Public Domain, https://commons.wikimedia.org/w/index.php?curid=8660255</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/8/87/Hipponax_of_Ephesus.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Hipponax, fr. 68 West: Two days are sweetest for a woman, the day a man marries her and the day he carries her out dead. (Hawkins, L. (n.d.). Hipponax &amp; Misogyny in Ancient Greece. World History Encyclopedia. Retrieved 5 May 2024, from https://www.worldhistory.org/article/188/hipponax--misogyny-in-ancient-greece/)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0233&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Ιππώναξ, απ. 68 West μετ. Σ. Μενάρδος: Δυο μέρες της γυναίκας είν᾽ οι πιο γλυκές, του γάμου η μια κι η άλλη… της κηδείας της. (Τσέλικας, Σ. (επ.). ΙΠΠΩΝΑΞ: απ. 68 West. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=122)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Ίαμβοι του Ιππώνακτα</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Έφεσος</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Κλαζομενές</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/8/87/Hipponax_of_Ephesus.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/8/87/Hipponax_of_Ephesus.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikiquote.org/wiki/Hipponax" target="_blank" rel="noopener">https://en.wikiquote.org/wiki/Hipponax</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Hipponax" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Hipponax</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:entry=hipponax-bio-1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:entry=hipponax-bio-1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0233.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0233.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.741" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.741</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Καλλίνος ο Εφέσιος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div>    <div class="textMediumMargin"><b>Comment</b>: Έλληνας ποιητής πιθανότατα από την Έφεσο, ο οποίος θεωρείται ως ένας από τους πρώτους ελεγειακούς ποιητές, γνωστός για τα αποσπάσματά του, συμπεριλαμβανομένης μιας πολεμικής ελεγείας που παρακινεί εναντίον των εχθρών, η οποία πιθανώς γράφτηκε γύρω στο 675 π.Χ. κατά τη διάρκεια των Κιμμερίων εισβολών.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> CALLINUS Eleg. {0243}. (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0243&amp;wid=&amp;q=CALLINUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=2&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Πολεμική Ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_025.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Callinus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DC%3Aentry+group%3D6%3Aentry%3Dcallinus-bio-1</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.310</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Callinus Ephesius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: callinus_ephesius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;The Elegiac Poems of Callinus, CURFRAG.tlg-0243.1, translated by Edmonts: How long will ye lie idle? When, young men, will ye show a stout heart? Have ye no shame of your sloth before them that dwell round about you? Purpose ye to sit in peace though the land is full of war? ... and let every man cast his javelin once more as he dies. For &apos;&apos;&apos;&apos;tis an honourable thing and a glorious to a man to fight the foe for land and children and wedded wife; and death shall befall only when the Fates ordain it. Nay, so soon as war is mingled let each go forward spear in poise and shield before stout heart; for by no means may a man escape death, nay not if he come of immortal lineage. Oftentime, it may be, he returneth safe from the conflict of battle and the thud of spears, and the doom of death cometh upon him at home; yet such is not dear to the people nor regretted, whereas if aught happen to the other sort he is bewailed of small and great. When a brave man dieth the whole people regretteth him, and while he lives he is as good as a demigod; for in their eyes he is a tower, seeing that he doeth single-handed as good work as many together. (Edmonds, J. M. (1931). The Elegiac Poems of Callinus in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D1%3Asection%3D2#note1:~:text=as%20many%20together.-,CURFRAG.tlg%2D0243.1,-%E2%80%9D%20Stobaeus%20Anthology)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0243&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Καλλίνος, απ. 1 West, μετ. Σ. Μενάνδρου: Ως πότε πια κατάκοιτοι; ορμήν πότε θα βρείτε; | δεν ντρέπεσθε τους γείτονες για την οκνιάν αυτή; | Ε! παλικάρια, ειρηνικά πως κάθεστε θαρρείτε | και ωστόσο γύρω ο πόλεμος όλη την γη κρατεί… | ................. | Είναι τιμή κι είναι χαρά στο παλικάρι η μάχη | για την πατρίδα, την καλή γυναίκα, τα παιδιά. | Ο θάνατος τότε θα ᾽ρθει, όταν η Μοίρα λάχει· | μόνο καθείς ας ορθωθεί μ᾽ ατρόμητη καρδιά, | και ας δράξει αμέσως το σπαθί κι ας ζώσει τ᾽ άρματά του | και όσό ᾽ναι του πολέμου αρχή, ας δράμει εκεί μπροστά, | γιατί να φύγει αδύνατο την μοίρα του θανάτου, | και αν η γενιά του από θεούς αθάνατου ς βαστά· | κάποτ᾽ αν απ᾽ τον πόλεμο δειλά λιποτακτήσει, | μέσα στο σπίτι βρίσκει τον η ώρα του η στερνή. | Μα τούτον ποιος τον αγαπά και ποιος θα τον ποθήσει; | ενώ τον άλλο ένας λαός, αν πάθει, τον πονεί. | Γιατί ο λαός ολάκερος θρηνεί το παλικάρι, | σαν αποθάνει· κι έχουν τον ημίθεο όσο ζει | σαν πύργ᾽ όλοι κατάματα θωρούν τον με καμάρι | γιατί μονάχος κάμνει αυτός όσα πολλοί μαζί! (Τσέλικας, Σ. (επ.). ΚΑΛΛΙΝΟΣ: απ. 1 West. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=48)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Πολεμικές ελεγείες του Καλλίνου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 7ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Έφεσος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0243.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0243.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.310" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.310</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/people/2039" target="_blank" rel="noopener">https://topostext.org/people/2039</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D1%3Asection%3D2" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D1%3Asection%3D2</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/biography/Callinus" target="_blank" rel="noopener">https://www.britannica.com/biography/Callinus</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Μίμνερμος από την Κολοφώνα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Μίμνερμος ο Λυρικός, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Mimnermus Lyricus</div>    <div class="textMediumMarginBlue">- en: Mimnermo of Colophon</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: mimnermus_lyricus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;The Elegies of Mimnermus, CURFRAG.tlg-0255.1, translated by Edmonts: But what life would there be, what joy, without golden Aphrodite? May I die when I be no more concerned with secret love and suasive gifts and the bed, such things as are the very flowers of youth, pleasant alike to man and woman. And when dolorous Age cometh, that maketh a man both foul without and evil within,ill cares do wear and wear his heart, he hath no more the joy of looking one the sunlight, to children he is hateful, to women contemptible, so grievous hath God made Age. (Edmonds, J. M. (1931). The Elegies of Mimnermus in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D4%3Asection%3D2#:~:text=God%20made%20Age.-,%20Stobaeus%20Anthology)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0255&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Μίμνερμος, απ. 1 West μετ. I. Ν. Καζάζη: Τι είναι η ζωή, και ποια η γλύκα της δίχως την Αφροδίτη τη χρυσή; Ν άφηνα την πνοή μου, όταν θα έπαυαν όλα τούτα να μ᾽ ενδιαφέρουν, οι κρυφές αγάπες, τα γλυκά σαν μέλι δώρα τους και το κρεβάτι — άνθη συναρπαστικά που στολίζουν τη νιότη αντρών και γυναικών. Μα όταν επιδράμει οδυνηρό το γήρας, αυτό που ασχημίζει τον άνθρωπο και τον εξευτελίζει, εξουθενωτικό άγχος βασανίζει την ψυχή του, και πια δεν χαίρεται να αντικρίζει το φως του ήλιου· γιατί οι άγουροι τον αποφεύγουν, και οι γυναίκες τον περιφρονούν — τόσο σκληρά έκαμε ο θεός τα γηρατειά! (Τσέλικας, Σ. (επ.). Μίμνερμος: απ. 1 West. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=64#m2)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Ερωτική ελεγεία του Μίμνερμου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 7ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Κολοφώνα, Σμύρνη</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg002" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg002</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q316129" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q316129</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.938" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.938</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D4%3Asection%3D2" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D4%3Asection%3D2</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Μίμνερμος ο Λυρικός</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Μίμνερμος από την Κολοφώνα, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Μίμνερμος, που καταγόταν από την Κολοφώνα (ή τη Σμύρνη) τον 7ο/6ο αιώνα π.Χ., πιστώνεται ότι εγκαινίασε το είδος της ερωτικής ελεγείας, απεικονίζοντας θέματα κρυμμένου έρωτα και την παροδική φύση της ανθρώπινης ζωής.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b>  MIMNERMUS Eleg. {0255} (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0255&amp;wid=&amp;q=MIMNERMUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=3&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Ερωτική Ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_026.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Mimnermus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DM%3Aentry+group%3D26%3Aentry%3Dmimnermus-bio-1</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.938</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Mimnermus Lyricus</div>    <div class="textMediumMarginBlue">- en: Mimnermo of Colophon</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: mimnermus_lyricus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;The Elegies of Mimnermus, CURFRAG.tlg-0255.1, translated by Edmonts: But what life would there be, what joy, without golden Aphrodite? May I die when I be no more concerned with secret love and suasive gifts and the bed, such things as are the very flowers of youth, pleasant alike to man and woman. And when dolorous Age cometh, that maketh a man both foul without and evil within,ill cares do wear and wear his heart, he hath no more the joy of looking one the sunlight, to children he is hateful, to women contemptible, so grievous hath God made Age. (Edmonds, J. M. (1931). The Elegies of Mimnermus in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D4%3Asection%3D2#:~:text=God%20made%20Age.-,%20Stobaeus%20Anthology)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0255&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Μίμνερμος, απ. 1 West μετ. I. Ν. Καζάζη: Τι είναι η ζωή, και ποια η γλύκα της δίχως την Αφροδίτη τη χρυσή; Ν άφηνα την πνοή μου, όταν θα έπαυαν όλα τούτα να μ᾽ ενδιαφέρουν, οι κρυφές αγάπες, τα γλυκά σαν μέλι δώρα τους και το κρεβάτι — άνθη συναρπαστικά που στολίζουν τη νιότη αντρών και γυναικών. Μα όταν επιδράμει οδυνηρό το γήρας, αυτό που ασχημίζει τον άνθρωπο και τον εξευτελίζει, εξουθενωτικό άγχος βασανίζει την ψυχή του, και πια δεν χαίρεται να αντικρίζει το φως του ήλιου· γιατί οι άγουροι τον αποφεύγουν, και οι γυναίκες τον περιφρονούν — τόσο σκληρά έκαμε ο θεός τα γηρατειά! (Τσέλικας, Σ. (επ.). Μίμνερμος: απ. 1 West. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=64#m2)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Ερωτική ελεγεία του Μίμνερμου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 7ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Κολοφώνα, Σμύρνη</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg002" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg002</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q316129" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q316129</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.938" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.938</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D4%3Asection%3D2" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D4%3Asection%3D2</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Πίνδαρος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Πίνδαρος από τη Βοιωτία, Πίνδαρος ο Βοιωτός, Πίνδαρος ο Λυρικός, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Pindarus Boeotus</div>    <div class="textMediumMarginBlue">- en: Pindar</div>    <div class="textMediumMarginBlue">- en: Pindarus Lyricus</div>    <div class="textMediumMarginBlue">- en: Pindarus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: pindarus_boeotus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Ancient Roman frescos of Pompeii - Enthroned Pindar with lyre, Muse and poetess. Antique fresco in Pompeii<br>https://pompeiiinpictures.com/pompeiiinpictures/index.htm, Public Domain, https://commons.wikimedia.org/w/index.php?curid=94696565</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Pythian 7 transl Svarlien: The great city of Athens is the most beautiful prelude of song, which the widely powerful race of the Alcmaeonids can lay as a foundation of odes in honor of their horses. [5] What fatherland, what family will you name that is more illustrious in Greece? For in all cities the story [10] of the citizens of Erechtheus makes the rounds, Apollo, how they made your dwelling in divine Pytho a marvel to see. Five Isthmian victories lead my song forward, and one outstanding triumph [15] at Zeus&apos;&apos;&apos;&apos; Olympian games, and two from Cirrha— yours, Megacles, and your ancestors&apos;&apos;&apos;&apos;. I rejoice at this new success; but I grieve that fine deeds are repaid with envy. [20] It is true what they say: the abiding bloom of good fortune brings with it both good and bad. (Arnson Svarlien, D. (n.d.). Pindar, Pythian 7. Retrieved 12 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0162%3Abook%3DP.%3Apoem%3D7)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0033&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Υπορχήματα του Πινδάρου, Παρθένεια του Πινδάρου, Προσόδια του Πινδάρου, Διθυραμβική ποίηση του Πινδάρου, Εγκωμιαστική ποίηση του Πινδάρου, Επίνικοι του Πινδάρου, Παιάνες του Πινδάρου, Θρήνοι του Πινδάρου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 5ος αιώνας π.Χ., 6ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Βοιωτία</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Ακράγας, Αθήνα, Συρακούσες</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/author/690" target="_blank" rel="noopener">https://www.trismegistos.org/author/690</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg002" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg002</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg003" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg003</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg004" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg004</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg005" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg005</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.1126" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.1126</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/collection?collection=Perseus%3Acorpus%3Aperseus%2Cauthor%2CPindar" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/collection?collection=Perseus%3Acorpus%3Aperseus%2Cauthor%2CPindar</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Πίνδαρος από τη Βοιωτία</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Πίνδαρος, Πίνδαρος ο Βοιωτός, Πίνδαρος ο Λυρικός, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Pindarus Boeotus</div>    <div class="textMediumMarginBlue">- en: Pindar</div>    <div class="textMediumMarginBlue">- en: Pindarus Lyricus</div>    <div class="textMediumMarginBlue">- en: Pindarus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: pindarus_boeotus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Ancient Roman frescos of Pompeii - Enthroned Pindar with lyre, Muse and poetess. Antique fresco in Pompeii<br>https://pompeiiinpictures.com/pompeiiinpictures/index.htm, Public Domain, https://commons.wikimedia.org/w/index.php?curid=94696565</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Pythian 7 transl Svarlien: The great city of Athens is the most beautiful prelude of song, which the widely powerful race of the Alcmaeonids can lay as a foundation of odes in honor of their horses. [5] What fatherland, what family will you name that is more illustrious in Greece? For in all cities the story [10] of the citizens of Erechtheus makes the rounds, Apollo, how they made your dwelling in divine Pytho a marvel to see. Five Isthmian victories lead my song forward, and one outstanding triumph [15] at Zeus&apos;&apos;&apos;&apos; Olympian games, and two from Cirrha— yours, Megacles, and your ancestors&apos;&apos;&apos;&apos;. I rejoice at this new success; but I grieve that fine deeds are repaid with envy. [20] It is true what they say: the abiding bloom of good fortune brings with it both good and bad. (Arnson Svarlien, D. (n.d.). Pindar, Pythian 7. Retrieved 12 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0162%3Abook%3DP.%3Apoem%3D7)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0033&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Υπορχήματα του Πινδάρου, Παρθένεια του Πινδάρου, Προσόδια του Πινδάρου, Διθυραμβική ποίηση του Πινδάρου, Εγκωμιαστική ποίηση του Πινδάρου, Επίνικοι του Πινδάρου, Παιάνες του Πινδάρου, Θρήνοι του Πινδάρου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 5ος αιώνας π.Χ., 6ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Βοιωτία</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Ακράγας, Αθήνα, Συρακούσες</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/author/690" target="_blank" rel="noopener">https://www.trismegistos.org/author/690</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg002" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg002</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg003" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg003</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg004" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg004</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg005" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg005</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.1126" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.1126</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/collection?collection=Perseus%3Acorpus%3Aperseus%2Cauthor%2CPindar" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/collection?collection=Perseus%3Acorpus%3Aperseus%2Cauthor%2CPindar</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Πίνδαρος ο Βοιωτός</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Πίνδαρος, Πίνδαρος από τη Βοιωτία, Πίνδαρος ο Λυρικός, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Πίνδαρος, που γεννήθηκε κοντά στη Θήβα, παρήγαγε διάφορες ποιητικές συνθέσεις, συμπεριλαμβανομένων των εγκωμίων, των επινίκων και των ύμνων, κερδίζοντας καταξίωση για τους πλούσιους στίχους του. Τα έργα του, γραμμένα κυρίως σε επική γλώσσα με δωρικά και κάποια αιολικά στοιχεία, αντανακλούν έναν σοβαρό και μεγαλοπρεπή τόνο, τονίζοντας τη θεϊκή δύναμη και το ανθρώπινο μεγαλείο.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> PINDARUS Lyr. {0033}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0033&amp;wid=&amp;q=PINDARUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=9&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). 3.5.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_042.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 192-194).</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.1126</div>    <div class="textItalicSmallMargin"><b>5)</b> https://lsj.gr/wiki/%CE%A0%CE%AF%CE%BD%CE%B4%CE%B1%CF%81%CE%BF%CF%82</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Pindarus Boeotus</div>    <div class="textMediumMarginBlue">- en: Pindar</div>    <div class="textMediumMarginBlue">- en: Pindarus Lyricus</div>    <div class="textMediumMarginBlue">- en: Pindarus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: pindarus_boeotus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Ancient Roman frescos of Pompeii - Enthroned Pindar with lyre, Muse and poetess. Antique fresco in Pompeii<br>https://pompeiiinpictures.com/pompeiiinpictures/index.htm, Public Domain, https://commons.wikimedia.org/w/index.php?curid=94696565</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Pythian 7 transl Svarlien: The great city of Athens is the most beautiful prelude of song, which the widely powerful race of the Alcmaeonids can lay as a foundation of odes in honor of their horses. [5] What fatherland, what family will you name that is more illustrious in Greece? For in all cities the story [10] of the citizens of Erechtheus makes the rounds, Apollo, how they made your dwelling in divine Pytho a marvel to see. Five Isthmian victories lead my song forward, and one outstanding triumph [15] at Zeus&apos;&apos;&apos;&apos; Olympian games, and two from Cirrha— yours, Megacles, and your ancestors&apos;&apos;&apos;&apos;. I rejoice at this new success; but I grieve that fine deeds are repaid with envy. [20] It is true what they say: the abiding bloom of good fortune brings with it both good and bad. (Arnson Svarlien, D. (n.d.). Pindar, Pythian 7. Retrieved 12 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0162%3Abook%3DP.%3Apoem%3D7)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0033&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Υπορχήματα του Πινδάρου, Παρθένεια του Πινδάρου, Προσόδια του Πινδάρου, Διθυραμβική ποίηση του Πινδάρου, Εγκωμιαστική ποίηση του Πινδάρου, Επίνικοι του Πινδάρου, Παιάνες του Πινδάρου, Θρήνοι του Πινδάρου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 5ος αιώνας π.Χ., 6ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Βοιωτία</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Ακράγας, Αθήνα, Συρακούσες</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/author/690" target="_blank" rel="noopener">https://www.trismegistos.org/author/690</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg002" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg002</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg001</a></div>    <div class= "externalLinkIndivi     ['<div class="terminologyEntry">    <div class="term">Πίνδαρος ο Λυρικός</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Πίνδαρος, Πίνδαρος από τη Βοιωτία, Πίνδαρος ο Βοιωτός, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Pindarus Boeotus</div>    <div class="textMediumMarginBlue">- en: Pindar</div>    <div class="textMediumMarginBlue">- en: Pindarus Lyricus</div>    <div class="textMediumMarginBlue">- en: Pindarus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: pindarus_boeotus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Ancient Roman frescos of Pompeii - Enthroned Pindar with lyre, Muse and poetess. Antique fresco in Pompeii<br>https://pompeiiinpictures.com/pompeiiinpictures/index.htm, Public Domain, https://commons.wikimedia.org/w/index.php?curid=94696565</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Pythian 7 transl Svarlien: The great city of Athens is the most beautiful prelude of song, which the widely powerful race of the Alcmaeonids can lay as a foundation of odes in honor of their horses. [5] What fatherland, what family will you name that is more illustrious in Greece? For in all cities the story [10] of the citizens of Erechtheus makes the rounds, Apollo, how they made your dwelling in divine Pytho a marvel to see. Five Isthmian victories lead my song forward, and one outstanding triumph [15] at Zeus&apos;&apos;&apos;&apos; Olympian games, and two from Cirrha— yours, Megacles, and your ancestors&apos;&apos;&apos;&apos;. I rejoice at this new success; but I grieve that fine deeds are repaid with envy. [20] It is true what they say: the abiding bloom of good fortune brings with it both good and bad. (Arnson Svarlien, D. (n.d.). Pindar, Pythian 7. Retrieved 12 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0162%3Abook%3DP.%3Apoem%3D7)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0033&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Υπορχήματα του Πινδάρου, Παρθένεια του Πινδάρου, Προσόδια του Πινδάρου, Διθυραμβική ποίηση του Πινδάρου, Εγκωμιαστική ποίηση του Πινδάρου, Επίνικοι του Πινδάρου, Παιάνες του Πινδάρου, Θρήνοι του Πινδάρου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 5ος αιώνας π.Χ., 6ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Βοιωτία</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Ακράγας, Αθήνα, Συρακούσες</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/author/690" target="_blank" rel="noopener">https://www.trismegistos.org/author/690</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg002" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg002</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg003" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg003</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg004" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg004</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg005" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg005</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.1126" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.1126</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/collection?collection=Perseus%3Acorpus%3Aperseus%2Cauthor%2CPindar" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/collection?collection=Perseus%3Acorpus%3Aperseus%2Cauthor%2CPindar</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σαπφώ</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκή λυρική ποιήτρια</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Σαπφώ η Λεσβία, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Σαπφώ, που συχνά περιβάλλεται από θρύλους, ήταν πιθανότατα αριστοκρατικής καταγωγής από τη Λέσβο, που συνδέθηκε με τον Πιττακό και τον Αλκαίο και πιθανώς εξορίστηκε στη Σικελία. Η σωζόμενη ποίησή της, επικεντρωμένη κυρίως σε θέματα αγάπης και στοργής, περιλαμβάνει κυρίως ωδές και επιθαλάμια, (χορικά γαμήλια τραγούδια).</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> SAPPHO Lyr. {0009} (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0009&amp;wid=&amp;q=SAPPHO&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=2&amp;acp=1&amp;editid=<br>2. Κακριδής, Φάνης. (2012). Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div>    <div class="textItalicSmallMargin"><b>2)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 188).</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Sappho. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DS%3Aentry+group%3D4%3Aentry%3Dsappho-bio-1</div>    <div class="textItalicSmallMargin"><b>4)</b> Britannica, T. Editors of Encyclopaedia. "Sappho." Encyclopedia Britannica. Retrieved 5 April 2024 from https://www.britannica.com/biography/Sappho-Greek-poet.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Sappho Lesbia</div>    <div class="textMediumMarginBlue">- en: Sappho Lyrica</div>    <div class="textMediumMarginBlue">- en: Sapphus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sappho_lesbia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poetess&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Charles Mengin - Sappho (1877) by Charles Mengin (1853–1933). One tradition claims that Sappho committed suicide by jumping off the Leucadian cliff., Public Domain, https://commons.wikimedia.org/w/index.php?curid=1753564</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b1/1877_Charles_Mengin_-_Sappho.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Sappho, fr. 50: The man who is pretty is so only as far as he looks; the man who is good is already beautiful. (Sententiaeantiquae. (2012, March 14). Sappho, fragment 50. SENTENTIAE ANTIQUAE. https://sententiaeantiquae.com/2012/03/14/sappho-fragment-50/)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0009&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;απφώ, απ. 50 Lobel-Page μετ. Ι.Ν. Καζάζη: Αυτός που είναι ωραίος, είναι ωραίος στην όψη, αυτός όμως που είναι και καλός, θα είναι αυτόματα και ωραίος. (Τσέλικας, Σ. (επ.). ΣΑΠΦΩ: απ. 50 Lobel-Page. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=296)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Υμέναιοι της Σαπφούς, Επιθαλάμια της Σαπφούς της Λεσβίας, Ύμνοι της Σαπφούς της Λεσβίας, Ερωτική ποίηση της Σαπφούς</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6ος αιώνας π.Χ., 7ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Λέσβος</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Σικελία</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/b/b1/1877_Charles_Mengin_-_Sappho.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/b/b1/1877_Charles_Mengin_-_Sappho.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:entry=sappho-bio-1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:entry=sappho-bio-1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0009.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0009.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0009.tlg002" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0009.tlg002</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DS%3Aentry+group%3D4%3Aentry%3Dsappho-bio-1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DS%3Aentry+group%3D4%3Aentry%3Dsappho-bio-1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/?f%5Btg_facet%5D%5B%5D=Sappho&amp;f%5Bwork_lang%5D%5B%5D=grc&amp;per_page=10&amp;q=tg_no_token%3A%5BS+TO+T%5D&amp;sort=auth_name+asc%2C+work_titl     ['<div class="terminologyEntry">    <div class="term">Σημωνίδης ο Αμοργίνος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Σημωνίδης ο Ιαμβογράφος, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Semonides Amorginus</div>    <div class="textMediumMarginBlue">- en: Simonides of Amorgos</div>    <div class="textMediumMarginBlue">- en: Semonides Iambographus</div>    <div class="textMediumMarginBlue">- en: Simonides of Samos</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: semonides_amorginus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Semonides, Iambi, CURFRAG.tlg-0260.3 translated by Edmonds: There&apos;&apos;&apos;&apos;s much time for us to lie dead in, yet we live years few in number and live them ill. (Edmonds, J. M. (1931). Iambi, Semonides in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0480%3Avolume%3D2%3Atext%3D22%3Asection%3D2#:~:text=live%20them%20ill.-,CURFRAG.tlg%2D0260.3,-%E2%80%9D%20Stobaeus%20Anthology)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0260&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Σημωνίδης, απ. 3 West μετ. Ηλ. Βουτιερίδης: Για να πεθάνουμε έχουμε καιρόν όσον κι αν θέμε, μα ζούμε χρόνια λιγοστά και συφορές γεμάτα. (Τσέλικας, Σ. (επ.). Σημωνίδης: απ. 3 West. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανα     ['<div class="terminologyEntry">    <div class="term">Σημωνίδης ο Ιαμβογράφος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Σημωνίδης ο Αμοργίνος, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Σημωνίδης, που γεννήθηκε στη Σάμο αλλά ζούσε στην Αμοργό, ήταν γνωστός για τους λιγοστούς σωζόμενους ιαμβικούς στίχους του και μερικά αποσπάσματα ελεγείας. Οι τελευταίες περιέχουν φιλοσοφικούς στοχασμούς, ενώ οι ιαμβικοί στίχοι σατιρικές απεικονίσεις γυναικών.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> SEMONIDES Eleg., Iamb. {0260} (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0260&amp;wid=&amp;q=SEMONIDES&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=2&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Ίαμβοι. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_022.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Simonides. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DS%3Aentry+group%3D19%3Aentry%3Dsimonides-bio-1#:~:text=%CE%A3%CE%B9%CE%BC%CF%89%CE%BD%CE%AF%CE%B4%CE%B7%CF%82)%2C%20literary.-,Simo%27nides,-1.%20Of%20Samos</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.1267</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="tex 2</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σιμωνίδης από την Κέα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Σιμωνίδης ο Λυρικός, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Σιμωνίδης, που γεννήθηκε στο νησί της Κέας, απέκτησε γρήγορα φήμη για τα ποικίλα ποιητικά του έργα, όπως οι επίνικοι, οι θρήνοι, τα επιγράμματα και οι διθύραμβοι. Φημισμένος για τη γλωσσική του ακρίβεια, επαινέθηκε επειδή ξεπέρασε ακόμη και τον Πίνδαρο στους συμπονετικούς θρήνους του. Ο Σιμωνίδης προτίμησε την απλότητα έναντι της μεγαλοπρέπειας στις συνθέσεις του, προσφέροντας φιλοσοφικούς προβληματισμούς για την ανθρώπινη μοίρα με βαθιά κατανόηση.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> SIMONIDES Lyr. {0261}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0261&amp;wid=&amp;q=SIMONIDES&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=11&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012).2.4.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 </div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 191).</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.1292</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Simonides Ceus</div>    <div class="textMediumMarginBlue">- en: Simonides Lyricus</div>    <div class="textMediumMarginBlue">- en: Simonides
