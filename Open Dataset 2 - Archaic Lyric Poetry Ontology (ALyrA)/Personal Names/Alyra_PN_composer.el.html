    ['<div class="terminologyEntry">    <div class="term">Σιμωνίδης ο Λυρικός</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Σιμωνίδης από την Κέα, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Simonides Ceus</div>    <div class="textMediumMarginBlue">- en: Simonides Lyricus</div>    <div class="textMediumMarginBlue">- en: Simonides of Ceos</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: simonides_ceus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Michel Wolgemut, Wilhelm Pleydenwurff; Text: Hartmann Schedel - Imaginary portrait of Simonides from the Nuremberg Chronicle (1493)<br>Self-scanned, Public Domain, https://commons.wikimedia.org/w/index.php?curid=1129423</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/2/2e/Nuremberg_chronicles_f_60r_3.png" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0261&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Ελεγείες του Σιμωνίδη από την Κέα, Διθύραμβοι του Σιμωνίδη του Κείου, Επίνικοι του Σιμωνίδη από την Κέα, Θρήνοι του Σιμωνίδη από την Κέα</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 5ος αιώνας π.Χ., 6ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Κέα</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Αθήνα, Σικελία</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/2/2e/Nuremberg_chronicles_f_60r_3.png" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/2/2e/Nuremberg_chronicles_f_60r_3.png</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Simonides_of_Ceos" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Simonides_of_Ceos</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q273003" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q273003</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://anthologiagraeca.org/authors/22/" target="_blank" rel="noopener">https://anthologiagraeca.org/authors/22/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/?f%5Btg_facet%5D%5B%5D=Simonides&amp;q=tg_no_token%3A%5BS+TO+T%5D" target="_blank" rel="noopener">https://catalog.perseus.org/?f%5Btg_facet%5D%5B%5D=Simonides&amp;q=tg_no_token%3A%5BS+TO+T%5D</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0480%3Avolume%3D2%3Atext%3D22" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0480%3Avolume%3D2%3Atext%3D22</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.1292" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.1292</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0004%3Aentry%3Dsimonides" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0004%3Aentry%3Dsimonides</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σόλων ο Αθηναίος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Σόλων, ένας Αθηναίος πολιτικός, παρενέβαινε στην πολιτική μέσω της ποίησής του, υποστηρίζοντας τη χρηστή διακυβέρνηση έναντι της ανομίας, καταδικάζοντας την απληστία των ηγετών και επικρίνοντας την υποδούλωση του χρέους. Πίστευε στη θεία δικαιοσύνη, προέβλεψε τις ανησυχίες της τραγωδίας και θέσπισε μετριοπαθείς μεταρρυθμίσεις, βελτιώνοντας τη νομοθεσία για τα δάνεια και καταργώντας ορισμένα χρέη. Οι πολιτικές του ελεγείες αντικατοπτρίζουν αυτά τα θέματα και τη μεταρρυθμιστική του πολιτική ατζέντα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). 2.4.Β.iii.γ. Πολιτική ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_027.html</div>    <div class="textItalicSmallMargin"><b>2)</b> SOLON Nomograph., Poeta {0263}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0263&amp;wid=&amp;q=SOLON&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=12&amp;acp=1&amp;editid=</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Solon Atheniensis</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: solon_atheniensis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By M. A. Barth - "Solon demands to pledge respect for his laws", book illustration (Augsburg 1832). &apos;Vorzeit und Gegenwart", Augsbourg, 1832, Public Domain, https://commons.wikimedia.org/w/index.php?curid=74939386</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/f/f6/Solon_demands_to_pledge_respect_for_his_laws.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0263&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Πολιτική ελεγεία του Σόλωνα</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6ος αιώνας π.Χ., 7ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Αθήνα</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/f/f6/Solon_demands_to_pledge_respect_for_his_laws.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/f/f6/Solon_demands_to_pledge_respect_for_his_laws.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0263.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0263.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0007.tlg007" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0007.tlg007</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0004%3Aalphabetic+letter%3DS%3Aentry+group%3D6%3Aentry%3Dsolon" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0004%3Aalphabetic+letter%3DS%3Aentry+group%3D6%3Aentry%3Dsolon</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D5%3Asection%3D2" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D5%3Asection%3D2</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Στησίχορος από την Ιμέρα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Στησίχορος, αναγνωρισμένος ως κορυφαία μορφή της λυρικής ποίησης, έφερε επανάσταση στον χορικό στίχο εισάγοντας νέα στοιχεία όπως η επωδός και τα περίπλοκα σχέδια των στροφών. Οι συνθέσεις του, οι οποίες επικεντρώνονται κυρίως σε μυθολογικά μοτίβα, όπως η «Ελένη» και η «Παλινωδία», υπογραμμίζουν τη βαθιά επίδρασή του στην ανάπτυξη των αρχαίων ελληνικών λογοτεχνικών μορφών.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> STESICHORUS Lyr. {0292} (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0292&amp;wid=&amp;q=STESICHORUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=5&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Stesi&apos;chorus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DT%3Aentry+group%3D26%3Aentry%3Dtyrtaeus-bio-1</div>    <div class="textItalicSmallMargin"><b>4)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 190).</div>    <div class="textItalicSmallMargin"><b>5)</b> https://catalog.perseus.tufts.edu/catalog/urn:cts:greekLit:tlg0292.tlg001.opp-grc3</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Stesichorus Himeraeus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: stesichorus_himeraeus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: Από Pirizz at Ιταλικά Βικιπαίδεια - Stesichorus - Bellini Garden, Catania, Italy - September 2010. Transferred from it.wikipedia to Commons by OrbiliusMagister., Κοινό Κτήμα, https://commons.wikimedia.org/w/index.php?curid=12861189</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e5/Stesichorus.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Stesichorus, fr. 192 tr. Campbell: That story is not true, and you did not go on the well-benched ships and you did not reach the citadel of Troy; (Campbell, D. A. (n.d.). Stesichorus, ΕΛΕΝΑ: ΠΑΛΙΝΩΙΔΙΑΙ. Loeb Classical Library. Retrieved 5 May 2024, from https://www.loebclassics.com/view/stesichorus_i-fragments/1991/pb_LCL476.93.xml)&apos;&apos; tlgIdentifyingNumber: &apos;&apos;tlg0292&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0292&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Στησίχορος, απ. 192 Page μετ. Ι.Ν. Καζάζης: Δεν αληθεύει αυτή η ιστορία· ούτε σε καράβια καλοσκάμνιστα μπήκες εσύ ποτέ, ούτε έφτασες στης Τροίας την ακρόπολη. (Τσέλικας, Σ. (επ.). ΣΤΗΣΙΧΟΡΟΣ: απ. 192 Page. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=199)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Χορική ποίηση του Στησίχορου από την Ιμέρα</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6ος αιώνας π.Χ., 7ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Ιμέρα</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/e/e5/Stesichorus.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/e/e5/Stesichorus.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/people/695" target="_blank" rel="noopener">https://topostext.org/people/695</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics-at.chs.harvard.edu/classics6-evanthia-tsitsibakou-vasalos-stesichorus-%E1%BC%B0%CE%BB%CE%B9%CE%BF%CF%85-%CF%80%CE%B5%CF%81%CF%83%CE%B9%CF%82-and-the-epic-tradition/" target="_blank" rel="noopener">https://classics-at.chs.harvard.edu/classics6-evanthia-tsitsibakou-vasalos-stesichorus-%E1%BC%B0%CE%BB%CE%B9%CE%BF%CF%85-%CF%80%CE%B5%CF%81%CF%83%CE%B9%CF%82-and-the-epic-tradition/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/biography/Stesichorus" target="_blank" rel="noopener">https://www.britannica.com/biography/Stesichorus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Stesichorus" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Stesichorus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/stesichorus_i-fragments/1991/pb_LCL476.61.xml?readMode=recto" target="_blank" rel="noopener">https://www.loebclassics.com/view/stesichorus_i-fragments/1991/pb_LCL476.61.xml?readMode=recto</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.tufts.edu/catalog/urn:cite:perseus:author.1328" target="_blank" rel="noopener">https://catalog.perseus.tufts.edu/catalog/urn:cite:perseus:author.1328</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.tufts.edu/catalog/urn:cts:greekLit:tlg0292.tlg001.opp-grc3" target="_blank" rel="noopener">https://catalog.perseus.tufts.edu/catalog/urn:cts:greekLit:tlg0292.tlg001.opp-grc3</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=PersEnc+S.stesichorus" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=PersEnc+S.stesichorus</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Τέρπανδρος ο Λέσβιος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Τέρπανδρος, γνωστός για τις μουσικές του καινοτομίες, τιμήθηκε στη Σπάρτη κατά τη διάρκεια της γιορτής του Απόλλωνα γύρω στο 674 π.Χ.. Εισήγαγε σημαντικές καινοτομίες, όπως η αντικατάσταση της τετράχορδης δωρικής λύρας με την επτάχορδη λυδία-λεσβιακή λύρα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 189).</div>    <div class="textItalicSmallMargin"><b>2)</b> Smith, W. (n.d.). Terpander. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DT%3Aentry+group%3D5%3Aentry%3Dterpander-bio-1</div>    <div class="textItalicSmallMargin"><b>3)</b>  Κακριδής, Φάνης. (2012). Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.1364</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Terpander Lesbius</div>    <div class="textMediumMarginBlue">- en: Terpandros</div>    <div class="textMediumMarginBlue">- en: Terpandrus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: terpander_lesbius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0299&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Ύμνοι του Τέρπανδρου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 7ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Λέσβος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://quod.lib.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=ACL3129.0003.001;didno=ACL3129.0003.001;view=image;seq=00001010" target="_blank" rel="noopener">https://quod.lib.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=ACL3129.0003.001;didno=ACL3129.0003.001;view=image;seq=00001010</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0299.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0299.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.1364" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.1364</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://chs.harvard.edu/chapter/iii-inventions-of-terpander/" target="_blank" rel="noopener">https://chs.harvard.edu/chapter/iii-inventions-of-terpander/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:entry=terpander-bio-1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:entry=terpander-bio-1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Terpander" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Terpander</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Τυρταίος ο Λακεδαιμόνιος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Τυρταίος, ποιητής από τη Σπάρτη, συνέθεσε πολεμικές ελεγείες κατά τη διάρκεια του δευτέρου Μεσσηνιακού Πολέμου. Τα γραπτά του εξυμνούσαν τις πολεμικές αρετές και ενθάρρυναν τους νέους της Σπάρτης να δώσουν προτεραιότητα στο θάρρος και την αυτοθυσία για την πατρίδα τους. Οι πεποιθήσεις του επικεντρώνονταν γύρω από τη δόξα του πολέμου και τη σημασία της ανδρείας για την υπεράσπιση του κράτους.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> TYRTAEUS Eleg. {0266} (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0266&amp;wid=&amp;q=TYRTAEUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=3&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Πολεμική Ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_025.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Tyrtaeus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DT%3Aentry+group%3D26%3Aentry%3Dtyrtaeus-bio-1</div>    <div class="textItalicSmallMargin"><b>4)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 186).</div>    <div class="textItalicSmallMargin"><b>5)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.1442</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Tyrtaeus Lacedaemonius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: tyrtaeus_lacedaemonius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Gustave Moreau - Gustave Moreau, "Tyrtée"<br>https://dessins-musee-moreau.fr/outils/peintures_total.php, Public Domain, https://commons.wikimedia.org/w/index.php?curid=127502347</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/2/20/Moreau_-_Tyrt%C3%A9e%2C_cat.96.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;The Elegiac Poems of Tyrtaeus, CURFRAG.tlg-0266.2 translated by Edmonds: They heard the voice of Phoebus and brought home from Pytho oracles of the God and words of sure fulfilment; for thus the Lord of the Silver Bow, Far-Shooting Apollo of the Golden Hair, gave answer from out his rich sanctuary: The beginning of counsel shall belong to the God-honoured Kings whose care is the delightsome city of Sparta, and to the men of elder birth; after them shall the commons, answering them back with forthright ordinances, both say things honourable and do all that is right, nor give the city any crooked counsel; so shall the common people have victory and might; for this hath Phoebus declared unto their city in these matters. (Edmonds, J. M. (1931). The Elegiac Poems of Tyrtaeus in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D2%3Asection%3D2#:~:text=in%20these%20matters.-,CURFRAG.tlg%2D0266.2,-%E2%80%9D%20Plutarch%20Life)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0266&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Τυρταίος, απ. 4 West μετ. Κ. Τοπούζης: Τον Φοίβο οι απεσταλμένοι όταν άκουσαν, | στην πατρίδα τους έφεραν του θεού τη μαντεία | και τα θεία του λόγια. | «Τις αποφάσεις να παίρνουν οι θεοτίμητοι άρχοντες, | που έχουν την έγνοια της ολολάτρευτης Σπάρτης, | και οι γέροντες όσοι πρωτότοκοι ήταν. | Και μετά οι πολίτες, | με τους δίκαιους νόμους πράττοντας σύμφωνα, | τα σωστά ν᾽ αποδέχονται και να πράττουν τα δίκαια, | χωρίς τα ανάκατα να προτείνουν στην πόλη· | και το λαό η δύναμη ν᾽ ακολουθά και η νίκη». | Έτσι ο Φοίβος για την πόλη καθόρισε. (Τσέλικας, Σ. (επ.). ΤΥΡΤΑΙΟΣ: απ. 4 West. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=51)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Πολεμικές ελεγείες του Τυρταίου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 7ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Σπάρτη</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/2/20/Moreau_-_Tyrt%C3%A9e%2C_cat.96.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/2/20/Moreau_-_Tyrt%C3%A9e%2C_cat.96.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Tyrtaeus" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Tyrtaeus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://quod.lib.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=ACL3129.0003.001;didno=ACL3129.0003.001;view=image;seq=00001205" target="_blank" rel="noopener">https://quod.     ['<div class="terminologyEntry">    <div class="term">Φωκυλίδης από τη Μίλητο</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Φωκυλίδης ο Λυρικός, Φωκυλίδης ο Μιλήσιος, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Φωκυλίδης, από τη Μίλητο τον 6ο αιώνα π.Χ., έγραψε γνωμικές ελεγείες. Ένα από τα σωζόμενα αποσπάσματά του, σε εξάμετρο, μοιράζεται το ίδιο θέμα με τον «Ιάμβο κατά των γυναικών» του Σιμωνίδη.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). 2.4.Β.iii.δ. Γνωμική ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_028.html</div>    <div class="textItalicSmallMargin"><b>2)</b> PHOCYLIDES Eleg., Gnom. {1604}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=1604&amp;wid=&amp;q=PHOCYLIDES&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=7&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>3)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.1116</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Phocylides Milesius</div>    <div class="textMediumMarginBlue">- en: Phocylides of Miletus</div>    <div class="textMediumMarginBlue">- en: Phocylides Lyricus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: phocylides_milesius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="obje function show_selected() {
    var selector = document.getElementById('idTerm');
    var champ = dictionnaire[selector[selector.selectedIndex].value][0];
    document.getElementById('display').innerHTML = champ;
}
document.getElementById('idTerm').addEventListener('change', show_selected);

searchBox = document.querySelector("#searchBox");
entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});

</script>
