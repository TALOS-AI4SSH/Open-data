    ['<div class="terminologyEntry">    <div class="term">Αλκμάν</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Αλκμάνας ο Λακεδαιμόνιος, Αλκμάνας ο Λυρικός, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Αλκμάν, γεννημένος στις Σάρδεις της Λυδίας, ήταν γνωστός για τα έργα του στη Σπάρτη. Μεταξύ των σωζόμενων αποσπασμάτων του είναι ένα Παρθένειο για έναν χορό δέκα κοριτσιών σε μια γιορτή θεάς. Αφηγείται έναν τοπικό μύθο και τονίζει τη θεϊκή τιμωρία, στη συνέχεια επαινεί την ομορφιά και την ενδυμασία των κοριτσιών ξεχωριστά, προσφέροντας μια ματιά στη ζωή τους στην αρχαία Σπάρτη.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> ALCMAN Lyr. {0291}. (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0291&amp;wid=&amp;q=ALCMAN&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=4&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 189-190).</div>    <div class="textItalicSmallMargin"><b>4)</b> Smith, W. (n.d.). Alcman. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D14%3Aentry%3Dalcman-bio-1</div>    <div class="textItalicSmallMargin"><b>5)</b> https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0291.tlg001.opp-eng1</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Alcman Lacedaemonius</div>    <div class="textMediumMarginBlue">- en: Alcman Lyricus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: alcman_lacedaemonius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By ellenm1 - Roman-period mosaic portrait of Alcman from Gerasa, 3rd century AD. Flickr: Mosaic Portrait of the Poet Alkman, CC BY 2.0, https://commons.wikimedia.org/w/index.php?curid=140276390</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/9/9e/Mosaic_Portrait_of_the_Poet_Alcman_%28cropped%29.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Alcman, fr. 14 transl. Cambell: Come, Muse, clear-voiced Muse of many songs, singer always, begin a new song for girls to sing. (Campbell, D. (n.d.). Alcman Fr. 14. In Greek Lyric, Volume II. Harvard University Press. Retrieved 4 May 2024, from https://www.loebclassics.com/view/alcman-fragments/1988/pb_LCL143.407.xml)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0291&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Αλκμάν, απ. 14a Page μετ. Ι.Ν. Καζάζης: Έλα, Μούσα, γλυκόλαλη Μούσα μου, με τα πλούσια, μελωδικά τραγούδια σου για κάθε περίσταση, κι άρχισε έναν καινούριο σκοπό να τραγουδήσουν τα κορίτσια. (Τσέλικας, Σ. (επ.). ΑΛΚΜΑΝ: απ. 14a Page. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=143)&apos;</div></div>    <div class="obje     ['<div class="terminologyEntry">    <div class="term">Ανακρέων ο Τήιος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Ανακρέων ο Λυρικός, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Ανακρέων, γεννημένος στην Τέω της Μικράς Ασίας, μετανάστευσε στα Άβδηρα της Θράκης κατά τη διάρκεια της περσικής εισβολής. Γνωστός για τις ωδές και τους ιαμβούς του, εξυμνούσε θέματα αγάπης και κρασιού, ενώ ενσωμάτωσε επίσης ύμνους, θρήνους και σατιρικά τραγούδια στα έργα του που γράφτηκαν στην ιωνική διάλεκτο.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> ANACREON Lyr. {0237}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0237&amp;wid=&amp;q=ANACREON&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=3&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). 2.4.Β.ii.β. Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 189).</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.84</div>    <div class="textItalicSmallMargin"><b>5)</b> https://lsj.gr/wiki/Anacreon</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Anacreon Teius</div>    <div class="textMediumMarginBlue">- en: Anacreon Lyricus</div></div><div class="objectEntry">     ['<div class="terminologyEntry">    <div class="term">Ανάνιος ο Ιαμβογράφος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Ανάνιος ο Λυρικός, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Ananius Iambographus</div>    <div class="textMediumMarginBlue">- en: Ananios Iambograph</div>    <div class="textMediumMarginBlue">- en: Ananius Lyricus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: ananius_iambographus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0238&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Ίαμβοι του Ανάνιου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6ος αιώνας π.Χ.</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://quod.lib.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=ACL3129.0001.001;didno=ACL3129.0001.001;view=image;seq=00000173" target="_blank" rel="noopener">https://quod.lib.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=ACL3129.0001.001;didno=ACL3129.0001.001;view=image;seq=00000173</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0238.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0238.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text.jsp?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D21%3Aentry%3Dananius-bio-1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text.jsp?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D21%3Aentry%3Dananius-bio-1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q3615044" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q3615044</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.85" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.85</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Ananius" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Ananius</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ανάνιος ο Λυρικός</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Ανάνιος ο Ιαμβογράφος, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Ανάνιος έγραψε ποίηση, από την οποία σώζονται έξι αποσπάσματα. Αυτά κρατούν απόσταση από τη συκοφαντία και την απρέπεια, προσφέροντας γοητευτικές ηθικές γνώσεις, παιχνιδιάρικη μυθολογική σάτιρα και ένα γαστρονομικό ημερολόγιο - σηματοδοτώντας το πρωιμότερο παράδειγμα γαστρονομικής ποίησης από τον πολιτιστικό χώρο της Ιωνίας.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Lesky, A. (2015). Ιστορία της Αρχαίας ελληνικής Γραμματολογίας (μετ.  Τσοπανάκης Α.). Θεσσαλονίκη: Κυριακίδης. σ. 185.</div>    <div class="textItalicSmallMargin"><b>2)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 185).</div>    <div class="textItalicSmallMargin"><b>3)</b> ANANIUS Iamb. {0238}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0238&amp;wid=&amp;q=ANANIUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=4&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.85</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Ananius Iambographus</div>    <div class="textMediumMarginBlue">- en: Ananios Iambograph</div>    <div class="textMediumMarginBlue">- en: Ananius Lyricus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: ananius_iambographus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0238&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Ίαμβοι του Ανάνιου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6ος αιώνας π.Χ.</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://quod.lib.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=ACL3129.0001.001;didno=ACL3129.0001.001;view=image;seq=00000173" target="_blank" rel="noopener">https://quod.lib.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=ACL3129.0001.001;didno=ACL3129.0001.001;view=image;seq=00000173</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0238.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0238.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text.jsp?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D21%3Aentry%3Dananius-bio-1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text.jsp?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D21%3Aentry%3Dananius-bio-1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q3615044" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q3615044</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.85" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.85</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Ananius" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Ananius</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Αρχίλοχος ο Πάριος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Αρχίλοχος, γεννημένος στην Πάρο τον 7ο αιώνα π.Χ., συνέθεσε μια γλαφυρή ποίηση που αντανακλούσε τις εμπειρίες της ζωής του, συμπεριλαμβανομένων των αποτυχημένων εγχειρημάτων του στη Θάσο και των θυελλωδών σχέσεων. Γνωστός για το άμεσο και επικριτικό του ύφος, απέφευγε τα παραδοσιακά ηρωικά θέματα, επιλέγοντας να απεικονίσει τη σύγχρονη πραγματικότητα με ωμή ειλικρίνεια. Έγραψε, ελεγείες, ύμνους, ιαμβούς, που του απέφεραν αναγνώριση παρόμοια με του Ομήρου, με σωζόμενα αποσπάσματα που σώζονται σε παπύρους.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> ARCHILOCHUS Eleg., Iamb. {0232}. (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0232&amp;wid=&amp;q=ARCHILOCHUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=2&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Ίαμβοι. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_022.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Archilochus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D37%3Aentry%3Darchilochus-bio-1</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.175</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Archilochus Parius</div>    <div class="textMediumMarginBlue">- en: Archilochus Lyricus</div>    <div class="textMediumMarginBlue">- en: Archilochus of Paros</div>    <div class="textMediumMarginBlue">- en: Archilochus Iamb. et Eleg.</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: archilochus_parius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By shakko - Own work, CC BY-SA 3.0, Bust of a bearded man (Archilochus?). Roman copy (c. 2nd century BC) of Greek original (4th century BC)https://commons.wikimedia.org/w/index.php?curid=7408002</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Archilochus_01_pushkin.jpg/800px-Archilochus_01_pushkin.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Elegiac Poems (Archilochus), CURFRAG.tlg-0232.6, translated by Edmonts: the shield I left because I must, poor blameless armament! beside a bush, gives joy now to some Saian, but myself I have saved. What care I for that shield? It shall go with a curse. I&apos;&apos;&apos;&apos;ll get me another e&apos;&apos;&apos;&apos;en as good. (Edmonds, J. M. (1931). Archilochus in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:2008.01.0480:volume=2:text=21:section=2&amp;highlight=shield#:~:text=e%27en%20as%20good.-,CURFRAG.tlg%2D0232.6,-%E2%80%9D%20Plutarch%20Spartan)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0232&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Αρχίλοχος, απ. 5 West, μετ. Θ. Κ. Στεφανόπουλος: Με την ασπίδα μου κάποιος Σάιος, το ξέρω, αγάλλεται. | Ήταν όπλο αψεγάδιαστο, κι εγώ την εγκατέλειψα πλάι στο θάμνο, | όμως δεν το ᾽θελα· έσωσα τη ζωή μου. | Τι με νοιάζει πια η ασπίδα εκείνη; Ώρα καλή· | θα ξαναβρώ άλλη, όχι κατώτερη. (Στεφανόπουλου, Θ. Κ., Τσιτσιρίδη, Στ., Αντζουλή, Λ., &amp; Κριτσέλη, Γ. (χ.χ.). ΑΡΧΙΛΟΧΟΣ: 25. – Απόσπασμα 5 West. Ανθολογία Αρχαίας Ελληνικής Γραμματείας. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/literature/browse.html?text_id=50)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Ελεγείες του Αρχιλόχου του Πάριου, Ίαμβοι του Αρχιλόχου, Ύμνοι του Αρχιλόχου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 7ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Πάρος</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Θάσος-αποικία</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Archilochus_01_pushkin.jpg/800px-Archilochus_01_pushkin.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Archilochus_01_pushkin.jpg/800px-Archilochus_01_pushkin.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikiquote.org/wiki/Archilochus" target="_blank" rel="noopener">https://en.wikiquote.org/wiki/Archilochus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q201323" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q201323</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://el.wikipedia.org/wiki/%CE%91%CF%81%CF%87%CE%AF%CE%BB%CE%BF%CF%87%CE%BF%CF%82" target="_blank" rel="noopener">https://el.wikipedia.org/wiki/%CE%91%CF%81%CF%87%CE%AF%CE%BB%CE%BF%CF%87%CE%BF%CF%82</a></div>    <div class= class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/0/01/P.Oxy._XI_1361_fr._4.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/0/01/P.Oxy._XI_1361_fr._4.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0064%3Abook%3DDith" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0064%3Abook%3DDith</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/collection?collection=Perseus%3Acorpus%3Aperseus%2Cwork%2CBacchylides%2C%20Epinicians" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/collection?collection=Perseus%3Acorpus%3Aperseus%2Cwork%2CBacchylides%2C%20Epinicians</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/LCL461/1992/volume.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/LCL461/1992/volume.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0064%3Abook%3DDith%3Apoem%3D17" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0064%3Abook%3DDith%3Apoem%3D17</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0064%3Abook%3DEp" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0064%3Abook%3DEp</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/biography/Bacchylides" target="_blank" rel="noopener">https://www.britannica.com/biography/Bacchylides</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Bacchylides" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Bacchylides</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://el.wikipedia.org/wiki/%CE%92%CE%B1%CE%BA%CF%87%CF%85%CE%BB%CE%AF%CE%B4%CE%B7%CF%82" target="_blank" rel="noopener">https://el.wikipedia.org/wiki/%CE%92%CE%B1%CE%BA%CF%87%CF%85%CE%BB%CE%AF%CE%B4%CE%B7%CF%82</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.254" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.254</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Βακχυλίδης ο Λυρικός</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Βακχυλίδης από την Κέα, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Βακχυλίδης, συγγενής του Πινδάρου, εξερεύνησε ποικίλες μορφές χορικής ποίησης, οι οποίες ταξίδεψαν ευρέως σε όλη την Ελλάδα. Οι επίνικοι και οι ύμνοι του που έχουν διασωθεί περιλαμβάνουν κατά κύριο λόγο μυθολογικές αφηγήσεις, αν και διαφοροποιήθηκε από τον Πίνδαρο ως προς τις υφολογικές αποχρώσεις και το θεματικό βάθος.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> BACCHYLIDES Lyr. {0199}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0199&amp;wid=&amp;q=BACCHYLIDES&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=10&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). 3.5.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_042.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 192).</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.254</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Bacchylides Ceus</div>    <div class="textMediumMarginBlue">- en: Bacchylides Lyricus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</ w.perseus.tufts.edu/hopper/collection?collection=Perseus%3Acorpus%3Aperseus%2Cwork%2CBacchylides%2C%20Epinicians" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/collection?collection=Perseus%3Acorpus%3Aperseus%2Cwork%2CBacchylides%2C%20Epinicians</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/LCL461/1992/volume.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/LCL461/1992/volume.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0064%3Abook%3DDith%3Apoem%3D17" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0064%3Abook%3DDith%3Apoem%3D17</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0064%3Abook%3DEp" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0064%3Abook%3DEp</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/biography/Bacchylides" target="_blank" rel="noopener">https://www.britannica.com/biography/Bacchylides</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Bacchylides" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Bacchylides</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://el.wikipedia.org/wiki/%CE%92%CE%B1%CE%BA%CF%87%CF%85%CE%BB%CE%AF%CE%B4%CE%B7%CF%82" target="_blank" rel="noopener">https://el.wikipedia.org/wiki/%CE%92%CE%B1%CE%BA%CF%87%CF%85%CE%BB%CE%AF%CE%B4%CE%B7%CF%82</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.254" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.254</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Θέογνις από τα Μέγαρα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Θεόγνις, ένας ποιητής από τα Μέγαρα, έγραψε μια συλλογή 1400 ελεγειακών στίχων που χαρακτηρίζονται από συντηρητικά ιδεώδη και ηθικούς προβληματισμούς, ασκώντας κριτική στη δημοκρατία και υιοθετώντας τις αριστοκρατικές αξίες.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> THEOGNIS Eleg. {0002} (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0002&amp;wid=&amp;q=THEOGNIS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=7&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 187).</div>    <div class="textItalicSmallMargin"><b>3)</b> Κακριδής, Φάνης. (2012). Γνωμική Ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_028.html</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.1388</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Theognis Megarensis</div>    <div class="textMediumMarginBlue">- en: Theognis Elegiacus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: theognis_megarensis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Mitteilungen des Deutschen Archäologischen Instituts, Athenische Abteilung - A kylix from Tanagra, Boeotia, 5th century B.C. A symposiast sings ὦ παίδων κάλλιστε, the beginning of a verse by Theognis https://archive.org/stream/mitteilungen09deut#page/392/mode/2up, Public Domain, https://commons.wikimedia.org/w/index.php?curid=7774895</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/7/7f/Tanagra%2C_5th_century_kylix_a_symposiast_sings_Theognis_o_paidon_kalliste.png" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;The Elegiac Poems of Theognis, Book I, 237-254 trans. Edmonds: I have given thee wings to fly with ease aloft the boundless sea and all the land. No meal or feast but thou&apos;&apos;&apos;&apos;lt be there, couched &apos;&apos;&apos;&apos;twixt the lips of many a guest, and lovely youths shall sing thee clear and well in orderly wise to the clear-voiced flute. And when thou comest to go down to the lamentable house of Hades in the depths of the gloomy earth, never, albeit thou be dead, shalt thou lose thy fame, but men will think of thee as one of immortal name, Cyrnus, who rangeth the land of Greece and the isles thereof —crossing the fishy unharvestable deep not upon horseback mounted but sped of the glorious gifts of the violet-crownad Muses unto all that care to receive thee; and living as they thou shalt be a song unto posterity so long as Earth and Sun abide. Yet as for me, thou hast no respect for me, great or small, but deceivest me with words as if I were a little child. (Edmonds, J. M. (1931). The Elegiac Poems of Theognis: Book I in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D11%3Asection%3D2#note1:~:text=assuredly%20be%20taken.-,237%2D254,-I%20have%20given)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0002&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Θέογνις, Ελεγίαι 237-254 μετ. Μ. Ζ. Κοπιδάκης: Κύρνε, σου χάρισα φτερά ανάλαφρα να σε σηκώσουν πάνω από την απέραντη θάλασσα και ολάκερη την οικουμένη. Παντού σε όλα τα συμπόσια και τις γιορτές θα βρίσκεσαι και συ, όλοι τους θα ᾽χουνε για σε να λένε. Παίζοντας μικρούς γλυκόλαλους αυλούς άντρες ερωτικοί θα τραγουδούν για σένα ωραία και τρυφερά τραγούδια. Κι όταν στα σπλάχνα της μαύρης γης θα κατεβείς, όταν θα φτάσεις στο πολυστέναχτο παλάτι του Άδη, ούτε και τότε, αν και νεκρός, θα ξεχαστείς. Όλοι θα σε θυμούνται, αθάνατο θα ᾽ναι στους ανθρώπους το όνομά σου. Κύρνε, στη γη της Ελλάδας θα τριγυρνάς και στα νησιά, πάνω από την άκαρπη θάλασσα, όπου ζουν τα ψάρια, θα περνοδιαβαίνεις. Δεν θα ᾽σαι σε άλογα καβάλα, τα λαμπρά δώρα των Μουσών, που έχουν στεφάνια από μενεξέδες στα μαλλιά, αυτά θα σε ταξιδεύουν. Θα ᾽σαι στη συντροφιά όσων και τώρα και στους αιώνες που ᾽ρχονται αγαπούνε το τραγούδι -ώσπου θα στέκει η γη και ο ήλιος θα φωτίζει. Μα ούτε τόσο δα δεν με προσέχεις, και σαν μικρό παιδί με υποσχέσεις ανεκπλήρωτες με ξεγελάς. (Στεφανόπουλου, Θ. Κ., Τσιτσιρίδη, Στ., Αντζουλή, Λ., &amp; Κριτσέλη, Γ. (χ.χ.). ΘΕΟΓΝΙΣ: 30. – «Ἐλεγεῖαι» 237-254. Ανθολογία Αρχαίας Ελληνικής Γραμματείας. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/literature/browse.html?text_id=50)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Γνωμικές ελεγείες του Θέογνη</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Μέγαρα</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commo
