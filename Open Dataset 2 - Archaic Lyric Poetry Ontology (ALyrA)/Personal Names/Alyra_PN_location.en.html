    ['<div class="terminologyEntry">    <div class="term">Colophon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient location</font></div>    <div class="textMediumMargin"><b>Comment</b>: Colophon was an Ionian city in Lydia, situated approximately 13 kilometers north of the harbor at Notion. The ruins of this ancient city can be found near the modern town of Değirmendere.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, DARMC, R. Talbert, Sean Gillies, Ryan Horne, Jeffrey Becker, and Tom Elliott, &apos;Colophon: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2022 &lt;https://pleiades.stoa.org/places/599577&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Κολοφώνα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: colophon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.108253,27.1483085&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Mimnermus Lyricus</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0006%3Aalphabetic+letter%3DC%3Aentry+group%3D8%3Aentry%3Dcolophon" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0006%3Aalphabetic+letter%3DC%3Aentry+group%3D8%3Aentry%3Dcolophon</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Colophon_(city)" target="_blank" rel="noopener">https://en.wikiped     ['<div class="terminologyEntry">    <div class="term">Ephesus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient location</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ephesus, also known as Arsinoe(ia), was the most significant ancient metropolis of Ionian Asia Minor.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, Brady Kiesling, Sean Gillies, Jeffrey Becker, H. Kopp, Joel Michael Kent, B. Siewert-Mayer, Phoebe Acheson, R. Talbert, Johan Åhlfeldt, W. Röllig, Adam Rabinowitz, Tom Elliott, DARMC, jfu, Francis Deblauwe, Ryan Horne, and Eric Kansa, &apos;Ephesus/Arsinoe(ia): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2021 &lt;https://pleiades.stoa.org/places/599612&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Έφεσος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: ephesus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.9407625,27.340307&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Hipponax Ephesius, Callinus Ephesius</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/379273PEph" target="_blank" rel="noopener">https://topostext.org/place/379273PEph</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DE%3Aentry+group%3D4%3Aentry%3Dephesus-geo" target="_blank" rel="noopener">http://www.perseus.t     ['<div class="terminologyEntry">    <div class="term">Klazomenai</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient location</font></div>    <div class="textMediumMargin"><b>Comment</b>: The original mainland location of the city was situated southwest of present-day Urla Iskelesi in Turkey. According to Pausanias, the city later moved to an island in the Bay of Smyrna.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, S. Mitchell, Peter Cobb, Sean Gillies, Jeffrey Becker, Tom Elliott, Brady Kiesling, R. Talbert, Rob Chavez, and Ryan Horne, &apos;Klazomenai (later): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/550651&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Κλαζομενές</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: klazomenai</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.3614575859,26.770567899&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Hipponax Ephesius</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/384268PKla" target="_blank" rel="noopener">https://topostext.org/place/384268PKla</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Klazomenai" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Klazomenai</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/550651" target="_blank" rel="noopener">https://pleiades.stoa.org/places/550651</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/550650" target="_blank" rel="noopener">https://pleiades.stoa.org/places/550650</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Lesbos</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient location</font></div>    <div class="textMediumMargin"><b>Comment</b>: The ancient island of Lesbos, situated in the Aegean Sea near the eastern coast of Greece, experienced a significant cultural blossoming during the 7th and 6th centuries BCE. It was home to prominent figures like Alcaeus, Terpander, and Sappho, who contributed greatly to the development of lyric poetry. This cultural richness reflected the island&apos;s prosperity and intellectual vibrancy during that era.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div>    <div class="textItalicSmallMargin"><b>2)</b> C. Foss, G. Reger, S. Mitchell, R. Talbert, Sean Gillies, Tom Elliott, and Jeffrey Becker, &apos;Lesbos (island): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/550696&gt; [accessed: 22 August 2024] </div>    <div class="textItalicSmallMargin"><b>3)</b> Britannica, T. Editors of Encyclopaedia (2024, April 17). Lésbos. Encyclopedia Britannica. https://www.britannica.com/place/Lesbos-island-Greece</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Λέσβος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: lesbos</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;39.1785448797,26.2377523591&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Alcaeus Lesbius, Sappho Lesbia, Terpander Lesbius</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/1242" target="_blank" rel="noopener">http://www.trismegistos.org/place/1242</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/" target="_blank" rel="noopener">https://www.wikidata.org/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/392261ILes" target="_blank" rel="noopener">https://topostext.org/place/392261ILes</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Lesbos" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Lesbos</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/550696" target="_blank" rel="noopener">https://pleiades.stoa.org/places/550696</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Megara</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient location</font></div>    <div class="textMediumMargin"><b>Comment</b>: Megara was a significant ancient Greek city situated in the northern part of the Isthmus of Corinth, directly across from the island of Salamis.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> G. Reger, J. McK. Camp II, DARMC, Brady Kiesling, R. Talbert, Chris de Lisle, Jeffrey Becker, Tom Elliott, Catherine Bouras, and Sean Gillies, &apos;Megara: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/570468&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Μέγαρα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: megara</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.985078,23.340163&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Theognis Megarensis</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Megaris" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Megaris</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DM%3Aentry+group%3D8%3Aentry%3Dmegara-geo02" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DM%3Aentry+group%3D8%3Aent     ['<div class="terminologyEntry">    <div class="term">Paros</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient location</font></div>    <div class="textMediumMargin"><b>Comment</b>: Paros, an island in the Cyclades in the Aegean Sea, Greece, renowned for its marble quarries, shared a common early Bronze Age culture with the other Cycladic islands. It was later settled by Arcadians and Ionians and played various roles in ancient conflicts, including the Persian Wars and disputes with Athens.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Britannica, T. Editors of Encyclopaedia (2022, January 17). Páros. Encyclopedia Britannica. https://www.britannica.com/place/Parose</div>    <div class="textItalicSmallMargin"><b>2)</b> C. Foss, G. Reger, Catherine Bouras, R. Talbert, Sean Gillies, Chris de Lisle, Jeffrey Becker, Arthur De Graauw, and Tom Elliott, &apos;Paros (island): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/599868&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Πάρος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: paros</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.0637200811,25.1981285553&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Archilochus Parius</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Paros" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Paros</a></div>    <di     ['<div class="terminologyEntry">    <div class="term">Rhegium</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient location</font></div>    <div class="textMediumMargin"><b>Comment</b>: Rhegion, a site with settlement origins dating back to the Bronze and Iron Ages, was ultimately colonized by Chalcis around 730 or 743 BCE.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> I.E.M. Edlund Berry, A.M. Small, DARMC, R. Talbert, Brady Kiesling, Sean Gillies, Ryan Horne, Jeffrey Becker, and Tom Elliott, &apos;Rhegion/Regium: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2022 &lt;https://pleiades.stoa.org/places/452416&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ρήγιο</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: rhegium</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.109279,15.64393&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Ibycus Rheginus</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/381156PRhe" target="_blank" rel="noopener">https://topostext.org/place/381156PRhe</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Reggio_Calabria" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Reggio_Calabria</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/452416" target="_blank" rel="noopener">https://pleiades.stoa.org/places/452416</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Samos</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient location</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ancient Samos, situated near Asia Minor, was an important trade center known for its commerce with peoples from the Black Sea, Egypt, and Corinth. It was also the birthplace of the poet Semonides.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, Pierre Motylewicz, Sean Gillies, Chris de Lisle, Jeffrey Becker, Arthur De Graauw, Tom Elliott, Catherine Bouras, and R. Talbert, &apos;Samos (island): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/599926&gt; [accessed: 22 August 2024] </div>    <div class="textItalicSmallMargin"><b>2)</b> Britannica, T. Editors of Encyclopaedia (2020, May 14). Sámos. Encyclopedia Britannica. Retrieved May 4, 2024, from https://www.britannica.com/place/Samos-island-Greece</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Σάμος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: samos</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.7324600706,26.8391253467&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Ibycus Rheginus, Anacreon Teius</div>    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Semonides Amorginus</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/377269PSam" target="_blank" rel="noopener">https://topos     ['<div class="terminologyEntry">    <div class="term">Sardis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient location</font></div>    <div class="textMediumMargin"><b>Comment</b>: Sardis, the capital of the Lydian Empire, was situated in western Turkey. In 188 B.C., it became part of the Attalid kingdom and subsequently passed to Rome in 133 B.C. with the territory of Attalus III.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, S. Mitchell, Brady Kiesling, Sean Gillies, Chris de Lisle, Jeffrey Becker, W. Röllig, Jamie Novotny, Tom Elliott, H. Kopp, DARMC, R. Talbert, B. Siewert-Mayer, Francis Deblauwe, and Eric Kansa, &apos; Sardis/Hyde?: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/550867&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Σάρδεις</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sardis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.488314,28.040286&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Alcman Lacedaemonius</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/place/2090" target="_blank" rel="noopener">https://www.trismegistos.org/place/2090</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.geonames.org/9986360/sardes.html" target="_blank" rel="noopener">http://www.geonames.org/9986360/sardes.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DS%3Aentry+group%3D5%3Aentry%3Dsardes-geo" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DS%3Aentry+group%3D5%3Aentry%3Dsardes-geo</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/385280PSar" target="_blank" rel="noopener">https://topostext.org/place/385280PSar</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Sardis" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Sardis</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/550867" target="_blank" rel="noopener">https://pleiades.stoa.org/places/550867</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Sicilia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient location</font></div>    <div class="textMediumMargin"><b>Comment</b>: Sicily, the largest island in the Mediterranean Sea, has been inhabited since around 8,000 BC. Throughout its history, Sicily has experienced significant settlement and influence from various cultures, including the Punic, Carthaginian, Greek, Roman, Vandalic, Ostrogothic, Byzantine, Arabic, and Norman.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> R.J.A. Wilson, Pierre Motylewicz, R. Talbert, Sean Gillies, R. Scott Smith, Jeffrey Becker, Greta Hawes, and Tom Elliott, &apos;Sicilia (island): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/462492&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Σικελία</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sicilia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.6288545273,13.9945590442&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Simonides Ceus, Sappho Lesbia</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/place/2132" target="_blank" rel="noopener">https://www.trismegistos.org/place/2132</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q4951156" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q4951156</a></div>     ['<div class="terminologyEntry">    <div class="term">Smyrna</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient location</font></div>    <div class="textMediumMargin"><b>Comment</b>: An ancient settlement of Asia Minor, modern Izmir in Turkey.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, S. Mitchell, R. Talbert, Chris de Lisle, Jeffrey Becker, W. Röllig, Tom Elliott, H. Kopp, DARMC, Sean Gillies, B. Siewert-Mayer, Rob Chavez, Francis Deblauwe, and Eric Kansa, &apos;Naulochon/Smyrna/Palaia Smyrna: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/550771&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Σμύρνη</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: smyrna</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.41719605,27.141387&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Mimnermus Lyricus</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0006%3Aalphabetic+letter%3DS%3Aentry+group%3D8%3Aentry%3Dsmyrna" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0006%3Aalphabetic+letter%3DS%3Aentry+group%3D8%3Aentry%3Dsmyrna</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/%C4%B0zmir" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/%C4%B0zmir function show_selected() {
    var selector = document.getElementById('idTerm');
    var champ = dictionnaire[selector[selector.selectedIndex].value][0];
    document.getElementById('display').innerHTML = champ;
}
document.getElementById('idTerm').addEventListener('change', show_selected);

searchBox = document.querySelector("#searchBox");
entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});

</script>
