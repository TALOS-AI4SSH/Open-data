    ['<div class="terminologyEntry">    <div class="term">Άβδηρα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Τα Άβδηρα βρίσκονταν στη Θράκη, στην ακτή κοντά στο ακρωτήριο Μπουλούστρα, κοντά στο σημείο όπου ο ποταμός Νέστος συναντούσε τη θάλασσα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> E.N. Borza, Brady Kiesling, Sean Gillies, Jeffrey Becker, Tom Elliott, Catherine Bouras, G. Reger, R. Talbert, and Ryan Horne, &apos;Abdera: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/501323&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Abdera</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: abdera</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;40.9328277487,24.9743082598&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Ανακρέων ο Λυρικός</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0006:entry=abdera" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0006:entry=abdera</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DA%3Aentry+group%3D1%3Aentry%3Dabdera-geo" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseu     ['<div class="terminologyEntry">    <div class="term">Αίγυπτος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Αρχαία Αίγυπτος, η οποία ήκμασε από την 4η χιλιετία π.Χ. έως τον 7ο αιώνα μ.Χ., φημίζεται για την εντυπωσιακή τέχνη και τη μνημειώδη αρχιτεκτονική της. Ξεκινώντας από τις προϊστορικές της καταβολές η ιστορία της συνεχίζει να συναρπάζει μέσα από τις συνεχείς αρχαιολογικές ανακαλύψεις.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Samuel, A. Edouard , Bowman, Alan K., Dorman, Peter F., Baines, John R. and Wente, Edward F. (2024, April 15). ancient Egypt. Encyclopedia Britannica. https://www.britannica.com/place/ancient-Egypt</div>    <div class="textItalicSmallMargin"><b>2)</b> J.J. Wilkes, S.T. Parker, R.S. Bagnall, W.V. Harris, A.S. Esmonde-Cleary, C.M. Wells, J.F. Drinkwater, R.C. Knapp, S. Mitchell, Brian Z. Lund, Sean Gillies, M. Joann McDaniel, Jeffrey Becker, R. Talbert, Mary E. Downs, Jamie Novotny, and Tom Elliott, &apos;Ancient Egypt (region): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/981503&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Aegypt</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: aegypt</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;16.1010829332,31.4591482445&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Αλκαίος ο Λέσβιος</div></div>    <div class="objectEntry">    <div clas     ['<div class="terminologyEntry">    <div class="term">Έφεσος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Έφεσος, επίσης γνωστή ως Αρσινόη, ήταν η σημαντικότερη αρχαία μητρόπολη της Ιωνικής Μικράς Ασίας.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, Brady Kiesling, Sean Gillies, Jeffrey Becker, H. Kopp, Joel Michael Kent, B. Siewert-Mayer, Phoebe Acheson, R. Talbert, Johan Åhlfeldt, W. Röllig, Adam Rabinowitz, Tom Elliott, DARMC, jfu, Francis Deblauwe, Ryan Horne, and Eric Kansa, &apos;Ephesus/Arsinoe(ia): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2021 &lt;https://pleiades.stoa.org/places/599612&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Ephesus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: ephesus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.9407625,27.340307&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Ιππώναξ ο Εφέσιος, Καλλίνος ο Εφέσιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/379273PEph" target="_blank" rel="noopener">https://topostext.org/place/379273PEph</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DE%3Aentry+group%3D4%3Aentry%3Dephesus-geo" target="_blank" rel="noopener">http://www.perseus.tu     ['<div class="terminologyEntry">    <div class="term">Κέα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ένα από τα νησιά των Κυκλάδων.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> G. Reger, J. McK. Camp II, Catherine Bouras, R. Talbert, Brady Kiesling, Sean Gillies, Jeffrey Becker, Arthur De Graauw, and Tom Elliott, &apos;Keos (island): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/570348&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Keos</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: keos</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.61385947,24.3265549158&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Βακχυλίδης από την Κέα, Σιμωνίδης από την Κέα</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/1032" target="_blank" rel="noopener">http://www.trismegistos.org/place/1032</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/376243IKeo" target="_blank" rel="noopener">https://topostext.org/place/376243IKeo</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Kea_(island)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Kea_(island)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/570348" target="_blank" rel="noopener">https://pleiades.stoa.org/places/570348</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Κλαζομενές</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η αρχική θέση της πόλης στην ηπειρωτική χώρα βρισκόταν νοτιοδυτικά της σημερινής Urla Iskelesi στην Τουρκία. Σύμφωνα με τον Παυσανία, η πόλη μεταφέρθηκε αργότερα σε ένα νησί στον κόλπο της Σμύρνης.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, S. Mitchell, Peter Cobb, Sean Gillies, Jeffrey Becker, Tom Elliott, Brady Kiesling, R. Talbert, Rob Chavez, and Ryan Horne, &apos;Klazomenai (later): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/550651&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Klazomenai</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: klazomenai</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.3614575859,26.770567899&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Ιππώναξ ο Εφέσιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/384268PKla" target="_blank" rel="noopener">https://topostext.org/place/384268PKla</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Klazomenai" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Klazomenai</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/550651" target="_blank" rel="noopener">https://pleiades.stoa.org/places/550651</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/550650" target="_blank" rel="noopener">https://pleiades.stoa.org/places/550650</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Κολοφώνα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Κολοφώνα ήταν μια ιωνική πόλη στη Λυδία, που βρισκόταν περίπου 13 χιλιόμετρα βόρεια του λιμανιού του Νοτίου. Τα ερείπια αυτής της αρχαίας πόλης βρίσκονται κοντά στη σύγχρονη πόλη Değirmendere.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, DARMC, R. Talbert, Sean Gillies, Ryan Horne, Jeffrey Becker, and Tom Elliott, &apos;Colophon: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2022 &lt;https://pleiades.stoa.org/places/599577&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Colophon</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: colophon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.108253,27.1483085&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Μίμνερμος από την Κολοφώνα</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0006%3Aalphabetic+letter%3DC%3Aentry+group%3D8%3Aentry%3Dcolophon" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0006%3Aalphabetic+letter%3DC%3Aentry+group%3D8%3Aentry%3Dcolophon</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Colophon_(city)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Colophon_(city)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.geonames.org/9794266/colophon-greek-bath.html" target="_blank" rel="noopener">http://www.geonames.org/9794266/colophon-greek-bath.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/1142" target="_blank" rel="noopener">http://www.trismegistos.org/place/1142</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/599577" target="_blank" rel="noopener">https://pleiades.stoa.org/places/599577</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Λέσβος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Το αρχαίο νησί της Λέσβου, που βρίσκεται στο Αιγαίο Πέλαγος κοντά στις ανατολικές ακτές της Ελλάδας, γνώρισε σημαντική πολιτιστική άνθιση κατά τον 7ο και 6ο αιώνα π.Χ. Εκεί έζησαν εξέχουσες προσωπικότητες όπως ο Αλκαίος, ο Τέρπανδρος και η Σαπφώ, οι οποίοι συνέβαλαν σημαντικά στην ανάπτυξη της λυρικής ποίησης. Αυτός ο πολιτιστικός πλούτος αντανακλούσε την ευημερία και την πνευματική ζωντάνια του νησιού κατά την εποχή εκείνη.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div>    <div class="textItalicSmallMargin"><b>2)</b> C. Foss, G. Reger, S. Mitchell, R. Talbert, Sean Gillies, Tom Elliott, and Jeffrey Becker, &apos;Lesbos (island): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/550696&gt; [accessed: 22 August 2024] </div>    <div class="textItalicSmallMargin"><b>3)</b> Britannica, T. Editors of Encyclopaedia (2024, April 17). Lésbos. Encyclopedia Britannica. https://www.britannica.com/place/Lesbos-island-Greece</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Lesbos</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: lesbos</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;39.1785448797,26.2377523591&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Αλκαίος ο Λέσβιος, Σαπφώ, Τέρπανδρος ο Λέσβιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/1242" target="_blank" rel="noopener">http://www.trismegistos.org/place/1242</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/" target="_blank" rel="noopener">https://www.wikidata.org/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/392261ILes" target="_blank" rel="noopener">https://topostext.org/place/392261ILes</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Lesbos" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Lesbos</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/550696" target="_blank" rel="noopener">https://pleiades.stoa.org/places/550696</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Μέγαρα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Τα Μέγαρα ήταν μια σημαντική αρχαία ελληνική πόλη που βρισκόταν στο βόρειο τμήμα του Ισθμού της Κορίνθου, ακριβώς απέναντι από το νησί της Σαλαμίνας.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> G. Reger, J. McK. Camp II, DARMC, Brady Kiesling, R. Talbert, Chris de Lisle, Jeffrey Becker, Tom Elliott, Catherine Bouras, and Sean Gillies, &apos;Megara: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/570468&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Megara</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: megara</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.985078,23.340163&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Θέογνις από τα Μέγαρα</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Megaris" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Megaris</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DM%3Aentry+group%3D8%3Aentry%3Dmegara-geo02" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DM%3Aentry+group%3D8%3Aentry%3Dmegara-geo02</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Megara" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Megara</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/380233PMeg" target="_blank" rel="noopener">https://topostext.org/place/380233PMeg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/570468" target="_blank" rel="noopener">https://pleiades.stoa.org/places/570468</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Μίλητος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Μεγάλη αρχαία πόλη της Ιωνίας.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, Brady Kiesling, Sean Gillies, Jeffrey Becker, H. Kopp, B. Siewert-Mayer, Johan Åhlfeldt, R. Talbert, Chris de Lisle, W. Röllig, Tom Elliott, DARMC, Francis Deblauwe, Phoebe Acheson, R. Scott Smith, Greta Hawes, Ryan Horne, and Eric Kansa, &apos;Miletus: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/599799&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Miletus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: miletus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.53046444,27.2788084839&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Φωκυλίδης ο Λυρικός</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.geonames.org/9534929/miletos.html" target="_blank" rel="noopener">http://www.geonames.org/9534929/miletos.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q169460" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q169460</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/1375" target="_blank" rel="noopener">http://www.trismegistos.org/place/1375</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.geonames.org/9534929/miletos.html" target="_blank" rel="noopener">http://www.geonames.org/9534929/miletos.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Miletus" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Miletus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/599799" target="_blank" rel="noopener">https://pleiades.stoa.org/places/599799</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Πάρος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Πάρος, νησί των Κυκλάδων στο Αιγαίο Πέλαγος, γνωστή για τα λατομεία μαρμάρου, είχε κοινό πολιτισμό της πρώιμης εποχής του Χαλκού με τα άλλα κυκλαδίτικα νησιά. Αργότερα εποικίστηκε από Αρκάδες και Ίωνες και διαδραμάτισε διάφορους ρόλους σε αρχαίες συγκρούσεις, συμπεριλαμβανομένων των Περσικών Πολέμων και των διαφορών με την Αθήνα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Britannica, T. Editors of Encyclopaedia (2022, January 17). Páros. Encyclopedia Britannica. https://www.britannica.com/place/Parose</div>    <div class="textItalicSmallMargin"><b>2)</b> C. Foss, G. Reger, Catherine Bouras, R. Talbert, Sean Gillies, Chris de Lisle, Jeffrey Becker, Arthur De Graauw, and Tom Elliott, &apos;Paros (island): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/599868&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Paros</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: paros</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.0637200811,25.1981285553&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Αρχίλοχος ο Πάριος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Paros" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Paros</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.geonames.org/255720/nisi-paros.html" target="_blank" rel="noopener">https://www.geonames.org/255720/nisi-paros.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/place/1613" target="_blank" rel="noopener">https://www.trismegistos.org/place/1613</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q201272" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q201272</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/599868" target="_blank" rel="noopener">https://pleiades.stoa.org/places/599868</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ρήγιο</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Το Ρήγιο, μια περιοχή με οικιστικές καταβολές που χρονολογούνται από την Εποχή του Χαλκού και του Σιδήρου, αποικίστηκε τελικά από τη Χαλκηδόνα γύρω στο 730 ή 743 π.Χ..</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> I.E.M. Edlund Berry, A.M. Small, DARMC, R. Talbert, Brady Kiesling, Sean Gillies, Ryan Horne, Jeffrey Becker, and Tom Elliott, &apos;Rhegion/Regium: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2022 &lt;https://pleiades.stoa.org/places/452416&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Rhegium</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: rhegium</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.109279,15.64393&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Ίβυκος ο Ρηγίνος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/381156PRhe" target="_blank" rel="noopener">https://topostext.org/place/381156PRhe</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Reggio_Calabria" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Reggio_Calabria</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/452416" target="_blank" rel="noopener">https://pleiades.stoa.org/places/452416</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σάμος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η αρχαία Σάμος, που βρισκόταν κοντά στη Μικρά Ασία, ήταν ένα σημαντικό εμπορικό κέντρο γνωστό για το εμπόριό της με λαούς από τη Μαύρη Θάλασσα, την Αίγυπτο και την Κόρινθο. Ήταν επίσης η γενέτειρα του ποιητή Σεμονίδη.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, Pierre Motylewicz, Sean Gillies, Chris de Lisle, Jeffrey Becker, Arthur De Graauw, Tom Elliott, Catherine Bouras, and R. Talbert, &apos;Samos (island): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/599926&gt; [accessed: 22 August 2024] </div>    <div class="textItalicSmallMargin"><b>2)</b> Britannica, T. Editors of Encyclopaedia (2020, May 14). Sámos. Encyclopedia Britannica. Retrieved May 4, 2024, from https://www.britannica.com/place/Samos-island-Greece</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Samos</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: samos</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.7324600706,26.8391253467&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Ίβυκος ο Ρηγίνος, Ανακρέων ο Λυρικός</div>    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Σημωνίδης ο Αμοργίνος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/377269PSam" target="_blank" rel="noopener">https://topostext.org/place/377269PSam</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q156882" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q156882</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/2081" target="_blank" rel="noopener">http://www.trismegistos.org/place/2081</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/599926" target="_blank" rel="noopener">https://pleiades.stoa.org/places/599926</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σάρδεις</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Οι Σάρδεις, η πρωτεύουσα της Λυδικής Αυτοκρατορίας, βρισκόταν στη δυτική Τουρκία. Το 188 π.Χ. έγινε μέρος του βασιλείου των Ατταλιδών και στη συνέχεια πέρασε στη Ρώμη το 133 π.Χ. με την επικράτεια του Αττάλου Γ&apos;.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, S. Mitchell, Brady Kiesling, Sean Gillies, Chris de Lisle, Jeffrey Becker, W. Röllig, Jamie Novotny, Tom Elliott, H. Kopp, DARMC, R. Talbert, B. Siewert-Mayer, Francis Deblauwe, and Eric Kansa, &apos; Sardis/Hyde?: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/550867&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Sardis</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sardis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.488314,28.040286&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Αλκμάν</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/place/2090" target="_blank" rel="noopener">https://www.trismegistos.org/place/2090</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.geonames.org/9986360/sardes.html" target="_blank" rel="noopener">http://www.geonames.org/9986360/sardes.html</a></div>    <div class= "extern     ['<div class="terminologyEntry">    <div class="term">Σικελία</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Σικελία, το μεγαλύτερο νησί της Μεσογείου, κατοικείται από το 8.000 π.Χ. περίπου. Καθ&apos; όλη τη διάρκεια της ιστορίας της, η Σικελία γνώρισε σημαντική κατοίκηση και επιρροή από διάφορους πολιτισμούς, όπως ο πουνικός, ο καρχηδονιακός, ο ελληνικός, ο ρωμαϊκός, ο οστρογοτθικός, ο βυζαντινός, ο αραβικός και ο νορμανδικός.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> R.J.A. Wilson, Pierre Motylewicz, R. Talbert, Sean Gillies, R. Scott Smith, Jeffrey Becker, Greta Hawes, and Tom Elliott, &apos;Sicilia (island): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/462492&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Sicilia</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sicilia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.6288545273,13.9945590442&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Σιμωνίδης από την Κέα, Σαπφώ</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/place/2132" target="_blank" rel="noopener">https://www.trismegistos.org/place/2132</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q4951156" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q4 function show_selected() {
    var selector = document.getElementById('idTerm');
    var champ = dictionnaire[selector[selector.selectedIndex].value][0];
    document.getElementById('display').innerHTML = champ;
}
document.getElementById('idTerm').addEventListener('change', show_selected);

searchBox = document.querySelector("#searchBox");
entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});

</script>
