    ['<div class="terminologyEntry">    <div class="term">Πίνδαρος ο Λυρικός</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Πίνδαρος, Πίνδαρος από τη Βοιωτία, Πίνδαρος ο Βοιωτός, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Pindarus Boeotus</div>    <div class="textMediumMarginBlue">- en: Pindar</div>    <div class="textMediumMarginBlue">- en: Pindarus Lyricus</div>    <div class="textMediumMarginBlue">- en: Pindarus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: pindarus_boeotus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Ancient Roman frescos of Pompeii - Enthroned Pindar with lyre, Muse and poetess. Antique fresco in Pompeii<br>https://pompeiiinpictures.com/pompeiiinpictures/index.htm, Public Domain, https://commons.wikimedia.org/w/index.php?curid=94696565</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Pythian 7 transl Svarlien: The great city of Athens is the most beautiful prelude of song, which the widely powerful race of the Alcmaeonids can lay as a foundation of odes in honor of their horses. [5] What fatherland, what family will you name that is more illustrious in Greece? For in all cities the story [10] of the citizens of Erechtheus makes the rounds, Apollo, how they made your dwelling in divine Pytho a marvel to see. Five Isthmian victories lead my song forward, and one outstanding triumph [15] at Zeus&apos;&apos;&apos;&apos; Olympian games, and two from Cirrha— yours, Megacles, and your ancestors&apos;&apos;&apos;&apos;. I rejoice at this new success; but I grieve that fine deeds are repaid with envy. [20] It is true what they say: the abiding bloom of good fortune brings with it both good and bad. (Arnson Svarlien, D. (n.d.). Pindar, Pythian 7. Retrieved 12 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0162%3Abook%3DP.%3Apoem%3D7)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0033&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Υπορχήματα του Πινδάρου, Παρθένεια του Πινδάρου, Προσόδια του Πινδάρου, Διθυραμβική ποίηση του Πινδάρου, Εγκωμιαστική ποίηση του Πινδάρου, Επίνικοι του Πινδάρου, Παιάνες του Πινδάρου, Θρήνοι του Πινδάρου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 5ος αιώνας π.Χ., 6ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Βοιωτία</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Ακράγας, Αθήνα, Συρακούσες</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/author/690" target="_blank" rel="noopener">https://www.trismegistos.org/author/690</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg002" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg002</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg003" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg003</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg004" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg004</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg005" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0033.tlg005</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.1126" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.1126</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/collection?collection=Perseus%3Acorpus%3Aperseus%2Cauthor%2CPindar" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/collection?collection=Perseus%3Acorpus%3Aperseus%2Cauthor%2CPindar</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Πολεμικές ελεγείες του Καλλίνου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">πολεμική ελεγεία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Καλλίνος συνέθεσε μια πολεμική ελεγεία που προέτρεπε τους νέους της Σπάρτης να εναντιωθούν στους Κιμμέριους (που απείλησαν τις ελληνικές αποικίες στη Μικρά Ασία περ. 675 π.Χ.). Τα σωζόμενα θραύσματα αναδεικνύουν το ταλέντο του και τον επιτακτικό χαρακτήρα της έκκλησής του στα όπλα εν μέσω της αναταραχής που προκαλούσε η απειλή των Κιμμερίων.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Πολεμική Ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_025.html</div>    <div class="textItalicSmallMargin"><b>2)</b> Smith, W. (n.d.). Callinus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DC%3Aentry+group%3D6%3Aentry%3Dcallinus-bio-1</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: War elegy of Callinus Ephesius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: war_elegy_callinus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet with war content&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Καλλίνος ο Εφέσιος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Πολεμικές ελεγείες του Τυρταίου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">πολεμική ελεγεία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Οι πολεμικές ελεγείες του Τυρταίου ήταν σπαρτιατικά εμβατήρια που προέτρεπαν σε θάρρος και εξυμνούσαν την ανδρεία των πολεμιστών κατά τη διάρκεια του δεύτερου Μεσσηνιακού Πολέμου. Τόνισαν τη σημασία των πολεμικών αρετών και ενέπνευσαν τους νέους της Σπάρτης να δώσουν προτεραιότητα στη γενναιότητα και τη θυσία για την πατρίδα τους πάνω απ&apos; όλα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Πολεμική Ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_025.html</div>    <div class="textItalicSmallMargin"><b>2)</b> Smith, W. (n.d.). Tyrtaeus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DT%3Aentry+group%3D26%3Aentry%3Dtyrtaeus-bio-1</div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 186).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: War elegies of Tyrtaeus Lacedaemonius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: war_elegies_tyrtaeus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet with war content&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Τυρταίος ο Λακεδαιμόνιος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Πολεμικές ωδές του Αλκαίου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">μονωδία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Τα πιο επαινετά ποιήματα του Αλκαίου είναι οι πολεμικές ή πατριωτικές ωδές του, που αναφέρονται κυρίως από τον Οράτιο. Σε αυτά περιλαμβάνονται αποσπάσματα που εξυμνούν νίκες και παρομοιάζουν τις πολιτικές παρατάξεις με ένα αχρηστευμένο πλοίο, τα οποία αργότερα μιμήθηκε ο Οράτιος.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Smith, W. (1873). Alcaeus of MYTILENE. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:alphabetic%20letter=A:entry%20group=13:entry=alcaeus-bio-6&amp;toc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D34</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Warlike odes of Alcaeus Lesbius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: warlike_odes_alcaeus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a single performer&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Αλκαίος ο Λέσβιος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Πολιτική ελεγεία του Σόλωνα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">πολιτική ελεγεία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Οι πολιτικές ελεγείες του Σόλωνα καταδίκαζαν τη διαφθορά, υποστήριζαν τη δικαιοσύνη και προέβλεπαν τις κοινωνικές ανησυχίες, αντανακλώντας τη μεταρρυθμιστική του ατζέντα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). 2.4.Β.iii.γ. Πολιτική ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_027.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Political elegy of Solon Athenienis</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: political_elegies_solon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet with political content&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Σόλων ο Αθηναίος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Προσόδια του Αλκμάνα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">προσόδιο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Alcman είναι επίσης γνωστό ότι συνέθεσε προσόδια.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Prosodia of Alcman Lacedaemonius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: prosodia_alcman</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus on the way to an altar&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Αλκμάν</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Προσόδια του Βακχυλίδη</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">προσόδιο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Βακχυλίδης είναι επίσης γνωστό ότι συνέθεσε Προσοδία.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 192).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Prosodia of Bacchylides Ceus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: prosodia_bacchylides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus on the way to an altar&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Βακχυλίδης από την Κέα</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Προσόδια του Πινδάρου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">προσόδιο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Πίνδαρος είναι επίσης γνωστό ότι συνέθεσε προσόδια.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 192-194).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Prosodia of Pindarus Boeotus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: prosodia_pindarus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus on the way to an altar&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Πίνδαρος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ρήγιο</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Το Ρήγιο, μια περιοχή με οικιστικές καταβολές που χρονολογούνται από την Εποχή του Χαλκού και του Σιδήρου, αποικίστηκε τελικά από τη Χαλκηδόνα γύρω στο 730 ή 743 π.Χ..</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> I.E.M. Edlund Berry, A.M. Small, DARMC, R. Talbert, Brady Kiesling, Sean Gillies, Ryan Horne, Jeffrey Becker, and Tom Elliott, &apos;Rhegion/Regium: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2022 &lt;https://pleiades.stoa.org/places/452416&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Rhegium</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: rhegium</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.109279,15.64393&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Ίβυκος ο Ρηγίνος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/381156PRhe" target="_blank" rel="noopener">https://topostext.org/place/381156PRhe</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Reggio_Calabria" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Reggio_Calabria</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/452416" target="_blank" rel="noopener">https://pleiades.stoa.org/places/452416</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σάμος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η αρχαία Σάμος, που βρισκόταν κοντά στη Μικρά Ασία, ήταν ένα σημαντικό εμπορικό κέντρο γνωστό για το εμπόριό της με λαούς από τη Μαύρη Θάλασσα, την Αίγυπτο και την Κόρινθο. Ήταν επίσης η γενέτειρα του ποιητή Σεμονίδη.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, Pierre Motylewicz, Sean Gillies, Chris de Lisle, Jeffrey Becker, Arthur De Graauw, Tom Elliott, Catherine Bouras, and R. Talbert, &apos;Samos (island): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/599926&gt; [accessed: 22 August 2024] </div>    <div class="textItalicSmallMargin"><b>2)</b> Britannica, T. Editors of Encyclopaedia (2020, May 14). Sámos. Encyclopedia Britannica. Retrieved May 4, 2024, from https://www.britannica.com/place/Samos-island-Greece</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Samos</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: samos</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.7324600706,26.8391253467&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Ίβυκος ο Ρηγίνος, Ανακρέων ο Λυρικός</div>    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Σημωνίδης ο Αμοργίνος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/377269PSam" target="_blank" rel="noopener">https://topostext.org/place/377269PSam</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q156882" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q156882</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/2081" target="_blank" rel="noopener">http://www.trismegistos.org/place/2081</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/599926" target="_blank" rel="noopener">https://pleiades.stoa.org/places/599926</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σαπφώ</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκή λυρική ποιήτρια</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Σαπφώ η Λεσβία, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Σαπφώ, που συχνά περιβάλλεται από θρύλους, ήταν πιθανότατα αριστοκρατικής καταγωγής από τη Λέσβο, που συνδέθηκε με τον Πιττακό και τον Αλκαίο και πιθανώς εξορίστηκε στη Σικελία. Η σωζόμενη ποίησή της, επικεντρωμένη κυρίως σε θέματα αγάπης και στοργής, περιλαμβάνει κυρίως ωδές και επιθαλάμια, (χορικά γαμήλια τραγούδια).</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> SAPPHO Lyr. {0009} (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0009&amp;wid=&amp;q=SAPPHO&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=2&amp;acp=1&amp;editid=<br>2. Κακριδής, Φάνης. (2012). Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div>    <div class="textItalicSmallMargin"><b>2)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 188).</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Sappho. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DS%3Aentry+group%3D4%3Aentry%3Dsappho-bio-1</div>    <div class="textItalicSmallMargin"><b>4)</b> Britannica, T. Editors of Encyclopaedia. "Sappho." Encyclopedia Britannica. Retrieved 5 April 2024 from https://www.britannica.com/biography/Sappho-Greek-poet.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Sappho Lesbia</div>    <div class="textMediumMarginBlue">- en: Sappho Lyrica</div>    <div class="textMediumMarginBlue">- en: Sapphus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sappho_lesbia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poetess&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Charles Mengin - Sappho (1877) by Charles Mengin (1853–1933). One tradition claims that Sappho committed suicide by jumping off the Leucadian cliff., Public Domain, https://commons.wikimedia.org/w/index.php?curid=1753564</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b1/1877_Charles_Mengin_-_Sappho.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Sappho, fr. 50: The man who is pretty is so only as far as he looks; the man who is good is already beautiful. (Sententiaeantiquae. (2012, March 14). Sappho, fragment 50. SENTENTIAE ANTIQUAE. https://sententiaeantiquae.com/2012/03/14/sappho-fragment-50/)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0009&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;απφώ, απ. 50 Lobel-Page μετ. Ι.Ν. Καζάζη: Αυτός που είναι ωραίος, είναι ωραίος στην όψη, αυτός όμως που είναι και καλός, θα είναι αυτόματα και ωραίος. (Τσέλικας, Σ. (επ.). ΣΑΠΦΩ: απ. 50 Lobel-Page. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=296)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Υμέναιοι της Σαπφούς, Επιθαλάμια της Σαπφούς της Λεσβίας, Ύμνοι της Σαπφούς της Λεσβίας, Ερωτική ποίηση της Σαπφούς</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6ος αιώνας π.Χ., 7ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Λέσβος</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Σικελία</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/b/b1/1877_Charles_Mengin_-_Sappho.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/b/b1/1877_Charles_Mengin_-_Sappho.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:entry=sappho-bio-1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:entry=sappho-bio-1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0009.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0009.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0009.tlg002" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0009.tlg002</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DS%3Aentry+group%3D4%3Aentry%3Dsappho-bio-1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DS%3Aentry+group%3D4%3Aentry%3Dsappho-bio-1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/?f%5Btg_facet%5D%5B%5D=Sappho&amp;f%5Bwork_lang%5D%5B%5D=grc&amp;per_page=10&amp;q=tg_no_token%3A%5BS+TO+T%5D&amp;sort=auth_name+asc%2C+work_titl     ['<div class="terminologyEntry">    <div class="term">Σάρδεις</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Οι Σάρδεις, η πρωτεύουσα της Λυδικής Αυτοκρατορίας, βρισκόταν στη δυτική Τουρκία. Το 188 π.Χ. έγινε μέρος του βασιλείου των Ατταλιδών και στη συνέχεια πέρασε στη Ρώμη το 133 π.Χ. με την επικράτεια του Αττάλου Γ&apos;.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, S. Mitchell, Brady Kiesling, Sean Gillies, Chris de Lisle, Jeffrey Becker, W. Röllig, Jamie Novotny, Tom Elliott, H. Kopp, DARMC, R. Talbert, B. Siewert-Mayer, Francis Deblauwe, and Eric Kansa, &apos; Sardis/Hyde?: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/550867&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Sardis</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sardis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.488314,28.040286&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Αλκμάν</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/place/2090" target="_blank" rel="noopener">https://www.trismegistos.org/place/2090</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.geonames.org/9986360/sardes.html" target="_blank" rel="noopener">http://www.geonames.org/9986360/sardes.html</a></div>    <div class= "extern     ['<div class="terminologyEntry">    <div class="term">Σημωνίδης ο Αμοργίνος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Σημωνίδης ο Ιαμβογράφος, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Semonides Amorginus</div>    <div class="textMediumMarginBlue">- en: Simonides of Amorgos</div>    <div class="textMediumMarginBlue">- en: Semonides Iambographus</div>    <div class="textMediumMarginBlue">- en: Simonides of Samos</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: semonides_amorginus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Semonides, Iambi, CURFRAG.tlg-0260.3 translated by Edmonds: There&apos;&apos;&apos;&apos;s much time for us to lie dead in, yet we live years few in number and live them ill. (Edmonds, J. M. (1931). Iambi, Semonides in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0480%3Avolume%3D2%3Atext%3D22%3Asection%3D2#:~:text=live%20them%20ill.-,CURFRAG.tlg%2D0260.3,-%E2%80%9D%20Stobaeus%20Anthology)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0260&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Σημωνίδης, απ. 3 West μετ. Ηλ. Βουτιερίδης: Για να πεθάνουμε έχουμε καιρόν όσον κι αν θέμε, μα ζούμε χρόνια λιγοστά και συφορές γεμάτα. (Τσέλικας, Σ. (επ.). Σημωνίδης: απ. 3 West. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανα s://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0480%3Avolume%3D2%3Atext%3D22%3Asection%3D1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0480%3Avolume%3D2%3Atext%3D22" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0480%3Avolume%3D2%3Atext%3D22</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σημωνίδης ο Ιαμβογράφος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Σημωνίδης ο Αμοργίνος, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Σημωνίδης, που γεννήθηκε στη Σάμο αλλά ζούσε στην Αμοργό, ήταν γνωστός για τους λιγοστούς σωζόμενους ιαμβικούς στίχους του και μερικά αποσπάσματα ελεγείας. Οι τελευταίες περιέχουν φιλοσοφικούς στοχασμούς, ενώ οι ιαμβικοί στίχοι σατιρικές απεικονίσεις γυναικών.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> SEMONIDES Eleg., Iamb. {0260} (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0260&amp;wid=&amp;q=SEMONIDES&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=2&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Ίαμβοι. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_022.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Simonides. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DS%3Aentry+group%3D19%3Aentry%3Dsimonides-bio-1#:~:text=%CE%A3%CE%B9%CE%BC%CF%89%CE%BD%CE%AF%CE%B4%CE%B7%CF%82)%2C%20literary.-,Simo%27nides,-1.%20Of%20Samos</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.1267</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="tex 2</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σικελία</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Σικελία, το μεγαλύτερο νησί της Μεσογείου, κατοικείται από το 8.000 π.Χ. περίπου. Καθ&apos; όλη τη διάρκεια της ιστορίας της, η Σικελία γνώρισε σημαντική κατοίκηση και επιρροή από διάφορους πολιτισμούς, όπως ο πουνικός, ο καρχηδονιακός, ο ελληνικός, ο ρωμαϊκός, ο οστρογοτθικός, ο βυζαντινός, ο αραβικός και ο νορμανδικός.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> R.J.A. Wilson, Pierre Motylewicz, R. Talbert, Sean Gillies, R. Scott Smith, Jeffrey Becker, Greta Hawes, and Tom Elliott, &apos;Sicilia (island): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/462492&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Sicilia</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sicilia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.6288545273,13.9945590442&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Σιμωνίδης από την Κέα, Σαπφώ</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/place/2132" target="_blank" rel="noopener">https://www.trismegistos.org/place/2132</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q4951156" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q4951156</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.geonames.org/" target="_blank" rel="noopener">http://www.geonames.org/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DS%3Aentry+group%3D12%3Aentry%3Dsicilia-geo" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DS%3Aentry+group%3D12%3Aentry%3Dsicilia-geo</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Sicily" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Sicily</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/462492" target="_blank" rel="noopener">https://pleiades.stoa.org/places/462492</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σιμωνίδης από την Κέα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Σιμωνίδης ο Λυρικός, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Σιμωνίδης, που γεννήθηκε στο νησί της Κέας, απέκτησε γρήγορα φήμη για τα ποικίλα ποιητικά του έργα, όπως οι επίνικοι, οι θρήνοι, τα επιγράμματα και οι διθύραμβοι. Φημισμένος για τη γλωσσική του ακρίβεια, επαινέθηκε επειδή ξεπέρασε ακόμη και τον Πίνδαρο στους συμπονετικούς θρήνους του. Ο Σιμωνίδης προτίμησε την απλότητα έναντι της μεγαλοπρέπειας στις συνθέσεις του, προσφέροντας φιλοσοφικούς προβληματισμούς για την ανθρώπινη μοίρα με βαθιά κατανόηση.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> SIMONIDES Lyr. {0261}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0261&amp;wid=&amp;q=SIMONIDES&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=11&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012).2.4.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 </div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 191).</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.1292</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Simonides Ceus</div>    <div class="textMediumMarginBlue">- en: Simonides Lyricus</div>    <div class="textMediumMarginBlue">- en: Simonides     ['<div class="terminologyEntry">    <div class="term">Σμύρνη</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Αρχαίος οικισμός της Μικράς Ασίας, η σύγχρονη Izmir στην Τουρκία.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, S. Mitchell, R. Talbert, Chris de Lisle, Jeffrey Becker, W. Röllig, Tom Elliott, H. Kopp, DARMC, Sean Gillies, B. Siewert-Mayer, Rob Chavez, Francis Deblauwe, and Eric Kansa, &apos;Naulochon/Smyrna/Palaia Smyrna: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/550771&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Smyrna</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: smyrna</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.41719605,27.141387&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Μίμνερμος από την Κολοφώνα</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0006%3Aalphabetic+letter%3DS%3Aentry+group%3D8%3Aentry%3Dsmyrna" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0006%3Aalphabetic+letter%3DS%3Aentry+group%3D8%3Aentry%3Dsmyrna</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/%C4%B0zmir" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/%C4%B0zmir</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/place/41382" target="_blank" rel="noopener">https://www.trismegistos.org/place/41382</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/550771" target="_blank" rel="noopener">https://pleiades.stoa.org/places/550771</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σόλων ο Αθηναίος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Σόλων, ένας Αθηναίος πολιτικός, παρενέβαινε στην πολιτική μέσω της ποίησής του, υποστηρίζοντας τη χρηστή διακυβέρνηση έναντι της ανομίας, καταδικάζοντας την απληστία των ηγετών και επικρίνοντας την υποδούλωση του χρέους. Πίστευε στη θεία δικαιοσύνη, προέβλεψε τις ανησυχίες της τραγωδίας και θέσπισε μετριοπαθείς μεταρρυθμίσεις, βελτιώνοντας τη νομοθεσία για τα δάνεια και καταργώντας ορισμένα χρέη. Οι πολιτικές του ελεγείες αντικατοπτρίζουν αυτά τα θέματα και τη μεταρρυθμιστική του πολιτική ατζέντα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). 2.4.Β.iii.γ. Πολιτική ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_027.html</div>    <div class="textItalicSmallMargin"><b>2)</b> SOLON Nomograph., Poeta {0263}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0263&amp;wid=&amp;q=SOLON&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=12&amp;acp=1&amp;editid=</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Solon Atheniensis</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: solon_atheniensis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By M. A. Barth - "Solon demands to pledge respect for his laws", book illustration (Augsburg 1832). &apos;Vorzeit und Gegenwart", Augsbourg, 1832, Public Domain, https://commons.wikimedia.org/w/index.php?curid=74939386</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/f/f6/Solon_demands_to_pledge_respect_for_his_laws.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0263&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Πολιτική ελεγεία του Σόλωνα</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6ος αιώνας π.Χ., 7ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Αθήνα</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/f/f6/Solon_demands_to_pledge_respect_for_his_laws.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/f/f6/Solon_demands_to_pledge_respect_for_his_laws.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0263.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0263.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0007.tlg007" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0007.tlg007</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0004%3Aalphabetic+letter%3DS%3Aentry+group%3D6%3Aentry%3Dsolon" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0004%3Aalphabetic+letter%3DS%3Aentry+group%3D6%3Aentry%3Dsolon</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <     ['<div class="terminologyEntry">    <div class="term">Στησίχορος από την Ιμέρα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Στησίχορος, αναγνωρισμένος ως κορυφαία μορφή της λυρικής ποίησης, έφερε επανάσταση στον χορικό στίχο εισάγοντας νέα στοιχεία όπως η επωδός και τα περίπλοκα σχέδια των στροφών. Οι συνθέσεις του, οι οποίες επικεντρώνονται κυρίως σε μυθολογικά μοτίβα, όπως η «Ελένη» και η «Παλινωδία», υπογραμμίζουν τη βαθιά επίδρασή του στην ανάπτυξη των αρχαίων ελληνικών λογοτεχνικών μορφών.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> STESICHORUS Lyr. {0292} (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0292&amp;wid=&amp;q=STESICHORUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=5&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Stesi&apos;chorus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DT%3Aentry+group%3D26%3Aentry%3Dtyrtaeus-bio-1</div>    <div class="textItalicSmallMargin"><b>4)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 190).</div>    <div class="textItalicSmallMargin"><b>5)</b> https://catalog.perseus.tufts.edu/catalog/urn:cts:greekLit:tlg0292.tlg001.opp-grc3</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Stesichorus Himeraeus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: stesichorus_himeraeus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: Από Pirizz at Ιταλικά Βικιπαίδεια - Stesichorus - Bellini Garden, Catania, Italy - September 2010. Transferred from it.wikipedia to Commons by OrbiliusMagister., Κοινό Κτήμα, https://commons.wikimedia.org/w/index.php?curid=12861189</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e5/Stesichorus.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Stesichorus, fr. 192 tr. Campbell: That story is not true, and you did not go on the well-benched ships and you did not reach the citadel of Troy; (Campbell, D. A. (n.d.). Stesichorus, ΕΛΕΝΑ: ΠΑΛΙΝΩΙΔΙΑΙ. Loeb Classical Library. Retrieved 5 May 2024, from https://www.loebclassics.com/view/stesichorus_i-fragments/1991/pb_LCL476.93.xml)&apos;&apos; tlgIdentifyingNumber: &apos;&apos;tlg0292&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0292&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Στησίχορος, απ. 192 Page μετ. Ι.Ν. Καζάζης: Δεν αληθεύει αυτή η ιστορία· ούτε σε καράβια καλοσκάμνιστα μπήκες εσύ ποτέ, ούτε έφτασες στης Τροίας την ακρόπολη. (Τσέλικας, Σ. (επ.). ΣΤΗΣΙΧΟΡΟΣ: απ. 192 Page. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=199)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Χορική ποίηση του Στησίχορου από την Ιμέρα<     ['<div class="terminologyEntry">    <div class="term">Συμποτικές ωδές του Αλκαίου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">μονωδία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Αλκαίος είναι γνωστός για τη σύνθεση συμποτικών τραγουδιών, τα οποία ήταν κεντρικά στα αριστοκρατικά συμπόσια, διευκόλυναν την ψυχαγωγία, τη συζήτηση και τη μουσική μέσα σε μια χαλαρή και ρομαντική ατμόσφαιρα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Sympotic odes of Alcaeus Lesbius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sympotic_odes_alcaeus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a single performer&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Αλκαίος ο Λέσβιος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Συμποτικές ωδές του Ανακρέοντα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">μονωδία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Οι Αλεξανδρινοί φιλόλογοι συγκέντρωσαν τα ποιήματα του Ανακρέοντα (ερωτικά, συμποτικά) σε ένα βιβλίο.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 189).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Sympotic odes of Anacreon Teius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sympotic_odes_anacreon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a single performer&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Ανακρέων ο Λυρικός</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Συρακούσες</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Σημαντική αρχαία πόλη στο νησί της Σικελίας.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> R.J.A. Wilson, DARMC, Brady Kiesling, Sean Gillies, Valeria Vitale, Rajas Pradhan, Jeffrey Becker, Adam Rabinowitz, Tom Elliott, Faith Lubeck, Jonathan Prag, Kali Kocian, R. Talbert, David Mimno, and Jeffrey Mayfield, &apos;Syracusae/Syrakousai: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/462503&gt; [accessed: 20 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Syrakousai</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: syrakousai</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.0700365425,15.2831354804&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Πίνδαρος, Βακχυλίδης από την Κέα</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Syracuse,_Sicily" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Syracuse,_Sicily</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.geonames.org/2523083/siracusa.html" target="_blank" rel="noopener">http://www.geonames.org/2523083/siracusa.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/2210" target="_blank" rel=     ['<div class="terminologyEntry">    <div class="term">Τέρπανδρος ο Λέσβιος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Τέρπανδρος, γνωστός για τις μουσικές του καινοτομίες, τιμήθηκε στη Σπάρτη κατά τη διάρκεια της γιορτής του Απόλλωνα γύρω στο 674 π.Χ.. Εισήγαγε σημαντικές καινοτομίες, όπως η αντικατάσταση της τετράχορδης δωρικής λύρας με την επτάχορδη λυδία-λεσβιακή λύρα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 189).</div>    <div class="textItalicSmallMargin"><b>2)</b> Smith, W. (n.d.). Terpander. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DT%3Aentry+group%3D5%3Aentry%3Dterpander-bio-1</div>    <div class="textItalicSmallMargin"><b>3)</b>  Κακριδής, Φάνης. (2012). Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.1364</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Terpander Lesbius</div>    <div class="textMediumMarginBlue">- en: Terpandros</div>    <div class="textMediumMarginBlue">- en: Terpandrus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: terpander_lesbius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMar
