από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=122)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Ίαμβοι του Ιππώνακτα</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Έφεσος</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Κλαζομενές</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/8/87/Hipponax_of_Ephesus.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/8/87/Hipponax_of_Ephesus.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikiquote.org/wiki/Hipponax" target="_blank" rel="noopener">https://en.wikiquote.org/wiki/Hipponax</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Hipponax" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Hipponax</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:entry=hipponax-bio-1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:entry=hipponax-bio-1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0233.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0233.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.741" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.741</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ιππώναξ ο Ιαμβογράφος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Ιππώναξ ο Εφέσιος, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Ιππόναξ, ποιητής από την Έφεσο, που αργότερα μετακόμισε στις Κλαζομενές, ήταν γνωστός για την εκφραστική σάτιρα και τη χυδαία γλώσσα του, απεικονίζοντας σκηνές φτώχειας, γελοιοποιώντας τους εχθρούς και εξερευνώντας θέματα κλοπής, καυγάδων και τολμηρών ρομαντικών περιπετειών. Οι στίχοι του περιλάμβαναν επίσης χονδροειδείς συγκρίσεις, μαγικά στοιχεία, παροιμιώδεις εκφράσεις και νύξεις μισογυνισμού, αναδεικνύοντας ένα μοναδικό μείγμα σάτιρας και ιδιότυπης γλώσσας.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Ίαμβοι. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_022.html</div>    <div class="textItalicSmallMargin"><b>2)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 185).</div>    <div class="textItalicSmallMargin"><b>3)</b> HIPPONAX Iamb. {0233}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0233&amp;wid=&amp;q=HIPPONAX&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=8&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.741</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Hipponax Ephesius</div>    <div class="textMediumMarginBlue">- en: Hipponax Iambographus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: hipponax_ephesius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Published by Guillaume Rouille(1518?-1589) - Hipponax of Ephesus was an Ancient Greek iambic poet. "Promptuarii Iconum Insigniorum ", Public Domain, https://commons.wikimedia.org/w/index.php?curid=8660255</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/8/87/Hipponax_of_Ephesus.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Hipponax, fr. 68 West: Two days are sweetest for a woman, the day a man marries her and the day he carries her out dead. (Hawkins, L. (n.d.). Hipponax &amp; Misogyny in Ancient Greece. World History Encyclopedia. Retrieved 5 May 2024, from https://www.worldhistory.org/article/188/hipponax--misogyny-in-ancient-greece/)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0233&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Ιππώναξ, απ. 68 West μετ. Σ. Μενάρδος: Δυο μέρες της γυναίκας είν᾽ οι πιο γλυκές, του γάμου η μια κι η άλλη… της κηδείας της. (Τσέλικας, Σ. (επ.). ΙΠΠΩΝΑΞ: απ. 68 West. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=122)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Ίαμβοι του Ιππώνακτα</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Έφεσος</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Κλαζομενές</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/8/87/Hipponax_of_Ephesus.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/8/87/Hipponax_of_Ephesus.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikiquote.org/wiki/Hipponax" target="_blank" rel="noopener">https://en.wikiquote.org/wiki/Hipponax</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Hipponax" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Hipponax</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:entry=hipponax-bio-1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:entry=hipponax-bio-1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0233.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0233.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.741" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.741</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Καλλίνος ο Εφέσιος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div>    <div class="textMediumMargin"><b>Comment</b>: Έλληνας ποιητής πιθανότατα από την Έφεσο, ο οποίος θεωρείται ως ένας από τους πρώτους ελεγειακούς ποιητές, γνωστός για τα αποσπάσματά του, συμπεριλαμβανομένης μιας πολεμικής ελεγείας που παρακινεί εναντίον των εχθρών, η οποία πιθανώς γράφτηκε γύρω στο 675 π.Χ. κατά τη διάρκεια των Κιμμερίων εισβολών.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> CALLINUS Eleg. {0243}. (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0243&amp;wid=&amp;q=CALLINUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=2&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Πολεμική Ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_025.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Callinus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DC%3Aentry+group%3D6%3Aentry%3Dcallinus-bio-1</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.310</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Callinus Ephesius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: callinus_ephesius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;The Elegiac Poems of Callinus, CURFRAG.tlg-0243.1, translated by Edmonts: How long will ye lie idle? When, young men, will ye show a stout heart? Have ye no shame of your sloth before them that dwell round about you? Purpose ye to sit in peace though the land is full of war? ... and let every man cast his javelin once more as he dies. For &apos;&apos;&apos;&apos;tis an honourable thing and a glorious to a man to fight the foe for land and children and wedded wife; and death shall befall only when the Fates ordain it. Nay, so soon as war is mingled let each go forward spear in poise and shield before stout heart; for by no means may a man escape death, nay not if he come of immortal lineage. Oftentime, it may be, he returneth safe from the conflict of battle and the thud of spears, and the doom of death cometh upon him at home; yet such is not dear to the people nor regretted, whereas if aught happen to the other sort he is bewailed of small and great. When a brave man dieth the whole people regretteth him, and while he lives he is as good as a demigod; for in their eyes he is a tower, seeing that he doeth single-handed as good work as many together. (Edmonds, J. M. (1931). The Elegiac Poems of Callinus in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D1%3Asection%3D2#note1:~:text=as%20many%20together.-,CURFRAG.tlg%2D0243.1,-%E2%80%9D%20Stobaeus%20Anthology)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0243&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Καλλίνος, απ. 1 West, μετ. Σ. Μενάνδρου: Ως πότε πια κατάκοιτοι; ορμήν πότε θα βρείτε; | δεν ντρέπεσθε τους γείτονες για την οκνιάν αυτή; | Ε! παλικάρια, ειρηνικά πως κάθεστε θαρρείτε | και ωστόσο γύρω ο πόλεμος όλη την γη κρατεί… | ................. | Είναι τιμή κι είναι χαρά στο παλικάρι η μάχη | για την πατρίδα, την καλή γυναίκα, τα παιδιά. | Ο θάνατος τότε θα ᾽ρθει, όταν η Μοίρα λάχει· | μόνο καθείς ας ορθωθεί μ᾽ ατρόμητη καρδιά, | και ας δράξει αμέσως το σπαθί κι ας ζώσει τ᾽ άρματά του | και όσό ᾽ναι του πολέμου αρχή, ας δράμει εκεί μπροστά, | γιατί να φύγει αδύνατο την μοίρα του θανάτου, | και αν η γενιά του από θεούς αθάνατου ς βαστά· | κάποτ᾽ αν απ᾽ τον πόλεμο δειλά λιποτακτήσει, | μέσα στο σπίτι βρίσκει τον η ώρα του η στερνή. | Μα τούτον ποιος τον αγαπά και ποιος θα τον ποθήσει; | ενώ τον άλλο ένας λαός, αν πάθει, τον πονεί. | Γιατί ο λαός ολάκερος θρηνεί το παλικάρι, | σαν αποθάνει· κι έχουν τον ημίθεο όσο ζει | σαν πύργ᾽ όλοι κατάματα θωρούν τον με καμάρι | γιατί μονάχος κάμνει αυτός όσα πολλοί μαζί! (Τσέλικας, Σ. (επ.). ΚΑΛΛΙΝΟΣ: απ. 1 West. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=48)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Πολεμικές ελεγείες του Καλλίνου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 7ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Έφεσος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0243.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0243.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.310" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.310</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/people/2039" target="_blank" rel="noopener">https://topostext.org/people/2039</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D1%3Asection%3D2" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D1%3Asection%3D2</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/biography/Callinus" target="_blank" rel="noopener">https://www.britannica.com/biography/Callinus</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Κέα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ένα από τα νησιά των Κυκλάδων.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> G. Reger, J. McK. Camp II, Catherine Bouras, R. Talbert, Brady Kiesling, Sean Gillies, Jeffrey Becker, Arthur De Graauw, and Tom Elliott, &apos;Keos (island): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/570348&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Keos</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: keos</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.61385947,24.3265549158&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Βακχυλίδης από την Κέα, Σιμωνίδης από την Κέα</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/1032" target="_blank" rel="noopener">http://www.trismegistos.org/place/1032</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/376243IKeo" target="_blank" rel="noopener">https://topostext.org/place/376243IKeo</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Kea_(island)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Kea_(island)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/570348" target="_blank" rel="noopener">https://pleiades.stoa.org/places/570348</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Κλαζομενές</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η αρχική θέση της πόλης στην ηπειρωτική χώρα βρισκόταν νοτιοδυτικά της σημερινής Urla Iskelesi στην Τουρκία. Σύμφωνα με τον Παυσανία, η πόλη μεταφέρθηκε αργότερα σε ένα νησί στον κόλπο της Σμύρνης.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, S. Mitchell, Peter Cobb, Sean Gillies, Jeffrey Becker, Tom Elliott, Brady Kiesling, R. Talbert, Rob Chavez, and Ryan Horne, &apos;Klazomenai (later): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/550651&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Klazomenai</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: klazomenai</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.3614575859,26.770567899&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Ιππώναξ ο Εφέσιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/384268PKla" target="_blank" rel="noopener">https://topostext.org/place/384268PKla</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Klazomenai" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Klazomenai</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/550651" target="_blank" rel="noopener">https://pleiades.stoa.org/places/550651</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/550650" target="_blank" rel="noopener">https://pleiades.stoa.org/places/550650</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Κολοφώνα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Κολοφώνα ήταν μια ιωνική πόλη στη Λυδία, που βρισκόταν περίπου 13 χιλιόμετρα βόρεια του λιμανιού του Νοτίου. Τα ερείπια αυτής της αρχαίας πόλης βρίσκονται κοντά στη σύγχρονη πόλη Değirmendere.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, DARMC, R. Talbert, Sean Gillies, Ryan Horne, Jeffrey Becker, and Tom Elliott, &apos;Colophon: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2022 &lt;https://pleiades.stoa.org/places/599577&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Colophon</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: colophon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.108253,27.1483085&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Μίμνερμος από την Κολοφώνα</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0006%3Aalphabetic+letter%3DC%3Aentry+group%3D8%3Aentry%3Dcolophon" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0006%3Aalphabetic+letter%3DC%3Aentry+group%3D8%3Aentry%3Dcolophon</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Colophon_(city)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Colophon_(city)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.geonames.org/9794266/colophon-greek-bath.html" target="_blank" rel="noopener">http://www.geonames.org/9794266/colophon-greek-bath.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/1142" target="_blank" rel="noopener">http://www.trismegistos.org/place/1142</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/599577" target="_blank" rel="noopener">https://pleiades.stoa.org/places/599577</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Λέσβος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Το αρχαίο νησί της Λέσβου, που βρίσκεται στο Αιγαίο Πέλαγος κοντά στις ανατολικές ακτές της Ελλάδας, γνώρισε σημαντική πολιτιστική άνθιση κατά τον 7ο και 6ο αιώνα π.Χ. Εκεί έζησαν εξέχουσες προσωπικότητες όπως ο Αλκαίος, ο Τέρπανδρος και η Σαπφώ, οι οποίοι συνέβαλαν σημαντικά στην ανάπτυξη της λυρικής ποίησης. Αυτός ο πολιτιστικός πλούτος αντανακλούσε την ευημερία και την πνευματική ζωντάνια του νησιού κατά την εποχή εκείνη.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div>    <div class="textItalicSmallMargin"><b>2)</b> C. Foss, G. Reger, S. Mitchell, R. Talbert, Sean Gillies, Tom Elliott, and Jeffrey Becker, &apos;Lesbos (island): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/550696&gt; [accessed: 22 August 2024] </div>    <div class="textItalicSmallMargin"><b>3)</b> Britannica, T. Editors of Encyclopaedia (2024, April 17). Lésbos. Encyclopedia Britannica. https://www.britannica.com/place/Lesbos-island-Greece</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Lesbos</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: lesbos</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;39.1785448797,26.2377523591&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Αλκαίος ο Λέσβιος, Σαπφώ, Τέρπανδρος ο Λέσβιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/1242" target="_blank" rel="noopener">http://www.trismegistos.org/place/1242</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/" target="_blank" rel="noopener">https://www.wikidata.org/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/392261ILes" target="_blank" rel="noopener">https://topostext.org/place/392261ILes</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Lesbos" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Lesbos</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/550696" target="_blank" rel="noopener">https://pleiades.stoa.org/places/550696</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Μέγαρα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Τα Μέγαρα ήταν μια σημαντική αρχαία ελληνική πόλη που βρισκόταν στο βόρειο τμήμα του Ισθμού της Κορίνθου, ακριβώς απέναντι από το νησί της Σαλαμίνας.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> G. Reger, J. McK. Camp II, DARMC, Brady Kiesling, R. Talbert, Chris de Lisle, Jeffrey Becker, Tom Elliott, Catherine Bouras, and Sean Gillies, &apos;Megara: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/570468&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Megara</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: megara</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.985078,23.340163&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Θέογνις από τα Μέγαρα</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Megaris" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Megaris</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DM%3Aentry+group%3D8%3Aentry%3Dmegara-geo02" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DM%3Aentry+group%3D8%3Aentry%3Dmegara-geo02</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Megara" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Megara</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/380233PMeg" target="_blank" rel="noopener">https://topostext.org/place/380233PMeg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/570468" target="_blank" rel="noopener">https://pleiades.stoa.org/places/570468</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Μίλητος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Μεγάλη αρχαία πόλη της Ιωνίας.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, Brady Kiesling, Sean Gillies, Jeffrey Becker, H. Kopp, B. Siewert-Mayer, Johan Åhlfeldt, R. Talbert, Chris de Lisle, W. Röllig, Tom Elliott, DARMC, Francis Deblauwe, Phoebe Acheson, R. Scott Smith, Greta Hawes, Ryan Horne, and Eric Kansa, &apos;Miletus: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/599799&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Miletus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: miletus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.53046444,27.2788084839&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Φωκυλίδης ο Λυρικός</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.geonames.org/9534929/miletos.html" target="_blank" rel="noopener">http://www.geonames.org/9534929/miletos.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q169460" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q169460</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/1375" target="_blank" rel="noopener">http://www.trismegistos.org/place/1375</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.geonames.org/9534929/miletos.html" target="_blank" rel="noopener">http://www.geonames.org/9534929/miletos.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Miletus" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Miletus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/599799" target="_blank" rel="noopener">https://pleiades.stoa.org/places/599799</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Μίμνερμος από την Κολοφώνα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Μίμνερμος ο Λυρικός, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Mimnermus Lyricus</div>    <div class="textMediumMarginBlue">- en: Mimnermo of Colophon</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: mimnermus_lyricus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;The Elegies of Mimnermus, CURFRAG.tlg-0255.1, translated by Edmonts: But what life would there be, what joy, without golden Aphrodite? May I die when I be no more concerned with secret love and suasive gifts and the bed, such things as are the very flowers of youth, pleasant alike to man and woman. And when dolorous Age cometh, that maketh a man both foul without and evil within,ill cares do wear and wear his heart, he hath no more the joy of looking one the sunlight, to children he is hateful, to women contemptible, so grievous hath God made Age. (Edmonds, J. M. (1931). The Elegies of Mimnermus in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D4%3Asection%3D2#:~:text=God%20made%20Age.-,%20Stobaeus%20Anthology)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0255&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Μίμνερμος, απ. 1 West μετ. I. Ν. Καζάζη: Τι είναι η ζωή, και ποια η γλύκα της δίχως την Αφροδίτη τη χρυσή; Ν άφηνα την πνοή μου, όταν θα έπαυαν όλα τούτα να μ᾽ ενδιαφέρουν, οι κρυφές αγάπες, τα γλυκά σαν μέλι δώρα τους και το κρεβάτι — άνθη συναρπαστικά που στολίζουν τη νιότη αντρών και γυναικών. Μα όταν επιδράμει οδυνηρό το γήρας, αυτό που ασχημίζει τον άνθρωπο και τον εξευτελίζει, εξουθενωτικό άγχος βασανίζει την ψυχή του, και πια δεν χαίρεται να αντικρίζει το φως του ήλιου· γιατί οι άγουροι τον αποφεύγουν, και οι γυναίκες τον περιφρονούν — τόσο σκληρά έκαμε ο θεός τα γηρατειά! (Τσέλικας, Σ. (επ.). Μίμνερμος: απ. 1 West. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=64#m2)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Ερωτική ελεγεία του Μίμνερμου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 7ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Κολοφώνα, Σμύρνη</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg002" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg002</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q316129" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q316129</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.938" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.938</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D4%3Asection%3D2" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D4%3Asection%3D2</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Μίμνερμος ο Λυρικός</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Μίμνερμος από την Κολοφώνα, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Μίμνερμος, που καταγόταν από την Κολοφώνα (ή τη Σμύρνη) τον 7ο/6ο αιώνα π.Χ., πιστώνεται ότι εγκαινίασε το είδος της ερωτικής ελεγείας, απεικονίζοντας θέματα κρυμμένου έρωτα και την παροδική φύση της ανθρώπινης ζωής.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b>  MIMNERMUS Eleg. {0255} (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0255&amp;wid=&amp;q=MIMNERMUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=3&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Ερωτική Ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_026.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Mimnermus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DM%3Aentry+group%3D26%3Aentry%3Dmimnermus-bio-1</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.938</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Mimnermus Lyricus</div>    <div class="textMediumMarginBlue">- en: Mimnermo of Colophon</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: mimnermus_lyricus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;The Elegies of Mimnermus, CURFRAG.tlg-0255.1, translated by Edmonts: But what life would there be, what joy, without golden Aphrodite? May I die when I be no more concerned with secret love and suasive gifts and the bed, such things as are the very flowers of youth, pleasant alike to man and woman. And when dolorous Age cometh, that maketh a man both foul without and evil within,ill cares do wear and wear his heart, he hath no more the joy of looking one the sunlight, to children he is hateful, to women contemptible, so grievous hath God made Age. (Edmonds, J. M. (1931). The Elegies of Mimnermus in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D4%3Asection%3D2#:~:text=God%20made%20Age.-,%20Stobaeus%20Anthology)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0255&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Μίμνερμος, απ. 1 West μετ. I. Ν. Καζάζη: Τι είναι η ζωή, και ποια η γλύκα της δίχως την Αφροδίτη τη χρυσή; Ν άφηνα την πνοή μου, όταν θα έπαυαν όλα τούτα να μ᾽ ενδιαφέρουν, οι κρυφές αγάπες, τα γλυκά σαν μέλι δώρα τους και το κρεβάτι — άνθη συναρπαστικά που στολίζουν τη νιότη αντρών και γυναικών. Μα όταν επιδράμει οδυνηρό το γήρας, αυτό που ασχημίζει τον άνθρωπο και τον εξευτελίζει, εξουθενωτικό άγχος βασανίζει την ψυχή του, και πια δεν χαίρεται να αντικρίζει το φως του ήλιου· γιατί οι άγουροι τον αποφεύγουν, και οι γυναίκες τον περιφρονούν — τόσο σκληρά έκαμε ο θεός τα γηρατειά! (Τσέλικας, Σ. (επ.). Μίμνερμος: απ. 1 West. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=64#m2)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Ερωτική ελεγεία του Μίμνερμου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 7ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Κολοφώνα, Σμύρνη</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg002" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg002</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q316129" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q316129</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.938" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.938</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D4%3Asection%3D2" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D4%3Asection%3D2</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Παιάνες του Αλκμάνα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">παιάνας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Αλκμάνας ήταν επίσης γνωστός για τους παιάνες του.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Smith, W. (n.d.). Alcman. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D14%3Aentry%3Dalcman-bio-1</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Paeans of Alcman Lacedaemonius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: paeans_alcman</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to apollo&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Αλκμάν</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Παιάνες του Βακχυλίδη</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">παιάνας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Βακχυλίδης ήταν επίσης γνωστός για τους παιάνες του.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 192).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Paeans of Bacchylides Ceus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: paeans_bacchylides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to apollo&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Βακχυλίδης από την Κέα</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Παιάνες του Πινδάρου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">παιάνας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Πίνδαρος ήταν επίσης γνωστός για τους παιάνες του, οι οποίοι σώζονται αποσπασματικά.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 192-194).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Paeans of Pindarus Boeotus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: paeans_pindarus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to apollo&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Πίνδαρος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Παρθένεια του Αλκμάνα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">παρθένειο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Τα σωζόμενα έργα του Αλκμάνα περιλαμβάνουν το σημαντικότερο δείγμα χορικής λυρικής ποίησης: έναν Παρθένειο, που πιθανώς εκτελέστηκε από χορό δέκα κοριτσιών κατά τη διάρκεια μιας γιορτής στη Σπάρτη τον 7ο/6ο αιώνα π.Χ.. Το ποίημα αρχίζει με έναν τοπικό πολεμικό μύθο και εξυμνεί την ομορφιά των κοριτσιών, συζητώντας για το ντύσιμο και τα κοσμήματά τους, αναδεικνύοντας ένα έντονο ερωτικό στοιχείο μέσα στο γυναικείο χορό.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Smith, W. (n.d.). Alcman. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D14%3Aentry%3Dalcman-bio-</div>    <div class="textItalicSmallMargin"><b>2)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 189-190).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Partheneia of Alcman Lacedaemonius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: partheneia_alcman</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus performed by a maidens chorus&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Αλκμάν</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Παρθένεια του Βακχυλίδη</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">παρθένειο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Βακχυλίδης είναι επίσης γνωστό ότι συνέθεσε παρθένεια.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 192).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Partheneia of Bacchylides Ceus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: partheneia_bacchylides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus performed by a maidens chorus&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Βακχυλίδης από την Κέα</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Παρθένεια του Πινδάρου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">παρθένειο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Πίνδαρος είχε επίσης συνθέσει Παρθένεια.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 192-194).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Partheneia of Pindarus Boeotus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: partheneia_pindarus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus performed by a maidens chorus&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Πίνδαρος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Πάρος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Πάρος, νησί των Κυκλάδων στο Αιγαίο Πέλαγος, γνωστή για τα λατομεία μαρμάρου, είχε κοινό πολιτισμό της πρώιμης εποχής του Χαλκού με τα άλλα κυκλαδίτικα νησιά. Αργότερα εποικίστηκε από Αρκάδες και Ίωνες και διαδραμάτισε διάφορους ρόλους σε αρχαίες συγκρούσεις, συμπεριλαμβανομένων των Περσικών Πολέμων και των διαφορών με την Αθήνα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Britannica, T. Editors of Encyclopaedia (2022, January 17). Páros. Encyclopedia Britannica. https://www.britannica.com/place/Parose</div>    <div class="textItalicSmallMargin"><b>2)</b> C. Foss, G. Reger, Catherine Bouras, R. Talbert, Sean Gillies, Chris de Lisle, Jeffrey Becker, Arthur De Graauw, and Tom Elliott, &apos;Paros (island): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/599868&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Paros</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: paros</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.0637200811,25.1981285553&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Αρχίλοχος ο Πάριος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Paros" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Paros</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.geonames.org/255720/nisi-paros.html" target="_blank" rel="noopener">https://www.geonames.org/255720/nisi-paros.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/place/1613" target="_blank" rel="noopener">https://www.trismegistos.org/place/1613</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q201272" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q201272</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/599868" target="_blank" rel="noopener">https://pleiades.stoa.org/places/599868</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Πίνδαρος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Πίνδαρος από τη Βοιωτία, Πίνδαρος ο Βοιωτός, Πίνδαρος ο Λυρικός, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Pindarus Boeotus</div>    <div class="textMediumMarginBlue">- en: Pindar</div>    <div class="textMediumMarginBlue">- en: Pindarus Lyricus</div>    <div class="textMediumMarginBlue">- en: Pindarus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: pindarus_boeotus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Ancient Roman frescos of Pompeii - Enthroned Pindar with lyre, Muse and poetess. Antique fresco in Pompeii<br>https://pompeiiinpictures.com/pompeiiinpictures/index.htm, Public Domain, https://commons.wikimedia.org/w/index.php?curid=94696565</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Pythian 7 transl Svarlien: The great city of Athens is the most beautiful prelude of song, which the widely powerful race of the Alcmaeonids can lay as a foundation of odes in honor of their horses. [5] What fatherland, what family will you name that is more illustrious in Greece? For in all cities the story [10] of the citizens of Erechtheus makes the rounds, Apollo, how they made your dwelling in divine Pytho a marvel to see. Five     ['<div class="terminologyEntry">    <div class="term">Πίνδαρος ο Βοιωτός</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Πίνδαρος, Πίνδαρος από τη Βοιωτία, Πίνδαρος ο Λυρικός, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Πίνδαρος, που γεννήθηκε κοντά στη Θήβα, παρήγαγε διάφορες ποιητικές συνθέσεις, συμπεριλαμβανομένων των εγκωμίων, των επινίκων και των ύμνων, κερδίζοντας καταξίωση για τους πλούσιους στίχους του. Τα έργα του, γραμμένα κυρίως σε επική γλώσσα με δωρικά και κάποια αιολικά στοιχεία, αντανακλούν έναν σοβαρό και μεγαλοπρεπή τόνο, τονίζοντας τη θεϊκή δύναμη και το ανθρώπινο μεγαλείο.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> PINDARUS Lyr. {0033}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0033&amp;wid=&amp;q=PINDARUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=9&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). 3.5.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_042.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 192-194).</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.1126</div>    <div class="textItalicSmallMargin"><b>5)</b> https://lsj.gr/wiki/%CE%A0%CE%AF%CE%BD%CE%B4%CE%B1%CF%81%CE%BF%CF%82</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <d
