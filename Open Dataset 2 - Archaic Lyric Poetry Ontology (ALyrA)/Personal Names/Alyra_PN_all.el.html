    ['<div class="terminologyEntry">    <div class="term">Γνωμικές ελεγείες του Θέογνη</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">γνωμική ελεγεία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Θεόγνις, από τα Μέγαρα, συνέθεσε μια συλλογή από σύντομες και μεγαλύτερες ελεγείες (περίπου 1400 στίχοι) που χαρακτηρίζονται από συντηρητικές απόψεις και ηθικούς προβληματισμούς, με την έρευνα να επικεντρώνεται στη διάκριση της αυθεντικής συμβολής του μεταξύ άλλων. Οι ελεγείες αυτές προορίζονταν πιθανότατα για αριστοκρατικά συμπόσια, ενώ περιλαμβάνεται και η Σφραγίδα του Θεογένη.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Γνωμική Ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_028.html</div>    <div class="textItalicSmallMargin"><b>2)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 187).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Gnomic elegies of Theognis Megarensis</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: gnomic_elegies_theognis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet with gnomic content&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Θέογνις από τα Μέγαρα</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Γνωμικές ελεγείς του Φωκυλίδη</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">γνωμική ελεγεία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Φωκυλίδης, από τη Μίλητο τον 6ο αιώνα π.Χ., έγραψε γνωμικές ελεγείες. Ένα από τα σωζόμενα αποσπάσματά του, σε εξάμετρο, μοιράζεται το ίδιο θέμα με τον «Ιάμβο κατά των γυναικών» του Σιμωνίδη.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Gnomic elegies of Phocylides Milesius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: gnomic_elegies_phocylides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet with gnomic content&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Φωκυλίδης ο Λυρικός</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Διθυραμβική ποίηση του Βακχυλίδη από την Κέα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">διθύραμβος</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Βακχυλίδης, συγγενής του Πινδάρου, εξερεύνησε ποικίλες μορφές χορικής ποίησης, οι οποίες ταξίδεψαν ευρέως σε όλη την Ελλάδα. Οι επίνικοι και οι ύμνοι του που έχουν διασωθεί περιλαμβάνουν κατά κύριο λόγο μυθολογικές αφηγήσεις, αν και διαφοροποιήθηκε από τον Πίνδαρο ως προς τις υφολογικές αποχρώσεις και το θεματικό βάθος.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 192).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Dithyrambs of Bacchylides Ceus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: dithyrambs_bacchylides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to dionysus&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Βακχυλίδης από την Κέα</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Διθυραμβική ποίηση του Πινδάρου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">διθύραμβος</font></div>    <div class="textMediumMargin"><b>Comment</b>: Παραγωγικός για πάνω από πενήντα χρόνια, ο Πίνδαρος συνέθεσε εγκώμια, επινίκους, θρήνους, παιάνες, παρθένια, διθυράμβους, ύμνους κ.λπ. Ωστόσο, από τα δεκαεπτά βιβλία όπου οι Αλεξανδρινοί είχαν συγκεντρώσει το έργο του, σώζονται μόνο τέσσερα βιβλία με 44 επινίκια: ένα με ολύμπιες ωδές, ένα με πυθικές ωδές, ένα με ισθμικές ωδές και ένα με νεμέϊκες ωδές. Τα υπόλοιπα σώζονται μόνο αποσπασματικά.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 192-194).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Dithyrambs of Pindarus Boeotus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: dithyrambs_pindarus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to dionysus&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Πίνδαρος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Διθύραμβοι του Σιμωνίδη του Κείου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">διθύραμβος</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Σιμωνίδης είχε επίσης συνθέσει διθύραμβους.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.1292</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Dithyrambs of Simonides Ceus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: dithyrambs_simonides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to dionysus&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Σιμωνίδης από την Κέα</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Εγκωμιαστική ποίηση του Βακχυλίδη</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">εγκώμιο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Βακχυλίδης, συγγενής του Πινδάρου, εξερεύνησε ποικίλες μορφές χορικής ποίησης, οι οποίες ταξίδεψαν ευρέως σε όλη την Ελλάδα. Οι επίνικοι και οι ύμνοι του που έχουν διασωθεί περιλαμβάνουν κατά κύριο λόγο μυθολογικές αφηγήσεις, αν και διαφοροποιήθηκε από τον Πίνδαρο ως προς τις υφολογικές αποχρώσεις και το θεματικό βάθος.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 192).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Enkomion of Bacchylides Ceus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: enkomion_bacchylides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to living&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Βακχυλίδης από την Κέα</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Εγκωμιαστική ποίηση του Ιβύκου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">εγκώμιο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ακολούθησε το πρότυπο του Στησίχορου, δημιουργώντας αφηγηματικά μυθολογικά τραγούδια με τοπικές παραλλαγές. Όταν βρισκόταν σε επτανησιακό περιβάλλον, οι συνθέσεις του έπαιρναν έναν πιο έντονο ερωτικό τόνο. Ένα σωζόμενο απόσπασμα κολακεύει τον οικοδεσπότη του και ταυτόχρονα εξυψώνει διακριτικά τη δική του καλλιτεχνική ικανότητα, αντιμετωπίζοντας τον μύθο σε επαινετικό πλαίσιο, όπως φαίνεται στον πανηγυρικό του προς τον Πολυκράτη, μεταβαίνοντας από τον Τρωικό Πόλεμο στην ομορφιά της νεότητας.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). 2.4.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Enkomion of Ibycus Rheginus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: enkomion_ibycus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to living&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Ίβυκος ο Ρηγίνος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Εγκωμιαστική ποίηση του Πινδάρου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">εγκώμιο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Παραγωγικός για πάνω από πενήντα χρόνια, ο Πίνδαρος συνέθεσε εγκώμια, επινίκους, θρήνους, παιάνες, παρθένια, διθυράμβους, ύμνους κ.λπ. Ωστόσο, από τα δεκαεπτά βιβλία όπου οι Αλεξανδρινοί είχαν συγκεντρώσει το έργο του, σώζονται μόνο τέσσερα βιβλία με 44 επινίκια: ένα με ολύμπιες ωδές, ένα με πυθικές ωδές, ένα με ισθμικές ωδές και ένα με νεμέϊκες ωδές. Τα υπόλοιπα σώζονται μόνο αποσπασματικά.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 192-194).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Enkomion of Pindarus Boeotus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: enkomion_pindarus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to living&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Πίνδαρος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ελεγείες του Ανακρέοντα του Τηίου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ελεγεία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Οι Αλεξανδρινοί φιλόλογοι συγκέντρωσαν τις ελεγείες του Ανακρέοντα σε ένα βιβλίο.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). 2.4.Β.ii.β. Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Elegies of Anacreon Teius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: elegies_anacreon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Ανακρέων ο Λυρικός</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ελεγείες του Αρχιλόχου του Πάριου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ελεγεία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Στον Αρχίλοχο αποδίδεται, μαζί με τον Καλλίνο, η επινόηση της ελεγείας, καθιστώντας τον έναν από τους πρώτους ποιητές που διέπρεψαν σε αυτό το είδος.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Smith, W. (n.d.). Archilochus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D37%3Aentry%3Darchilochus-bio-1</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Elegies of Archilochus Parius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: elegies_archilochus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Αρχίλοχος ο Πάριος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ελεγείες του Σιμωνίδη από την Κέα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ελεγεία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο ρόλος του Σιμωνίδη ήταν επίσης σημαντικός στην εξέλιξη της ελεγείας.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 191).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Elegies of Simonides Ceus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: elegies_simonides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Σιμωνίδης από την Κέα</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Επιθαλάμια της Σαπφούς της Λεσβίας</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">επιθαλάμιο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Στα σωζόμενα αποσπάσματα της Σαπφούς ξεχωρίζουν τα επιθαλάμια, τα χορικά γαμήλια τραγούδια, που θυμίζουν τα παραδοσιακά ελληνικά νυφικά τραγούδια, αποδίδοντας μια παρόμοια αίσθηση και ατμόσφαιρα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Epithalamia of Sappho Lesbia</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: epithalamia_sappho</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to wedding couple&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Σαπφώ</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Επίνικοι του Βακχυλίδη</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">επίνικος</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Βακχυλίδης, συγγενής του Πινδάρου, εξερεύνησε ποικίλες μορφές χορικής ποίησης, οι οποίες ταξίδεψαν ευρέως σε όλη την Ελλάδα. Οι επίνικοι και οι ύμνοι του που έχουν διασωθεί περιλαμβάνουν κατά κύριο λόγο μυθολογικές αφηγήσεις, αν και διαφοροποιήθηκε από τον Πίνδαρο ως προς τις υφολογικές αποχρώσεις και το θεματικό βάθος.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 192).</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). 3.5.Β.i. Χορική ποίηση<br>. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_042.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Epinikoi of Bacchylides Ceus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: epinikoi_bacchylides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to winners in athletic events&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Βακχυλίδης από την Κέα</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Επίνικοι του Πινδάρου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">επίνικος</font></div>    <div class="textMediumMargin"><b>Comment</b>: Οι επινίκιες ωδές του Πίνδαρου είναι τελετουργικά άσματα που εξυμνούν τους νικητές σε αρχαίους ελληνικούς αθλητικούς αγώνες. Διαθέτουν τριαδική δομή -στροφή, αντιστροφή και επωδός- και είναι γνωστές για την πολύπλοκη, πλούσια σε μεταφορές γλώσσα τους και το συναισθηματικό τους βάθος. Αυτές οι ωδές δημιουργήθηκαν για να τιμήσουν τα επιτεύγματα και να μεταδώσουν θεϊκές αξίες, αναδεικνύοντας την ικανότητα του Πίνδαρου να απαθανατίζει μεγάλες πράξεις μέσω της ποίησης.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 192-194).</div>    <div class="textItalicSmallMargin"><b>2)</b> Britannica, The Editors of Encyclopaedia. "Pindaric ode". Encyclopedia Britannica, 28 Feb. 2008, https://www.britannica.com/art/Pindaric-ode. Accessed 20 August 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Epinikoi of Pindarus Boeotus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: epinikoi_pindarus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to winners in athletic events&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Πίνδαρος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Επίνικοι του Σιμωνίδη από την Κέα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">επίνικος</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Σιμωνίδης είχε επίσης γράψει επινίκια τραγούδια.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012).2.4.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Epinikoi of Simonides Ceus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: epinikoi_simonides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to winners in athletic events&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Σιμωνίδης από την Κέα</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ερωτικές ωδές του Αλκαίου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">μονωδία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Λίγα αποσπάσματα έχουν επιβιώσει από την ερωτική ποίηση του Αλκαίου. Μερικά ήταν αφιερωμένα στη Σαπφώ, ενώ άλλα απευθύνονταν σε όμορφους νέους, όπως αναφέρουν ο Οράτιος και ο Κικέρωνας.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Smith, W. (1873). Alcaeus of MYTILENE. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:alphabetic%20letter=A:entry%20group=13:entry=alcaeus-bio-6&amp;toc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D34</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Erotic odes of Alcaeus Lesbius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: erotic_odes_alcaeus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a single performer&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Αλκαίος ο Λέσβιος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ερωτικές ωδές του Ανακρέοντα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">μονωδία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Οι Αλεξανδρινοί φιλόλογοι συγκέντρωσαν τα ποιήματα του Ανακρέοντα Τειού (ερωτικά, συμποτικά) σε ένα βιβλίο.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 189).</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). 2.4.Β.ii.β. Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Erotic odes of Anacreon Teius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: erotic_odes_anacreon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a single performer&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Ανακρέων ο Λυρικός</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ερωτική ελεγεία του Μίμνερμου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ερωτική ελεγεία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Μίμνερμος από την Κολοφώνα έφερε επανάσταση στην ελεγεία, εμπλουτίζοντάς την με θρηνητικά και ερωτικά θέματα και μετατοπίζοντάς την από τα παραδοσιακά πολεμικά και χαρούμενα θέματα. Οι στίχοι του, ιδίως εκείνοι που θρηνούσαν τη γήρανση στη σχέση του με τη Ναννό, σηματοδότησαν την έναρξη της ερωτικής ελεγείας, αντανακλώντας μια πιο εσωστρεφή και συναισθηματική εξερεύνηση του έρωτα και της λαχτάρας στην ποίηση.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Ερωτική Ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_026.html</div>    <div class="textItalicSmallMargin"><b>2)</b> Smith, W. (n.d.). Mimnermus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DM%3Aentry+group%3D26%3Aentry%3Dmimnermus-bio-1</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Erotic elegies of Mimnermus Lyricus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: erotic_elegies_mimnermus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet with erotic content&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Μίμνερμος από την Κολοφώνα</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ερωτική ποίηση της Σαπφούς</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">μονωδία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η ερωτική ποίηση της Σαπφούς, γνωστή για τις γλαφυρές εικόνες και τη συναισθηματική της ένταση, εμβαθύνει στην πολυπλοκότητα του πάθους, της επιθυμίας και της ακαταμάχητης δύναμης του έρωτα, απεικονίζοντας συχνά τις στενές σχέσεις μέσα στο θίασό της και εξυμνώντας τη θεϊκή επιρροή της Αφροδίτης.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Smith, W. (n.d.). Sappho. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DS%3Aentry+group%3D4%3Aentry%3Dsappho-bio-1</div>    <div class="textItalicSmallMargin"><b>2)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 188).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Erotic poetry of Sappho Lesbia</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: erotic_odes_sappho</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a single performer&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Σαπφώ</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ερωτική ποίηση του Αλκμάνα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">μονωδία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Μεγάλο μέρος της ποίησης του Αλκμάνα ήταν ερωτική. Λόγω της ελευθερίας και του αισθησιασμού του στα έργα αυτά, συχνά χαρακτηριζόταν ως «γλυκός» και «ευχάριστος» (ανκ.γρ.: γλυκύς, χαριείς).</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Smith, W. (1873). Alcman. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D14%3Aentry%3Dalcman-bio-1</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Erotic poetry of Alcman Lacedaemonius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: erotic_odes_alcman</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a single performer&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Αλκμάν</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Έφεσος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Έφεσος, επίσης γνωστή ως Αρσινόη, ήταν η σημαντικότερη αρχαία μητρόπολη της Ιωνικής Μικράς Ασίας.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, Brady Kiesling, Sean Gillies, Jeffrey Becker, H. Kopp, Joel Michael Kent, B. Siewert-Mayer, Phoebe Acheson, R. Talbert, Johan Åhlfeldt, W. Röllig, Adam Rabinowitz, Tom Elliott, DARMC, jfu, Francis Deblauwe, Ryan Horne, and Eric Kansa, &apos;Ephesus/Arsinoe(ia): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2021 &lt;https://pleiades.stoa.org/places/599612&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Ephesus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: ephesus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.9407625,27.340307&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Ιππώναξ ο Εφέσιος, Καλλίνος ο Εφέσιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/379273PEph" target="_blank" rel="noopener">https://topostext.org/place/379273PEph</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DE%3Aentry+group%3D4%3Aentry%3Dephesus-geo" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DE%3Aentry+group%3D4%3Aentry%3Dephesus-geo</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Ephesus" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Ephesus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q47611" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q47611</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q64699469" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q64699469</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/599612" target="_blank" rel="noopener">https://pleiades.stoa.org/places/599612</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Θάσος-αποικία</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Έλληνες από την Πάρο ίδρυσαν αποικία στη Θάσο στα μέσα του έβδομου αιώνα π.Χ.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> E.N. Borza, DARMC, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Jeffrey Becker, Tom Elliott, Catherine Bouras, G. Reger, and R. Talbert, &apos;Thasos (settlement): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/501634&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Thasos- settlement</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: thasos_settlement</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;40.78201,24.717535&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Αρχίλοχος ο Πάριος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/place/2346" target="_blank" rel="noopener">https://www.trismegistos.org/place/2346</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.geonames.org/6633834/thasos.html" target="_blank" rel="noopener">https://www.geonames.org/6633834/thasos.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0006" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0006</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/408247PTha" target="_blank" rel="noopener">https://topostext.org/place/408247PTha</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/501634" target="_blank" rel="noopener">https://pleiades.stoa.org/places/501634</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Θέογνις από τα Μέγαρα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Θεόγνις, ένας ποιητής από τα Μέγαρα, έγραψε μια συλλογή 1400 ελεγειακών στίχων που χαρακτηρίζονται από συντηρητικά ιδεώδη και ηθικούς προβληματισμούς, ασκώντας κριτική στη δημοκρατία και υιοθετώντας τις αριστοκρατικές αξίες.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> THEOGNIS Eleg. {0002} (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0002&amp;wid=&amp;q=THEOGNIS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=7&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 187).</div>    <div class="textItalicSmallMargin"><b>3)</b> Κακριδής, Φάνης. (2012). Γνωμική Ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_028.html</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.1388</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Theognis Megarensis</div>    <div class="textMediumMarginBlue">- en: Theognis Elegiacus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: theognis_megarensis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Mitteilungen des Deutschen Archäologischen Instituts, Athenische Abteilung - A kylix from Tanagra, Boeotia, 5th century B.C. A symposiast sings ὦ παίδων κάλλιστε, the beginning of a verse by Theognis https://archive.org/stream/mitteilungen09deut#page/392/mode/2up, Public Domain, https://commons.wikimedia.org/w/index.php?curid=7774895</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/7/7f/Tanagra%2C_5th_century_kylix_a_symposiast_sings_Theognis_o_paidon_kalliste.png" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;The Elegiac Poems of Theognis, Book I, 237-254 trans. Edmonds: I have given thee wings to fly with ease aloft the boundless sea and all the land. No meal or feast but thou&apos;&apos;&apos;&apos;lt be there, couched &apos;&apos;&apos;&apos;twixt the lips of many a guest, and lovely youths shall sing thee clear and well in orderly wise to the clear-voiced flute. And when thou comest to go down to the lamentable house of Hades in the depths of the gloomy earth, never, albeit thou be dead, shalt thou lose thy fame, but men will think of thee as one of immortal name, Cyrnus, who rangeth the land of Greece and the isles thereof —crossing the fishy unharvestable deep not upon horseback mounted but sped of the glorious gifts of the violet-crownad Muses unto all that care to receive thee; and living as they thou shalt be a song unto posterity so long as Earth and Sun abide. Yet as for me, thou hast no respect for me, great or small, but deceivest me with words as if I were a little child. (Edmonds, J. M. (1931). The Elegiac Poems of Theognis: Book I in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D11%3Asection%3D2#note1:~:text=assuredly%20be%20taken.-,237%2D254,-I%20have%20given)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0002&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Θέογνις, Ελεγίαι 237-254 μετ. Μ. Ζ. Κοπιδάκης: Κύρνε, σου χάρισα φτερά ανάλαφρα να σε σηκώσουν πάνω από την απέραντη θάλασσα και ολάκερη την οικουμένη. Παντού σε όλα τα συμπόσια και τις γιορτές θα βρίσκεσαι και συ, όλοι τους θα ᾽χουνε για σε να λένε. Παίζοντας μικρούς γλυκόλαλους αυλούς άντρες ερωτικοί θα τραγουδούν για σένα ωραία και τρυφερά τραγούδια. Κι όταν στα σπλάχνα της μαύρης γης θα κατεβείς, όταν θα φτάσεις στο πολυστέναχτο παλάτι του Άδη, ούτε και τότε, αν και νεκρός, θα ξεχαστείς. Όλοι θα σε θυμούνται, αθάνατο θα ᾽ναι στους ανθρώπους το όνομά σου. Κύρνε, στη γη της Ελλάδας θα τριγυρνάς και στα νησιά, πάνω από την άκαρπη θάλασσα, όπου ζουν τα ψάρια, θα περνοδιαβαίνεις. Δεν θα ᾽σαι σε άλογα καβάλα, τα λαμπρά δώρα των Μουσών, που έχουν στεφάνια από μενεξέδες στα μαλλιά, αυτά θα σε ταξιδεύουν. Θα ᾽σαι στη συντροφιά όσων και τώρα και στους αιώνες που ᾽ρχονται αγαπούνε το τραγούδι -ώσπου θα στέκει η γη και ο ήλιος θα φωτίζει. Μα ούτε τόσο δα δεν με προσέχεις, και σαν μικρό παιδί με υποσχέσεις ανεκπλήρωτες με ξεγελάς. (Στεφανόπουλου, Θ. Κ., Τσιτσιρίδη, Στ., Αντζουλή, Λ., &amp; Κριτσέλη, Γ. (χ.χ.). ΘΕΟΓΝΙΣ: 30. – «Ἐλεγεῖαι» 237-254. Ανθολογία Αρχαίας Ελληνικής Γραμματείας. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/literature/browse.html?text_id=50)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Γνωμικές ελεγείες του Θέογνη</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Μέγαρα</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commo s.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D11%3Asection%3D1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D11%3Asection%3D1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D11%3Asection%3D2" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D11%3Asection%3D2</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Θρήνοι του Ανακρέοντα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">θρήνος</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Ανακρέων είχε συνθέσει και θρήνους.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 189).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Threnoi of Anacreon Teius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: threnoi_anacreon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to dead&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Ανακρέων ο Λυρικός</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Θρήνοι του Πινδάρου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">θρήνος</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Πίνδαρος είναι γνωστός και για τις θρηνητικές του συνθέσεις.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 192-194).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Threnoi of Pindarus Boeotus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: threnoi_pindarus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to dead&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Πίνδαρος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Θρήνοι του Σιμωνίδη από την Κέα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">θρήνος</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Σιμωνίδης είναι γνωστός και για τις θρηνητικές του συνθέσεις.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 191).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Threnoi of Simonides Ceus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: threnoi_simonides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to dead&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Σιμωνίδης από την Κέα</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ίαμβοι του Ανακρέοντα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ίαμβος</font></div>    <div class="textMediumMargin"><b>Comment</b>: Οι Αλεξανδρινοί φιλόλογοι συγκέντρωσαν τους ιάμβους του Ανακρέοντα  σε ένα βιβλίο.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 189).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Iambs of Anacreon Teius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: iambs_anacreon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in iambic or trochaic metre&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Ανακρέων ο Λυρικός</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ίαμβοι του Ανάνιου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ίαμβος</font></div>    <div class="textMediumMargin"><b>Comment</b>: Έξι αποσπάσματα έχουν σωθεί, αποφεύγοντας τη δυσφήμιση και την απρέπεια, με απολαυστικούς ηθικούς προβληματισμούς, παιχνιδιάρικη μυθολογική σάτιρα και ένα γαστρονομικό ημερολόγιο - που αποτελεί την πρώτη περίπτωση γαστρονομικής ποίησης από τον πολιτιστικό χώρο της Ιωνίας.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Lesky, A. (2015). Ιστορία της Αρχαίας ελληνικής Γραμματολογίας (μετ.  Τσοπανάκης Α.). Θεσσαλονίκη: Κυριακίδης. σ. 185.</div>    <div class="textItalicSmallMargin"><b>2)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 185).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Iambs of Ananius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: iambs_ananius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in iambic or trochaic metre&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Ανάνιος ο Ιαμβογράφος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ίαμβοι του Αρχιλόχου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ίαμβος</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η φήμη του Αρχιλόχου ως του σημαντικότερου συγγραφέα ιαμβικής ποίησης εδραιώθηκε μέσω της αιχμηρής και αχαλίνωτης γλώσσας του, που εξέφραζε έντονα συναισθήματα και πολιτική κριτική, η οποία οδήγησε τόσο σε θαυμασμό όσο και σε κριτική, αναγνωριζόμενη κυρίως για την ισχυρή έκφραση και την έντονη σάτιρά του.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div>    <div class="textItalicSmallMargin"><b>2)</b> Smith, W. (n.d.). Archilochus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D37%3Aentry%3Darchilochus-bio-1</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Iambs of Archilochus Parius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: iambs_archilochus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in iambic or trochaic metre&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Αρχίλοχος ο Πάριος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ίαμβοι του Ιππώνακτα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ίαμβος</font></div>    <div class="textMediumMargin"><b>Comment</b>: Οι ιαμβικοί στίχοι του Ιππώνακτα πραγματεύονται ένα ευρύ φάσμα θεμάτων, συμπεριλαμβανομένης της αγαπημένης του Αρήτης, επικρίσεις των εχθρών του και κυρίως ζωντανές περιγραφές της φτώχειας του, συχνά με καυστικό ρεαλισμό και μια δόση χιούμορ.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Ίαμβοι. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_022.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Iambs of Hipponax Ephesius</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: iambs_hipponax</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in iambic or trochaic metre&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Ιππώναξ ο Εφέσιος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ίαμβοι του Σημωνίδη του Αμοργίνου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ίαμβος</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Σημωνίδης ήταν γνωστός για την ιαμβική ποίησή του, εστιάζοντας σε γνωστικούς και σατιρικούς στίχους που απεικόνιζαν διάφορες πτυχές του ανθρώπινου χαρακτήρα και της ζωής, ιδιαίτερα για τις ιδιότητες των γυναικών, όπου χρησιμοποιώντας εικόνες ζώων σε ένα ποίημα 118 στίχων απεικονίζει τα χαρακτηριστικά τους και καταλήγει στο συμπέρασμα ότι μόνο όσες μοιάζουν με μέλισσες είναι ωφέλιμες για τους άνδρες (Semonides, απ. 7 West).</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Ίαμβοι. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_022.html</div>    <div class="textItalicSmallMargin"><b>2)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 184-185).</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Simonides. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DS%3Aentry+group%3D19%3Aentry%3Dsimonides-bio-1#:~:text=%CE%A3%CE%B9%CE%BC%CF%89%CE%BD%CE%AF%CE%B4%CE%B7%CF%82)%2C%20literary.-,Simo%27nides,-1.%20Of%20Samos<br>3. </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Iambs of Semonides Amorginus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: iambs_semonides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in iambic or trochaic metre&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Σημωνίδης ο Αμοργίνος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ίβυκος ο Ρηγίνος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ακολούθησε το μοντέλο του Στησίχορου, συνθέτοντας αφηγηματικά μυθολογικά τραγούδια με τοπικές παραλλαγές. Σε ένα επτανησιακό περιβάλλον, τα έργα του πήραν έναν ερωτικό τόνο. Ένα σωζόμενο απόσπασμα κολακεύει τον οικοδεσπότη του και ταυτόχρονα εξυψώνει διακριτικά την τέχνη του, αντιμετωπίζοντας τον μύθο σε εγκωμιαστικό πλαίσιο, όπως φαίνεται στον πανηγυρικό του προς τον Πολυκράτη, μεταβαίνοντας από τον Τρωικό Πόλεμο στην ομορφιά της νιότης.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> IBYCUS Lyr. {0293}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0293&amp;wid=&amp;q=IBYCUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=5&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). 2.4.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 191).</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.760</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Ibycus Rheginus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: ibycus_rheginus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Heinrich Schwemminger - The Cranes of Ibycus, by Heinrich Schwemminger, illustrating Schiller&apos;s poem of that name<br>https://digital.belvedere.at/objects/2534/die-kraniche-des-ibykus, Public Domain, https://commons.wikimedia.org/w/index.php?curid=74330706</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/d/de/Heinrich_Schwemminger_-_Die_Kraniche_des_Ibykus_-_3739_-_Kunsthistorisches_Museum.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0293&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Χορική ποίηση του Ίβυκου του Ρηγίνου, Εγκωμιαστική ποίηση του Ιβύκου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Ρήγιο</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Σάμος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/d/de/Heinrich_Schwemminger_-_Die_Kraniche_des_Ibykus_-_3739_-_Kunsthistorisches_Museum.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/d/de/Heinrich_Schwemminger_-_Die_Kraniche_des_Ibykus_-_3739_-_Kunsthistorisches_Museum.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://web.archive.org/web/20120212233258/http://www.csad.ox.ac.uk/POXY/VExhibition/images/1790.jpg" target="_blank" rel="noopener">https://web.archive.org/web/20120212233258/http://www.csad.ox.ac.uk/POXY/VExhibition/images/1790.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Ibycus" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Ibycus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://quod.lib.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=ACL3129.0002.001;didno=ACL3129.0002.001;view=image;seq=00000567" target="_blank" rel="noopener">https://quod.lib.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=ACL3129.0002.001;didno=ACL3129.0002.001;view=image;seq=00000567</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.760" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.760</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0293.tlg001.opp-eng1" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0293.tlg001.opp-eng1</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ιμέρα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Αποικία στη βόρεια ακτή της Σικελίας, που ιδρύθηκε το 649/8 π.Χ.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> R.J.A. Wilson, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Valeria Vitale, Rosemary Selth, Jeffrey Becker, jpragghawes, Tom Elliott, R. Talbert, and R. Scott Smith, &apos;Himera: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/462244&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Himera</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: himera</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.9698366164,13.8223437955&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Στησίχορος από την Ιμέρα</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/place/33123" target="_blank" rel="noopener">https://www.trismegistos.org/place/33123</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q1111219" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q1111219</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Himera" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Himera</a></div>    <div class= "externalLinkIndivi
