    ['<div class="terminologyEntry">    <div class="term">Αθήνα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Μια σημαντική ελληνική πόλη-κράτος και η πρωτεύουσα της Αττικής, γνωστή σήμερα ως σύγχρονη Αθήνα στην Ελλάδα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> J.S. Traill, Brady Kiesling, Sean Gillies, Chelsea Lee, Jeffrey Becker, Rachaelle L Browning, DARMC, R. Talbert, Johan Åhlfeldt, Alec Mitchell, Adam Rabinowitz, Tom Elliott, Pierre Motylewicz, April Kissinger, Eric Shea, Ryan Horne, and Sterling Wright, &apos;Athenae: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/579885&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Athens</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: athens</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.9718132251,23.7235488821&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Ανακρέων ο Λυρικός, Σιμωνίδης από την Κέα, Πίνδαρος</div>    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Σόλων ο Αθηναίος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.geonames.org/264371/athens.html" target="_blank" rel="noopener">http://www.geonames.org/264371/athens.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/364" target="_blank" rel="noopener">http://www.trismegistos.org/place/364</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q1524" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q1524</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Athens" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Athens</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/380237PAth" target="_blank" rel="noopener">https://topostext.org/place/380237PAth</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/579885" target="_blank" rel="noopener">https://pleiades.stoa.org/places/579885</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Αίγυπτος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Αρχαία Αίγυπτος, η οποία ήκμασε από την 4η χιλιετία π.Χ. έως τον 7ο αιώνα μ.Χ., φημίζεται για την εντυπωσιακή τέχνη και τη μνημειώδη αρχιτεκτονική της. Ξεκινώντας από τις προϊστορικές της καταβολές η ιστορία της συνεχίζει να συναρπάζει μέσα από τις συνεχείς αρχαιολογικές ανακαλύψεις.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Samuel, A. Edouard , Bowman, Alan K., Dorman, Peter F., Baines, John R. and Wente, Edward F. (2024, April 15). ancient Egypt. Encyclopedia Britannica. https://www.britannica.com/place/ancient-Egypt</div>    <div class="textItalicSmallMargin"><b>2)</b> J.J. Wilkes, S.T. Parker, R.S. Bagnall, W.V. Harris, A.S. Esmonde-Cleary, C.M. Wells, J.F. Drinkwater, R.C. Knapp, S. Mitchell, Brian Z. Lund, Sean Gillies, M. Joann McDaniel, Jeffrey Becker, R. Talbert, Mary E. Downs, Jamie Novotny, and Tom Elliott, &apos;Ancient Egypt (region): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/981503&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Aegypt</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: aegypt</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;16.1010829332,31.4591482445&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Αλκαίος ο Λέσβιος</div></div>    <div class="objectEntry">    <div clas     ['<div class="terminologyEntry">    <div class="term">Ακράγας</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Ακράγας ήταν η αρχαία πόλη της Σικελίας που σήμερα ονομάζεται Αγκριτζέντο. Ο αρχαιολογικός χώρος του Αγκριτζέντο χαρακτηρίστηκε ως μνημείο παγκόσμιας πολιτιστικής κληρονομιάς της UNESCO το 1997.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> R.J.A. Wilson, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Valeria Vitale, Jeffrey Becker, Tom Elliott, DARMC, Jonathan Prag, R. Talbert, and Ingrid Luo, &apos;Akragas/Agrigentum: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/462086&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Akragas</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: akragas</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.290594,13.585475&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Πίνδαρος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/22270" target="_blank" rel="noopener">http://www.trismegistos.org/place/22270</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q13678" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q13678</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.geonames.org/2525764/agrigento.html" target="_blank" rel="noopener">http://www.geonames.org/2525764/agrigento.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Agrigento" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Agrigento</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/373136PAkr" target="_blank" rel="noopener">https://topostext.org/place/373136PAkr</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/462086" target="_blank" rel="noopener">https://pleiades.stoa.org/places/462086</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Αλκαίος ο Λέσβιος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Αλκαίος ο Λυρικός, Αλκαίος ο Μυτιληναίος, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Alcaeus Lesbius</div>    <div class="textMediumMarginBlue">- en: Alcaeus Lyricus</div>    <div class="textMediumMarginBlue">- en: Alcaeus Mytilenaeus</div>    <div class="textMediumMarginBlue">- en: Alcaeus Mytilenensis</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: alcaeus_lesbius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Brygos Painter - Alcaeus and Sappho, Attic red-figure calathus, c. 470 BC, Staatliche Antikensammlungen (Inv. 2416). User:Bibi Saint-Pol, own work, 2007-02-10, Public Domain, https://commons.wikimedia.org/w/index.php?curid=2751067</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Alkaios_Sappho_Staatliche_Antikensammlungen_2416_n1.jpg/440px-Alkaios_Sappho_Staatliche_Antikensammlungen_2416_n1.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Tr. J. Henderson, Alcaeus fr. Lobel-Page 335 (Sympotic): We should not surrender our hearts to our troubles, for we shall make no headway by grieving, Bycchis: the best of remedies is to bring wine and get drunk. (Henderson, J. (n.d.). Alcaeus. Loeb Classical Library. Retrieved 4 May 2024, from https://www.loebclassics.com/view/alcaeus-fragments/1982/pb_LCL142.373.xml)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0383&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Αλκαίος, απ. Lobel-Page 335, μετ. Ηλ. Βουτιερίδης: Δεν πρέπει την ψυχή ν᾽ αφήνουμε στις λύπες· | γιατί κι αν λυπηθούμε δε θα ωφεληθούμε | τίποτα, ω Βάκχε. Σαν το πιο καλό θεράπιο | δίνοντας στην ψυχή μας το κρασί, ας μεθούμε. (Τσέλικας, Σ. (επ.). ΑΛΚΑΙΟΣ: απ. 335 Lobel-Page. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=252)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Ύμνοι του Αλκαίου, Ερωτικές ωδές του Αλκαίου, Συμποτικές ωδές του Αλκαίου, Πολεμικές ωδές του Αλκαίου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6ος αιώνας π.Χ., 7ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Λέσβος</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Αίγυπτος, Λέσβος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Alkaios_Sappho_Staatliche_Antikensammlungen_2416_n1.jpg/440px-Alkaios_Sappho_Staatliche_Antikensammlungen_2416_n1.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Alkaios_Sappho_Staatliche_Antikensammlungen_2416_n1.jpg/440px-Alkaios_Sappho_Staatliche_Antikensammlungen_2416_n1.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0383.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0383.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.attalus.org/names/a/alcaeus.html" target="_blank" rel="noopener">https://www.attalus.org/names/a/alcaeus.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.oxfordreference.com/display/10.1093/oi/authority.20110803095400481" target="_blank" rel="noopener">https://www.oxfordreference.com/display/10.1093/oi/authority.20110803095400481</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://chs.harvard.edu/curated-article/gregory-nagy-did-sappho-and-alcaeus-ever-meet-symmetries-of-myth-and-ritual-in-performing-the-songs-of-ancient-lesbos/" target="_blank" rel="noopener">https://chs.harvard.edu/curated-article/gregory-nagy-did-sappho-and-alcaeus-ever-meet-symmetries-of-myth-and-ritual-in-performing-the-songs-of-ancient-lesbos/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://repository.kallipos.gr/handle/11419/8620" target="_blank" rel="noopener">https://repository.kallipos.gr/handle/11419/8620</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/biography/Alcaeus" target="_blank" rel="noopener">https://www.britannica.com/biography/Alcaeus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Alcaeus" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Alcaeus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.51" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.51</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Αλκαίος ο Λυρικός</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Αλκαίος ο Λέσβιος, Αλκαίος ο Μυτιληναίος, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Αλκαίος, ένας αρχαϊκός λυρικός ποιητής από τη Λέσβο (Αιολία), ήταν μια σημαντική προσωπικότητα για την ανάπτυξη των Ωδών, μαζί με τη Σαπφώ, καταθέτοντας ένα σημαντικό έργο που περιλάμβανε ύμνους και ερωτική ποίηση, με ιδιαίτερα αξιοσημείωτα τα συμποτικά του τραγούδια. Η επιρροή του στη λυρική ποίηση παραμένει βαθιά, αν και έχουν διασωθεί μόνο λίγα ολοκληρωμένα τραγούδια και αρκετά αποσπάσματα, κυρίως σε παπυρικά θραύσματα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> ALCAEUS Lyr. {0383}. (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0383&amp;wid=&amp;q=ALCAEUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=2&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (1873). Alcaeus of MYTILENE. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:alphabetic%20letter=A:entry%20group=13:entry=alcaeus-bio-6&amp;toc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D34</div>    <div class="textItalicSmallMargin"><b>4)</b> Britannica, T. Editors of Encyclopaedia (2024, February 14). Alcaeus. Encyclopedia Britannica. https://www.britannica.com/biography/Alcaeus</div>    <div class="textItalicSmallMargin"><b>5)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.51</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Alcaeus Lesbius</div>    <div class="textMediumMarginBlue">- en: Alcaeus Lyricus</div>    <div class="textMediumMarginBlue">- en: Alcaeus Mytilenaeus</div>    <div class="textMediumMarginBlue">- en: Alcaeus Mytilenensis</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: alcaeus_lesbius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Brygos Painter - Alcaeus and Sappho, Attic red-figure calathus, c. 470 BC, Staatliche Antikensammlungen (Inv. 2416). User:Bibi Saint-Pol, own work, 2007-02-10, Public Domain, https://commons.wikimedia.org/w/index.php?curid=2751067</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Alkaios_Sappho_Staatliche_Antikensammlungen_2416_n1.jpg/440px-Alkaios_Sappho_Staatliche_Antikensammlungen_2416_n1.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Tr. J. Henderson, Alcaeus fr. Lobel-Page 335 (Sympotic): We should not surrender our hearts to our troubles, for we shall make no headway by grieving, Bycchis: the best of remedies is to bring wine and get drunk. (Henderson, J. (n.d.). Alcaeus. Loeb Classical Library. Retrieved 4 May 2024, from https://www.loebclassics.com/view/alcaeus-fragments/1982/pb_LCL142.373.xml)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0383&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Αλκαίος, απ. Lobel-Page 335, μετ. Ηλ. Βουτιερίδης: Δεν πρέπει την ψυχή ν᾽ αφήνουμε στις λύπες· | γιατί κι αν λυπηθούμε δε θα ωφεληθούμε | τίποτα, ω Βάκχε. Σαν το πιο καλό θεράπιο | δίνοντας στην ψυχή μας το κρασί, ας μεθούμε. (Τσέλικας, Σ. (επ.). ΑΛΚΑΙΟΣ: απ. 335 Lobel-Page. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=252)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Ύμνοι του Αλκαίου, Ερωτικές ωδές του Αλκαίου, Συμποτικές ωδές του Αλκαίου, Πολεμικές ωδές του Αλκαίου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6ος αιώνας π.Χ., 7ος αιώνας π.Χ.</div>    <div class="attributeIndividual"> <u>bornIn</u>: Λέσβος</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Αίγυπτος, Λέσβος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Alkaios_Sappho_Staatliche_Antikensammlungen_2416_n1.jpg/440px-Alkaios_Sappho_Staatliche_Antikensammlungen_2416_n1.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Alkaios_Sappho_Staatliche_Antikensammlungen_2416_n1.jpg/440px-Alkaios_Sappho_Staatliche_Antikensammlungen_2416_n1.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0383.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0383.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.attalus.org/names/a/alcaeus.html" target="_blank" rel="noopener">https://www.attalus.org/names/a/alcaeus.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.oxfordreference.com/display/10.1093/oi/authority.20110803095400481" target="_blank" rel="noopener">https://www.oxfordreference.com     ['<div class="terminologyEntry">    <div class="term">Αλκμάν</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Αλκμάνας ο Λακεδαιμόνιος, Αλκμάνας ο Λυρικός, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Αλκμάν, γεννημένος στις Σάρδεις της Λυδίας, ήταν γνωστός για τα έργα του στη Σπάρτη. Μεταξύ των σωζόμενων αποσπασμάτων του είναι ένα Παρθένειο για έναν χορό δέκα κοριτσιών σε μια γιορτή θεάς. Αφηγείται έναν τοπικό μύθο και τονίζει τη θεϊκή τιμωρία, στη συνέχεια επαινεί την ομορφιά και την ενδυμασία των κοριτσιών ξεχωριστά, προσφέροντας μια ματιά στη ζωή τους στην αρχαία Σπάρτη.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> ALCMAN Lyr. {0291}. (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0291&amp;wid=&amp;q=ALCMAN&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=4&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 189-190).</div>    <div class="textItalicSmallMargin"><b>4)</b> Smith, W. (n.d.). Alcman. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D14%3Aentry%3Dalcman-bio-1</div>    <div class="textItalicSmallMargin"><b>5)</b> https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0291.tlg001.opp-eng1</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Alcman Lacedaemonius</div>    <div class="textMediumMarginBlue">- en: Alcman Lyricus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: alcman_lacedaemonius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By ellenm1 - Roman-period mosaic portrait of Alcman from Gerasa, 3rd century AD. Flickr: Mosaic Portrait of the Poet Alkman, CC BY 2.0, https://commons.wikimedia.org/w/index.php?curid=140276390</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/9/9e/Mosaic_Portrait_of_the_Poet_Alcman_%28cropped%29.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Alcman, fr. 14 transl. Cambell: Come, Muse, clear-voiced Muse of many songs, singer always, begin a new song for girls to sing. (Campbell, D. (n.d.). Alcman Fr. 14. In Greek Lyric, Volume II. Harvard University Press. Retrieved 4 May 2024, from https://www.loebclassics.com/view/alcman-fragments/1988/pb_LCL143.407.xml)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0291&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Αλκμάν, απ. 14a Page μετ. Ι.Ν. Καζάζης: Έλα, Μούσα, γλυκόλαλη Μούσα μου, με τα πλούσια, μελωδικά τραγούδια σου για κάθε περίσταση, κι άρχισε έναν καινούριο σκοπό να τραγουδήσουν τα κορίτσια. (Τσέλικας, Σ. (επ.). ΑΛΚΜΑΝ: απ. 14a Page. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=143)&apos;</div></div>    <div class="obje     ['<div class="terminologyEntry">    <div class="term">Ανακρέων ο Τήιος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Ανακρέων ο Λυρικός, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Ανακρέων, γεννημένος στην Τέω της Μικράς Ασίας, μετανάστευσε στα Άβδηρα της Θράκης κατά τη διάρκεια της περσικής εισβολής. Γνωστός για τις ωδές και τους ιαμβούς του, εξυμνούσε θέματα αγάπης και κρασιού, ενώ ενσωμάτωσε επίσης ύμνους, θρήνους και σατιρικά τραγούδια στα έργα του που γράφτηκαν στην ιωνική διάλεκτο.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> ANACREON Lyr. {0237}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0237&amp;wid=&amp;q=ANACREON&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=3&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). 2.4.Β.ii.β. Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 189).</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.84</div>    <div class="textItalicSmallMargin"><b>5)</b> https://lsj.gr/wiki/Anacreon</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Anacreon Teius</div>    <div class="textMediumMarginBlue">- en: Anacreon Lyricus</div></div><div class="objectEntry">     ['<div class="terminologyEntry">    <div class="term">Ανάνιος ο Ιαμβογράφος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Ανάνιος ο Λυρικός, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Ananius Iambographus</div>    <div class="textMediumMarginBlue">- en: Ananios Iambograph</div>    <div class="textMediumMarginBlue">- en: Ananius Lyricus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: ananius_iambographus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0238&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Ίαμβοι του Ανάνιου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6ος αιώνας π.Χ.</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://quod.lib.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=ACL3129.0001.001;didno=ACL3129.0001.001;view=image;seq=00000173" target="_blank" rel="noopener">https://quod.lib.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=ACL3129.0001.001;didno=ACL3129.0001.001;view=image;seq=00000173</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0238.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0238.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text.jsp?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D21%3Aentry%3Dananius-bio-1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text.jsp?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D21%3Aentry%3Dananius-bio-1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q3615044" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q3615044</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.85" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.85</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Ananius" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Ananius</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ανάνιος ο Λυρικός</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Ανάνιος ο Ιαμβογράφος, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Ανάνιος έγραψε ποίηση, από την οποία σώζονται έξι αποσπάσματα. Αυτά κρατούν απόσταση από τη συκοφαντία και την απρέπεια, προσφέροντας γοητευτικές ηθικές γνώσεις, παιχνιδιάρικη μυθολογική σάτιρα και ένα γαστρονομικό ημερολόγιο - σηματοδοτώντας το πρωιμότερο παράδειγμα γαστρονομικής ποίησης από τον πολιτιστικό χώρο της Ιωνίας.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Lesky, A. (2015). Ιστορία της Αρχαίας ελληνικής Γραμματολογίας (μετ.  Τσοπανάκης Α.). Θεσσαλονίκη: Κυριακίδης. σ. 185.</div>    <div class="textItalicSmallMargin"><b>2)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 185).</div>    <div class="textItalicSmallMargin"><b>3)</b> ANANIUS Iamb. {0238}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0238&amp;wid=&amp;q=ANANIUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=4&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.85</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Ananius Iambographus</div>    <div class="textMediumMarginBlue">- en: Ananios Iambograph</div>    <div class="textMediumMarginBlue">- en: Ananius Lyricus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: ananius_iambographus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0238&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Ίαμβοι του Ανάνιου</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6ος αιώνας π.Χ.</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://quod.lib.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=ACL3129.0001.001;didno=ACL3129.0001.001;view=image;seq=00000173" target="_blank" rel="noopener">https://quod.lib.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=ACL3129.0001.001;didno=ACL3129.0001.001;view=image;seq=00000173</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0238.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0238.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text.jsp?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D21%3Aentry%3Dananius-bio-1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text.jsp?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D21%3Aentry%3Dananius-bio-1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q3615044" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q3615044</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.85" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.85</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Ananius" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Ananius</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Αρχίλοχος ο Πάριος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Αρχίλοχος, γεννημένος στην Πάρο τον 7ο αιώνα π.Χ., συνέθεσε μια γλαφυρή ποίηση που αντανακλούσε τις εμπειρίες της ζωής του, συμπεριλαμβανομένων των αποτυχημένων εγχειρημάτων του στη Θάσο και των θυελλωδών σχέσεων. Γνωστός για το άμεσο και επικριτικό του ύφος, απέφευγε τα παραδοσιακά ηρωικά θέματα, επιλέγοντας να απεικονίσει τη σύγχρονη πραγματικότητα με ωμή ειλικρίνεια. Έγραψε, ελεγείες, ύμνους, ιαμβούς, που του απέφεραν αναγνώριση παρόμοια με του Ομήρου, με σωζόμενα αποσπάσματα που σώζονται σε παπύρους.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> ARCHILOCHUS Eleg., Iamb. {0232}. (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0232&amp;wid=&amp;q=ARCHILOCHUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=2&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Ίαμβοι. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_022.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Archilochus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D37%3Aentry%3Darchilochus-bio-1</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.175</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Archilochus Parius</div>    <div class="textMediumMarginBlue">- en: Archilochus Lyricus</div>    <div class="textMediumMarginBlue">- en: Archilochus of Paros</div>    <div class="textMediumMarginBlue">- en: Archilochus Iamb. et Eleg.</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: archilochus_parius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By shakko - Own work, CC BY-SA 3.0, Bust of a bearded man (Archilochus?). Roman copy (c. 2nd century BC) of Greek original (4th century BC)https://commons.wikimedia.org/w/index.php?curid=7408002</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Archilochus_01_pushkin.jpg/800px-Archilochus_01_pushkin.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Elegiac Poems (Archilochus), CURFRAG.tlg-0232.6, translated by Edmonts: the shield I left because I must, poor blameless armament! beside a bush, gives joy now to some Saian, but myself I have saved. What care I for that shield? It shall go with a curse. I&apos;&apos;&apos;&apos;ll get me another e&apos;&apos;&apos;&apos;en as good. (Edmonds, J. M. (1931). Archilochus in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:2008.01.0480:volume=2:text=21:section=2&amp;highlight=shield#:~:text=e%27en%20as%20good.-,CURFRAG.tlg%2D0232.6,-%E2%80%9D%20Plutarch%20Spartan)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0232&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Αρχίλοχος, απ. 5 W     ['<div class="terminologyEntry">    <div class="term">Βακχυλίδης ο Λυρικός</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαϊκός λυρικός ποιητής</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Βακχυλίδης από την Κέα, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Βακχυλίδης, συγγενής του Πινδάρου, εξερεύνησε ποικίλες μορφές χορικής ποίησης, οι οποίες ταξίδεψαν ευρέως σε όλη την Ελλάδα. Οι επίνικοι και οι ύμνοι του που έχουν διασωθεί περιλαμβάνουν κατά κύριο λόγο μυθολογικές αφηγήσεις, αν και διαφοροποιήθηκε από τον Πίνδαρο ως προς τις υφολογικές αποχρώσεις και το θεματικό βάθος.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> BACCHYLIDES Lyr. {0199}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0199&amp;wid=&amp;q=BACCHYLIDES&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=10&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). 3.5.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_042.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 192).</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.254</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Bacchylides Ceus</div>    <div class="textMediumMarginBlue">- en: Bacchylides Lyricus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</     ['<div class="terminologyEntry">    <div class="term">Βοιωτία</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία τοποθεσία</font></div>    <div class="textMediumMargin"><b>Comment</b>: Μια περιοχή στην κεντρική Ελλάδα που κατοικείται από τους προϊστορικούς χρόνους.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> J. Fossey, J. Morin, Pierre Motylewicz, Brady Kiesling, Sean Gillies, Jeffrey Becker, Tom Elliott, Catherine Bouras, G. Reger, and R. Talbert, &apos;Boeotia: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/540689&gt; [accessed: 22 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Boeotia</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: boeotia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient Location&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.3168971672,23.1349191419&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Πίνδαρος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/place/446" target="_blank" rel="noopener">https://www.trismegistos.org/place/446</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/384233RBoi" target="_blank" rel="noopener">https://topostext.org/place/384233RBoi</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Boeotia" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Boeotia</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a
