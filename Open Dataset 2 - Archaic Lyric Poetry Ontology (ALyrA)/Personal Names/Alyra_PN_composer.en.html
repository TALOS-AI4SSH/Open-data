3D1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0480%3Avolume%3D2%3Atext%3D22" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0480%3Avolume%3D2%3Atext%3D22</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Solon Atheniensis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div>    <div class="textMediumMargin"><b>Comment</b>: Solon, an Athenian statesman, intervened in politics through his poetry, advocating for good governance over lawlessness, condemning leaders&apos; greed, and criticizing debt enslavement. He believed in divine justice, foresaw the concerns of tragedy, and enacted moderate reforms, improving legislation on loans and abolishing certain debts. His political elegies reflect these themes and his reformist agenda.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). 2.4.Β.iii.γ. Πολιτική ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_027.html</div>    <div class="textItalicSmallMargin"><b>2)</b> SOLON Nomograph., Poeta {0263}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0263&amp;wid=&amp;q=SOLON&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=12&amp;acp=1&amp;editid=</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Σόλων ο Αθηναίος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: solon_atheniensis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By M. A. Barth - "Solon demands to pledge respect for his laws", book illustration (Augsburg 1832). &apos;Vorzeit und Gegenwart", Augsbourg, 1832, Public Domain, https://commons.wikimedia.org/w/index.php?curid=74939386</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/f/f6/Solon_demands_to_pledge_respect_for_his_laws.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0263&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Political elegy of Solon Athenienis</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6th century BCE, 7th century BCE</div>    <div class="attributeIndividual"> <u>bornIn</u>: Athens</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/f/f6/Solon_demands_to_pledge_respect_for_his_laws.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/f/f6/Solon_demands_to_pledge_respect_for_his_laws.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0263.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0263.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0007.tlg007" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0007.tlg007</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0004%3Aalphabetic+letter%3DS%3Aentry+group%3D6%3Aentry%3Dsolon" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0004%3Aalphabetic+letter%3DS%3Aentry+group%3D6%3Aentry%3Dsolon</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D5%3Asection%3D2" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D5%3Asection%3D2</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Stesichorus Himeraeus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div>    <div class="textMediumMargin"><b>Comment</b>: Stesichorus, recognized as a leading figure in lyric poetry, revolutionized choral verse by introducing novel elements like the epode and intricate strophe designs. His compositions, predominantly focused on mythological themes like "Helen" and "Palinode," underscored his profound impact on the development of ancient Greek literary forms.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> STESICHORUS Lyr. {0292} (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0292&amp;wid=&amp;q=STESICHORUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=5&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Stesi&apos;chorus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DT%3Aentry+group%3D26%3Aentry%3Dtyrtaeus-bio-1</div>    <div class="textItalicSmallMargin"><b>4)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 190).</div>    <div class="textItalicSmallMargin"><b>5)</b> https://catalog.perseus.tufts.edu/catalog/urn:cts:greekLit:tlg0292.tlg001.opp-grc3</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Στησίχορος από την Ιμέρα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: stesichorus_himeraeus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: Από Pirizz at Ιταλικά Βικιπαίδεια - Stesichorus - Bellini Garden, Catania, Italy - September 2010. Transferred from it.wikipedia to Commons by OrbiliusMagister., Κοινό Κτήμα, https://commons.wikimedia.org/w/index.php?curid=12861189</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e5/Stesichorus.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Stesichorus, fr. 192 tr. Campbell: That story is not true, and you did not go on the well-benched ships and you did not reach the citadel of Troy; (Campbell, D. A. (n.d.). Stesichorus, ΕΛΕΝΑ: ΠΑΛΙΝΩΙΔΙΑΙ. Loeb Classical Library. Retrieved 5 May 2024, from https://www.loebclassics.com/view/stesichorus_i-fragments/1991/pb_LCL476.93.xml)&apos;&apos; tlgIdentifyingNumber: &apos;&apos;tlg0292&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0292&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Στησίχορος, απ. 192 Page μετ. Ι.Ν. Καζάζης: Δεν αληθεύει αυτή η ιστορία· ούτε σε καράβια καλοσκάμνιστα μπήκες εσύ ποτέ, ούτε έφτασες στης Τροίας την ακρόπολη. (Τσέλικας, Σ. (επ.). ΣΤΗΣΙΧΟΡΟΣ: απ. 192 Page. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=199)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Choral songs of Stesichorus Himeraeus</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6th century BCE, 7th century BCE</div>    <div class="attributeIndividual"> <u>bornIn</u>: Himera</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/e/e5/Stesichorus.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/e/e5/Stesichorus.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/people/695" target="_blank" rel="noopener">https://topostext.org/people/695</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics-at.chs.harvard.edu/classics6-evanthia-tsitsibakou-vasalos-stesichorus-%E1%BC%B0%CE%BB%CE%B9%CE%BF%CF%85-%CF%80%CE%B5%CF%81%CF%83%CE%B9%CF%82-and-the-epic-tradition/" target="_blank" rel="noopener">https://classics-at.chs.harvard.edu/classics6-evanthia-tsitsibakou-vasalos-stesichorus-%E1%BC%B0%CE%BB%CE%B9%CE%BF%CF%85-%CF%80%CE%B5%CF%81%CF%83%CE%B9%CF%82-and-the-epic-tradition/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/biography/Stesichorus" target="_blank" rel="noopener">https://www.britannica.com/biography/Stesichorus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Stesichorus" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Stesichorus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/stesichorus_i-fragments/1991/pb_LCL476.61.xml?readMode=recto" target="_blank" rel="noopener">https://www.loebclassics.com/view/stesichorus_i-fragments/1991/pb_LCL476.61.xml?readMode=recto</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.tufts.edu/catalog/urn:cite:perseus:author.1328" target="_blank" rel="noopener">https://catalog.perseus.tufts.edu/catalog/urn:cite:perseus:author.1328</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.tufts.edu/catalog/urn:cts:greekLit:tlg0292.tlg001.opp-grc3" target="_blank" rel="noopener">https://catalog.perseus.tufts.edu/catalog/urn:cts:greekLit:tlg0292.tlg001.opp-grc3</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=PersEnc+S.stesichorus" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=PersEnc+S.stesichorus</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Terpander Lesbius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Terpandros, Terpandrus, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Terpander, renowned for his musical innovations, was honored in Sparta during the festival of Apollo around 674 BCE. He introduced significant innovations such as replacing the four-stringed Doric lyre with the seven-stringed Lydian-Lesbian lyre and inventing the scolia.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 189).</div>    <div class="textItalicSmallMargin"><b>2)</b> Smith, W. (n.d.). Terpander. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DT%3Aentry+group%3D5%3Aentry%3Dterpander-bio-1</div>    <div class="textItalicSmallMargin"><b>3)</b>  Κακριδής, Φάνης. (2012). Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.1364</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Τέρπανδρος ο Λέσβιος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: terpander_lesbius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0299&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Hymns of Terpander Lesbius</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 7th century BCE</div>    <div class="attributeIndividual"> <u>bornIn</u>: Lesbos</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://quod.lib.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=ACL3129.0003.001;didno=ACL3129.0003.001;view=image;seq=00001010" target="_blank" rel="noopener">https://quod.lib.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=ACL3129.0003.001;didno=ACL3129.0003.001;view=image;seq=00001010</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0299.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0299.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.1364" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.1364</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://chs.harvard.edu/chapter/iii-inventions-of-terpander/" target="_blank" rel="noopener">https://chs.harvard.edu/chapter/iii-inventions-of-terpander/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:entry=terpander-bio-1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:entry=terpander-bio-1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Terpander" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Terpander</a /a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://chs.harvard.edu/chapter/iii-inventions-of-terpander/" target="_blank" rel="noopener">https://chs.harvard.edu/chapter/iii-inventions-of-terpander/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:entry=terpander-bio-1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:entry=terpander-bio-1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Terpander" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Terpander</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Theognis Elegiacus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Theognis Megarensis, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Θέογνις από τα Μέγαρα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: theognis_megarensis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Mitteilungen des Deutschen Archäologischen Instituts, Athenische Abteilung - A kylix from Tanagra, Boeotia, 5th century B.C. A symposiast sings ὦ παίδων κάλλιστε, the beginning of a verse by Theognis https://archive.org/stream/mitteilungen09deut#page/392/mode/2up, Public Domain, https://commons.wikimedia.org/w/index.php?curid=7774895</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/7/7f/Tanagra%2C_5th_century_kylix_a_symposiast_sings_Theognis_o_paidon_kalliste.png" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;The Elegiac Poems of Theognis, Book I, 237-254 trans. Edmonds: I have given thee wings to fly with ease aloft the boundless sea and all the land. No meal or feast but thou&apos;&apos;&apos;&apos;lt be there, couched &apos;&apos;&apos;&apos;twixt the lips of many a guest, and lovely youths shall sing thee clear and well in orderly wise to the clear-voiced flute. And when thou comest to go down to the lamentable house of Hades in the depths of the gloomy earth, never, albeit thou be dead, shalt thou lose thy fame, but men will think of thee as one of immortal name, Cyrnus, who rangeth the land of Greece and the isles thereof —crossing the fishy unharvestable deep not upon horseback mounted but sped of the glorious gifts of the violet-crownad Muses unto all that care to receive thee; and living as they thou shalt be a song unto posterity so long as Earth and Sun abide. Yet as for me, thou hast no respect for me, great or small, but deceivest me with words as if I were a little child. (Edmonds, J. M. (1931). The Elegiac Poems of Theognis: Book I in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D11%3Asection%3D2#note1:~:text=assuredly%20be%20taken.-,237%2D254,-I%20have%20given)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0002&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Θέογνις, Ελεγίαι 237-254 μετ. Μ. Ζ. Κοπιδάκης: Κύρνε, σου χάρισα φτερά ανάλαφρα να σε σηκώσουν πάνω από την απέραντη θάλασσα και ολάκερη την οικουμένη. Παντού σε όλα τα συμπόσια και τις γιορτές θα βρίσκεσαι και συ, όλοι τους θα ᾽χουνε για σε να λένε. Παίζοντας μικρούς γλυκόλαλους αυλούς άντρες ερωτικοί θα τραγουδούν για σένα ωραία και τρυφερά τραγούδια. Κι όταν στα σπλάχνα της μαύρης γης θα κατεβείς, όταν θα φτάσεις στο πολυστέναχτο παλάτι του Άδη, ούτε και τότε, αν και νεκρός, θα ξεχαστείς. Όλοι θα σε θυμούνται, αθάνατο θα ᾽ναι στους ανθρώπους το όνομά σου. Κύρνε, στη γη της Ελλάδας θα τριγυρνάς και στα νησιά, πάνω από την άκαρπη θάλασσα, όπου ζουν τα ψάρια, θα περνοδιαβαίνεις. Δεν θα ᾽σαι σε άλογα καβάλα, τα λαμπρά δώρα των Μουσών, που έχουν στεφάνια από μενεξέδες στα μαλλιά, αυτά θα σε ταξιδεύουν. Θα ᾽σαι στη συντροφιά όσων και τώρα και στους αιώνες που ᾽ρχονται αγαπούνε το τραγούδι -ώσπου θα στέκει η γη και ο ήλιος θα φωτίζει. Μα ούτε τόσο δα δεν με προσέχεις, και σαν μικρό παιδί με υποσχέσεις ανεκπλήρωτες με ξεγελάς. (Στεφανόπουλου, Θ. Κ., Τσιτσιρίδη, Στ., Αντζουλή, Λ., &amp; Κριτσέλη, Γ. (χ.χ.). ΘΕΟΓΝΙΣ: 30. – «Ἐλεγεῖαι» 237-254. Ανθολογία Αρχαίας Ελληνικής Γραμματείας. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/literature/browse.html?text_id=50)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Gnomic elegies of Theognis Megarensis</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6th century BCE</div>    <div class="attributeIndividual"> <u>bornIn</u>: Megara</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/7/7f/Tanagra%2C_5th_century_kylix_a_symposiast_sings_Theognis_o_paidon_kalliste.png" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/7/7f/Tanagra%2C_5th_century_kylix_a_symposiast_sings_Theognis_o_paidon_kalliste.png</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q336115" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q336115</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Theognis_of_Megara" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Theognis_of_Megara</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DT%3Aentry+group%3D11%3Aentry%3Dtheognis-bio-1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DT%3Aentry+group%3D11%3Aentry%3Dtheognis-bio-1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/?f%5Btg_facet%5D%5B%5D=Theognis&amp;f%5Bwork_lang%5D%5B%5D=grc&amp;q=tg_no_token%3A%5BT+TO+U%5D&amp;sort=title_display+asc" target="_blank" rel="noopener">https://catalog.perseus.org/?f%5Btg_facet%5D%5B%5D=Theognis&amp;f%5Bwork_lang%5D%5B%5D=grc&amp;q=tg_no_token%3A%5BT+TO+U%5D&amp;sort=title_display+asc</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0002.tlg004" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0002.tlg004</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0002.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0002.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D11%3Asection%3D1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D11%3Asection%3D1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D11%3Asection%3D2" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D11%3Asection%3D2</a></div></div></div></div>'],

gen des Deutschen Archäologischen Instituts, Athenische Abteilung - A kylix from Tanagra, Boeotia, 5th century B.C. A symposiast sings ὦ παίδων κάλλιστε, the beginning of a verse by Theognis https://archive.org/stream/mitteilungen09deut#page/392/mode/2up, Public Domain, https://commons.wikimedia.org/w/index.php?curid=7774895</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/7/7f/Tanagra%2C_5th_century_kylix_a_symposiast_sings_Theognis_o_paidon_kalliste.png" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;The Elegiac Poems of Theognis, Book I, 237-254 trans. Edmonds: I have given thee wings to fly with ease aloft the boundless sea and all the land. No meal or feast but thou&apos;&apos;&apos;&apos;lt be there, couched &apos;&apos;&apos;&apos;twixt the lips of many a guest, and lovely youths shall sing thee clear and well in orderly wise to the clear-voiced flute. And when thou comest to go down to the lamentable house of Hades in the depths of the gloomy earth, never, albeit thou be dead, shalt thou lose thy fame, but men will think of thee as one of immortal name, Cyrnus, who rangeth the land of Greece and the isles thereof —crossing the fishy unharvestable deep not upon horseback mounted but sped of the glorious gifts of the violet-crownad Muses unto all that care to receive thee; and living as they thou shalt be a song unto posterity so long as Earth and Sun abide. Yet as for me, thou hast no respect for me, great or small, but deceivest me with words as if I were a little child. (Edmonds, J. M. (1931). The Elegiac Poems of Theognis: Book I in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D11%3Asection%3D2#note1:~:text=assuredly%20be%20taken.-,237%2D254,-I%20have%20given)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0002&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Θέογνις, Ελεγίαι 237-254 μετ. Μ. Ζ. Κοπιδάκης: Κύρνε, σου χάρισα φτερά ανάλαφρα να σε σηκώσουν πάνω από την απέραντη θάλασσα και ολάκερη την οικουμένη. Παντού σε όλα τα συμπόσια και τις γιορτές θα βρίσκεσαι και συ, όλοι τους θα ᾽χουνε για σε να λένε. Παίζοντας μικρούς γλυκόλαλους αυλούς άντρες ερωτικοί θα τραγουδούν για σένα ωραία και τρυφερά τραγούδια. Κι όταν στα σπλάχνα της μαύρης γης θα κατεβείς, όταν θα φτάσεις στο πολυστέναχτο παλάτι του Άδη, ούτε και τότε, αν και νεκρός, θα ξεχαστείς. Όλοι θα σε θυμούνται, αθάνατο θα ᾽ναι στους ανθρώπους το όνομά σου. Κύρνε, στη γη της Ελλάδας θα τριγυρνάς και στα νησιά, πάνω από την άκαρπη θάλασσα, όπου ζουν τα ψάρια, θα περνοδιαβαίνεις. Δεν θα ᾽σαι σε άλογα καβάλα, τα λαμπρά δώρα των Μουσών, που έχουν στεφάνια από μενεξέδες στα μαλλιά, αυτά θα σε ταξιδεύουν. Θα ᾽σαι στη συντροφιά όσων και τώρα και στους αιώνες που ᾽ρχονται αγαπούνε το τραγούδι -ώσπου θα στέκει η γη και ο ήλιος θα φωτίζει. Μα ούτε τόσο δα δεν με προσέχεις, και σαν μικρό παιδί με υποσχέσεις ανεκπλήρωτες με ξεγελάς. (Στεφανόπουλου, Θ. Κ., Τσιτσιρίδη, Στ., Αντζουλή, Λ., &amp; Κριτσέλη, Γ. (χ.χ.). ΘΕΟΓΝΙΣ: 30. – «Ἐλεγεῖαι» 237-254. Ανθολογία Αρχαίας Ελληνικής Γραμματείας. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/literature/browse.html?text_id=50)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Gnomic elegies of Theognis Megarensis</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6th century BCE</div>    <div class="attributeIndividual"> <u>bornIn</u>: Megara</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/7/7f/Tanagra%2C_5th_century_kylix_a_symposiast_sings_Theognis_o_paidon_kalliste.png" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/7/7f/Tanagra%2C_5th_century_kylix_a_symposiast_sings_Theognis_o_paidon_kalliste.png</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q336115" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q336115</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Theognis_of_Megara" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Theognis_of_Megara</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DT%3Aentry+group%3D11%3Aentry%3Dtheognis-bio-1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DT%3Aentry+group%3D11%3Aentry%3Dtheognis-bio-1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/?f%5Btg_facet%5D%5B%5D=Theognis&amp;f%5Bwork_lang%5D%5B%5D=grc&amp;q=tg_no_token%3A%5BT+TO+U%5D&amp;sort=title_display+asc" target="_blank" rel="noopener">https://catalog.perseus.org/?f%5Btg_facet%5D%5B%5D=Theognis&amp;f%5Bwork_lang%5D%5B%5D=grc&amp;q=tg_no_token%3A%5BT+TO+U%5D&amp;sort=title_display+asc</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0002.tlg004" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0002.tlg004</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0002.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0002.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D11%3Asection%3D1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D11%3Asection%3D1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D11%3Asection%3D2" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D11%3Asection%3D2</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Tyrtaeus Lacedaemonius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div>    <div class="textMediumMargin"><b>Comment</b>: Tyrtaeus, a poet from Sparta, composed war elegies during the second Messenian War. His writings exalted martial virtues and encouraged Spartan youths to prioritize courage and self-sacrifice for their homeland. His beliefs centered around the glory of warfare and the importance of valor in defending the state.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> TYRTAEUS Eleg. {0266} (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0266&amp;wid=&amp;q=TYRTAEUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=3&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Πολεμική Ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_025.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Tyrtaeus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DT%3Aentry+group%3D26%3Aentry%3Dtyrtaeus-bio-1</div>    <div class="textItalicSmallMargin"><b>4)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 186).</div>    <div class="textItalicSmallMargin"><b>5)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.1442</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Τυρταίος ο Λακεδαιμόνιος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: tyrtaeus_lacedaemonius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Gustave Moreau - Gustave Moreau, "Tyrtée"<br>https://dessins-musee-moreau.fr/outils/peintures_total.php, Public Domain, https://commons.wikimedia.org/w/index.php?curid=127502347</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/2/20/Moreau_-_Tyrt%C3%A9e%2C_cat.96.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;The Elegiac Poems of Tyrtaeus, CURFRAG.tlg-0266.2 translated by Edmonds: They heard the voice of Phoebus and brought home from Pytho oracles of the God and words of sure fulfilment; for thus the Lord of the Silver Bow, Far-Shooting Apollo of the Golden Hair, gave answer from out his rich sanctuary: The beginning of counsel shall belong to the God-honoured Kings whose care is the delightsome city of Sparta, and to the men of elder birth; after them shall the commons, answering them back with forthright ordinances, both say things honourable and do all that is right, nor give the city any crooked counsel; so shall the common people have victory and might; for this hath Phoebus declared unto their city in these matters. (Edmonds, J. M. (1931). The Elegiac Poems of Tyrtaeus in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D2%3Asection%3D2#:~:text=in%20these%20matters.-,CURFRAG.tlg%2D0266.2,-%E2%80%9D%20Plutarch%20Life)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0266&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Τυρταίος, απ. 4 West μετ. Κ. Τοπούζης: Τον Φοίβο οι απεσταλμένοι όταν άκουσαν, | στην πατρίδα τους έφεραν του θεού τη μαντεία | και τα θεία του λόγια. | «Τις αποφάσεις να παίρνουν οι θεοτίμητοι άρχοντες, | που έχουν την έγνοια της ολολάτρευτης Σπάρτης, | και οι γέροντες όσοι πρωτότοκοι ήταν. | Και μετά οι πολίτες, | με τους δίκαιους νόμους πράττοντας σύμφωνα, | τα σωστά ν᾽ αποδέχονται και να πράττουν τα δίκαια, | χωρίς τα ανάκατα να προτείνουν στην πόλη· | και το λαό η δύναμη ν᾽ ακολουθά και η νίκη». | Έτσι ο Φοίβος για την πόλη καθόρισε. (Τσέλικας, Σ. (επ.). ΤΥΡΤΑΙΟΣ: απ. 4 West. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=51)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: War elegies of Tyrtaeus Lacedaemonius</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 7th century BCE</div>    <div class="attributeIndividual"> <u>bornIn</u>: Sparta</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/2/20/Moreau_-_Tyrt%C3%A9e%2C_cat.96.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/2/20/Moreau_-_Tyrt%C3%A9e%2C_cat.96.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Tyrtaeus" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Tyrtaeus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://quod.lib.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=ACL3129.0003.001;didno=ACL3129.0003.001;view=image;seq=00001205" target="_blank" rel="noopener">https://quod.lib.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=ACL3129.0003.001;didno=ACL3129.0003.001;view=image;seq=00001205</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0266.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0266.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.oxfordreference.com/display/10.1093/acref/9780199545568.001.0001/acref-9780199545568-e-6628" target="_blank" rel="noopener">https://www.oxfordreference.com/display/10.1093/acref/9780199545568.001.0001/acref-9780199545568-e-6628</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://chs.harvard.edu/chapter/part-i-greece-11-tyrtaeus-the-lame-general/" target="_blank" rel="noopener">https://chs.harvard.edu/chapter/part-i-greece-11-tyrtaeus-the-lame-general/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/authorwork/6452" target="_blank" rel="noopener">https://www.trismegistos.org/authorwork/6452</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.1442" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.1442</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D2%3Asection%3D2" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D2%3Asection%3D2</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D2" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D2</a></div></div></div></div>'],

function show_selected() {
    var selector = document.getElementById('idTerm');
    var champ = dictionnaire[selector[selector.selectedIndex].value][0];
    document.getElementById('display').innerHTML = champ;
}
document.getElementById('idTerm').addEventListener('change', show_selected);

searchBox = document.querySelector("#searchBox");
entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});

</script>
