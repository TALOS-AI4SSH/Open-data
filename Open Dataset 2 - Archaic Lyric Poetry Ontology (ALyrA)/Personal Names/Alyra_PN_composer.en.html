    ['<div class="terminologyEntry">    <div class="term">Alcaeus Lesbius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Alcaeus Lyricus, Alcaeus Mytilenaeus, Alcaeus Mytilenensis, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Alcaeus, an archaic lyric poet from Lesbos (Aeolia), was an essential figure for the development of Odes, alongside Sappho, contributing a significant body of work including hymns and love poetry, with his sympotic songs being particularly notable. His influence on lyric poetry remains profound, though only a few complete songs and several fragments have survived, primarily in papyrus fragments.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> ALCAEUS Lyr. {0383}. (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0383&amp;wid=&amp;q=ALCAEUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=2&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (1873). Alcaeus of MYTILENE. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:alphabetic%20letter=A:entry%20group=13:entry=alcaeus-bio-6&amp;toc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D34</div>    <div class="textItalicSmallMargin"><b>4)</b> Britannica, T. Editors of Encyclopaedia (2024, February 14). Alcaeus. Encyclopedia Britannica. http     ['<div class="terminologyEntry">    <div class="term">Alcman Lacedaemonius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Alcman Lyricus, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Alcman, born in Sardis, Lydia, was known for his works in Sparta. Among his surviving fragments is a Partheneion for a chorus of ten girls at a goddess&apos;s festival. He recounts a local myth and highlights divine punishment, then praises the girls&apos; beauty and attire individually, offering a glimpse into their lives in ancient Sparta.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> ALCMAN Lyr. {0291}. (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0291&amp;wid=&amp;q=ALCMAN&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=4&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 189-190).</div>    <div class="textItalicSmallMargin"><b>4)</b> Smith, W. (n.d.). Alcman. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D14%3Aentry%3Dalcman-bio-1</div>    <div class="textItalicSmallMargin"><b>5)</b> https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0291.tlg001.opp-eng1</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Αλκμάν</div>    <div class="textMediumMarginBlue">- el: Αλκμάνας ο Λακεδαιμόνιος</div>    <div class="textMediumMarginBlue">- el: Αλκμάνας ο Λυρικός</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: alcman_lacedaemonius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By ellenm1 - Roman-period mosaic portrait of Alcman from Gerasa, 3rd century AD. Flickr: Mosaic Portrait of the Poet Alkman, CC BY 2.0, https://commons.wikimedia.org/w/index.php?curid=140276390</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/9/9e/Mosaic_Portrait_of_the_Poet_Alcman_%28cropped%29.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Alcman, fr. 14 transl. Cambell: Come, Muse, clear-voiced Muse of many songs, singer always, begin a new song for girls to sing. (Campbell, D. (n.d.). Alcman Fr. 14. In Greek Lyric, Volume II. Harvard University Press. Retrieved 4 May 2024, from https://www.loebclassics.com/view/alcman-fragments/1988/pb_LCL143.407.xml)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0291&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Αλκμάν, απ. 14a Page μετ. Ι.Ν. Καζάζης: Έλα, Μούσα, γλυκόλαλη Μούσα μου, με τα πλούσια, μελωδικά τραγούδια σου για κάθε περίσταση, κι άρχισε έναν καινούριο σκοπό να τραγουδήσουν τα κορίτσια. (Τσέλικας, Σ. (επ.). ΑΛΚΜΑΝ: απ. 14a Page. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=143)&apos;</div></div>    <div class="o     ['<div class="terminologyEntry">    <div class="term">Anacreon Teius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Anacreon Lyricus, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Anacreon, born in Teos, Asia Minor, migrated to Abdera, Thrace during the Persian invasion. Known for his odes and iambs, he celebrated themes of love and wine, while also incorporating hymns, laments, and satirical songs in his works written in the Ionic dialect.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> ANACREON Lyr. {0237}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0237&amp;wid=&amp;q=ANACREON&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=3&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). 2.4.Β.ii.β. Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 189).</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.84</div>    <div class="textItalicSmallMargin"><b>5)</b> https://lsj.gr/wiki/Anacreon</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ανακρέων ο Λυρικός</div>    <div class="textMediumMarginBlue">- el: Ανακρέων ο Τήιος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: anacr     ['<div class="terminologyEntry">    <div class="term">Ananius Iambographus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Ananios Iambograph, Ananius Lyricus, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Ananius penned poetry, yielding six preserved fragments. These steer clear of slander and indecency, offering charming moral insights, playful mythological satire, and a culinary journal — marking the earliest example of gastronomic poetry from the Ionian cultural realm.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Lesky, A. (2015). Ιστορία της Αρχαίας ελληνικής Γραμματολογίας (μετ.  Τσοπανάκης Α.). Θεσσαλονίκη: Κυριακίδης. σ. 185.</div>    <div class="textItalicSmallMargin"><b>2)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 185).</div>    <div class="textItalicSmallMargin"><b>3)</b> ANANIUS Iamb. {0238}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0238&amp;wid=&amp;q=ANANIUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=4&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.85</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ανάνιος ο Ιαμβογράφος</div>    <div class="textMediumMarginBlue">- el: Ανάνιος ο Λυρικός</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: ananius_iambographus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">     ['<div class="terminologyEntry">    <div class="term">Archilochus Iamb. et Eleg.</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Archilochus Lyricus, Archilochus of Paros, Archilochus Parius, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Αρχίλοχος ο Πάριος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: archilochus_parius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By shakko - Own work, CC BY-SA 3.0, Bust of a bearded man (Archilochus?). Roman copy (c. 2nd century BC) of Greek original (4th century BC)https://commons.wikimedia.org/w/index.php?curid=7408002</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Archilochus_01_pushkin.jpg/800px-Archilochus_01_pushkin.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Elegiac Poems (Archilochus), CURFRAG.tlg-0232.6, translated by Edmonts: the shield I left because I must, poor blameless armament! beside a bush, gives joy now to some Saian, but myself I have saved. What care I for that shield? It shall go with a curse. I&apos;&apos;&apos;&apos;ll get me another e&apos;&apos;&apos;&apos;en as good. (Edmonds, J. M. (1931). Archilochus in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:2008.01.0480:volume=2:text=21:section=2&amp;highlight=shield#:~:text=e%27en%20as%20good.-,CURFRAG.tlg%2D0232.6,-%E2%80%9D%20Plutarch%20Spartan)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0232&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Αρχίλοχος, απ. 5 West, μετ. Θ. Κ. Στεφανόπουλος: Με την ασπίδα μου κάποιος Σάιος, το ξέρω, αγάλλεται. | Ήταν όπλο αψεγάδιαστο, κι εγώ την εγκατέλειψα πλάι στο θάμνο, | όμως δεν το ᾽θελα· έσωσα τη ζωή μου. | Τι με νοιάζει πια η ασπίδα εκείνη; Ώρα καλή· | θα ξαναβρώ άλλη, όχι κατώτερη. (Στεφανόπουλου, Θ. Κ., Τσιτσιρίδη, Στ., Αντζουλή, Λ., &amp; Κριτσέλη, Γ. (χ.χ.). ΑΡΧΙΛΟΧΟΣ: 25. – Απόσπασμα 5 West. Ανθολογία Αρχαίας Ελληνικής Γραμματείας. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/literature/browse.html?text_id=50)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Elegies of Archilochus Parius, Iambs of Archilochus Parius, Hymns of Archilochus Parius</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 7th century BCE</div>    <div class="attributeIndividual"> <u>bornIn</u>: Paros</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Thasos- settlement</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Archilochus_01_pushkin.jpg/800px-Archilochus_01_pushkin.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Archilochus_01_pushkin.jpg/800px-Archilochus_01_pushkin.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikiquote.org/wiki/Archilochus" target="_blank" rel="noopener">https://en.wikiquote.org/wiki/Archilochus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q201323" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q201323</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso     ['<div class="terminologyEntry">    <div class="term">Archilochus of Paros</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Archilochus Iamb. et Eleg., Archilochus Lyricus, Archilochus Parius, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Αρχίλοχος ο Πάριος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: archilochus_parius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By shakko - Own work, CC BY-SA 3.0, Bust of a bearded man (Archilochus?). Roman copy (c. 2nd century BC) of Greek original (4th century BC)https://commons.wikimedia.org/w/index.php?curid=7408002</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Archilochus_01_pushkin.jpg/800px-Archilochus_01_pushkin.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Elegiac Poems (Archilochus), CURFRAG.tlg-0232.6, translated by Edmonts: the shield I left because I must, poor blameless armament! beside a bush, gives joy now to some Saian, but myself I have saved. What care I for that shield? It shall go with a curse. I&apos;&apos;&apos;&apos;ll get me another e&apos;&apos;&apos;&apos;en as good. (Edmonds, J. M. (1931). Archilochus in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:2008.01.0480:volume=2:text=21:section=2&amp;highlight=shield#:~:text=e%27en%20as%20good.-,CURFRAG.tlg%2D0232.6,-%     ['<div class="terminologyEntry">    <div class="term">Archilochus Parius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Archilochus Iamb. et Eleg., Archilochus Lyricus, Archilochus of Paros, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Archilochus, born in Paros in the 7th century BCE, penned candid poetry reflecting his life experiences, including his failed ventures in Thasos and turbulent relationships. Renowned for his direct and critical style, he eschewed traditional heroic themes, opting to portray contemporary reality with raw honesty. He wrote,  elegies, hymns, iambs, earned him acclaim akin to Homer, with surviving fragments preserved on papyri.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> ARCHILOCHUS Eleg., Iamb. {0232}. (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0232&amp;wid=&amp;q=ARCHILOCHUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=2&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Ίαμβοι. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_022.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Archilochus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D37%3Aentry%3Darchilochus-bio-1</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.175</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Αρχίλοχος ο Πάριος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: archilochus_parius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By shakko - Own work, CC BY-SA 3.0, Bust of a bearded man (Archilochus?). Roman copy (c. 2nd century BC) of Greek original (4th century BC)https://commons.wikimedia.org/w/index.php?curid=7408002</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Archilochus_01_pushkin.jpg/800px-Archilochus_01_pushkin.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Elegiac Poems (Archilochus), CURFRAG.tlg-0232.6, translated by Edmonts: the shield I left because I must, poor blameless armament! beside a bush, gives joy now to some Saian, but myself I have saved. What care I for that shield? It shall go with a curse. I&apos;&apos;&apos;&apos;ll get me another e&apos;&apos;&apos;&apos;en as good. (Edmonds, J. M. (1931). Archilochus in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:2008.01.0480:volume=2:text=21:section=2&amp;highlight=shield#:~:text=e%27en%20as%20good.-,CURFRAG.tlg%2D0232.6,-%E2%80%9D%20Plutarch%20Spartan)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0232&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Αρχίλοχος, απ. 5 West, μετ. Θ. Κ. Στεφανόπουλος: Με την ασπίδα μου κάποιος Σάιος, το ξέρω, αγάλλεται. | Ήταν όπλο αψεγάδιαστο, κι εγώ την εγκατέλειψα πλάι στο θάμνο, | όμως δεν το ᾽θελα· έσωσα τη ζωή μου. | Τι με νοιάζει πια η ασπίδα εκείνη; Ώρα καλή· | θα ξαναβρώ άλλη, όχι κατώτερη. (Στεφανόπουλου, Θ. Κ., Τσιτσιρίδη, Στ., Αντζουλή, Λ., &amp; Κριτσέλη, Γ. (χ.χ.). ΑΡΧΙΛΟΧΟΣ: 25. – Απόσπασμα 5 West. Ανθολογία Αρχαίας Ελληνικής Γραμματείας. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/literature/browse.html?text_id=50)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Elegies of Archilochus Parius, Iambs of Archilochus Parius, Hymns of Archilochus Parius</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 7th century BCE</div>    <div class="attributeIndividual"> <u>bornIn</u>: Paros</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Thasos- settlement</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Archilochus_01_pushkin.jpg/800px-Archilochus_01_pushkin.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Archilochus_01_pushkin.jpg/800px-Archilochus_01_pushkin.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikiquote.org/wiki/Archilochus" target="_blank" rel="noopener">https://en.wikiquote.org/wiki/Archilochus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q201323" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q201323</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://el.wikipedia.org/wiki/%CE%91%CF%81%CF%87%CE%AF%CE%BB%CE%BF%CF%87%CE%BF%CF%82" target="_blank" rel="noopener">https://el.wikipedia.org/wiki/%CE%91%CF%81%CF%87%CE%AF%CE%BB%CE%BF%CF%87%CE%BF%CF%82</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0480%3Avolume%3D2%3     ['<div class="terminologyEntry">    <div class="term">Bacchylides Ceus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Bacchylides Lyricus, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Bacchylides, akin to Pindar, explored diverse forms of choral poetry, which journeyed widely throughout Greece. His surviving epinicians and hymns predominantly feature mythological narratives, although he set himself apart from Pindar in stylistic nuances and thematic depth.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> BACCHYLIDES Lyr. {0199}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0199&amp;wid=&amp;q=BACCHYLIDES&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=10&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). 3.5.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_042.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 192).</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.254</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Βακχυλίδης από την Κέα</div>    <div class="textMediumMarginBlue">- el: Βακχυλίδης ο Λυρικός</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: bacchylides_ceus</div>    <div class="textMediumM ides" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Bacchylides</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://el.wikipedia.org/wiki/%CE%92%CE%B1%CE%BA%CF%87%CF%85%CE%BB%CE%AF%CE%B4%CE%B7%CF%82" target="_blank" rel="noopener">https://el.wikipedia.org/wiki/%CE%92%CE%B1%CE%BA%CF%87%CF%85%CE%BB%CE%AF%CE%B4%CE%B7%CF%82</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.254" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.254</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Callinus Ephesius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div>    <div class="textMediumMargin"><b>Comment</b>: Greek poet possibly from Ephesus, who is credited as one of the earliest elegiac poets, known for his fragments, including a war elegy encouraging against enemies, likely composed around 675 B.C. during the Cimmerian invasions.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> CALLINUS Eleg. {0243}. (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0243&amp;wid=&amp;q=CALLINUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=2&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Πολεμική Ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_025.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Callinus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DC%3Aentry+group%3D6%3Aentry%3Dcallinus-bio-1</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.310</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Καλλίνος ο Εφέσιος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: callinus_ephesius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;The Elegiac Poems of Callinus, CURFRAG.tlg-0243.1, translated by Edmonts: How long will ye lie idle? When, young men, will ye show a stout heart? Have ye no shame of your sloth before them that dwell round about you? Purpose ye to sit in peace though the land is full of war? ... and let every man cast his javelin once more as he dies. For &apos;&apos;&apos;&apos;tis an honourable thing and a glorious to a man to fight the foe for land and children and wedded wife; and death shall befall only when the Fates ordain it. Nay, so soon as war is mingled let each go forward spear in poise and shield before stout heart; for by no means may a man escape death, nay not if he come of immortal lineage. Oftentime, it may be, he returneth safe from the conflict of battle and the thud of spears, and the doom of death cometh upon him at home; yet such is not dear to the people nor regretted, whereas if aught happen to the other sort he is bewailed of small and great. When a brave man dieth the whole people regretteth him, and while he lives he is as good as a demigod; for in their eyes he is a tower, seeing that he doeth single-handed as good work as many together. (Edmonds, J. M. (1931). The Elegiac Poems of Callinus in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D1%3Asection%3D2#note1:~:text=as%20many%20together.-,CURFRAG.tlg%2D0243.1,-%E2%80%9D%20Stobaeus%20Anthology)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0243&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Καλλίνος, απ. 1 West, μετ. Σ. Μενάνδρου: Ως πότε πια κατάκοιτοι; ορμήν πότε θα βρείτε; | δεν ντρέπεσθε τους γείτονες για την οκνιάν αυτή; | Ε! παλικάρια, ειρηνικά πως κάθεστε θαρρείτε | και ωστόσο γύρω ο πόλεμος όλη την γη κρατεί… | ................. | Είναι τιμή κι είναι χαρά στο παλικάρι η μάχη | για την πατρίδα, την καλή γυναίκα, τα παιδιά. | Ο θάνατος τότε θα ᾽ρθει, όταν η Μοίρα λάχει· | μόνο καθείς ας ορθωθεί μ᾽ ατρόμητη καρδιά, | και ας δράξει αμέσως το σπαθί κι ας ζώσει τ᾽ άρματά του | και όσό ᾽ναι του πολέμου αρχή, ας δράμει εκεί μπροστά, | γιατί να φύγει αδύνατο την μοίρα του θανάτου, | και αν η γενιά του από θεούς αθάνατου ς βαστά· | κάποτ᾽ αν απ᾽ τον πόλεμο δειλά λιποτακτήσει, | μέσα στο σπίτι βρίσκει τον η ώρα του η στερνή. | Μα τούτον ποιος τον αγαπά και ποιος θα τον ποθήσει; | ενώ τον άλλο ένας λαός, αν πάθει, τον πονεί. | Γιατί ο λαός ολάκερος θρηνεί το παλικάρι, | σαν αποθάνει· κι έχουν τον ημίθεο όσο ζει | σαν πύργ᾽ όλοι κατάματα θωρούν τον με καμάρι | γιατί μονάχος κάμνει αυτός όσα πολλοί μαζί! (Τσέλικας, Σ. (επ.). ΚΑΛΛΙΝΟΣ: απ. 1 West. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=48)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: War elegy of Callinus Ephesius</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 7th century BCE</div>    <div class="attributeIndividual"> <u>bornIn</u>: Ephesus</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0243.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0243.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.310" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.310</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D1" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/people/2039" target="_blank" rel="noopener">https://topostext.org/people/2039</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D1%3Asection%3D2" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D1%3Asection%3D2</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/biography/Callinus" target="_blank" rel="noopener">https://www.britannica.com/biography/Callinus</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Hipponax Ephesius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Hipponax Iambographus, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Hipponax, a poet from Ephesus, later relocated to Clazomenae, was renowned for his expressive satire and scurrilous language, depicting scenes of poverty, ridiculing enemies, and exploring themes of theft, quarrels, and bold romantic escapades. His verses also included coarse comparisons, magical elements, proverbial expressions, and hints of misogyny, showcasing a unique blend of satire and idiosyncratic language.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Ίαμβοι. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_022.html</div>    <div class="textItalicSmallMargin"><b>2)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 185).</div>    <div class="textItalicSmallMargin"><b>3)</b> HIPPONAX Iamb. {0233}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0233&amp;wid=&amp;q=HIPPONAX&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=8&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.741</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ιππώναξ ο Εφέσιος</div>    <div class="textMediumMarginBlue">- el: Ιππώναξ ο Ιαμβογράφος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: hipponax_ephesius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Published by Guillaume Rouille(1518?-1589) - Hipponax of Ephesus was an Ancient Greek iambic poet. "Promptuarii Iconum Insigniorum ", Public Domain, https://commons.wikimedia.org/w/index.php?curid=8660255</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/8/87/Hipponax_of_Ephesus.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Hipponax, fr. 68 West: Two days are sweetest for a woman, the day a man marries her and the day he carries her out dead. (Hawkins, L. (n.d.). Hipponax &amp; Misogyny in Ancient Greece. World History Encyclopedia. Retrieved 5 May 2024, from https://www.worldhistory.org/article/188/hipponax--misogyny-in-ancient-greece/)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0233&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Ιππώναξ, απ. 68 West μετ. Σ. Μενάρδος: Δυο μέρες της γυναίκας είν᾽ οι πιο γλυκές, του γάμου η μια κι η άλλη… της κηδείας της. (Τσέλικας, Σ. (επ.). ΙΠΠΩΝΑΞ: απ. 68 West. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=122)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Iambs of Hipponax Ephesius</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6th century BCE</div>    <div class="attributeIndividual"> <u>bornIn</u>: Ephesus</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Klazomenai</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf     ['<div class="terminologyEntry">    <div class="term">Ibycus Rheginus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div>    <div class="textMediumMargin"><b>Comment</b>: He followed Stesichorus&apos;s model, composing narrative mythological songs with local variations. In an Ionian setting, his works took on an erotic tone. One surviving fragment both flatters his host and subtly elevates his art, treating myth in a laudatory context, as seen in his panegyric to Polycrates, transitioning from the Trojan War to the beauty of youth.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> IBYCUS Lyr. {0293}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0293&amp;wid=&amp;q=IBYCUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=5&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). 2.4.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 191).</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.760</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ίβυκος ο Ρηγίνος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: ibycus_rheginus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Heinrich Schwemminger - The Cranes of Ibycus, by Heinrich Schwemminger, illustrating Schiller&apos;s poem of that name<br>https://digital.belvedere.at/objects/2534/die-kraniche-des-ibykus, Public Domain, https://commons.wikimedia.org/w/index.php?curid=74330706</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/d/de/Heinrich_Schwemminger_-_Die_Kraniche_des_Ibykus_-_3739_-_Kunsthistorisches_Museum.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0293&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Choral songs of Ibycus Rheginus, Enkomion of Ibycus Rheginus</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 6th century BCE</div>    <div class="attributeIndividual"> <u>bornIn</u>: Rhegium</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Samos</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/d/de/Heinrich_Schwemminger_-_Die_Kraniche_des_Ibykus_-_3739_-_Kunsthistorisches_Museum.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/d/de/Heinrich_Schwemminger_-_Die_Kraniche_des_Ibykus_-_3739_-_Kunsthistorisches_Museum.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://web.archive.org/web/20120212233258/http://www.csad.ox.ac.uk/POXY/VExhibition/images/1790.jpg" target="_blank" rel="noopener">https://web.archive.org/web/20120212233258/http://www.csad.ox.ac.uk/POXY/VExhibition/images/1790.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Ibycus" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Ibycus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://quod.lib.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=ACL3129.0002.001;didno=ACL3129.0002.001;view=image;seq=00000567" target="_blank" rel="noopener">https://quod.lib.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=ACL3129.0002.001;didno=ACL3129.0002.001;view=image;seq=00000567</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.760" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.760</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0293.tlg001.opp-eng1" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0293.tlg001.opp-eng1</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Mimnermo of Colophon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Mimnermus Lyricus, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Μίμνερμος από την Κολοφώνα</div>    <div class="textMediumMarginBlue">- el: Μίμνερμος ο Λυρικός</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: mimnermus_lyricus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;The Elegies of Mimnermus, CURFRAG.tlg-0255.1, translated by Edmonts: But what life would there be, what joy, without golden Aphrodite? May I die when I be no more concerned with secret love and suasive gifts and the bed, such things as are the very flowers of youth, pleasant alike to man and woman. And when dolorous Age cometh, that maketh a man both foul without and evil within,ill cares do wear and wear his heart, he hath no more the joy of looking one the sunlight, to children he is hateful, to women contemptible, so grievous hath God made Age. (Edmonds, J. M. (1931). The Elegies of Mimnermus in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D4%3Asection%3D2#:~:text=God%20made%20Age.-,%20Stobaeus%20Anthology)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0255&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Μίμνερμος, απ. 1 West μετ. I. Ν. Καζάζη: Τι είναι η ζωή, και ποια η γλύκα της δίχως την Αφροδίτη τη χρυσή; Ν άφηνα την πνοή μου, όταν θα έπαυαν όλα τούτα να μ᾽ ενδιαφέρουν, οι κρυφές αγάπες, τα γλυκά σαν μέλι δώρα τους και το κρεβάτι — άνθη συναρπαστικά που στολίζουν τη νιότη αντρών και γυναικών. Μα όταν επιδράμει οδυνηρό το γήρας, αυτό που ασχημίζει τον άνθρωπο και τον εξευτελίζει, εξουθενωτικό άγχος βασανίζει την ψυχή του, και πια δεν χαίρεται να αντικρίζει το φως του ήλιου· γιατί οι άγουροι τον αποφεύγουν, και οι γυναίκες τον περιφρονούν — τόσο σκληρά έκαμε ο θεός τα γηρατειά! (Τσέλικας, Σ. (επ.). Μίμνερμος: απ. 1 West. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=64#m2)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Erotic elegies of Mimnermus Lyricus</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 7th century BCE</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Colophon, Smyrna</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg002" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg002</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q316129" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q316129</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.938" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.938</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D4%3Asection%3D2" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D4%3Asection%3D2</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Mimnermus Lyricus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Mimnermo of Colophon, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Mimnermus, hailing from Colophon (or Smyrna) in the 7th/6th century BC, is credited with initiating the genre of erotic elegy, portraying themes of concealed loves and the transient nature of human life.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b>  MIMNERMUS Eleg. {0255} (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0255&amp;wid=&amp;q=MIMNERMUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=3&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Ερωτική Ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_026.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Mimnermus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DM%3Aentry+group%3D26%3Aentry%3Dmimnermus-bio-1</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.938</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Μίμνερμος από την Κολοφώνα</div>    <div class="textMediumMarginBlue">- el: Μίμνερμος ο Λυρικός</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: mimnermus_lyricus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;The Elegies of Mimnermus, CURFRAG.tlg-0255.1, translated by Edmonts: But what life would there be, what joy, without golden Aphrodite? May I die when I be no more concerned with secret love and suasive gifts and the bed, such things as are the very flowers of youth, pleasant alike to man and woman. And when dolorous Age cometh, that maketh a man both foul without and evil within,ill cares do wear and wear his heart, he hath no more the joy of looking one the sunlight, to children he is hateful, to women contemptible, so grievous hath God made Age. (Edmonds, J. M. (1931). The Elegies of Mimnermus in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D4%3Asection%3D2#:~:text=God%20made%20Age.-,%20Stobaeus%20Anthology)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0255&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Μίμνερμος, απ. 1 West μετ. I. Ν. Καζάζη: Τι είναι η ζωή, και ποια η γλύκα της δίχως την Αφροδίτη τη χρυσή; Ν άφηνα την πνοή μου, όταν θα έπαυαν όλα τούτα να μ᾽ ενδιαφέρουν, οι κρυφές αγάπες, τα γλυκά σαν μέλι δώρα τους και το κρεβάτι — άνθη συναρπαστικά που στολίζουν τη νιότη αντρών και γυναικών. Μα όταν επιδράμει οδυνηρό το γήρας, αυτό που ασχημίζει τον άνθρωπο και τον εξευτελίζει, εξουθενωτικό άγχος βασανίζει την ψυχή του, και πια δεν χαίρεται να αντικρίζει το φως του ήλιου· γιατί οι άγουροι τον αποφεύγουν, και οι γυναίκες τον περιφρονούν — τόσο σκληρά έκαμε ο θεός τα γηρατειά! (Τσέλικας, Σ. (επ.). Μίμνερμος: απ. 1 West. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=64#m2)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Erotic elegies of Mimnermus Lyricus</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 7th century BCE</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Colophon, Smyrna</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg001" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg001</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg002" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0255.tlg002</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q316129" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q316129</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.938" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.938</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D4%3Asection%3D2" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0479%3Avolume%3D1%3Atext%3D4%3Asection%3D2</a></div></div></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">Phocylides Milesius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Phocylides Lyricus, Phocylides of Miletus, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Phocylides, from Miletus in the 6th century BCE, wrote gnomic elegies. One of his surviving fragments, in hexameter, shares a theme with Simonides&apos; "Iamb against women".</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). 2.4.Β.iii.δ. Γνωμική ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_028.html</div>    <div class="textItalicSmallMargin"><b>2)</b> PHOCYLIDES Eleg., Gnom. {1604}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=1604&amp;wid=&amp;q=PHOCYLIDES&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=7&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>3)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.1116</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Φωκυλίδης ο Λυρικός</div>    <div class="textMediumMarginBlue">- el: Φωκυλίδης ο Μιλήσιος</div>    <div class="textMediumMarginBlue">- el: Φωκυλίδης από τη Μίλητο</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: phocylides_milesius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class=     ['<div class="terminologyEntry">    <div class="term">Pindar</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Pindarus, Pindarus Boeotus, Pindarus Lyricus, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Πίνδαρος</div>    <div class="textMediumMarginBlue">- el: Πίνδαρος από τη Βοιωτία</div>    <div class="textMediumMarginBlue">- el: Πίνδαρος ο Βοιωτός</div>    <div class="textMediumMarginBlue">- el: Πίνδαρος ο Λυρικός</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: pindarus_boeotus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Ancient Roman frescos of Pompeii - Enthroned Pindar with lyre, Muse and poetess. Antique fresco in Pompeii<br>https://pompeiiinpictures.com/pompeiiinpictures/index.htm, Public Domain, https://commons.wikimedia.org/w/index.php?curid=94696565</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Pythian 7 transl Svarlien: The great city of Athens is the most beautiful prelude of song, which the widely powerful race of the Alcmaeonids can lay as a foundation of odes in honor of their horses. [5] What fatherland, what family will you name that is more illustrious in Greece? For in all cities the story [10] of the citizens of Erechtheus makes the rounds, Apollo, how they made your dwelling in divine Pytho a marvel to see. Five Isthmian victories lead my song forward, and one outstanding triumph [15] at Zeus&apos;&apos;&apos;&apos; Olympian games, and two from Cirrha— yours, Megacles, and your ancestors&apos;&apos;&apos;&apos;. I rejoice at this new success; but I grieve that fine deeds are repaid with envy. [20] It is true what they say: the abiding bloom of good fortune brings with it both good and bad. (Arnson Svarlien, D. (n.d.). Pindar, Pythian 7. Retrieved 12 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0162%3Abook%3DP.%3Apoem%3D7)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0033&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Hyporchemes of Pindarus Boeotus, Partheneia of Pindarus Boeotus, Prosodia of Pindarus Boeotus, Dithyrambs of Pindarus Boeotus, Enkomion of Pindarus Boeotus, Epinikoi of Pindarus Boeotus, Paeans of Pindarus Boeotus, Threnoi of Pindarus Boeotus</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 5th century BCE, 6th century BCE</div>    <div class="attributeIndividual"> <u>bornIn</u>: Boeotia</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Akragas, Athens, Syrakousai</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/author/690" target="_blank" rel="noopener">https://www.trismegistos.org/author/690</a></div>    <div class= "externalLinkIndividual">rdfs:seeAls     ['<div class="terminologyEntry">    <div class="term">Pindarus Boeotus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Pindar, Pindarus, Pindarus Lyricus, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Pindar, born near Thebes, produced various poetic compositions, including enkomia, epinikoi, and hymns, earning acclaim for his richly crafted verses. His works, predominantly written in epic language with Doric and some Aeolic elements, reflect a serious and majestic tone, emphasizing divine power and human greatness.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> PINDARUS Lyr. {0033}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0033&amp;wid=&amp;q=PINDARUS&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=9&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). 3.5.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_042.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 192-194).</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.1126</div>    <div class="textItalicSmallMargin"><b>5)</b> https://lsj.gr/wiki/%CE%A0%CE%AF%CE%BD%CE%B4%CE%B1%CF%81%CE%BF%CF%82</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Πίνδαρος</div>    <div class="textMediumMarginBlu     ['<div class="terminologyEntry">    <div class="term">Pindarus Lyricus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Pindar, Pindarus, Pindarus Boeotus, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Πίνδαρος</div>    <div class="textMediumMarginBlue">- el: Πίνδαρος από τη Βοιωτία</div>    <div class="textMediumMarginBlue">- el: Πίνδαρος ο Βοιωτός</div>    <div class="textMediumMarginBlue">- el: Πίνδαρος ο Λυρικός</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: pindarus_boeotus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Ancient Roman frescos of Pompeii - Enthroned Pindar with lyre, Muse and poetess. Antique fresco in Pompeii<br>https://pompeiiinpictures.com/pompeiiinpictures/index.htm, Public Domain, https://commons.wikimedia.org/w/index.php?curid=94696565</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Pythian 7 transl Svarlien: The great city of Athens is the most beautiful prelude of song, which the widely powerful race of the Alcmaeonids can lay as a foundation of odes in honor of their horses. [5] What fatherland, what family will you name that is more illustrious in Greece? For in all cities the story [10] of the citizens of Erechtheus makes the rounds, Apollo, how they made your dwelling in divine Pytho a marvel to see. Five Isthmian victories lead my song forward, and one outstanding triumph [15] at Zeus&apos;&apos;&apos;&apos; Olympian games, and two from Cirrha— yours, Megacles, and your ancestors&apos;&apos;&apos;&apos;. I rejoice at this new success; but I grieve that fine deeds are repaid with envy. [20] It is true what they say: the abiding bloom of good fortune brings with it both good and bad. (Arnson Svarlien, D. (n.d.). Pindar, Pythian 7. Retrieved 12 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0162%3Abook%3DP.%3Apoem%3D7)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0033&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Hyporchemes of Pindarus Boeotus, Partheneia of Pindarus Boeotus, Prosodia of Pindarus Boeotus, Dithyrambs of Pindarus Boeotus, Enkomion of Pindarus Boeotus, Epinikoi of Pindarus Boeotus, Paeans of Pindarus Boeotus, Threnoi of Pindarus Boeotus</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 5th century BCE, 6th century BCE</div>    <div class="attributeIndividual"> <u>bornIn</u>: Boeotia</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Akragas, Athens, Syrakousai</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/d/d7/VIII.1.a%2C_Pompeii._June_2017._Painted_panel_from_west_end_of_south_wall_of_enthroned_Pindar_with_lyre%2C_with_Muse_and_poetess.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/author/690" target="_blank" rel="noopener">https://www.trismegistos.org/author/690</a></div>    <div class= "externalLinkIndividual">rdfs:seeAls     ['<div class="terminologyEntry">    <div class="term">Sappho Lesbia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poetess</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Sappho Lyrica, Sapphus, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Sappho, often shrouded in legend, was likely an aristocrat from Lesbos, associated with Pittacus and Alcaeus, and possibly exiled to Sicily. Her surviving poetry, primarily focused on themes of love and affection, notably includes odes and epithalamia, (choral wedding songs).</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> SAPPHO Lyr. {0009} (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0009&amp;wid=&amp;q=SAPPHO&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=2&amp;acp=1&amp;editid=<br>2. Κακριδής, Φάνης. (2012). Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div>    <div class="textItalicSmallMargin"><b>2)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 188).</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Sappho. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DS%3Aentry+group%3D4%3Aentry%3Dsappho-bio-1</div>    <div class="textItalicSmallMargin"><b>4)</b> Britannica, T. Editors of Encyclopaedia. "Sappho." Encyclopedia Britannica. Retrieved 5 April 2024 from https://www.britannica.com/biography/Sappho-Greek-poet.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Σαπφώ</div>    <div class="textMediumMarginBlue">- el: Σαπφώ η Λεσβία</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sappho_lesbia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poetess&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Charles Mengin - Sappho (1877) by Charles Mengin (1853–1933). One tradition claims that Sappho committed suicide by jumping off the Leucadian cliff., Public Domain, https://commons.wikimedia.org/w/index.php?curid=1753564</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b1/1877_Charles_Mengin_-_Sappho.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Sappho, fr. 50: The man who is pretty is so only as far as he looks; the man who is good is already beautiful. (Sententiaeantiquae. (2012, March 14). Sappho, fragment 50. SENTENTIAE ANTIQUAE. https://sententiaeantiquae.com/2012/03/14/sappho-fragment-50/)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0009&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;απφώ, απ. 50 Lobel-Page μετ. Ι.Ν. Καζάζη: Αυτός που είναι ωραίος, είναι ωραίος στην όψη, αυτός όμως που είναι και καλός, θα είναι αυτόματα και ωραίος. (Τσέλικας, Σ. (επ.). ΣΑΠΦΩ: απ. 50 Lobel-Page. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=296)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Hymenaios of Sappho Lesbia, Epithalamia of Sappho Lesbia, Hymns of Sappho Lesbia, Erotic poetry of Sappho Lesbia</div>    <div class="attributeIndivi     ['<div class="terminologyEntry">    <div class="term">Semonides Amorginus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Semonides Iambographus, Simonides of Amorgos, Simonides of Samos, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Semonides, born in Samos but living in Amorgos, was renowned for his scarce surviving iambic verses and a few fragments of elegies. The latter contain philosophical musings, while iambic verses satirical depictions of women.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> SEMONIDES Eleg., Iamb. {0260} (n.d.). TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0260&amp;wid=&amp;q=SEMONIDES&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=50&amp;c=2&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). Ίαμβοι. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_022.html</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Simonides. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DS%3Aentry+group%3D19%3Aentry%3Dsimonides-bio-1#:~:text=%CE%A3%CE%B9%CE%BC%CF%89%CE%BD%CE%AF%CE%B4%CE%B7%CF%82)%2C%20literary.-,Simo%27nides,-1.%20Of%20Samos</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.1267</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Σημωνίδης ο Αμοργίνος</div>    <div class="textMediumMarginBlue">- el: Σημωνίδης ο Ιαμβογράφος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: semonides_amorginus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>passageChosenEn</u>: &apos;Semonides, Iambi, CURFRAG.tlg-0260.3 translated by Edmonds: There&apos;&apos;&apos;&apos;s much time for us to lie dead in, yet we live years few in number and live them ill. (Edmonds, J. M. (1931). Iambi, Semonides in Elegy and Iambus [English Translation]. Cambridge, MA: Harvard University Press. London: William Heinemann Ltd. (Original work published 1931). Retrieved May 4, 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0480%3Avolume%3D2%3Atext%3D22%3Asection%3D2#:~:text=live%20them%20ill.-,CURFRAG.tlg%2D0260.3,-%E2%80%9D%20Stobaeus%20Anthology)&apos;</div>    <div class="attributeIndividual"> <u>tlgIdentifyingNumber</u>: &apos;tlg0260&apos;</div>    <div class="attributeIndividual"> <u>passageChoselEl</u>: &apos;Σημωνίδης, απ. 3 West μετ. Ηλ. Βουτιερίδης: Για να πεθάνουμε έχουμε καιρόν όσον κι αν θέμε, μα ζούμε χρόνια λιγοστά και συφορές γεμάτα. (Τσέλικας, Σ. (επ.). Σημωνίδης: απ. 3 West. Ανθολογία Αρχαϊκής Λυρικής Ποίησης. Ανακτήθηκε 4 Μαΐου 2024, από https://www.greek-language.gr/digitalResources/ancient_greek/anthology/poetry/browse.html?text_id=58)&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasWritten</u>: Iambs of Semonides Amorginus</div>    <div class="attributeIndividual"> <u>centuryOfLiving</u>: 7th century BCE</div>    <div class="attributeIndividual"> <u>bornIn</u>: Samos</div>    <div class="attributeIndividual"> <u>stayedIn</u>: Amorgos</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual"     ['<div class="terminologyEntry">    <div class="term">Simonides Ceus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poet</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Simonides Lyricus, Simonides of Ceos, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Simonides, born in the Ionian island of Keos, quickly gained fame for his diverse poetic works, including epinikia, threnoi, epigrams, skolia, and dithyrambs. Renowned for his linguistic precision, he was praised for surpassing even Pindar in his compassionate lamentations. Simonides favored simplicity over grandeur in his compositions, offering philosophical reflections on human fate with profound understanding.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> SIMONIDES Lyr. {0261}. TLG - Canon Search. Retrieved 4 May 2024, from https://stephanus.tlg.uci.edu/Iris/canon/csearch.jsp#doc=tlg&amp;aid=0261&amp;wid=&amp;q=SIMONIDES&amp;dt=list&amp;cs_sort=1_sortname_asc&amp;st=author_text&amp;aw=&amp;verndipl=0&amp;per=100&amp;c=11&amp;acp=1&amp;editid=</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012).2.4.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 </div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 191).</div>    <div class="textItalicSmallMargin"><b>4)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.1292</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Σιμωνίδης από την Κέα</div>    <div class="textMediumMarginBlue">- el: Σιμωνίδης ο Λυρικός</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</
