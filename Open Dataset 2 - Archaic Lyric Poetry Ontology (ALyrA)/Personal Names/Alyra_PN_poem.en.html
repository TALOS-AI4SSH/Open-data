<script language="JavaScript">
var dictionnaire = [
    ['<div class="terminologyEntry">    <div class="term">Choral songs of Ibycus Rheginus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poem in ionic or in doric or in aeolic dialect performed by a chorus</font></div>    <div class="textMediumMargin"><b>Comment</b>: He followed Stesichorus&apos;s model, crafting narrative mythological songs with local variations. When in an Ionian setting, his compositions took on a more pronounced erotic tone. One surviving fragment both flatters his host and subtly elevates his own artistry, treating myth in a laudatory context, as seen in his panegyric to Polycrates, transitioning from the Trojan War to the beauty of youth.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Χορική ποίηση του Ίβυκου του Ρηγίνου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: choral_ibycus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Ibycus Rheginus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Choral songs of Stesichorus Himeraeus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">archaic lyric poem in ionic or in doric or in aeolic dialect performed by a chorus</font></div>    <div class="textMediumMargin"><b>Comment</b>: Stesichorus revolutionized choral poetry with innovations like the epode, introducing more varied meters and elaborate strophic structures. His choral works, primarily mythological narratives such as "Helen" and "Palinode", were mainly influences by epic themes, showcased his significant contributions to ancient Greek literary tradition.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div>    <div class="textItalicSmallMargin"><b>2)</b> Smith, W. (n.d.). Stesi&apos;chorus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DT%3Aentry+group%3D26%3Aentry%3Dtyrtaeus-bio-1</div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 190).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Χορική ποίηση του Στησίχορου από την Ιμέρα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: choral_stesichorus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Stesichorus Himeraeus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Dithyrambs of Bacchylides Ceus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">dithyramb</font></div>    <div class="textMediumMargin"><b>Comment</b>: Bacchylides, akin to Pindar, explored diverse forms of choral poetry, which journeyed widely throughout Greece. His surviving epinicians and hymns predominantly feature mythological narratives, although he set himself apart from Pindar in stylistic nuances and thematic depth.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 192).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Διθυραμβική ποίηση του Βακχυλίδη από την Κέα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: dithyrambs_bacchylides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to dionysus&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Bacchylides Ceus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Dithyrambs of Pindarus Boeotus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">dithyramb</font></div>    <div class="textMediumMargin"><b>Comment</b>: Productive for over fifty years, Pindar composed enkomia, epinikia, threnoi, paeans, parthenia, dithyrambs, hymns etc. However, out of the seventeen books where Alexandrians had collected his work, only four books with 44 epinikians survived: one with Olympian odes, one with Pythian odes, one with Isthmian odes, and one with Nemean odes. The rest were preserved only in fragments.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 192-194).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Διθυραμβική ποίηση του Πινδάρου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: dithyrambs_pindarus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to dionysus&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Pindarus Boeotus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Dithyrambs of Simonides Ceus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">dithyramb</font></div>    <div class="textMediumMargin"><b>Comment</b>: Simonides had also written Dithyrambs.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://catalog.perseus.org/catalog/urn:cite:perseus:author.1292</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Διθύραμβοι του Σιμωνίδη του Κείου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: dithyrambs_simonides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to dionysus&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Simonides Ceus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Elegies of Anacreon Teius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">elegy</font></div>    <div class="textMediumMargin"><b>Comment</b>: Alexandrian philologists gathered Anacreon Teius&apos; elegies in one book.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). 2.4.Β.ii.β. Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ελεγείες του Ανακρέοντα του Τηίου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: elegies_anacreon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Anacreon Teius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Elegies of Archilochus Parius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">elegy</font></div>    <div class="textMediumMargin"><b>Comment</b>: Archilochus is credited, along with Callinus, with the invention of elegy, making him one of the earliest poets to excel in this genre.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Smith, W. (n.d.). Archilochus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D37%3Aentry%3Darchilochus-bio-1</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ελεγείες του Αρχιλόχου του Πάριου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: elegies_archilochus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Archilochus Parius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Elegies of Simonides Ceus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">elegy</font></div>    <div class="textMediumMargin"><b>Comment</b>: Simonides&apos; role was important in the evolution of elegy as well.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 191).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ελεγείες του Σιμωνίδη από την Κέα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: elegies_simonides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Simonides Ceus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Enkomion of Bacchylides Ceus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">enkomion</font></div>    <div class="textMediumMargin"><b>Comment</b>: Bacchylides, akin to Pindar, explored diverse forms of choral poetry, which journeyed widely throughout Greece. His surviving epinicians and hymns predominantly feature mythological narratives, although he set himself apart from Pindar in stylistic nuances and thematic depth.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 192).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Εγκωμιαστική ποίηση του Βακχυλίδη</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: enkomion_bacchylides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to living&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Bacchylides Ceus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Enkomion of Ibycus Rheginus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">enkomion</font></div>    <div class="textMediumMargin"><b>Comment</b>: He followed Stesichorus&apos;s model, crafting narrative mythological songs with local variations. When in an Ionian setting, his compositions took on a more pronounced erotic tone. One surviving fragment both flatters his host and subtly elevates his own artistry, treating myth in a laudatory context, as seen in his panegyric to Polycrates, transitioning from the Trojan War to the beauty of youth.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). 2.4.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Εγκωμιαστική ποίηση του Ιβύκου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: enkomion_ibycus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to living&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Ibycus Rheginus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Enkomion of Pindarus Boeotus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">enkomion</font></div>    <div class="textMediumMargin"><b>Comment</b>: Productive for over fifty years, Pindar composed enkomia, epinikia, threnoi, paeans, parthenia, dithyrambs, hymns etc. However, out of the seventeen books where Alexandrians had collected his work, only four books with 44 epinikians survived: one with Olympian odes, one with Pythian odes, one with Isthmian odes, and one with Nemean odes. The rest were preserved only in fragments.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 192-194).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Εγκωμιαστική ποίηση του Πινδάρου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: enkomion_pindarus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to living&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Pindarus Boeotus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Epinikoi of Bacchylides Ceus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">epinikion</font></div>    <div class="textMediumMargin"><b>Comment</b>: Bacchylides, akin to Pindar, explored diverse forms of choral poetry, which journeyed widely throughout Greece. His surviving epinicians and hymns predominantly feature mythological narratives, although he set himself apart from Pindar in stylistic nuances and thematic depth.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 192).</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). 3.5.Β.i. Χορική ποίηση<br>. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_042.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Επίνικοι του Βακχυλίδη</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: epinikoi_bacchylides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to winners in athletic events&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Bacchylides Ceus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Epinikoi of Pindarus Boeotus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">epinikion</font></div>    <div class="textMediumMargin"><b>Comment</b>: Pindar&apos;s epinician odes are ceremonial songs celebrating victors in ancient Greek athletic competitions. They feature a triadic structure—strophe, antistrophe, and epode—and are known for their complex, metaphor-rich language and emotional depth. These odes were crafted to honor achievements and convey divine values, showcasing Pindar&apos;s skill in immortalizing great deeds through poetry.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 192-194).</div>    <div class="textItalicSmallMargin"><b>2)</b> Britannica, The Editors of Encyclopaedia. "Pindaric ode". Encyclopedia Britannica, 28 Feb. 2008, https://www.britannica.com/art/Pindaric-ode. Accessed 20 August 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Επίνικοι του Πινδάρου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: epinikoi_pindarus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to winners in athletic events&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Pindarus Boeotus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Epinikoi of Simonides Ceus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">epinikion</font></div>    <div class="textMediumMargin"><b>Comment</b>: Simonides had also written Epinikian songs.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 191).</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012).2.4.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Επίνικοι του Σιμωνίδη από την Κέα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: epinikoi_simonides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to winners in athletic events&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Simonides Ceus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Epithalamia of Sappho Lesbia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">epithalamion</font></div>    <div class="textMediumMargin"><b>Comment</b>: In Sappho&apos;s surviving fragments, the epithalamia, choral wedding songs, stand out, reminiscent of many traditional Greek bridal songs, conveying a similar essence and ambiance.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Επιθαλάμια της Σαπφούς της Λεσβίας</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: epithalamia_sappho</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to wedding couple&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Sappho Lesbia</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Erotic elegies of Mimnermus Lyricus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">erotic elegy</font></div>    <div class="textMediumMargin"><b>Comment</b>: Mimnermus of Colophon revolutionized elegy by infusing it with plaintive and erotic themes, shifting away from traditional warlike and joyous subjects. His verses, particularly those lamenting aging in his relationship with Nanno, marked the onset of erotic elegy, reflecting a more introspective and emotional exploration of love and longing in poetry.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Ερωτική Ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_026.html</div>    <div class="textItalicSmallMargin"><b>2)</b> Smith, W. (n.d.). Mimnermus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DM%3Aentry+group%3D26%3Aentry%3Dmimnermus-bio-1</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ερωτική ελεγεία του Μίμνερμου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: erotic_elegies_mimnermus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet with erotic content&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Mimnermus Lyricus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Erotic odes of Alcaeus Lesbius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">monody</font></div>    <div class="textMediumMargin"><b>Comment</b>: Few remnants remain of Alcaeus&apos; erotic poetry. Some were dedicated to Sappho, while others were addressed to handsome youths, as referenced by Horace and Cicero.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Smith, W. (1873). Alcaeus of MYTILENE. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:alphabetic%20letter=A:entry%20group=13:entry=alcaeus-bio-6&amp;toc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D34</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ερωτικές ωδές του Αλκαίου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: erotic_odes_alcaeus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a single performer&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Alcaeus Lesbius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Erotic odes of Anacreon Teius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">monody</font></div>    <div class="textMediumMargin"><b>Comment</b>: Alexandrian philologists gathered Anacreon Teius&apos; poems (erotic, sympotic) in one book.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 189).</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). 2.4.Β.ii.β. Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ερωτικές ωδές του Ανακρέοντα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: erotic_odes_anacreon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a single performer&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Anacreon Teius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Erotic poetry of Alcman Lacedaemonius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">monody</font></div>    <div class="textMediumMargin"><b>Comment</b>: Alcman&apos;s poetry included a significant amount of erotic, due to the freedom and sensuality in these works, he was often described as "sweet" and "pleasant" (anc.gr.: γλυκύς, χαριείς).</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Smith, W. (1873). Alcman. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D14%3Aentry%3Dalcman-bio-1</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ερωτική ποίηση του Αλκμάνα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: erotic_odes_alcman</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a single performer&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Alcman Lacedaemonius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Erotic poetry of Sappho Lesbia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">monody</font></div>    <div class="textMediumMargin"><b>Comment</b>: Sappho&apos;s erotic poetry, renowned for its vivid imagery and emotional intensity, delves into the complexities of passion, desire, and the irresistible force of love, often depicting the intimate relationships within her thiasos and celebrating the divine influence of Aphrodite.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 188).</div>    <div class="textItalicSmallMargin"><b>2)</b> Smith, W. (n.d.). Sappho. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DS%3Aentry+group%3D4%3Aentry%3Dsappho-bio-1</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ερωτική ποίηση της Σαπφούς</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: erotic_odes_sappho</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a single performer&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Sappho Lesbia</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Gnomic elegies of Phocylides Milesius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">gnomic elegy</font></div>    <div class="textMediumMargin"><b>Comment</b>: Phocylides, from Miletus in the 6th century BCE, wrote gnomic elegies. One of his surviving fragments, in hexameter, shares a theme with Simonides&apos; "Iamb against women".<br></div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). 2.4.Β.iii.δ. Γνωμική ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_028.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Γνωμικές ελεγείς του Φωκυλίδη</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: gnomic_elegies_phocylides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet with gnomic content&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Phocylides Milesius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Gnomic elegies of Theognis Megarensis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">gnomic elegy</font></div>    <div class="textMediumMargin"><b>Comment</b>: Theognis, from Megara, composed a collection of short and longer elegies (about 1400 verses) marked by conservative views and ethical reflections, with the research focused on discerning his authentic contributions among others. These elegies were likely intended for aristocratic symposiums, while the Shpragis of Theognis is included.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Γνωμική Ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_028.html</div>    <div class="textItalicSmallMargin"><b>2)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 187).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Γνωμικές ελεγείες του Θέογνη</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: gnomic_elegies_theognis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet with gnomic content&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Theognis Megarensis</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Hymenaios of Sappho Lesbia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">hymenaios</font></div>    <div class="textMediumMargin"><b>Comment</b>: Sappho is known and for her Hymenaious songs.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Υμέναιοι της Σαπφούς</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: hymenaios_sappho</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus during bride procession&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Sappho Lesbia</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Hymns of Alcaeus Lesbius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">hymn</font></div>    <div class="textMediumMargin"><b>Comment</b>: Alcaeus is also known to have composed hymns.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Smith, W. (1873). Alcaeus of MYTILENE. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:alphabetic%20letter=A:entry%20group=13:entry=alcaeus-bio-6&amp;toc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D34</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ύμνοι του Αλκαίου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: hymns_alcaeus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to a god&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Alcaeus Lesbius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Hymns of Alcman Lacedaemonius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">hymn</font></div>    <div class="textMediumMargin"><b>Comment</b>: Alcman is also known to have composed hymns.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Smith, W. (n.d.). Alcman. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D14%3Aentry%3Dalcman-bio-1</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ύμνοι του Αλκμάνα του Λακεδαιμόνιου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: hymns_alcman</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to a god&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Alcman Lacedaemonius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Hymns of Anacreon Teius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">hymn</font></div>    <div class="textMediumMargin"><b>Comment</b>: Anacreon is also known to have composed hymns.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). 2.4.Β.ii.β. Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ύμνοι του Ανακρέοντα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: hymns_anacreon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to a god&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Anacreon Teius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Hymns of Archilochus Parius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">hymn</font></div>    <div class="textMediumMargin"><b>Comment</b>: Archilochus is known to have composed hymns, alongside his other lyrical works; moreover, traditions also suggest he may have won a prize at Olympia for his hymn to Heracles, and Olympic victors sang a hymn by him during their procession.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div>    <div class="textItalicSmallMargin"><b>2)</b> Smith, W. (n.d.). Archilochus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D37%3Aentry%3Darchilochus-bio-1</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ύμνοι του Αρχιλόχου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: hymns_archilochus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to a god&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Archilochus Parius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Hymns of Sappho Lesbia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">hymn</font></div>    <div class="textMediumMargin"><b>Comment</b>: Sappho seemed to had written hymns, as Menander references her hymns to Artemis and Aphrodite, while Damophila is noted to have imitated one of Sappho&apos;s hymns to Artemis (Philostr. Vit. Soph. 1.30). In addition, the fr.1 of Sappho is a hymn to Aphrodite, in which in a fervent plea to Aphrodite, the speaker recalls past encounters and the agony of unrequited love, seeking relief and fulfillment from the goddess.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Smith, W. (n.d.). Sappho. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DS%3Aentry+group%3D4%3Aentry%3Dsappho-bio-1</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ύμνοι της Σαπφούς της Λεσβίας</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: hymns_sappho</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to a god&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Sappho Lesbia</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Hymns of Terpander Lesbius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">hymn</font></div>    <div class="textMediumMargin"><b>Comment</b>: Considering the few surviving fragments Terpander must have written comprised religious hymns, but they are lost.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div>    <div class="textItalicSmallMargin"><b>2)</b> Smith, W. (n.d.). Terpander. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DT%3Aentry+group%3D5%3Aentry%3Dterpander-bio-1</div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 189).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ύμνοι του Τέρπανδρου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: hymns_terpander</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to a god&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Terpander Lesbius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Hyporchemes of Bacchylides Ceus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">hyporcheme</font></div>    <div class="textMediumMargin"><b>Comment</b>: Bacchylides, akin to Pindar, explored diverse forms of choral poetry, which journeyed widely throughout Greece. His surviving epinicians and hymns predominantly feature mythological narratives, although he set himself apart from Pindar in stylistic nuances and thematic depth.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 192).</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). 3.5.Β.i. Χορική ποίηση<br>. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_042.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Υπορχήματα του Βακχυλίδη</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: hyporcheme_bacchylides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus with imitation expressions&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Bacchylides Ceus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Hyporchemes of Pindarus Boeotus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">hyporcheme</font></div>    <div class="textMediumMargin"><b>Comment</b>: Productive for over fifty years, Pindar composed enkomia, epinikia, threnoi, paeans, parthenia, dithyrambs, hymns etc. However, out of the seventeen books where Alexandrians had collected his work, only four books with 44 epinikians survived: one with Olympian odes, one with Pythian odes, one with Isthmian odes, and one with Nemean odes. The rest were preserved only in fragments.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 192-194).</div>    <div class="textItalicSmallMargin"><b>2)</b> Κακριδής, Φάνης. (2012). 3.5.Β.i. Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_042.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Υπορχήματα του Πινδάρου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: hyporchemes_pindarus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus with imitation expressions&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Pindarus Boeotus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Iambs of Anacreon Teius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">iamb</font></div>    <div class="textMediumMargin"><b>Comment</b>: Alexandrian philologists gathered Anacreon Teius&apos; iambs in one book.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 189).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ίαμβοι του Ανακρέοντα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: iambs_anacreon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in iambic or trochaic metre&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Anacreon Teius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Iambs of Ananius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">iamb</font></div>    <div class="textMediumMargin"><b>Comment</b>: Six fragments have survived, steering clear of defamation and indecency, featuring delightful moral reflections, playful mythological satire, and a culinary journal — representing the earliest instance of gastronomic poetry from the Ionian cultural sphere.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Lesky, A. (2015). Ιστορία της Αρχαίας ελληνικής Γραμματολογίας (μετ.  Τσοπανάκης Α.). Θεσσαλονίκη: Κυριακίδης. σ. 185.</div>    <div class="textItalicSmallMargin"><b>2)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 185).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ίαμβοι του Ανάνιου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: iambs_ananius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in iambic or trochaic metre&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Ananius Iambographus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Iambs of Archilochus Parius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">iamb</font></div>    <div class="textMediumMargin"><b>Comment</b>: Archilochus&apos;s fame as the foremost writer of iambic poetry was established through his sharp and unbridled language, expressing strong emotions and political critique, which led to both admiration and criticism, notably recognized for his powerful expression and keen satire.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div>    <div class="textItalicSmallMargin"><b>2)</b> Smith, W. (n.d.). Archilochus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D37%3Aentry%3Darchilochus-bio-1</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ίαμβοι του Αρχιλόχου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: iambs_archilochus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in iambic or trochaic metre&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Archilochus Parius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Iambs of Hipponax Ephesius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">iamb</font></div>    <div class="textMediumMargin"><b>Comment</b>: The iambic verses of Hipponax addressed a range of subjects, including his beloved Arete, criticisms of his enemies, and notably, vivid depictions of his own poverty, often delivered with biting realism and a touch of humor.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Ίαμβοι. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_022.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ίαμβοι του Ιππώνακτα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: iambs_hipponax</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in iambic or trochaic metre&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Hipponax Ephesius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Iambs of Semonides Amorginus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">iamb</font></div>    <div class="textMediumMargin"><b>Comment</b>: Semonides was known for his iambic poetry, focusing on gnomic and satirical verses that depicted various aspects of human character and life, particularly on the qualities of women, in which using images of animals in a 118-verse poem he illustrates their characteristics and concludes that only those who resemble bees are beneficial to men (Semonides, fr. 7 West).<br></div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Ίαμβοι. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_022.html</div>    <div class="textItalicSmallMargin"><b>2)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 184-185).</div>    <div class="textItalicSmallMargin"><b>3)</b> Smith, W. (n.d.). Simonides. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DS%3Aentry+group%3D19%3Aentry%3Dsimonides-bio-1#:~:text=%CE%A3%CE%B9%CE%BC%CF%89%CE%BD%CE%AF%CE%B4%CE%B7%CF%82)%2C%20literary.-,Simo%27nides,-1.%20Of%20Samos<br>3. </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ίαμβοι του Σημωνίδη του Αμοργίνου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: iambs_semonides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in iambic or trochaic metre&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Semonides Amorginus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Paeans of Alcman Lacedaemonius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">paean</font></div>    <div class="textMediumMargin"><b>Comment</b>: Alcman was also known for his Paeans.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Smith, W. (n.d.). Alcman. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D14%3Aentry%3Dalcman-bio-1</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Παιάνες του Αλκμάνα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: paeans_alcman</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to apollo&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Alcman Lacedaemonius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Paeans of Bacchylides Ceus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">paean</font></div>    <div class="textMediumMargin"><b>Comment</b>: Bacchylides was also known for his Paeans.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 192).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Παιάνες του Βακχυλίδη</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: paeans_bacchylides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to apollo&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Bacchylides Ceus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Paeans of Pindarus Boeotus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">paean</font></div>    <div class="textMediumMargin"><b>Comment</b>: Pindar was also known for his Paeans.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 192-194).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Παιάνες του Πινδάρου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: paeans_pindarus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to apollo&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Pindarus Boeotus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Partheneia of Alcman Lacedaemonius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">partheneion</font></div>    <div class="textMediumMargin"><b>Comment</b>: The surviving works of Alcman include the most important sample of choral lyric poetry; a Partheneion, probably performed by a chorus of ten girls during a festival in Sparta in the 7th/6th century BCE. The poem begins with a local war myth and praises the beauty of the girls, discussing their dress and ornaments, highlighting a strong erotic element within the female chorus.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Smith, W. (n.d.). Alcman. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D14%3Aentry%3Dalcman-bio-</div>    <div class="textItalicSmallMargin"><b>2)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 189-190).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Παρθένεια του Αλκμάνα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: partheneia_alcman</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus performed by a maidens chorus&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Alcman Lacedaemonius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Partheneia of Bacchylides Ceus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">partheneion</font></div>    <div class="textMediumMargin"><b>Comment</b>: Bacchylides is also known to have composed Partheneia.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 192).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Παρθένεια του Βακχυλίδη</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: partheneia_bacchylides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus performed by a maidens chorus&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Bacchylides Ceus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Partheneia of Pindarus Boeotus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">partheneion</font></div>    <div class="textMediumMargin"><b>Comment</b>: Pindar had also composed Partheneia.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 192-194).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Παρθένεια του Πινδάρου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: partheneia_pindarus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus performed by a maidens chorus&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Pindarus Boeotus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Political elegy of Solon Athenienis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">political elegy</font></div>    <div class="textMediumMargin"><b>Comment</b>: Solon&apos;s political elegies condemned corruption, advocated for justice, and foresaw societal concerns, reflecting his reformist agenda.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). 2.4.Β.iii.γ. Πολιτική ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_027.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Πολιτική ελεγεία του Σόλωνα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: political_elegies_solon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet with political content&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Solon Atheniensis</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Prosodia of Alcman Lacedaemonius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">prosodion</font></div>    <div class="textMediumMargin"><b>Comment</b>: Alcman is also know to have composed Prosodia.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Χορική ποίηση. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_020.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Προσόδια του Αλκμάνα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: prosodia_alcman</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus on the way to an altar&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Alcman Lacedaemonius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Prosodia of Bacchylides Ceus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">prosodion</font></div>    <div class="textMediumMargin"><b>Comment</b>: Bacchylides is also know to have composed Prosodia.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 192).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Προσόδια του Βακχυλίδη</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: prosodia_bacchylides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus on the way to an altar&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Bacchylides Ceus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Prosodia of Pindarus Boeotus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">prosodion</font></div>    <div class="textMediumMargin"><b>Comment</b>: Pindar is also know to have composed Prosodia.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 192-194).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Προσόδια του Πινδάρου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: prosodia_pindarus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus on the way to an altar&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Pindarus Boeotus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Sympotic odes of Alcaeus Lesbius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">monody</font></div>    <div class="textMediumMargin"><b>Comment</b>: Alcaeus is known for composing sympotic songs, which were central to aristocratic banquets (symposia), facilitating entertainment, conversation and music in a relaxed and romantic atmosphere.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Ωδές. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_023.html</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Συμποτικές ωδές του Αλκαίου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sympotic_odes_alcaeus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a single performer&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Alcaeus Lesbius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Sympotic odes of Anacreon Teius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">monody</font></div>    <div class="textMediumMargin"><b>Comment</b>: Alexandrian philologists gathered Anacreon Teius&apos; poems (erotic, sympotic) in one book.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 189).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Συμποτικές ωδές του Ανακρέοντα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sympotic_odes_anacreon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a single performer&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Anacreon Teius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Threnoi of Anacreon Teius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">threnos</font></div>    <div class="textMediumMargin"><b>Comment</b>: Anacreon is known for his "Threnoi" compositions.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 189).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Θρήνοι του Ανακρέοντα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: threnoi_anacreon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to dead&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Anacreon Teius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Threnoi of Pindarus Boeotus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">threnos</font></div>    <div class="textMediumMargin"><b>Comment</b>: Pindar is known for his "Threnoi" compositions.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (pp. 192-194).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Θρήνοι του Πινδάρου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: threnoi_pindarus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to dead&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Pindarus Boeotus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Threnoi of Simonides Ceus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">threnos</font></div>    <div class="textMediumMargin"><b>Comment</b>: Simonides is known for his "Threnoi" compositions.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 191).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Θρήνοι του Σιμωνίδη από την Κέα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: threnoi_simonides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a chorus or by a single performer dedicated to dead&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Simonides Ceus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">War elegies of Tyrtaeus Lacedaemonius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">war elegy</font></div>    <div class="textMediumMargin"><b>Comment</b>: Tyrtaeus&apos;s war elegies were Spartan marching songs that exhorted courage and celebrated the valor of warriors during the second Messenian War. They emphasized the importance of martial virtues and inspired Spartan youths to prioritize bravery and sacrifice for their homeland above all else.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Πολεμική Ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_025.html</div>    <div class="textItalicSmallMargin"><b>2)</b> Smith, W. (n.d.). Tyrtaeus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DT%3Aentry+group%3D26%3Aentry%3Dtyrtaeus-bio-1</div>    <div class="textItalicSmallMargin"><b>3)</b> Nesselrath, H.-G. (2013). Εισαγωγή στην αρχαιογνωσία (Πρώτος τόμος). (Ι. Ι. Δανιήλ, Ed.). Παπαδήμας. (p. 186).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Πολεμικές ελεγείες του Τυρταίου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: war_elegies_tyrtaeus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet with war content&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Tyrtaeus Lacedaemonius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">War elegy of Callinus Ephesius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">war elegy</font></div>    <div class="textMediumMargin"><b>Comment</b>: Callinus composed a war-elegy urging courage and resistance against invading enemies, likely the Cimmerians threatening Greek colonies in Asia Minor ca. 675 BCE. The surviving fragments showcase his talent and the urgency of his call to arms amidst the turmoil of the Cimmerian threat.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Κακριδής, Φάνης. (2012). Πολεμική Ελεγεία. In Αρχαία Ελληνική Γραμματολογία. Κέντρο Εκπαιδευτικής Έρευνας &amp; Ινστιτούτο Νεοελληνικών Σπουδών. Retrieved 2 May 2024 https://www.greek-language.gr/digitalResources/ancient_greek/history/grammatologia/page_025.html</div>    <div class="textItalicSmallMargin"><b>2)</b> Smith, W. (n.d.). Callinus. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DC%3Aentry+group%3D6%3Aentry%3Dcallinus-bio-1</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Πολεμικές ελεγείες του Καλλίνου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: war_elegy_callinus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem only in ionic dialect in elegiac couplet with war content&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Callinus Ephesius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Warlike odes of Alcaeus Lesbius</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">monody</font></div>    <div class="textMediumMargin"><b>Comment</b>: Alcaeus&apos; most praised poems are his warlike or patriotic odes, notably mentioned by Horace. These include fragments celebrating victories and likening political factions to a disabled ship, both later imitated by Horace.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Smith, W. (1873). Alcaeus of MYTILENE. In A Dictionary of Greek and Roman biography and mythology. Retrieved 2 May 2024, from https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0104:alphabetic%20letter=A:entry%20group=13:entry=alcaeus-bio-6&amp;toc=Perseus%3Atext%3A1999.04.0104%3Aalphabetic+letter%3DA%3Aentry+group%3D34</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Πολεμικές ωδές του Αλκαίου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: warlike_odes_alcaeus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Archaic Lyric Poem in ionic or in doric or in aeolic dialect performed by a single performer&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>isWrittenBy</u>: Alcaeus Lesbius</div></div></div></div>'],
];
function show_selected() {
    var selector = document.getElementById('idTerm');
    var champ = dictionnaire[selector[selector.selectedIndex].value][0];
    document.getElementById('display').innerHTML = champ;
}
document.getElementById('idTerm').addEventListener('change', show_selected);

searchBox = document.querySelector("#searchBox");
entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});

</script>
