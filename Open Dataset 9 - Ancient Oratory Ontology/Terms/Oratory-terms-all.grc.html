<script language="JavaScript">
var dictionnaire = [
    ['<div class="terminologyEntry">    <div class="term">ἀγών ἀτίμητος</div>    <div class="textMediumMargin"><b>Status</b>: alternative</div>    <div class="textMediumMargin"><b>See also</b>: δίκη ἀτίμητη (preferred),     </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: non-assessable lawsuit (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Legal proceeding with a fixed penalty&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /non-assessable penalty/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">ἀγών τιμητός</div>    <div class="textMediumMargin"><b>Status</b>: alternative</div>    <div class="textMediumMargin"><b>See also</b>: δίκη τιμητή (preferred),     </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: assessable lawsuit (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Legal proceeding with an assessable penalty&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /assessable penalty/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">αἰκίας δίκη</div>    <div class="definitionNL"><b>Definition</b>: A private legal proceeding for starting a physical fight without justification, proceeded over by the Forty and tried before the dikasterion. If convicted, defendant receives the assessable penalty of a fine.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Dem. 37.33: "<br>ἐνταυθὶ πόλλ᾽ ἄττα καὶ δεινά μοι ἅμ᾽ ἐγκαλεῖ: καὶ γὰρ αἴκειαν καὶ ὕβριν καὶ βιαίων καὶ πρὸς ἐπικλήρους ἀδικήματα. τούτων δ᾽ εἰσὶν ἑκάστου χωρὶς αἱ δίκαι καὶ οὔτε πρὸς ἀρχὴν τὴν αὐτὴν οὔθ᾽ ὑπὲρ τιμημάτων τῶν αὐτῶν, ἀλλ᾽ ἡ μὲν αἴκεια καὶ τὰ τῶν βιαίων πρὸς τοὺς τετταράκοντα, αἱ δὲ τῆς ὕβρεως πρὸς τοὺς θεσμοθέτας, ὅσα δ᾽ εἰς ἐπικλήρους, πρὸς τὸν ἄρχοντα. οἱ δὲ νόμοι καὶ τούτων διδόασι τὰς παραγραφὰς ἀντιλαγχάνειν, περὶ ὧν οὐκ εἰσὶν εἰσαγωγεῖς. λέγε δ᾽ αὐτοῖς τουτονὶ τὸν νόμον."</div>    <div class="textItalicSmallMargin"><b>2)</b> Dem. 54.18: "φασὶ τοίνυν ταύτας διὰ τοῦτο γίγνεσθαι, ἵνα μὴ λοιδορούμενοι τύπτειν ἀλλήλους προάγωνται. πάλιν αἰκείας εἰσί: καὶ ταύτας ἀκούω διὰ τοῦτ᾽ εἶναι τὰς δίκας, ἵνα μηδείς, ὅταν ἥττων ᾖ, λίθῳ μηδὲ τῶν τοιούτων ἀμύνηται μηδενί, ἀλλὰ τὴν ἐκ τοῦ νόμου δίκην ἀναμένῃ."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: battery suit (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Private legal proceeding for battery &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by the injured party or a guardian/, /the Forty/, /dikasterion/, /prosecutor issues oral summons at the Assembly/, /for starting a physical fight without justification/, /fine/, /assessable penalty/, /initiated by submitting a charge in writing/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Private legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">ἀπαγωγή</div>    <div class="definitionNL"><b>Definition</b>: A public legal proceeding initiated by arresting an offender and bringing them before a magistrate, overseen by the Eleven and tried before the dikasterion. If convicted, defendant receives the non-assessable penalty of death. If prosecutor fails to receive one-fifth of the votes, he faces a one thousand drachma penalty.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Dem. 24.146: "ὡς δὲ σαφῶς γνώσεσθ᾽ ὅτι ἀληθῆ λέγω, ἐγὼ ὑμῖν ἐρῶ. οὔτε γὰρ ἄν, ὦ ἄνδρες δικασταί, τιμᾶν ἐξῆν ὑμῖν ὅ τι χρὴ παθεῖν ἢ ἀποτεῖσαι （ἐν γὰρ τῷ παθεῖν καὶ ὁ δεσμὸς ἔνι: οὐκ ἂν οὖν ἐξῆν δεσμοῦ τιμῆσαι）, οὔθ᾽ ὅσων ἔνδειξίς ἐστιν ἢ ἀπαγωγὴ προσεγέγραπτ᾽ ἂν ἐν τοῖς νόμοις ‘τὸν δ᾽ ἐνδειχθέντα ἢ ἀπαχθέντα δησάντων οἱ ἕνδεκα ἐν τῷ ξύλῳ,’ εἴπερ μὴ ἐξῆν ἄλλους ἢ τοὺς ἐπὶ προδοσίᾳ τῆς πόλεως ἢ ἐπὶ καταλύσει τοῦ δήμου συνιόντας ἢ τοὺς τὰ τέλη ὠνουμένους καὶ μὴ καταβάλλοντας δῆσαι."σει τοῦ δήμου συνιόντας ἢ τοὺς τὰ τέλη ὠνουμένους καὶ μὴ καταβάλλοντας δῆσαι.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: summary arrest (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Public legal proceeding initiated by an arrest &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by anyone who wishes/, /initiated by arresting an offender and bringing to a magistrate  /, /the Eleven/, /dikasterion/, /arrest/, /non-assessable penalty/, /penalty of 1000 drachmas/, /death/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Public legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">ἀπογραφή</div>    <div class="definitionNL"><b>Definition</b>: A public indictment for withholding property from the state, proceeded over by the Eleven, and tried by the dikasterion. If convicted, the defendant pays an assessable fine and the prosecutor gets one third of the contested property.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Dem. 53.3: "εἰ μὲν οὖν μοι ἦν ἱκανὸν τὸ ὕδωρ διηγήσασθαι πρὸς ὑμᾶς τὰ ἐξ ἀρχῆς, ὅσ᾽ ἀγαθὰ πεπονθότες ὑπ᾽ ἐμοῦ οἷά με εἰργασμένοι εἰσίν, εὖ οἶδ᾽ ὅτι ὑμεῖς τ᾽ ἄν μοι ἔτι μᾶλλον συγγνώμην εἴχετε τοῦ ὀργίζεσθαι αὐτοῖς, τούτους τ᾽ ἀνοσιωτάτους ἀνθρώπων ἡγήσασθε εἶναι: νῦν δ᾽ οὐδὲ διπλάσιόν μοι τούτου ὕδωρ ἱκανὸν ἂν γένοιτο. τὰ μὲν οὖν μέγιστα καὶ περιφανῆ τῶν ἀδικημάτων, καὶ ὁπόθεν ἡ ἀπογραφὴ αὕτη γέγονεν, ἐρῶ πρὸς ὑμᾶς, τὰ δὲ πολλὰ ἐάσω."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: indictment for confiscation (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Public legal proceeding initiated in writing for debts to the state &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by anyone who wishes/, /initiated by submitting a charge in writing/, /prosecutor issues oral summons at the Assembly/, /penalty of 1000 drachmas/, /assessable penalty/, /for withholding property from the state/, /the Eleven/, /dikasterion/, /fine and prosecutor gets one third of property/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Public legal proceeding initiated in writing   &gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">ἀσεβείας γραφή</div>    <div class="definitionNL"><b>Definition</b>: A public indictment for impiety, proceeded over by the Basileus and tried before the dikasterion. If convicted, defendant receives the non-assessable penalty of death.<br></div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Dem. 22.2: "αἰτιασάμενος γάρ με, ἃ καὶ λέγειν ἂν ὀκνήσειέ τις, εἰ μὴ τύχοι προσόμοιος ὢν τούτῳ, τὸν πατέρ᾽ ὡς ἀπέκτον᾽ ἐγὼ τὸν ἐμαυτοῦ, καὶ κατασκευάσας ἀσεβείας γραφὴν οὐκ ἐπ᾽ ἐμέ, ἀλλ᾽ ἐπὶ τὸν θεῖόν μου, γράψας ἀσεβεῖν ἐμοὶ συνιόντ᾽ εἰς ταὐτὸν ὡς πεποιηκότι ταῦτα, εἰς ἀγῶνα κατέστησεν: ὃν εἰ συνέβη τόθ᾽ ἁλῶναι, τίς ἂν ἀθλιώτερ᾽ ἐμοῦ πεπονθὼς ἦν ὑπὸ τούτου; τίς γὰρ ἂν ἢ φίλος ἢ ξένος εἰς ταὐτό ποτ᾽ ἐλθεῖν ἠθέλησεν ἐμοί; τίς δ᾽ ἂν εἴασε πόλις που παρ᾽ ἑαυτῇ γενέσθαι τὸν τὸ τοιοῦτ᾽ ἀσέβημα δοκοῦντ᾽ εἰργάσθαι; οὐκ ἔστιν οὐδὲ μία."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: indictment for impiety (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Public legal proceeding initiated in writing for impiety &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by anyone who wishes/, /initiated by submitting a charge in writing/, /prosecutor issues oral summons at the Assembly/, /penalty of 1000 drachmas/, /for impiety/, /basileus/, /dikasterion/, /non-assessable penalty/, /death/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Public legal proceeding initiated in writing   &gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">ἀσεβείας τοῦ σηκοῦ γραφή</div>    <div class="definitionNL"><b>Definition</b>: A public indictment for the destruction of sacred olive trees, proceeded over by the Basileus and tried by the Council of the Areopagus. If convicted, defendant receives the non-assessable penalty of exile and confiscation of property.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Lys. 7.2: "οὕτω δ᾽ ἄπορος ὁ ἀγών μοι καθέστηκεν, ὥστε ἀπεγράφην τὸ μὲν πρῶτον ἐλάαν ἐκ τῆς γῆς ἀφανίζειν, καὶ πρὸς τοὺς ἐωνημένους τοὺς καρποὺς τῶν μορίων πυνθανόμενοι προσῇσαν: ἐπειδὴ δ᾽ ἐκ τούτου τοῦ τρόπου ἀδικοῦντά με οὐδὲν εὑρεῖν ἐδυνήθησαν, νυνί με σηκόν φασιν1 ἀφανίζειν, ἡγούμενοι ἐμοὶ μὲν ταύτην τὴν αἰτίαν ἀπορωτάτην εἶναι ἀπελέγξαι,2 αὐτοῖς δὲ ἐξεῖναι μᾶλλον ὅ τι ἂν βούλωνται λέγειν."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: indictment for removal of sacred olive tree (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Public legal proceeding initiated in writing for destruction of sacred olive trees &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by anyone who wishes/, /initiated by submitting a charge in writing/, /prosecutor issues oral summons at the Assembly/, /penalty of 1000 drachmas/, /basileus/, /council of the Areopagus/, /for destruction of sacred olive trees/, /non-assessable penalty/, /exile and confiscation/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Public legal proceeding initiated in writing   &gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">ἀστρατείας γραφή</div>    <div class="definitionNL"><b>Definition</b>: A public indictment for avoiding military service, proceeded over by the Strategoi and tried before the dikasterion. If convicted, defendant receives the non-assessable penalty of disenfranchisement.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Lys. 15.1: "ἐγὼ μέν, ὦ ἄνδρες δικασταί, καὶ ὑμᾶς αἰτοῦμαι τὰ δίκαια ψηφίσασθαι, καὶ τῶν στρατηγῶν δέομαι, ἐπεὶ καὶ ἐν τῇ ἄλλῃ ἀρχῇ πολλοῦ ἄξιοι τῇ πόλει γεγόνασι, καὶ τῶν τῆς ἀστρατείας γραφῶν κοινοὺς εἶναι τῷ τε διώκοντι καὶ τῷ φεύγοντι, καὶ μὴ βοηθοῦντας ᾧ ἂν βούλωνται πᾶσαν προθυμίαν ἔχειν παρὰ τὸ δίκαιον ὑμᾶς ψηφίσασθαι,"</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: indictment for avoiding military service (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Public legal proceeding initiated in writing for avoiding military service&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by anyone who wishes/, /initiated by submitting a charge in writing/, /prosecutor issues oral summons at the Assembly/, /penalty of 1000 drachmas/, /strategoi/, /dikasterion/, /for avoiding military service/, /disenfranchisement/, /non-assessable penalty/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Public legal proceeding initiated in writing   &gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">βιαίων δίκη</div>    <div class="definitionNL"><b>Definition</b>: A private legal proceeding for violent acts such as rape, proceeded over by the Forty and tried by the dikasterion. If convicted, defendant receives the assessable penalty of a fine.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Dem. 37.33: "ἐνταυθὶ πόλλ᾽ ἄττα καὶ δεινά μοι ἅμ᾽ ἐγκαλεῖ: καὶ γὰρ αἴκειαν καὶ ὕβριν καὶ βιαίων καὶ πρὸς ἐπικλήρους ἀδικήματα. τούτων δ᾽ εἰσὶν ἑκάστου χωρὶς αἱ δίκαι καὶ οὔτε πρὸς ἀρχὴν τὴν αὐτὴν οὔθ᾽ ὑπὲρ τιμημάτων τῶν αὐτῶν, ἀλλ᾽ ἡ μὲν αἴκεια καὶ τὰ τῶν βιαίων πρὸς τοὺς τετταράκοντα, αἱ δὲ τῆς ὕβρεως πρὸς τοὺς θεσμοθέτας, ὅσα δ᾽ εἰς ἐπικλήρους, πρὸς τὸν ἄρχοντα. οἱ δὲ νόμοι καὶ τούτων διδόασι τὰς παραγραφὰς ἀντιλαγχάνειν, περὶ ὧν οὐκ εἰσὶν εἰσαγωγεῖς. λέγε δ᾽ αὐτοῖς τουτονὶ τὸν νόμον."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: suit for acts of violence (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Private legal proceeding against forceful acts of violence&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by the injured party or a guardian/, /initiated by submitting a charge in writing/, /dikasterion/, /prosecutor issues oral summons at the Assembly/, /for violent acts such as rape/, /fine/, /assessable penalty/, /the Forty/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Private legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">βλάβης δίκη</div>    <div class="definitionNL"><b>Definition</b>: A private legal proceeding for causing financial loss, proceeded over by the Forty and tried by the dikasterion. If convicted, defendant receives the non-assessable penalty of death. If convicted, defendant receives the assessable penalty of a fine. If prosecutor fails to receive one-fifth of the votes, he faces a fine of one-sixth the sum in question.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Dem. 49.20: "νυνὶ δὲ τῷ Ἀντιφάνει εἴληχα βλάβης ἰδίαν δίκην, ὅτι μοι οὔτ᾽ ἐμαρτύρησεν οὔτ᾽ ἐξωμόσατο κατὰ τὸν νόμον. καὶ ἀξιῶ αὐτὸν ἀναβάντα εἰπεῖν ἐναντίον ὑμῶν διομοσάμενον, πρῶτον μὲν εἰ ἐδάνεισε Τιμοθέῳ ἐν Καλαυρείᾳ χιλίας δραχμάς, δεύτερον δ᾽ εἰ παρὰ τοῦ πατρὸς Φίλιππος ἀπέλαβεν ἐνθάδε τοῦτο τὸ ἀργύριον."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: suit for damages (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Private legal proceeding for wrongful financial loss&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by the injured party or a guardian/, /initiated by submitting a charge in writing/, /the Forty/, /dikasterion/, /prosecutor issues oral summons at the Assembly/, /for causing financial loss/, /fine/, /assessable penalty/, /penalty of one sixth of the sum at issue/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Private legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">γραφή</div>    <div class="definitionNL"><b>Definition</b>: A public legal proceeding initiated by submitting a charge in writing, in which the defendant is summoned when the prosecutor issues oral summons at the Assembly. If prosecutor fails to receive one-fifth of the votes, he faces a one thousand drachma penalty.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Antiph. 1.2: "ἡ γὰρ τύχη καὶ αὐτοὶ οὗτοι ἠνάγκασαν ἐμοὶ πρὸς τούτους αὐτοὺς τὸν ἀγῶνα καταστῆναι, οὓς εἰκὸς ἦν τῷ μὲν τεθνεῶτι τιμωροὺς γενέσθαι, τῷ δ᾽ ἐπεξιόντι βοηθούς. νῦν δὲ τούτων τἀναντία γεγένηται: αὐτοὶ γὰρ οὗτοι καθεστᾶσιν ἀντίδικοι καὶ φονῆς, ὡς καὶ ἐγὼ καὶ ἡ γραφὴ λέγει."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: indictment (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Public legal proceeding initiated in writing   &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by anyone who wishes/, /initiated by submitting a charge in writing/, /prosecutor issues oral summons at the Assembly/, /penalty of 1000 drachmas/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Public legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">διαδικασία</div>    <div class="definitionNL"><b>Definition</b>: A private legal proceeding initiated by competing claims for inheritance with no defendant or prosecutor, proceeded over by the Eponymous Archon and tried by the dikasterion. If prosecutor fails to receive one-fifth of the votes, he faces a fine of one-sixth the contested sum.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Dem. 24.54: "ὅσων δίκη πρότερον ἐγένετο ἢ εὔθυνα ἢ διαδικασία περί του ἐν δικαστηρίῳ, ἢ ἰδίᾳ ἢ δημοσίᾳ, ἢ τὸ δημόσιον ἀπέδοτο, μὴ εἰσάγειν περὶ τούτων εἰς τὸ δικαστήριον μηδ᾽ ἐπιψηφίζειν τῶν ἀρχόντων μηδένα, μηδὲ κατηγορεῖν ἐώντων ἃ οὐκ ἐῶσιν οἱ νόμοι.”</div>    <div class="textItalicSmallMargin"><b>2)</b> Dem. 43.61: "ἔστιν δ᾽ ὁ νῦν ἀγὼν καὶ ἡ διαδικασία οὐκ εἴ τις ἕτερος ἑτέρου πρότερος ἢ ὕστερος τετελεύτηκεν, ἀλλ᾽ εἰ μὴ προσήκει ἐξελαθῆναι ἐκ τοῦ οἴκου τοῦ Ἁγνίου τοὺς οἰκείους τοὺς Ἁγνίου, ἀνεψιοὺς ὄντας καὶ ἀνεψιῶν παῖδας Ἁγνίᾳ πρὸς πατρός, ὑπὸ τῶν ἐκ τοῦ Στρατίου οἴκου καὶ μηδὲν προσηκόντων ὥστε κληρονομεῖν τῶν Ἁγνίου, ἀλλὰ γένει ἀπωτέρω ὄντων. περὶ τούτου νῦν ἐσθ᾽ ὁ ἀγών."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: lawsuit for adjudication (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Private legal proceeding for competing inheritance claims &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by the injured party or a guardian/, /initiated by competing claims for inheritance/, /eponymous Archon/, /dikasterion/, /proclamation in the Assembly/, /for inheritance dispute/, /penalty of one sixth of the sum at issue/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Private legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">δίκαι δημόσιαι</div>    <div class="definitionNL"><b>Definition</b>:  A legal proceeding brought forward by any adult male citizen who wishes.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Andoc. 1.9: " ὁρῶν ὑμᾶς καὶ ἐν τοῖς ἰδίοις καὶ ἐν τοῖς δημοσίοις περὶ πλείστου τοῦτο ποιουμένους"</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: public lawsuits (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Public legal proceeding&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by anyone who wishes/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">δίκαι ἴδιαι</div>    <div class="definitionNL"><b>Definition</b>: A legal proceeding brought forward by the injured party or a guardian.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Andoc. 1.9: " ὁρῶν ὑμᾶς καὶ ἐν τοῖς ἰδίοις καὶ ἐν τοῖς δημοσίοις περὶ πλείστου τοῦτο ποιουμένους"</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: private lawsuits (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Private legal proceeding&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by the injured party or a guardian/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">δίκη</div>    <div class="definitionNL"><b>Definition</b>: A legal proceeding in the classical Athenian court system.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Aeschin. 1.44: "ᾗ δὴ καὶ πάνυ χαίρω, ὅτι μοι γέγονεν ἡ δίκη πρὸς ἄνθρωπον οὐκ ἠγνοημένον ὑφ᾽ ὑμῶν, οὐδ᾽ ἀπ᾽ ἄλλου γιγνωσκόμενον οὐδενός, ἢ ἀπ᾽ αὐτοῦ τοῦ ἐπιτηδεύματος περὶ οὗ καὶ τὴν ψῆφον μέλλετε φέρειν."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: lawsuit (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">δίκη ἀτίμητη</div>    <div class="definitionNL"><b>Definition</b>: A legal proceeding with a non-assessable penalty.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>See also</b>: ἀγών ἀτίμητος (alternative),     </div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Dem. 27.67: "καὶ νῦν κομίσασθαι τἀμαυτοῦ ζητῶν εἰς κίνδυνον καθέστηκα τὸν μέγιστον. ἂν γὰρ ἀποφύγῃ μ᾽ οὗτος, ὃ μὴ γένοιτο, τὴν ἐπωβελίαν ὀφλήσω μνᾶς ἑκατόν. καὶ τούτῳ μέν, ἐὰν καταψηφίσησθε, τιμητόν, κοὐκ ἐκ τῶν ἑαυτοῦ χρημάτων, ἀλλ᾽ ἐκ τῶν ἐμῶν ποιήσεται τὴν ἔκτεισιν: ἐμοὶ δ᾽ ἀτίμητον τοῦτ᾽ ἔστιν, ὥστ᾽ οὐ μόνον ἔσομαι τῶν πατρῴων ἀπεστερημένος, ἀλλὰ καὶ πρὸς ἠτιμωμένος, ἂν μὴ νῦν ἡμᾶς ὑμεῖς ἐλεήσητε."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: non-assessable lawsuit (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Legal proceeding with a fixed penalty&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /non-assessable penalty/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">δίκη ἐπιτροπῆς</div>    <div class="definitionNL"><b>Definition</b>: A private legal proceeding against guardian witholding property from ward, proceeded over by the Eponymous Archon and tried before the dikasterion. If convicted, defendant receives the assessable penalty of a fine. If prosecutor fails to get one-fifth of the votes, he faces the penalty of one-sixth of the sum at issue.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Isaeus 7.7: " ἀνδρί τε γενομένῳ συνηγωνίσατο καὶ εἰσέπραξε τὸ ἡμικλήριον ὧν Μνήσων κατέλιπεν ὅσα τε ἐκ τῆς ἐπιτροπῆς ἀπεστέρησε, δίκας δύο ἑλών, καὶ τὴν οὐσίαν ἐποίησε κομίσασθαι τὴν αὑτοῦ πᾶσαν."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: suit over a guardianship (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Private legal proceeding against guardian withholding property from ward &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by the injured party or a guardian/, /eponymous Archon/, /dikasterion/, /prosecutor issues oral summons at the Assembly/, /against guardian witholding property from ward/, /fine/, /assessable penalty/, /penalty of one sixth of the sum at issue/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Private legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">δίκη προικός</div>    <div class="definitionNL"><b>Definition</b>: A private legal proceeding to claim full amount of a dowry, proceeded over by the Eponymous Archon and tried before the dikasterion. If convicted, defendant recives the assessable pentalty of a fine. If prosecutor fails to get one-fifth of the votes, he faces the penalty of one-sixth of the sum at issue.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Isaeus 3.9: "ἢ εἰ μὴ ἐκομίζετο, ὁποίαν δίκην σίτου ἢ τῆς προικὸς αὐτῆς ἐν εἴκοσιν ἔτεσι τῷ ἔχοντι τὸν κλῆρον δικάσασθαι ἠξίωσεν,1 ἢ εἴ του ἀνθρώπων ἐναντίον προσῆλθεν ἐγκαλῶν τῷ κληρονόμῳ περὶ τῆς προικὸς τῆς ἀδελφῆς ἐν χρόνῳ τοσούτῳ. περί τε οὖν τούτων ἡδέως ἂν πυθοίμην, ὅ τι ποτ᾽ ἦν τὸ αἴτιον τοῦ μηδὲν τούτων γεγενῆσθαι περὶ τῆς ἐγγυητῆς （ὡς μεμαρτύρηκεν οὗτος） γυναικός,"</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: suit for a dowry (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Private legal proceeding for return of a dowry &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by the injured party or a guardian/, /initiated by submitting a charge in writing/, /eponymous Archon/, /dikasterion/, /prosecutor issues oral summons at the Assembly/, /fine/, /assessable penalty/, /penalty of one sixth of the sum at issue/, /to claim full amount of a dowry/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Private legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">δίκη τιμητή</div>    <div class="definitionNL"><b>Definition</b>: A legal proceeding with an assessable penalty.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>See also</b>: ἀγών τιμητός (alternative),     </div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Dem. 27.67: "καὶ νῦν κομίσασθαι τἀμαυτοῦ ζητῶν εἰς κίνδυνον καθέστηκα τὸν μέγιστον. ἂν γὰρ ἀποφύγῃ μ᾽ οὗτος, ὃ μὴ γένοιτο, τὴν ἐπωβελίαν ὀφλήσω μνᾶς ἑκατόν. καὶ τούτῳ μέν, ἐὰν καταψηφίσησθε, τιμητόν, κοὐκ ἐκ τῶν ἑαυτοῦ χρημάτων, ἀλλ᾽ ἐκ τῶν ἐμῶν ποιήσεται τὴν ἔκτεισιν: ἐμοὶ δ᾽ ἀτίμητον τοῦτ᾽ ἔστιν, ὥστ᾽ οὐ μόνον ἔσομαι τῶν πατρῴων ἀπεστερημένος, ἀλλὰ καὶ πρὸς ἠτιμωμένος, ἂν μὴ νῦν ἡμᾶς ὑμεῖς ἐλεήσητε."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: assessable lawsuit (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Legal proceeding with an assessable penalty&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /assessable penalty/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">δοκιμασία</div>    <div class="definitionNL"><b>Definition</b>: A public legal proceeding initiated before a magistrate&apos;s term and proceeded over by the Thesmothetae.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Aeschin. 1.28: "τίνας δ᾽ οὐκ ᾤετο δεῖν λέγειν; τοὺς αἰσχρῶς βεβιωκότας: τούτους οὐκ ἐᾷ δημηγορεῖν. καὶ ποῦ τοῦτο δηλοῖ; ‘δοκιμασία,’ φησί, ‘ῥητόρων: ἐάν τις λέγῃ ἐν τῷ δήμῳ τὸν πατέρα τύπτων ἢ τὴν μητέρα, ἢ μὴ τρέφων, ἢ μὴ παρέχων οἴκησιν:’ τοῦτον οὐκ ἐᾷ λέγειν. νὴ Δία καλῶς γε, ὡς ἔγωγέ φημι. διὰ τί; ὅτι εἴ τις, οὓς ἐξ ἴσου δεῖ τιμᾶν τοῖς θεοῖς, εἰς τούτους ἐστὶ φαῦλος, τί ποτε, φησίν, ὑπ᾽ αὐτοῦ πείσονται οἱ ἀλλότριοι καὶ ἡ πόλις ὅλη; καὶ τίσι δεύτερον ἀπεῖπε μὴ λέγειν; ‘ἢ τὰς στρατείας,’"</div>    <div class="textItalicSmallMargin"><b>2)</b> Lys. 26.16: "καίτοιγε αὐτὸν ἀκούω λέξειν ὡς οὐ περὶ αὐτοῦ μόνον ἡ δοκιμασία ἐστίν, ἀλλὰ περὶ πάντων τῶν ἐν ἄστει μεινάντων, καὶ τοὺς ὅρκους καὶ τὰς συνθήκας ὑμᾶς ὑπομνήσειν, ὡς ἐκ τούτων προσληψόμενον αὐτὸν δοκιμαστὰς τοὺς ἐν ἄστει μείναντας. ἐγὼ δ᾽ ὑπὲρ τοῦ πλήθους βραχέα πρὸς αὐτὸν εἰπεῖν βούλομαι, ὅτι ὁ δῆμος οὐ τὴν αὐτὴν γνώμην ἔχει περὶ πάντων τῶν ἐν ἄστει μεινάντων, ἀλλὰ περὶ μὲν τῶν τοιαῦτα ἐξαμαρτανόντων οἵαν ἐγώ φημι δεῖν,"</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: scrutiny (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Public legal proceeding initiated before a magistrate begins term in office &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by anyone who wishes/, /initiated before a magistrates term/, /thesmothetae/, /prosecutor issues oral summons at the Assembly/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Public legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">δωροδοκίας γραφή</div>    <div class="definitionNL"><b>Definition</b>: A public indictment for accepting bribes, proceeded over by the Thesmothetae and tried before the dikasterion. If convicted, defendant receives the assessable penalty of death or a fine ten times the bribe.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Aeschin. 2.3: "ἀλλ᾽ οἶμαι Δημοσθένης οὐ χαίρει δικαίοις λόγοις, οὐδ᾽ οὕτω παρεσκεύασται, ἀλλὰ τὴν ὑμετέραν ὀργὴν ἐκκαλέσασθαι βεβούληται. καὶ κατηγόρηκε δωροδοκίας, ἀπίθανος ὢν πρὸς τὴν ὑποψίαν ταύτην: τὸν γὰρ ἐπὶ ταῖς δωροδοκίαις προτρεπόμενον ὀργίζεσθαι, αὐτὸν χρὴ τῶν τοιούτων ἔργων ἀπέχεσθαι."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: indictment for accepting bribes (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Public legal proceeding initiated in writing for accepting bribes &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by anyone who wishes/, /initiated by submitting a charge in writing/, /prosecutor issues oral summons at the Assembly/, /penalty of 1000 drachmas/, /thesmothetae/, /dikasterion/, /for accepting bribes/, /death or fine ten times the bribe/, /assessable penalty/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Public legal proceeding initiated in writing   &gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">εἰσαγγελία</div>    <div class="definitionNL"><b>Definition</b>: A public legal proceeding for major offenses against the state. Can be proceeded over by the Assembly or the Council of 500, and can be tried before the Council or the Assembly or the dikasterion. If convicted, defendant receives the non-assesable penalty of death and confiscation. There is no penalty for prosecutors who fail to get one-fifth of the votes.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Andoc. 1.43: "ἡ μὲν εἰσαγγελία αὐτῷ, ὦ ἄνδρες, τοιαύτη: ἀπογράφει δὲ τὰ ὀνόματα τῶν ἀνδρῶν ὧν ἔφη γνῶναι, δύο καὶ τετταράκοντα, πρώτους μὲν Μαντίθεον καὶ Ἀψεφίωνα, βουλευτὰς ὄντας καὶ καθημένους ἔνδον, εἶτα δὲ καὶ τοὺς ἄλλους. ἀναστὰς δὲ Πείσανδρος ἔφη χρῆναι λύειν τὸ ἐπὶ Σκαμανδρίου ψήφισμα καὶ ἀναβιβάζειν ἐπὶ τὸν τροχὸν τοὺς ἀπογραφέντας, ὅπως μὴ πρότερον νὺξ ἔσται πρὶν πυθέσθαι τοὺς ἄνδρας ἅπαντας. ἀνέκραγεν ἡ βουλὴ ὡς εὖ λέγει."</div>    <div class="textItalicSmallMargin"><b>2)</b> Dem. 21.121: "Λυσίμαχος Ἀλωπεκῆθεν, Δημέας Σουνιεύς, Χάρης Θορίκιος, Φιλήμων Σφήττιος, Μόσχος Παιανιεύς, καθ᾽ οὓς καιροὺς ἡ εἰσαγγελία ἐδόθη εἰς τὴν βουλὴν ὑπὲρ Ἀριστάρχου τοῦ Μόσχου, ὅτι εἴη Νικόδημον ἀπεκτονώς, οἴδαμεν Μειδίαν τὸν κρινόμενον ὑπὸ Δημοσθένους, ᾧ μαρτυροῦμεν, ἐλθόντα πρὸς τὴν βουλὴν καὶ λέγοντα μηδένα ἕτερον εἶναι τὸν Νικοδήμου φονέα, ἀλλ᾽ Ἀρίσταρχον, καὶ τοῦτον αὐτοῦ γεγονέναι αὐτόχειρα, καὶ συμβουλεύοντα τῇ βουλῇ βαδίζειν ἐπὶ τὴν οἰκίαν τὴν Ἀριστάρχου καὶ συλλαμβάνειν αὐτόν."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: impeachment for treason (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Public legal proceeding against official for offenses against the state&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by anyone who wishes/, /initiated by submitting a charge in writing/, /council or Assembly or dikasterion/, /the Assembly or the Council of 500/, /prosecutor issues oral summons at the Assembly/, /for major offenses against the state/, /death and confiscation/, /non-assessable penalty/, /no penalty/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Public legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">εἰσαγγελία κάκωσις</div>    <div class="definitionNL"><b>Definition</b>: A public legal proceeding for maltreatment of parents, orphans, and heiresses, proceeded over by the Eponymous Archon and tried before the dikasterion. If convicted, defendant receives an assesable penalty ranging from a fine to a death sentence. There is no penalty for prosecutors who fail to get one-fifth of the votes.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: impeachment for maltreatment (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Public legal proceeding for maltreatment&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by anyone who wishes/, /initiated by submitting a charge in writing/, /prosecutor issues oral summons at the Assembly/, /eponymous Archon/, /dikasterion/, /for maltreatment of parents orphans and heiresses/, /assessable penalty/, /penal assessment/, /no penalty/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Public legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">ἔνδειξις</div>    <div class="definitionNL"><b>Definition</b>: A public legal proceeding inititated by denouncing an offender to a magistrate who carries out the arrest, proceeded over by the Eleven, tried in the dikasterion.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Andoc. 1.10: "ὥσπερ δὲ καὶ προεῖπον ὑμῖν, ὦ ἄνδρες, ἐξ ἀρχῆς περὶ πάντων ποιήσομαι τὴν ἀπολογίαν, πρῶτον μὲν περὶ αὐτῆς τῆς αἰτίας ὅθεν περ ἡ ἔνδειξις ἐγένετο, διόπερ εἰς τὸν ἀγῶνα τόνδε κατέστην, περὶ τῶν μυστηρίων"</div>    <div class="textItalicSmallMargin"><b>2)</b> Dem. 24.22: "ἐὰν δ᾽ οἱ πρυτάνεις μὴ ποιήσωσι κατὰ τὰ γεγραμμένα τὴν ἐκκλησίαν ἢ οἱ πρόεδροι μὴ χρηματίσωσι, ὀφείλειν τῶν μὲν πρυτάνεων ἕκαστον χιλίας δραχμὰς ἱερὰς τῇ Ἀθηνᾷ, τῶν δὲ προέδρων ἕκαστος ὀφειλέτω τετταράκοντα δραχμὰς ἱερὰς τῇ Ἀθηνᾷ. καὶ ἔνδειξις αὐτῶν ἔστω πρὸς τοὺς θεσμοθέτας, καθάπερ ἐάν τις ἄρχῃ ὀφείλων τῷ δημοσίῳ: οἱ δὲ θεσμοθέται τοὺς ἐνδειχθέντας εἰσαγόντων εἰς τὸ δικαστήριον κατὰ τὸν νόμον, ἢ μὴ ἀνιόντων εἰς Ἄρειον πάγον, ὡς καταλύοντες τὴν ἐπανόρθωσιν τῶν νόμων."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: denunciation (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Public legal proceeding initiated by denouncing an offender&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by anyone who wishes/, /inititated by denouncing an offender to a magistrate who carries out the arrest/, /the Eleven/, /dikasterion/, /arrest/, /penalty of 1000 drachmas/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Public legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">ἔνδειξις τῶν κακούργων</div>    <div class="definitionNL"><b>Definition</b>: A public legal proceeding initiated by a denouncement before a magistrate for crimes against others. If convicted, defendant is sentenced to the non-assessable penalty of death.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: denunciation of malefactors (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Public legal proceeding initiated by denouncing an offender for antisocial behavior &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by anyone who wishes/, /inititated by denouncing an offender to a magistrate who carries out the arrest/, /the Eleven/, /dikasterion/, /arrest/, /penalty of 1000 drachmas/, /non-assessable penalty/, /for crimes against others/, /death/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Public legal proceeding initiated by denouncing an offender&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">ἐξούλης δίκη</div>    <div class="definitionNL"><b>Definition</b>: A private legal proceeding for physically obstructing someone from their inheritance, proceeded over by the Eponymous Archon and tried before the dikasterion. If convicted, defendant receives the assessable penalty of restoring the property to the heir and paying its value to the state. If prosecutor fails to get one-fifth of the votes, he faces the penalty of one-sixth of the sum at issue.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Dem. 39.15: "ὅτι νὴ Δί᾽ εἴσονται πάντες πότερός ποτ᾽ ὦφλεν. καλῶς. ἂν δέ, ὃ τυχὸν γένοιτ᾽ ἄν, χρόνος διέλθῃ καὶ μὴ ἐκτεισθῇ τὸ ὄφλημα, τί μᾶλλον οἱ τούτου παῖδες ἔσονται τῶν ἐμῶν ἐγγεγραμμένοι, ὅταν τοὔνομα καὶ ὁ πατὴρ καὶ ἡ φυλὴ καὶ πάντ᾽ ᾖ ταὐτά; τί δ᾽, εἴ τις δίκην ἐξούλης αὐτῷ λαχὼν μηδὲν ἐμοὶ φαίη πρὸς αὑτὸν εἶναι, κυρίαν δὲ ποιησάμενος ἐγγράψαι, τί μᾶλλον ἂν εἴη τοῦτον ἢ ἔμ᾽ ἐγγεγραφώς; τί δ᾽, εἴ τινας εἰσφορὰς μὴ θείη;"</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: suit for ejectment (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Private legal proceeding against obstructing an heir &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by the injured party or a guardian/, /eponymous Archon/, /dikasterion/, /prosecutor issues oral summons at the Assembly/, /initiated by submitting a charge in writing/, /assessable penalty/, /for physically obstructing someone from their inheritance/, /penalty of one sixth of the sum at issue/, /restore property and pay cash value to state/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Private legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">ἑταιρήσεως γραφή</div>    <div class="definitionNL"><b>Definition</b>: A public indictment for exercising citizenship rights having engaged in prostitution, proceeded over by the Thesmothetae and tried by the dikasterion. If convicted, defendant receives the non-assessable penalty of death.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Aeschin. 1.20: "μηδὲ κηρυκευσάτω, μηδὲ πρεσβευσάτω, μηδὲ τοὺς πρεσβεύσαντας κρινέτω, μηδὲ συκοφαντείτω μισθωθείς, μηδὲ γνώμην εἰπάτω μηδέποτε μήτε ἐν τῇ βουλῇ μήτε ἐν τῷ δήμῳ, μηδ᾽ ἂν δεινότατος ᾖ λέγειν Ἀθηναίων. ἐὰν δέ τις παρὰ ταῦτα πράττῃ, γραφὰς ἑταιρήσεως πεποίηκε καὶ τὰ μέγιστα ἐπιτίμια ἐπέθηκεν. λέγε αὐτοῖς καὶ τοῦτον τὸν νόμον, ἵν᾽ εἰδῆτε οἵων νόμων ὑμῖν κειμένων, ὡς καλῶν καὶ σωφρόνων, τετόλμηκε Τίμαρχος δημηγορεῖν, ὁ τοιοῦτος τὸν τρόπον οἷον ὑμεῖς ἐπίστασθε."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: indictment for prostitution (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Public legal proceeding initiated in writing for prostitution &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by anyone who wishes/, /initiated by submitting a charge in writing/, /prosecutor issues oral summons at the Assembly/, /penalty of 1000 drachmas/, /thesmothetae/, /dikasterion/, /for exercising citizenship rights having engaged in prostitution/, /death/, /non-assessable penalty/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Public legal proceeding initiated in writing   &gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">εὔθυναι</div>    <div class="definitionNL"><b>Definition</b>: A public legal proceeding initiated after a magistrates term for theft of sacred or public property, proceeded over by the Thesmothetae and tried before the dikasterion. If convicted, defendant receives the assessable penalty of tenfold damages.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> --- new context ---<br>--- should contain the term ---</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: review (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Public legal proceeding initiated at the end of the term of a magistrate &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by anyone who wishes/, /initiated after a magistrates term/, /thesmothetae/, /dikasterion/, /prosecutor issues oral summons at the Assembly/, /for theft of sacred or public property/, /tenfold damages/, /assessable penalty/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Public legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">κακηγορίας δίκη</div>    <div class="definitionNL"><b>Definition</b>: A private legal proceeding for illegal defamatory speech, proceeded over by the Forty and tried before the dikasterion. If convicted, defendant receives the non-assessable penalty of a fine.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Dem. 21.32: "ἴστε δήπου τοῦθ᾽ ὅτι τῶν θεσμοθετῶν τούτων οὐδενὶ θεσμοθέτης ἔστ᾽ ὄνομα, ἀλλ᾽ ὁτιδήποθ᾽ ἑκάστῳ. ἂν μὲν τοίνυν ἰδιώτην ὄντα τιν᾽ αὐτῶν ὑβρίσῃ τις ἢ κακῶς εἴπῃ, γραφὴν ὕβρεως καὶ δίκην κακηγορίας ἰδίαν φεύξεται, ἐὰν δὲ θεσμοθέτην, ἄτιμος ἔσται καθάπαξ. διὰ τί; ὅτι τοὺς νόμους ἤδη ὁ τοῦτο ποιῶν προσυβρίζει καὶ τὸν ὑμέτερον κοινὸν στέφανον καὶ τὸ τῆς πόλεως ὄνομα: ὁ γὰρ θεσμοθέτης οὐδενὸς ἀνθρώπων ἔστ᾽ ὄνομα, ἀλλὰ τῆς πόλεως."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: defamation suit (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Private legal proceeding for illegal defamatory speech &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by the injured party or a guardian/, /initiated by submitting a charge in writing/, /the Forty/, /dikasterion/, /prosecutor issues oral summons at the Assembly/, /for illegal defamatory speech/, /fine/, /non-assessable penalty/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Private legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">κλοπῆς δίκη</div>    <div class="definitionNL"><b>Definition</b>: A private legal proceeding for theft of private property, proceeded over by the Thesmothetae and tried by the dikasterion. If convicted, defendant receives the assessable penalty of double damages. If prosecutor fails to get one-fifth of the votes, he faces the penalty of one-sixth of the sum at issue.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Aeschin. 3.10: "πολλοὶ γὰρ πάνυ τῶν ὑπευθύνων, ἐπ᾽ αὐτοφώρῳ κλέπται τῶν δημοσίων χρημάτων ὄντες ἐξελεγχόμενοι, διεφύγγανον ἐκ τῶν δικαστηρίων, εἰκότως: ᾐσχύνοντο γὰρ οἶμαι οἱ δικασταί, εἰ φανήσεται ὁ αὐτὸς ἀνὴρ ἐν τῇ αὐτῇ πόλει, πρώην1 μέν ποτε ἀναγορευόμενος ἐν τοῖς ἀγῶσιν, ὅτι στεφανοῦται ἀρετῆς ἕνεκα καὶ δικαιοσύνης ὑπὸ τοῦ δήμου χρυσῷ στεφάνῳ, ὁ δὲ αὐτὸς ἀνὴρ μικρὸν ἐπισχὼν ἔξεισιν ἐκ τοῦ δικαστηρίου κλοπῆς ἕνεκα τὰς εὐθύνας ὠφληκώς: ὥστε ἠναγκάζοντο τὴν ψῆφον φέρειν οἱ δικασταί, οὐ περὶ τοῦ παρόντος ἀδικήματος,"</div>    <div class="textItalicSmallMargin"><b>2)</b> Dem. 22.26: "δεῖν δ᾽ ᾤετο μηδέν᾽ ἀποστερεῖσθαι τοῦ δίκης τυχεῖν, ὡς ἕκαστος δύναται. πῶς οὖν ἔσται τοῦτο; ἐὰν πολλὰς ὁδοὺς δῷ διὰ τῶν νόμων ἐπὶ τοὺς ἠδικηκότας οἷον τῆς κλοπῆς. ἔρρωσαι καὶ σαυτῷ πιστεύεις: ἄπαγε: ἐν χιλίαις δ᾽ ὁ κίνδυνος. ἀσθενέστερος εἶ: τοῖς ἄρχουσιν ἐφηγοῦ: τοῦτο ποιήσουσιν ἐκεῖνοι. φοβεῖ καὶ τοῦτο: γράφου."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: suit for theft (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Private legal proceeding against theft&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by the injured party or a guardian/, /thesmothetae/, /dikasterion/, /for theft of private property/, /double damages/, /assessable penalty/, /penalty of one sixth of the sum at issue/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Private legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">μοιχείας γραφή</div>    <div class="definitionNL"><b>Definition</b>: A public indictment for illicit consensual sex with a woman, proceeded over by the Thesmothetae and tried by the dikasterion. If convicted, defendant receives an assessable penalty.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Lys. 1.36: "οἷς ὑμᾶς ἀξιῶ τὴν αὐτὴν γνώμην ἔχειν: εἰ δὲ μή, τοιαύτην ἄδειαν τοῖς μοιχοῖς ποιήσετε, ὥστε1 καὶ τοὺς κλέπτας ἐπαρεῖτε φάσκειν μοιχοὺς εἶναι, εὖ εἰδότας ὅτι, ἐὰν ταύτην τὴν αἰτίαν περὶ ἑαυτῶν λέγωσι καὶ ἐπὶ τούτῳ φάσκωσιν εἰς τὰς ἀλλοτρίας οἰκίας εἰσιέναι, οὐδεὶς αὐτῶν ἅψεται. πάντες γὰρ εἴσονται ὅτι τοὺς μὲν νόμους τῆς μοιχείας χαίρειν ἐᾶν δεῖ, τὴν δὲ ψῆφον τὴν ὑμετέραν δεδιέναι: αὕτη γάρ ἐστι πάντων τῶν ἐν τῇ πόλει κυριωτάτη."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: indictment for seduction (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Public legal proceeding initiated in writing against illegal consensual sex &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by anyone who wishes/, /initiated by submitting a charge in writing/, /prosecutor issues oral summons at the Assembly/, /penalty of 1000 drachmas/, /thesmothetae/, /dikasterion/, /for illicit consensual sex with a woman/, /assessable penalty/, /penal assessment/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Public legal proceeding initiated in writing   &gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">ξενίας γραφή</div>    <div class="definitionNL"><b>Definition</b>: A public indictment for exercising citizenship rights as a noncitizen, proceeded over by the Thesmothetae and tried by the dikasterion. If convicted, defendant receives the non-assessable penalty of enslavement.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Dem. 24.131: "μὴ τοίνυν αὐτοὶ διδάσκετε, ἀλλὰ τιμωρεῖσθε. καὶ μὴ ἐᾶτ᾽ ἀγανακτεῖν εἰ δεθήσονται ἔχοντες τὰ ὑμέτερα ἀλλ᾽ ἄγετ᾽ αὐτοὺς ὑπὸ τοὺς νόμους. οὐδὲ γὰρ οἱ τῆς ξενίας ἁλισκόμενοι ἀγανακτοῦσιν ἐν τῷ οἰκήματι τούτῳ ὄντες, ἕως ἂν τῶν ψευδομαρτυριῶν ἀγωνίσωνται, ἀλλὰ μένουσιν καὶ οὐκ οἴονται δεῖν ἐγγυητὰς καταστήσαντες περιιέναι."</div>    <div class="textItalicSmallMargin"><b>2)</b> Isaeus 3.37: "ἆρ᾽ οὖν δοκεῖ τῳ ὑμῶν ὀλιγώρως οὕτως ἔχειν χρημάτων Νικόδημος, ὥστε παραλιπεῖν ἄν τι τῶν τοιούτων; ἐγὼ μὲν γὰρ οὐ νομίζω. εἶτα παρὰ τούτου ὁ ἡμέτερος θεῖος ἠξίωσεν ἂν ἐγγυήσασθαι τὴν ἀδελφήν, ὃς αὐτὸς ξενίας φεύγων ὑπὸ ἑνὸς τῶν φρατόρων ὧν φησιν αὑτοῦ εἶναι, παρὰ τέτταρας ψήφους μετέσχε τῆς πόλεως; καὶ ὡς ἀληθῆ λέγω, ἀναγίγνωσκε τὴν μαρτυρίαν."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: indictment for false assertion of citizenship (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Public legal proceeding initiated in writing for citizenship violations&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by anyone who wishes/, /initiated by submitting a charge in writing/, /prosecutor issues oral summons at the Assembly/, /penalty of 1000 drachmas/, /thesmothetae/, /dikasterion/, /for exercising citizenship rights as a noncitizen/, /enslavement/, /non-assessable penalty/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Public legal proceeding initiated in writing   &gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">παραγραφή</div>    <div class="definitionNL"><b>Definition</b>: A private legal proceeding initiated by submitting a charge in writing to block an illegal prosecution, tried before the dikasterion.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Dem. 45.42: "οὐκοῦν ἐναντία μὲν ἡ παραγραφὴ πᾶσι τοῖς μεμαρτυρημένοις, ἐναντία δ᾽ ἣν ἀνέγνων ὑμῖν ἄρτι μίσθωσιν, τῇδε τῇ διαθήκῃ: οὐδὲν δὲ τῶν πεπραγμένων οὔτ᾽ εὔλογον οὔθ᾽ ἁπλοῦν οὔθ᾽ ὁμολογούμενον αὐτὸ ἑαυτῷ φαίνεται. ἐκ δὲ τούτου τοῦ τρόπου πάντα πεπλασμένα καὶ κατεσκευασμέν᾽ ἐλέγχεται." </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: counter-indictment (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Private legal proceeding against an illegal prosecution &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by the injured party or a guardian/, /initiated by submitting a charge in writing/, /dikasterion/, /to block an illegal prosecution/, /prosecutor issues oral summons at the Assembly/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Private legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">παρανόμων γραφή</div>    <div class="definitionNL"><b>Definition</b>: A public indictment for proposing or enacting an illegal law, proceeded over by the Assembly and tried by the dikasterion. If convicted, defendant receives the assessable penalty of the annulment of their law and disenfranchisement if convicted three times.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Dem. 18.13: " ἀλλ᾽ ἐφ᾽ οἷς ἀδικοῦντά μ᾽ ἑώρα τὴν πόλιν, οὖσί γε τηλικούτοις ἡλίκα νῦν ἐτραγῴδει καὶ διεξῄει, ταῖς ἐκ τῶν νόμων τιμωρίαις παρ᾽ αὐτὰ τἀδικήματα χρῆσθαι, εἰ μὲν εἰσαγγελίας ἄξια πράττονθ᾽ ἑώρα, εἰσαγγέλλοντα καὶ τοῦτον τὸν τρόπον εἰς κρίσιν καθιστάντα παρ᾽ ὑμῖν, εἰ δὲ γράφοντα παράνομα, παρανόμων γραφόμενον"</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: indictment for illegal proposals (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Public legal proceeding initiated in writing against the proposal or enactment of an illegal law &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by anyone who wishes/, /initiated by submitting a charge in writing/, /prosecutor issues oral summons at the Assembly/, /penalty of 1000 drachmas/, /the Assembly/, /dikasterion/, /for proposing or enacting an illegal law/, /annulment of law/, /assessable penalty/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Public legal proceeding initiated in writing   &gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">προβολή</div>    <div class="definitionNL"><b>Definition</b>: A public legal proceeding initiated by a vote before the Assembly to condemn the offender with a formal sanction.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Dem. 21.193: "οἶμαι τοίνυν αὐτὸν οὐδὲ τοῦ δήμου κατηγορεῖν ὀκνήσειν οὐδὲ τῆς ἐκκλησίας, ἀλλ᾽ ἅπερ τότ᾽ ἐτόλμα λέγειν ὅτ᾽ ἦν ἡ προβολή, ταῦτα καὶ νῦν ἐρεῖν, ὡς ὅσοι δέον ἐξιέναι κατέμενον καὶ ὅσοι τὰ φρούρι᾽ ἦσαν ἔρημα λελοιπότες, ἐξεκλησίασαν, καὶ χορευταὶ καὶ ξένοι καὶ τοιοῦτοί τινες ἦσαν οἳ κατεχειροτόνησαν αὐτοῦ."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: presentation (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Public legal proceedings to present an offender for formal sanctions &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by anyone who wishes/, /initiated by a vote before the Assembly to condemn or acquit the offender /, /the Assembly/, /prosecutor issues oral summons at the Assembly/, /formal sanction/, /penalty of 1000 drachmas/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Public legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">σίτου δίκη</div>    <div class="definitionNL"><b>Definition</b>: A private legal proceeding to claim interest owed on a dowry, proceeded over by the Eponymous Archon and tried before the dikasterion. If convicted, defendant receives the assessable penalty of a fine. If prosecutor fails to get one-fifth of the votes, he faces the penalty of one-sixth of the sum at issue.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Dem 59.53: "τὸν μὲν τοίνυν νόμον ἀνέγνω ὑμῖν, καθ᾽ ὃν ἐγράφη Στέφανος οὑτοσὶ ὑπὸ τοῦ Φράστορος πρὸς τοὺς θεσμοθέτας. γνοὺς δ᾽ ὅτι κινδυνεύσει ἐξελεγχθεὶς ξένης θυγατέρα ἠγγυηκέναι καὶ ταῖς ἐσχάταις ζημίαις περιπεσεῖν, διαλλάττεται πρὸς τὸν Φράστορα καὶ ἀφίσταται τῆς προικός, καὶ τὴν δίκην τοῦ σίτου ἀνείλετο, καὶ ὁ Φράστωρ τὴν γραφὴν παρὰ τῶν θεσμοθετῶν. καὶ ὡς ἀληθῆ λέγω, τούτων ὑμῖν μάρτυρα αὐτὸν τὸν Φράστορα καλῶ, καὶ ἀναγκάσω μαρτυρεῖν κατὰ τὸν νόμον."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: suit for maintenance (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Private legal proceeding for interest on dowry &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by the injured party or a guardian/, /dikasterion/, /prosecutor issues oral summons at the Assembly/, /to claim interest owed on a dowry/, /fine/, /assessable penalty/, /penalty of one sixth of the sum at issue/, /eponymous Archon/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Private legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">τραύματος ἐκ προνοίας γραφή</div>    <div class="definitionNL"><b>Definition</b>: A public indictment for intentional wounding with a weapon, tried by the Council of the Areopagus. If convicted, defendant receives the non-assessable penalty of exile and confiscation of property.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Dem 23.22: "δικάζειν δὲ τὴν βουλὴν τὴν ἐν Ἀρείῳ πάγῳ φόνου καὶ τραύματος ἐκ προνοίας καὶ πυρκαϊᾶς καὶ φαρμάκων, ἐάν τις ἀποκτείνῃ δούς."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: intentional wounding suit (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Public legal proceeding initiated in writing against intentional wounding with a weapon &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by anyone who wishes/, /initiated by submitting a charge in writing/, /prosecutor issues oral summons at the Assembly/, /penalty of 1000 drachmas/, /council of the Areopagus/, /for intentional wounding with a weapon/, /exile and confiscation/, /non-assessable penalty/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Public legal proceeding initiated in writing   &gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">ὕβρεως γραφή</div>    <div class="definitionNL"><b>Definition</b>: A public indictment for crimes of hubris, proceeded over by the Thesmothetae and tried by the dikasterion. If convicted, defendant receives an assessable penalty.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Dem. 37.33: "ἐνταυθὶ πόλλ᾽ ἄττα καὶ δεινά μοι ἅμ᾽ ἐγκαλεῖ: καὶ γὰρ αἴκειαν καὶ ὕβριν καὶ βιαίων καὶ πρὸς ἐπικλήρους ἀδικήματα. τούτων δ᾽ εἰσὶν ἑκάστου χωρὶς αἱ δίκαι καὶ οὔτε πρὸς ἀρχὴν τὴν αὐτὴν οὔθ᾽ ὑπὲρ τιμημάτων τῶν αὐτῶν, ἀλλ᾽ ἡ μὲν αἴκεια καὶ τὰ τῶν βιαίων πρὸς τοὺς τετταράκοντα, αἱ δὲ τῆς ὕβρεως πρὸς τοὺς θεσμοθέτας, ὅσα δ᾽ εἰς ἐπικλήρους, πρὸς τὸν ἄρχοντα. οἱ δὲ νόμοι καὶ τούτων διδόασι τὰς παραγραφὰς ἀντιλαγχάνειν, περὶ ὧν οὐκ εἰσὶν εἰσαγωγεῖς. λέγε δ᾽ αὐτοῖς τουτονὶ τὸν νόμον."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: indictment for hubris (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Public legal proceeding initiated in writing against crimes against humanity &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by anyone who wishes/, /initiated by submitting a charge in writing/, /prosecutor issues oral summons at the Assembly/, /penalty of 1000 drachmas/, /thesmothetae/, /dikasterion/, /penal assessment/, /assessable penalty/, /for crimes of hubris/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Public legal proceeding initiated in writing   &gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">φόνος ἀκούσιος δίκη</div>    <div class="definitionNL"><b>Definition</b>: A private legal proceeding for unintentional homicide, initiated with a proclamation at funeral of victim, proceeded over by the Basileus and tried before the 51 Ephetai. If convicted, the defendant receives the non-assessable penalty of exile.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Antiph. 3 3.7: "ἀκουσίως δὲ οὐχ ἧσσον ἢ ἑκουσίως ἀποκτείναντες1 μου τὸν παῖδα, τὸ παράπαν δ᾽ ἀρνούμενοι2 μὴ ἀποκτεῖναι αὐτόν, οὐδ᾽ ὑπὸ τοῦ νόμου καταλαμβάνεσθαί φασιν,3 ὃς ἀπαγορεύει μήτε δικαίως μήτε ἀδίκως ἀποκτείνειν. ἀλλὰ τίς ὁ βαλών; εἰς τίν᾽ ὁ φόνος ἀνήκει;4 εἰς τοὺς θεωμένους ἢ εἰς τοὺς παιδαγωγοὺς, ὧν οὐδεὶς οὐδὲν κατηγορεῖ; οὐ γὰρ ἀφανὴς ἀλλὰ καὶ λίαν φανερὸς ἔμοιγε αὐτοῦ ὁ θάνατός ἐστιν. ἐγὼ δὲ τὸν νόμον ὀρθῶς ἀγορεύειν φημὶ τοὺς ἀποκτείναντας κολάζεσθαι: ὅ τε γὰρ ἄκων ἀποκτείνας ἀκουσίοις κακοῖς περιπεσεῖν δίκαιός ἐστιν, ὅ τε διαφθαρεὶς οὐδὲν ἧσσον ἀκουσίως ἢ ἑκουσίως βλαφθεὶς ἀδικοῖτ᾽ ἂν ἀτιμώρητος γενόμενος."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: unintentional homicide suit (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Private legal proceeding for unintentional homicide&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by the injured party or a guardian/, /initiated with a proclamation at funeral of victim/, /basileus/, /51 ephetai/, /proclamation at funeral of victim/, /non-assessable penalty/, /for unintentional homicide/, /exile/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Private legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">φόνος ἑκούσιος δίκη</div>    <div class="definitionNL"><b>Definition</b>: A private legal proceeding for intentional homicide, initiated with a proclamation at funeral of victim, proceeded over by the Basileus and tried before the Council of the Areopagus. If convicted, the defendant receives the non-assessable penalty of death and confiscation.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Antiph. 3 3.7: "ἀκουσίως δὲ οὐχ ἧσσον ἢ ἑκουσίως ἀποκτείναντες1 μου τὸν παῖδα, τὸ παράπαν δ᾽ ἀρνούμενοι2 μὴ ἀποκτεῖναι αὐτόν, οὐδ᾽ ὑπὸ τοῦ νόμου καταλαμβάνεσθαί φασιν,3 ὃς ἀπαγορεύει μήτε δικαίως μήτε ἀδίκως ἀποκτείνειν. ἀλλὰ τίς ὁ βαλών; εἰς τίν᾽ ὁ φόνος ἀνήκει;4 εἰς τοὺς θεωμένους ἢ εἰς τοὺς παιδαγωγοὺς, ὧν οὐδεὶς οὐδὲν κατηγορεῖ; οὐ γὰρ ἀφανὴς ἀλλὰ καὶ λίαν φανερὸς ἔμοιγε αὐτοῦ ὁ θάνατός ἐστιν. ἐγὼ δὲ τὸν νόμον ὀρθῶς ἀγορεύειν φημὶ τοὺς ἀποκτείναντας κολάζεσθαι: ὅ τε γὰρ ἄκων ἀποκτείνας ἀκουσίοις κακοῖς περιπεσεῖν δίκαιός ἐστιν, ὅ τε διαφθαρεὶς οὐδὲν ἧσσον ἀκουσίως ἢ ἑκουσίως βλαφθεὶς ἀδικοῖτ᾽ ἂν ἀτιμώρητος γενόμενος."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: intentional homicide suit (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Private legal proceeding for intentional homicide&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by the injured party or a guardian/, /initiated with a proclamation at funeral of victim/, /basileus/, /council of the Areopagus/, /proclamation at funeral of victim/, /for intentional homicide/, /death and confiscation/, /non-assessable penalty/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Private legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">ψευδομαρτυριῶν δίκη</div>    <div class="definitionNL"><b>Definition</b>: A private legal proceeding for providing false witness testimony, tried before the dikasterion.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Dem. 24.131: "οὐδὲ γὰρ οἱ τῆς ξενίας ἁλισκόμενοι ἀγανακτοῦσιν ἐν τῷ οἰκήματι τούτῳ ὄντες, ἕως ἂν τῶν ψευδομαρτυριῶν ἀγωνίσωνται, ἀλλὰ μένουσιν καὶ οὐκ οἴονται δεῖν ἐγγυητὰς καταστήσαντες περιιέναι."</div>    <div class="textItalicSmallMargin"><b>2)</b> Isaeus 11.46: "δίκαι γὰρ ἐνεστήκασι ψευδομαρτυρίων, κελεύει δ᾽ ὁ νόμος, ἐὰν ἁλῷ τις τῶν ψευδομαρτυρίων, πάλιν ἐξ ἀρχῆς εἶναι περὶ αὐτῶν τὰς λήξεις: τὰ δὲ τοῦ παιδὸς ὡμολογημένα καὶ ἀναμφισβήτητα καταλέλοιπε Στρατοκλῆς. ὅτι δὲ τοσαῦτά ἐστι τἀμὰ σὺν τοῖς τοῦ ἐκποιήτου ὑέος, καὶ ψευδομαρτυριῶν ἐνεστᾶσι δίκαι περὶ τῶν Ἁγνίου, λαβὲ τὰς μαρτυρίας καὶ ἀνάγνωθι."</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: false witness suit (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Private legal proceeding for providing false witness testimony &gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /brought forward by the injured party or a guardian/, /initiated by submitting a charge in writing/, /prosecutor issues oral summons at the Assembly/, /dikasterion/, /for providing false witness testimony/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Private legal proceeding&gt;</div></div></div><div class="otherEntry"></div></div>'],
];
function show_selected() {
    var selector = document.getElementById('idTerm');
    var champ = dictionnaire[selector[selector.selectedIndex].value][0];
    document.getElementById('display').innerHTML = champ;
}
document.getElementById('idTerm').addEventListener('change', show_selected);

searchBox = document.querySelector("#searchBox");
entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});

</script>
