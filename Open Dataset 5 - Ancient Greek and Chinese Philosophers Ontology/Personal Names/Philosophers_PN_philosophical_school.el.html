<script language="JavaScript">
var dictionnaire = [
    ['<div class="terminologyEntry">    <div class="term">Διαλεκτική σχολή</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας ελληνικής φιλοσοφίας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η «Διαλεκτική Σχολή» αναφέρεται σε μια ομάδα πρώιμων Ελληνορωμαϊκών φιλοσόφων, όπως ο Διόδωρος ο Κρόνος και ο Φίλων ο Λογικός, που επικεντρώθηκαν στη διαλεκτική σκέψη και τα λογικά παραδόξα. Συνέβαλαν σημαντικά στη θεωρία των προτασιακών λογικών, με τον Φίλωνα να εισάγει την υλική υπόθεση και τον Διόδωρο να αναπτύσσει μια μορφή αυστηρής υπόθεσης. Δραστηριοποιήθηκαν από τον τελευταίο 4ο έως τα μέσα του 3ου αιώνα π.Χ. και συνδέονται, αλλά είναι διακριτοί από τη Μέγαρη Σχολή. Το έργο τους έθεσε θεμέλια για τη σύγχρονη τροπική λογική και τη θεωρία των προτάσεων.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Bobzien, Susanne and Matthew Duncombe, "Dialectical School", The Stanford Encyclopedia of Philosophy (Fall 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2023/entries/dialectical-school/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Dialectical school</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: dialectical_school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Διόδωρος Κρόνος</div>    <div class="attributeIndividual"> <u>hasMember</u>: Αριστοτέλης ο Διαλεκτικός, Διονύσιος ο Χαλκηδόνιος, Φίλων ο Διαλεκτικός</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ελεατική σχολή</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας ελληνικής φιλοσοφίας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Φιλοσοφική σχολή του 5ου αιώνα με βασικούς εκπροσώπους τον Παρμενίδη τον Ελεάτη, τον Ζήνωνα τον Ελεάτη και τον Μέλισσο από τη Σάμο. Ο Παρμενίδης έκανε λόγο για τη μοναδική Αλήθεια και η διαφύλάξη της παρμενιδικής αυτής διδασκαλίας από τον Ζήνωνα αποτελεί το πιο γνωστό έργο της σχολής, βέβαια ο Ζήνων μπορεί να απέρριψε την ενότητα και την πολλαπλότητα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Chisholm, Hugh, ed. (1911). "Eleatic School". Encyclopædia Britannica. Vol. 9 (11th ed.). Cambridge University Press. pp. 168–169. Via: https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Eleatic_School</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Eleatic school</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: eleatic school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Ζήνων ο Ελεάτης, Παρμενίδης ο Ελεάτης, Μέλισσος ο Σάμιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Eleatic_School" target="_blank" rel="noopener">https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Eleatic_School</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/parmenides/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/parmenides/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/zeno-elea/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/zeno-elea/</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Επικούρεια σχολή</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας ελληνικής φιλοσοφίας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Επίκουρος ίδρυσε γύρω στο 307 π.Χ. τη σχολή του, τον "Κήπο". Για τον Επίκουρο, η φιλοσοφία είναι άρρηκτα συνδεδεμένη με τη μελέτη των φυσικών φαινομένων και είναι τόσο διδακτική, καθώς βοηθά τον άνθρωπο να μετριάσει τις ανάγκες του προκειμένου να φτάσει στην ἡδονή (ηδονή), όσο και θεραπευτική, καθώς απελευθερώνει τον άνθρωπο από το φόβο του θανάτου, των θεών και του πόνου.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Konstan, David, "Epicurus", The Stanford Encyclopedia of Philosophy (Fall 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2022/entries/epicurus/&gt;.</div>    <div class="textItalicSmallMargin"><b>2)</b> Diano, Carlo and Duignan, Brian. "Epicureanism". Encyclopedia Britannica, 16 Jul. 2024, https://www.britannica.com/topic/Epicureanism. Accessed 19 August 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Epicurean school</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: epicurean school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Επίκουρος</div>    <div class="attributeIndividual"> <u>hasMember</u>: Αλβούκιος Τίτος, Απολλόδωρος ο Επικούρειος, Βατίς από τη Λάμψακο, Καρνείσκος, Κωλώτης ο Λαμψακηνός, Δαμοφάνης, Δημητρία, Δημήτριος ο Λάκων, Διόδωρος (Επικούρειος), Διογένης (Επικούρειος), Διογένης ο Οινοανδεύς, Διογένης από τη Σελεύκεια, Διογένης ο Ταρσεύς, Διονύσιος ο Ρόδιος, Ευκρατίδης ο Ρόδιος, Εύδημος, Ηδεία, Ηλιόδωρος (Επικούρειος), Έρμαρχος ο Μυτιληναίος, Ιπποκλείδης, Ιδομενεύς ο Λαμψακηνός, Ειρηναίος ο Μιλήσιος, Λεόντιον, Λεόντιος από τη Λάμψακο, Λέπιδος, Μαμμάριον, Μενέστρατος, Μητρόδωρος ο Λαμψακηνός (Επικούρειος), Ωρίων, Πάτρων ο Επικούρειος, Φαίδρος ο Επικούρειος, Φιλίσκος, Φιλόδημος ο Γαδαρεύς, Φιλωνίδης, Πoλύαινoς o Λαμψακηνός, Πολύστρατος ο Επικούρειος, Πτολεμαίος ο μέλας, Πτολεμαίος ο λευκός, Ζήνων ο Σιδώνιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikisource.org/wiki/Lives_of_the_Eminent_Philosophers/Book_X" target="_blank" rel="noopener">https://en.wikisource.org/wiki/Lives_of_the_Eminent_Philosophers/Book_X</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://epicurus.net/" target="_blank" rel="noopener">https://epicurus.net/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://web.archive.org/web/20040404213456/http://epicurus.info/" target="_blank" rel="noopener">https://web.archive.org/web/20040404213456/http://epicurus.info/</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Κυνισμός</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας ελληνικής φιλοσοφίας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Οι Κυνικοί, αρχίζοντας από τον Αντισθένη και περιλαμβάνοντας σημαντικές μορφές όπως ο Διογένης ο Σινωπεύς, ο Κράτης και αργότερα ο Ζήνων ο Κιτιεύς, επικέντρωσαν στην ζωή σύμφωνα με τη φύση και την απόρριψη των κοινωνικών κανόνων. Υποστήριζαν την ασκητική ζωή, την αυτονομία και την απλότητα, θεωρώντας ότι η ηθική είναι ένας πρακτικός τρόπος ζωής παρά μια θεωρητική διδασκαλία. Ο τρόπος ζωής και οι διδασκαλίες τους επηρέασαν τις επόμενες φιλοσοφικές σχολές, κυρίως τον Στωικισμό. Παρά τα περιορισμένα σωζόμενα κείμενα, η ηθική τους είναι γνωστή μέσω του ιδιαίτερου τρόπου ζωής τους και των πρακτικών τους.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Cynic school</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: cynicism</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Διογένης ο Σινωπεύς, Αντισθένης, Κράτης ο Θηβαίος</div>    <div class="attributeIndividual"> <u>hasMember</u>: Βίων ο Βορυσθενίτης, Καρνείος ο Μεγαρεύς, Κερκιδάς ο Μεγαλοπολίτης, Κυνούλκος, Δημήτριος ο Αλεξανδρεύς (Κυνικός), Δημήτριος από το Σούνιο, Δημώναξ ο Κύπριος, Αγαθόβουλος ο Αλεξανδρεύς, Δημήτριος ο Κυνικός, Εχεκλής ο Εφέσιος, Ηγησίας ο Σινωπεύς, Ιππαρχία η Μαρώνεια, Ονοράτος, Ιάσων ο Νυσαεύς, Μελέαγρος o Γαδαρεύς, Μενέδημος ο Κυνικός, Μένιππος ο Γαδαρεύς, Μητροκλής από τη Μαρώνεια, Μόνιμος ο Συρακούσιος, Οινόμαος ο Γαδαρηνός, Ονησίκριτος από την Αστυπάλαια, Πανκράτης, Πανταίνος, Περεγρίνος Πρωτεύς, Φιλίσκος Αιγινήτης, Θεόμβροτος, Θράσυλλος ο Κυνικός, Ζωίλος από την Αμφίπολη</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/cynics/" target="_blank" rel="noopener">https://iep.utm.edu/cynics/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://xtf.lib.virginia.edu/xtf/view?docId=DicHist/uvaBook/tei/DicHist1.xml;chunk.id=dv1-75" target="_blank" rel="noopener">https://xtf.lib.virginia.edu/xtf/view?docId=DicHist/uvaBook/tei/DicHist1.xml;chunk.id=dv1-75</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikisource.org/wiki/Catholic_Encyclopedia_(1913)/Cynic_School_of_Philosophy" target="_blank" rel="noopener">https://en.wikisource.org/wiki/Catholic_Encyclopedia_(1913)/Cynic_School_of_Philosophy</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Cynicism_(philosophy)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Cynicism_(philosophy)</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Κυρηναϊκή σχολή</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας ελληνικής φιλοσοφίας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Οι Κυρηναϊκοί, που ιδρύθηκαν από τον Αρίστιππο, ήταν μία μικρή σωκρατική σχολή γνωστή για την εμπειριστική και σκεπτικιστική τους επιγνώση και την αισθησιακή ηδονιστική τους φιλοσοφία. Υποστήριξαν ότι μπορούμε να έχουμε βεβαιότητα μόνο για τις άμεσες αισθητηριακές μας εμπειρίες (π.χ., ότι βλέπουμε κάτι λευκό), αλλά δεν μπορούμε να γνωρίσουμε τα εξωτερικά αντικείμενα ή τον εξωτερικό κόσμο πέρα από αυτές τις εμπειρίες. Πίστευαν ότι η ηδονή είναι το ανώτερο αγαθό, με τις άμεσες σωματικές ηδονές να είναι προτιμότερες από τις καθυστερημένες ή πνευματικές. Σημαντικοί εκπρόσωποι περιλαμβάνουν τον Αρίστιππο, τον μαθητή του Αρίστιππο τον Νεότερο και αργότερους Κυρηναϊκούς όπως τον Ηγέσια, τον Αννικέρη και τον Θεόδωρο. Οι απόψεις τους επηρεάσαν αργότερα φιλοσοφικές συζητήσεις, ιδιαίτερα στον σκεπτικισμό και ηδονισμό.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/cynics/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Cyrenaic school</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: cyrenaic_school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Αρίστιππος ο Κυρηναίος</div>    <div class="attributeIndividual"> <u>hasMember</u>: Αννίκερις ο Κυρηναίος, Αντίπατρος ο Κυρηναίος, Αρήτη η Κυρηναία, Αρίστιππος ο Μητροδίδακτος, Αριστοτέλης ο Κυρηναίος, Διονύσιος ο Ηρακλεώτης, Επιτιμίδης ο Κυρηναίος, Ηγησίας ο Πεισιθάνατος, Παραιβάτης, Θεόδωρος ο Κυρηναίος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Cyrenaics" target="_blank" rel="noopener">https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Cyrenaics</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://lucianofsamosata.info/wiki/doku.php?id=cyrenaics:cyrenaics" target="_blank" rel="noopener">http://lucianofsamosata.info/wiki/doku.php?id=cyrenaics:cyrenaics</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/cyrenaics/" target="_blank" rel="noopener">https://iep.utm.edu/cyrenaics/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikisource.org/wiki/Catholic_Encyclopedia_(1913)/Cyrenaic_School_of_Philosophy" target="_blank" rel="noopener">https://en.wikisource.org/wiki/Catholic_Encyclopedia_(1913)/Cyrenaic_School_of_Philosophy</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Μεγαρική σχολή</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας ελληνικής φιλοσοφίας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Μεγαρική φιλοσοφική σχολή, η οποία άνθισε τον 4ο αιώνα π.Χ., ιδρύθηκε από τον Ευκλείδη από τα Μέγαρα, ένας από τους μαθητές του Σωκράτη. Οι ηθικές της διδασκαλίες αντλήθηκαν από τον Σωκράτη, αναγνωρίζοντας ένα και μοναδικό αγαθό.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Bobzien, Susanne and Matthew Duncombe, "Dialectical School", The Stanford Encyclopedia of Philosophy (Fall 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2023/entries/dialectical-school/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Megarian School</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: megarian school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Ευκλείδης ο Μεγαρεύς, Στίλπων ο Μεγαρεύς, Διονύσιος ο Χαλκηδόνιος</div>    <div class="attributeIndividual"> <u>hasMember</u>: Αλεξίνος ο Ηλείος, Απολλώνιος Κρόνος, Κλεινόμαχος από τους Θουρείους, Διοκλείδης (Μεγαρικός φιλόσοφος), Ευβουλίδης ο Μιλήσιος, Εύφαντος από την Όλυνθο, Ιχθύας, Μενέλαος, Πασικλής ο Θηβαίος, Θρασύμαχος ο Κορίνθιος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Μέσος πλατωνισμός</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας ελληνικής φιλοσοφίας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Μέσος Πλατωνισμός (περίπου 130 π.Χ. - 70 μ.Χ.) ξεκινά με τον Αντίοχο τον Ασκαλωνίτη και τελειώνει με τον Πλωτίνο, τον ιδρυτή του Νεοπλατωνισμού. Αυτή η περίοδος επικεντρώνεται στην ερμηνεία των έργων του Πλάτωνα, ιδιαίτερα των Αγράφων Διδασκαλιών του και της σχέσης τους με το διάλογο «Τίμαιος». Οι Πλατωνιστές, όπως ο Αντίοχος και ο Εύδωρος ο Αλεξανδρεύς, προσπαθούσαν να συμφιλιώσουν τον Πλατωνικό, τον Αριστοτελικό και τον Στωϊκό φιλοσοφικό λόγο. Σημαντικές προσωπικότητες ήταν ο Φίλων ο Αλεξανδρεύς, που επηρέασε τον Χριστιανισμό, και ο Πλούταρχος, γνωστός για τη συγκρητιστική του προσέγγιση.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/midplato/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Middle Platonism</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: middle_platonism</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Αντίοχος ο Ασκαλωνίτης</div>    <div class="attributeIndividual"> <u>hasMember</u>: Εύδωρος ο Αλεξανδρεύς, Αρποκρατίων ο Αργείος, Αττικός, Λυσίμαχος (μαθητής του Θεόφραστου), Μνασέας ο Τύριος, Ονόσανδρος, Φίλων ο Αλεξανδρεύς, Πλούταρχος ο Χαιρωνεύς, Ταύρος ο Τύριος, Θέων ο Σμυρναίος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Νεοπλατωνική σχολή</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας ελληνικής φιλοσοφίας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Φιλοσοφικό κίνημα που ξεκίνησε από τον Πλωτίνο τον 3ο αι. μ.Χ., το οποίο επανερμήνευσε τις ιδέες του Πλάτωνα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Wildberg, Christian, "Neoplatonism", The Stanford Encyclopedia of Philosophy (Winter 2021 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/win2021/entries/neoplatonism/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Neoplatonist school</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: neoplatonist school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Ιάμβλιχος ο Χαλκιδεύς, Πλωτίνος</div>    <div class="attributeIndividual"> <u>hasMember</u>: Ιέριος, Μάξιμος από τη Νίκαια, Ωριγένης από την Αλεξάνδρεια, Πατέριος, Πλωτίνος, Πτολεμαίος, Θεόδωρος ο Ασιναίος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/neoplatonism/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/neoplatonism/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/neoplato/" target="_blank" rel="noopener">https://iep.utm.edu/neoplato/</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Νεοπυθαγορισμός</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας ελληνικής φιλοσοφίας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Σχολή ελληνιστικής και ρωμαϊκής φιλοσοφίας περίπου στις αρχές του πρώτου αιώνα μ.Χ., η οποία αναβίωσε τα πυθαγόρεια δόγματα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Huffman, Carl, "Pythagoreanism", The Stanford Encyclopedia of Philosophy (Summer 2024 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/sum2024/entries/pythagoreanism/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Neopythagoreanism</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: neopythagorean school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Απολλώνιος ο Τυανέας, Μοδεράτος από τα Γάδειρα</div>    <div class="attributeIndividual"> <u>hasMember</u>: Λούκιος Κορνήλιος Αλέξανδρος, Ισαγόρας ο Θεσσαλός, Νικόμαχος από τα Γέρασα</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/pythagoreanism/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/pythagoreanism/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Neopythagoreanism" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Neopythagoreanism</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Περιπατική σχολή</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας ελληνικής φιλοσοφίας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Περιπατητική Σχολή του Αριστοτέλη ιδρύθηκε το 335 π.Χ. στο Λύκειο της Αθήνας. Ο Αριστοτέλης, 50 ετών τότε, δημιούργησε μια βιβλιοθήκη και συγκέντρωσε μια ομάδα μαθητών γύρω του, γνωστών ως "περιπατητικοί" λόγω της συνήθειάς τους να περπατούν και να συζητούν στον Περίπατο του Λυκείου. Η σχολή δεν ήταν κλειστός σύλλογος, αλλά τακτικά ανοιχτή στο κοινό με διαλέξεις. Τα κυριότερα έργα του Αριστοτέλη πιθανόν να γράφτηκαν κατά την περίοδο αυτή, με συνεχή αναθεώρηση. Οι Περιπατητικοί ασχολούνταν με φιλοσοφικές και επιστημονικές αναζητήσεις, και η σχολή περιλάμβανε διάφορα οικοδομήματα όπως γυμνάσιο, παλαίστρα και ιερά.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/lyceum/</div>    <div class="textItalicSmallMargin"><b>2)</b> Lynch, J. (1997), "Lyceum", in Zeyl, Donald J.; Devereux, Daniel; Mitsis, Phillip (eds.), Encyclopedia of Classical Philosophy, Greenwood Press, ISBN 0-313-28775-9. Via https://archive.org/details/encyclopediaofcl00zeyl</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Peripatetic School</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: peripatetic school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Αριστοτέλης, Θεόφραστος</div>    <div class="attributeIndividual"> <u>hasMember</u>: Αινησίας από τη Μεγαλόπολη, Αλέξανδρος ο Αφροδισιεύς, Ανδρόνικος ο Ρόδιος, Απελλικών ο Τήιος, Αριστόβουλος ο Αλ "https://en.wikipedia.org/wiki/Peripatetic_school" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Peripatetic_school</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Πλατωνισμός</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας ελληνικής φιλοσοφίας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο πρώιμος πλατωνισμός, ή η Πρώιμη Ακαδημία, είναι η φάση της πλατωνικής φιλοσοφίας κατά τη διάρκεια της ζωής του Πλάτωνα και μετά το θάνατό του, η οποία χαρακτηρίζεται από το έργο των πρώτων διαδόχων του, όπως ο Σπεύσιππος, ο Ξενοκράτης και ο Πολέμωνας. Η περίοδος αυτή επικεντρώθηκε στην ερμηνεία των κειμένων και της ηθικής του Πλάτωνα, χωρίς τα περίτεχνα μεταφυσικά συστήματα του μεταγενέστερου Πλατωνισμού, και ενσωμάτωσε στοιχεία από τον Αριστοτέλη και τον Πυθαγορισμό.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Dillon, J. 1998, &apos;Platonism, Early and Middle&apos; In: Routledge Encyclopedia of Philosophy, Taylor and Francis, viewed 19 August 2024, &lt;https://www.rep.routledge.com/articles/thematic/platonism-early-and-middle/v-1&gt;. doi:10.4324/9780415249126-A089-1</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Early Platonism</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: platonist school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>hasMember</u>: Αδείμαντος του Κολλυτού, Αισχίνης ο Νεαπολίτης, Άριστος ο Ασκαλωνίτης, Αξιοθέα η Φλειάσια, Βοηθός από την Πάρο, Κράντωρ ο Σολεύς, Κράτης ο Αθηναίος, Κράτης ο Ταρσεύς, Δάμων ο Κυρηναίος, Δημήτριος από τη Φώκαια, Δημοφάνης, Δημοσθένης ο Μεγαλοπολίτης, Δερκυλλίδης, Δήλιος ο Εφέσιος, Διόδωρος ο Αλεξανδρεύς, Διονύσιος ο Κολοφώνιος, Εύβουλος (2ο π.Χ.), Εύβουλος (3ο μ.Χ), Εύδαμος, Εύδοξος ο Κνίδιος, Ευμένης από την Άσπενδο, Εύανδρος ο Αθηναίος, Γλαύκων, Εστιαίος ο Μιλήσιος, Μέναιχμος, Μενέδημος από την Πύρρα, Νικόστρατος ο Αθηναίος, Πάμφιλος, Φιλίστιος, Πολέμων ο Αθηναίος, Σέξτος o Χαιρωνεύς, Σπεύσιππος, Τηλεκλής από τη Φώκαια, Ξενοκράτης ο Χαλκηδόνιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/platonism/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/platonism/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Platonism" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Platonism</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Προσωκρατικοί</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας ελληνικής φιλοσοφίας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Οι Προσωκρατικοί ή Πρώιμοι Έλληνες φιλόσοφοι είναι οι δυτικοί στοχαστές που προηγήθηκαν του Σωκράτη (περ. 469- 399 π.Χ.). Στην κατηγορία αυτή περιλαμβάνονται ορισμένοι στοχαστές που ήταν περίπου σύγχρονοι με τον Σωκράτη, όπως ο Πρωταγόρας (περ. 490- 420 π.Χ.). Ενδιαφέρονταν κυρίως για την κοσμολογία, την αρχή και την ουσία του σύμπαντος.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Presocratic school</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: presocratic school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Δημόκριτος, Εμπεδοκλής ο Ακραγαντινός, Ξενοφάνης ο Κολοφώνιος, Παρμενίδης ο Ελεάτης, Ζήνων ο Ελεάτης</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Πυθαγορική Σχολή</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας ελληνικής φιλοσοφίας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Πυθαγορική Σχολή συνίσταται από τη φιλοσοφική και πνευματική διδασκαλία που ιδρύθηκε από τον Πυθαγόρα, επικεντρωμένη στη σημασία των αριθμών για την κατανόηση του σύμπαντος, στη δομημένη ζωή και στη μετεμψύχωση των ψυχών. Αργότερα εξελίχθηκε σε Νεοπυθαγόρειο σύστημα, ενσωματώνοντας τις ιδέες του Πυθαγόρα σε ευρύτερες μεταφυσικές και μυστηριακές παραδόσεις.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Huffman, Carl, "Pythagoreanism", The Stanford Encyclopedia of Philosophy (Summer 2024 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/sum2024/entries/pythagoreanism/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Pythagorean school</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: pythagorean school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Αλκμαίων ο Κροτωνιάτης, Αναξίλαος ο Λαρισαίος, Πυθαγόρας ο Σάμιος</div>    <div class="attributeIndividual"> <u>hasMember</u>: Ακμονίδας ο Ταραντίνος, Ακουσιλάδας ο Ταραντίνος, Αινέας ο Μεταποντίνος, Αισάρα από τη Λουκανία, Αναξίλαος ο Λαρισαίος, Ανδροκύδης (Πυθαγόρειος), Αρχέδημος ο Συρακούσιος, Αρχύτας ο Ταραντίνος, Αρέσας από τη Λουκανία, Αριγνώτη η Κροτωνιάτισσα, Αρισταίος ο Δαμοφώντος, Βροντίνος ο Μεταποντίνος, Καλλιφών ο Κροτωνιάτης, Κέβης ο Θηβαίος, Χαρώνδας, Κλεινίας ο Ταραντίνος, Δάμιππος, Δάμων ο Συρακούσιος, Δείναρχος ο άτης, Κλεοσθένης ο Κροτωνιάτης, Σύλλος ο Κροτωνιάτης, Επίσυλος ο Κροτωνιάτης, Φυκιάδας ο Κροτωνιάτης, Τίμαιος ο Κροτωνιάτης, Ιταναίος ο Κροτωνιάτης, Ρόδιππος ο Κροτωνιάτης, Εύανδρος ο Κροτωνιάτης, Μυλλίας ο Κροτωνιάτης, Λεόφρων ο Κροτωνιάτης, Δαμοκλής ο Κροτωνιάτης, Αντιμένης ο Μεταποντίνος, Χειλάς ο Μεταποντίνος, Δαμάρμενος ο Μεταποντίνος, Δαμοτάγης ο Μεταποντίνος, Ειρίσκος ο Μεταποντίνος, Εύανδρος ο Μεταποντίνος, Ξενοφάντης ο Μεταποντίνος, Ξενοκάδης ο Μεταποντίνος, Θρασυμήδης ο Μεταποντίνος, Θρασέας ο Μεταποντίνος, Ρηξίβιος ο Μεταποντίνος, Πύρρων ο Μεταποντίνος, Προκλής ο Μεταποντίνος, Ορεστάδας ο Μεταποντίνος, Λεωκύδης ο Μεταποντίνος, Ευρύφημος ο Μεταποντίνος, Εύφημος ο Μεταποντίνος, Μελήσιας ο Μεταποντίνος, Λέων ο Μεταποντίνος, Εύρυτος ο Μεταποντίνος, Ανίοχος ο Μεταποντίνος, Επιχαρίδης ο Ταραντίνος, Θεόδωρος ο Ταραντίνος, Λύκων ο Ταραντίνος, Πολέμαρχος ο Ταραντίνος, Καινίας ο Ταραντίνος, Κλέων ο Ταραντίνος, Ευρυμέδων ο Ταραντίνος, Κλειναγόρας ο Ταραντίνος, Ζώπυρος ο Ταραντίνος, Εύθυνος ο Ταραντίνος, Φιλωνίδης ο Ταραντίνος, Φροντίδας ο Ταραντίνος, Λύσις ο Ταραντίνος, Λυσίβιος ο Ταραντίνος, Πακτίων ο Ταραντίνος, Πεισικράτης ο Ταραντίνος, Κλεάρατος ο Ταραντίνος, Λεοντεύς ο Ταραντίνος, Φρύνιχος ο Ταραντίνος, Σιμιχίας ο Ταραντίνος, Πεισίρροδος ο Ταραντίνος, Έλανδρος ο Ταραντίνος, Δικάς ο Ταραντίνος, Καροφαντίδας ο Ταραντίνος, Τιμύχα η Λακεδαιμονία, Φίλτυς από τον Κρότωνα, Χειλωνίς, Κρατησίκλεια η Λάκαινα, Θεανώ</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Πυρρωνισμός</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας ελληνικής φιλοσοφίας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Πυρρωνισμός είναι μια αρχαία σκεπτικιστική φιλοσοφία που ιδρύθηκε από τον Πύρρωνα από την Ήλιδα. Υποστηρίζει την επίτευξη της ηρεμίας (ἀταραξία) μέσω της αναστολής της κρίσης (ἐποχή) για όλες τις πεποιθήσεις και απόψεις, εστιάζοντας μόνο στις φαινομενικές (φαίνεσθαι) καταστάσεις. Σε αντίθεση με τον Ακαδημαϊκό σκεπτικισμό, ο οποίος ασχολείται με διαλεκτική επιχειρηματολογία, ο Πυρρωνισμός στοχεύει στην προσωπική ηρεμία μέσω μιας στάσης μη δέσμευσης σε οριστικές αλήθειες.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Britannica, The Editors of Encyclopaedia. "Pyrrhonism". Encyclopedia Britannica, 30 Sep. 2023, https://www.britannica.com/topic/Pyrrhonism. Accessed 19 August 2024.</div>    <div class="textItalicSmallMargin"><b>2)</b> Vogt, Katja, "Ancient Skepticism", The Stanford Encyclopedia of Philosophy (Winter 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/win2022/entries/skepticism-ancient/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Pyrrhonism</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: pyrrhonian skeptics school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Πύρρων ο Ηλείος, Αινησίδημος ο Κνώσιος, Τίμων ο Φλιάσιος</div>    <div class="attributeIndividual"> <u>hasMember</u>: Πτολεμαίος ο Κυρηναίος, Πύρρων ο Φλιάσιος, Σαρπηδόνας, Σέξτος ο Εμπειρικός</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σκεπτικιστική περίοδος της Ακαδημίας</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας ελληνικής φιλοσοφίας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Ακαδημαϊκός σκεπτικισμός συνιστά μία σκεπτικιστική περίοδο της Ακαδημίας πο τοποθετείται από c.266 π.Χ., όταν ο Αρκεσίλαος έγινε διευθυντής, μέχρι c. το 90 π.Χ., όταν ο Αντίοχος από την Ασκάλωνα απέρριψε τον σκεπτικισμός, αν και κάποιοι φιλόσοφοι, όπως ο Φαβωρίνος και ο δάσκαλός του ο Πλούταρχος, συνέχισαν να υπερασπίζονται τον σκεπτικισμό και μετά το 90 π.Χ. Οι κύριοι εκπρόσωποι αυτής της σκεπτικιστικής φάσης της Ακαδημίας είναι ο Αρκεσίλαος, ο Καρνεάδης και ο Φίλων ο Λαρισαίος.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Vogt, Katja, "Ancient Skepticism", The Stanford Encyclopedia of Philosophy (Winter 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/win2022/entries/skepticism-ancient/&gt;.<br></div>    <div class="textItalicSmallMargin"><b>2)</b> https://iep.utm.edu/ancient-greek-skepticism/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Academic Skepticism school</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: academic_skepticism_school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Καρνεάδης ο Κυρηναίος, Αρκεσίλαος από την Πιτάνη, Φίλων ο Λαρισαίος</div>    <div class="attributeIndividual"> <u>hasMember</u>: Κλειτόμαχος ο Καρχηδόνιος, Δίων ο Αλεξανδρεύς, Άγνων από την Ταρσό, Εύανδρος από τη Φώκαια, Ηλιόδωρος ο Αλεξανδρεύς, Ηράκλειτος από την     ['<div class="terminologyEntry">    <div class="term">Σοφιστές</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας ελληνικής φιλοσοφίας</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Σοφιστική σχολή, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Sophist school</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sophist school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Πρωταγόρας ο Αβδηρίτης, Γοργίας ο Λεοντίνος, Πρόδικος ο Κείος, Ιππίας ο Ηλείος, Λούκιος Φλάβιος Φιλόστρατος, Θρασύμαχος ο Χαλκηδόνιος</div>    <div class="attributeIndividual"> <u>hasMember</u>: Δαμόφιλος από τη Βιθυνία, Διαγόρας από τη Μήλο, Διονύσιος ο Μιλήσιος, Ίππων, Λέων ο Βυζάντιος, Λεσβόναξ, Λυκόφρων</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/sophists/" target="_blank" rel="noopener">https://iep.utm.edu/sophists/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Sophist-philosophy" target="_blank" rel="noopener">https://www.britannica.com/topic/Sophist-philosophy</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/sophists/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/sophists/</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σοφιστική σχολή</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας ελληνικής φιλοσοφίας</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Σοφιστές, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Σοφιστική σχολή του 5ου αιώνα π.Χ. περιλάμβανε σημαντικές προσωπικότητες όπως ο Πρωταγόρας, ο Γοργίας και ο Ίππιας, που προσέφεραν διδασκαλία στη ρητορική και την πρακτική σοφία. Αυτή η νέα τάξη διανοουμένων αναδύθηκε ως απάντηση στην αυξανόμενη ζήτηση για προχωρημένη εκπαίδευση και επιτυχία σε δημοκρατικά και πολιτικά πεδία, ευδοκιμώντας σε μια εποχή πνευματικής και κοινωνικής αλλαγής. Σε αντίθεση με τις παραδοσιακές σχολές, οι σοφιστές δρούσαν ανεξάρτητα, χωρίς ενιαία οργάνωση ή κοινές πεποιθήσεις.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Taylor, C.C.W. and Mi-Kyoung Lee, "The Sophists", The Stanford Encyclopedia of Philosophy (Fall 2020 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/fall2020/entries/sophists/&gt;.<br></div>    <div class="textItalicSmallMargin"><b>2)</b> https://iep.utm.edu/sophists/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Sophist school</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sophist school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Πρωταγόρας ο Αβδηρίτης, Γοργίας ο Λεοντίνος, Πρόδικος ο Κείος, Ιππίας ο Ηλείος, Λούκιος Φλάβιος Φιλόστρατος, Θρασύμαχος ο Χαλκηδόνιος</div>    <div class="attributeIndividual"> <u>hasMember</u>: Δαμόφιλος από τη Βιθυνία, Διαγόρας από τη Μήλο, Διονύσιος ο Μιλήσιος, Ίππων, Λέων ο Βυζάντιος, Λεσβόναξ, Λυκόφρων</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/sophists/" target="_blank" rel="noopener">https://iep.utm.edu/sophists/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Sophist-philosophy" target="_blank" rel="noopener">https://www.britannica.com/topic/Sophist-philosophy</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/sophists/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/sophists/</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Στωική σχολή</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας ελληνικής φιλοσοφίας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Στωικισμός, ιδρυμένος από τον Ζήνωνα τον Κιτιέα γύρω στο 300 π.Χ., είναι ένα φιλοσοφικό σύστημα που εξετάζει τη σύνθεση της φυσικής, της λογικής και της ηθικής. Σημαντικοί εκπρόσωποι περιλαμβάνουν τον Ζήνωνα, τον Κλήνθη και τον Χρύσιππο από τη Σχολή της Πρώιμης Στωικής Φιλοσοφίας, οι οποίοι καθόρισαν βασικές διδασκαλίες του Στωικισμού, όπως η αλληλεπίδραση αυτών των φιλοσοφικών τομέων και η ζωή σύμφωνα με τη φύση. Η Μέση Στωική Σχολή, με τους Πάναιτιο και Ποσειδώνιο, τόνισε την πρακτική ηθική και τα θρησκευτικά στοιχεία, επηρεάζοντας τον Ρωμαϊκό Στωικισμό. Η Ύστερη Στωική Σχολή, που περιλαμβάνει τους Σενέκα, Επίκτητο και Μάρκο Αυρήλιο, επικεντρώθηκε στην προσωπική αρετή και την ανθεκτικότητα, εξετάζοντας ηθικά και υπαρξιακά ζητήματα. Ο Στωικισμός αναδεικνύει τη λογική, την αποδοχή της μοίρας και την επιδίωξη της αρετής ως δρόμους προς μια ευτυχισμένη ζωή.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Durand, Marion, Simon Shogry, and Dirk Baltzly, "Stoicism", The Stanford Encyclopedia of Philosophy (Spring 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/spr2023/entries/stoicism/&gt;.</div>    <div class="textItalicSmallMargin"><b>2)</b> https://iep.utm.edu/stoicism/</div>    <div class="textItalicSmallMargin"><b>3)</b> Saunders, Jason Lewis. "Stoicism". Encyclopedia Britannica, 23 Jul. 2024, https://www.britannica.com/topic/Stoicism. Accessed 19 August 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Stoic school</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: stoic_school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Ζήνων ο Κιτιεύς, Χρύσιππος ο Σολεύς, Μάρκος Αυρήλιος, Ποσειδώνιος ο Απαμεύς, Παναίτιος ο Ρόδιος</div>    <div class="attributeIndividual"> <u>hasMember</u>: Αντίπατρος ο Ταρσεύς, Αντίπατρος ο Τύριος, Απολλόδωρος από τη Σελεύκεια, Αρχέδημος ο Ταρσεύς, Αρίστων ο Χίος, Άρειος Δίδυμος, Ασκληπιόδοτος Τακτικός, Αθηνόδωρος o Κανανίτης, Αθηνόδωρος ο Σολεύς, Αθηνόδωρος Κορδυλίων, Βοηθός από τη Σιδώνα- Στωικός, Χαιρήμων ο Αλεξανδρεύς, Χρεμωνίδης ο Αθηναίος, Χρύσερμος ο Αλεξανδρεύς, Κράτης o Μαλλώτης, Δαμοκλής ο Μεσσήνιος, Δάρδανος ο Αθηναίος, Δίκαιος ο Ταρσεύς, Διόδωρος (Στωικός), Διόδοτος ο Στωικός, Διογένης Βαβυλώνιος, Δίων ο Ηρακλεώτης, Διονύσιος ο Αλεξανδρεύς, Διονύσιος ο Κυρηναίος, Εύβιος ο Ασκαλωνιάτης, Εύδρομος, Ευφράτης ο Στωικός, Γόργος ο Σπαρτιάτης, Εκάτων ο Ρόδιος, Ηρακλείδης (3ο μ.Χ.), Ηρακλείδης Αυρήλιος, Ήριλλος ο Χαλκηδών, Ερμαγόρας, Ιεροκλής, Ύλλος ο Σολεύς, Λεωνίδης ο Ρόδιος, Μέδιος, Μνησαγόρας, Μνήσαρχος ο Αθηναίος, Νέστωρ από την Ταρσό, Νίκανδρος από τη Βιθυνία, Φιλωνίδης ο Θηβαίος, Σωσιγένης, Ζήνων ο Ταρσεύς, Ζηνόδοτος ο Στωικός, Θεαγένης από την Πάτρα, Κλεάνθης ο Άσσιος, Τέλης ο Μεγαρεύς, Στρατοκλής ο Ρόδιος, Πρόκλος Μαλλώτης, Πλάτων ο Ρόδιος, Φαινίας, Παράμονος από την Ταρσό</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/ENTRIES/stoicism/" target="_blank" rel="noopener">https://plato.stanford.edu/ENTRIES/stoicism/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/stoicism/" target="_blank" rel="noopener">https://iep.utm.edu/stoicism/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Stoicism" target="_blank" rel="noopener">https://www.britannica.com/topic/Stoicism</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σχολή Ατομιστών</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας ελληνικής φιλοσοφίας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η ατομική θεωρία (από το αρχ.ελλ. ἄτομον, δηλαδή "άκοπος, αδιαίρετος") είναι μια αρχαία ελληνική θεωρία που αναπτύχθηκε από τους Λεύκιππο και Δημόκριτο ως απάντηση στον Παρμενίδη, ο οποίος υποστήριζε ότι η αλλαγή είναι αδύνατη επειδή «το μη ον» δεν μπορεί να υπάρχει. Οι ατομιστές πρότειναν ότι τα πάντα αποτελούνται από μικροσκοπικά, αδιαίρετα σωματίδια που ονομάζονται άτομα, τα οποία κινούνται μέσα σε ένα άπειρο κενό. Αυτά τα άτομα είναι αιώνια, αμετάβλητα και διαφέρουν σε μέγεθος και σχήμα. Οι αλλαγές στον κόσμο οφείλονται στην αναδιάταξη και κίνηση αυτών των ατόμων μέσα στο κενό, επιτρέποντας έτσι την πραγματικότητα της κίνησης και της μεταμόρφωσης στον ορατό κόσμο.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Berryman, Sylvia, "Democritus", The Stanford Encyclopedia of Philosophy (Spring 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/spr2023/entries/democritus/&gt;.</div>    <div class="textItalicSmallMargin"><b>2)</b> https://iep.utm.edu/ancient-greek-philosophy/</div>    <div class="textItalicSmallMargin"><b>3)</b> Melsen, Andrew G.M. van. "atomism". Encyclopedia Britannica, 3 Nov. 2023, https://www.britannica.com/topic/atomism. Accessed 19 August 2024.</div>    <div class="textItalicSmallMargin"><b>4)</b> https://lsj.gr/wiki/%E1%BC%84%CF%84%CE%BF%CE%BC%CE%BF%CF%82</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Atomist school</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: atomist school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Δημόκριτος, Παρμενίδης ο Ελεάτης, Λεύκιππος</div>    <div class="attributeIndividual"> <u>hasMember</u>: Αιγίμιος από την Ηλεία, Μητρόδωρος από τη Χίο, Ναυσιφάνης ο Τήιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/atomism" target="_blank" rel="noopener">https://www.britannica.com/topic/atomism</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/ancient-greek-philosophy/" target="_blank" rel="noopener">https://iep.utm.edu/ancient-greek-philosophy/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/democritus/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/democritus/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.etymonline.com/word/atom" target="_blank" rel="noopener">https://www.etymonline.com/word/atom</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0057:entry=a)/tomos" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0057:entry=a)/tomos</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σχολή της Ήλιδος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας ελληνικής φιλοσοφίας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Σχολή της Ήλιδας ιδρύθηκε από τον Φαίδωνα, μαθητή του Σωκράτη, αλλά αργότερα, μεταφέρθηκε από τον Μενέδημο στην Ερέτρια.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Chisholm, Hugh, ed. (1911). "Elis, Philosophical School of" . Encyclopædia Britannica. Vol. 9 (11th ed.). Cambridge University Press. p. 279. Via: https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Elis,_Philosophical_School_of</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: School of Elis</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: school_of_elis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Μενέδημος από την Ερέτρια, Φαίδων o Hλείος</div>    <div class="attributeIndividual"> <u>hasMember</u>: Αγχίπυλος ο Ηλείος, Ασκληπιάδης ο Φλάσιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Elis,_Philosophical_School_of" target="_blank" rel="noopener">https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Elis,_Philosophical_School_of</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Eretrian_school" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Eretrian_school</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σχολή της Ιωνίας</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας ελληνικής φιλοσοφίας</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Ιωνική Σχολή, που άνθισε τον 6ο και 5ο αιώνα π.Χ., περιλάμβανε πρώιμους Έλληνες φιλοσόφους όπως ο Θαλής, ο Αναξίμανδρος, ο Αναξιμένης και ο Ηράκλειτος. Επικεντρωμένη στις ιωνικές πόλεις της Μικράς Ασίας, η σχολή αυτή επιδίωξε να εξηγήσει τον φυσικό κόσμο μέσω θεμελιωδών ουσιών και φυσικών διαδικασιών, σε αντίθεση με τις αργότερες μεταφυσικές προσεγγίσεις των Ελεατών και Πυθαγόρειων. Παρά τις διαφοροποιήσεις στις θεωρίες τους—από το νερό ως πρωταρχική ουσία του Θαλή έως την έννοια της συνεχιζόμενης αλλαγής του Ηράκλειτου—μοιράζονταν τη φιλοδοξία να προσφέρουν υλικές εξηγήσεις για τα φυσικά φαινόμενα, δημιουργώντας έτσι θεμέλια για τη μεταγενέστερη επιστημονική και μεταφυσική σκέψη.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Britannica, The Editors of Encyclopaedia. "Ionian school". Encyclopedia Britannica, 6 Mar. 2012, https://www.britannica.com/topic/Ionian-school. Accessed 19 August 2024.</div>    <div class="textItalicSmallMargin"><b>2)</b> "Ionian School of Philosophy" . Encyclopædia Britannica. Vol. 14 (11th ed.). 1911. pp. 731–732. Via https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Ionian_School_of_Philosophy</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Ionian school</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: ionian_school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Alexikoua - Greek settlements in Asia Minor. Ionia in green.  Own workData taken from: [1], [2]Topography taken from DEMIS Mapserver, which are public domain, other wise self-made., CC BY-SA 3.0, https://commons.wikimedia.org/w/index.php?curid=30582147</div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Αναξαγόρας ο Κλαζομενεύς, Θαλής ο Μιλήσιος, Αναξίμανδρος ο Μιλήσιος, Αναξιμένης ο Μιλήσιος, Ηράκλειτος ο Εφέσιος, Αρχέλαος ο Αθηναίος</div>    <div class="attributeIndividual"> <u>hasMember</u>: Διογένης ο Απολλωνιάτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://dbpedia.org/page/Ionian_School_(philosophy)" target="_blank" rel="noopener">https://dbpedia.org/page/Ionian_School_(philosophy)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.newworldencyclopedia.org/entry/Ionian_school" target="_blank" rel="noopener">https://www.newworldencyclopedia.org/entry/Ionian_school</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Ionian-school" target="_blank" rel="noopener">https://www.britannica.com/topic/Ionian-school</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σχολή του Κομφούκιου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">σχολή αρχαίας κινεζικής φιλοσοφίας</font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Confucian school</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: confucian school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Chinese-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: &apos;xunzi - person&apos; &apos;mencius&apos; Κομφούκιος</div></div></div></div>'],

function show_selected() {
    var selector = document.getElementById('idTerm');
    var champ = dictionnaire[selector[selector.selectedIndex].value][0];
    document.getElementById('display').innerHTML = champ;
}
document.getElementById('idTerm').addEventListener('change', show_selected);

searchBox = document.querySelector("#searchBox");
entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});

</script>
