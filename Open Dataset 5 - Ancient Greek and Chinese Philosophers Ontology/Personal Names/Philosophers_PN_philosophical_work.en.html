    ['<div class="terminologyEntry">    <div class="term">Paedagogus (Clement of Alexandria)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: One of the most important surviving works of Clement that belongs to a trilogy.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Fredericksen, Linwood. "St. Clement of Alexandria". Encyclopedia Britannica, 22 Feb. 2024, https://www.britannica.com/biography/Clement-of-Alexandria. Accessed 7 August 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Παιδαγωγός (Κλήμης ο Αλεξανδρεύς)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: paedagogus_clement</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Clement of Alexandria</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Parmenides - philosophical work</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Plato&apos;s Parmenides presents a complex dialogue where Parmenides challenges the theory of forms proposed by a young Socrates and engages in intricate arguments (Deductions) to explore and defend this theory, influencing later Neoplatonist thought.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Rickless, Samuel, "Plato’s Parmenides", The Stanford Encyclopedia of Philosophy (Spring 2020 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/spr2020/entries/plato-parmenides/&gt;.</div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://www.inphoproject.org/work/5412" target="_blank" rel="noopener">https://www.inphoproject.org/work/5412</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://scaife.perseus.org/library/urn:cts:greekLit:tlg0059.tlg009/" target="_blank" rel="noopener">https://scaife.perseus.org/library/urn:cts:greekLit:tlg0059.tlg009/</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0174" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0174</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/plato-parmenides/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/plato-parmenides/</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q1130762" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q1130762</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Parmenides_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Parmenides_(dialogue)</a></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Παρμενίδης- φιλοσοφικό έργο</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: parmenides_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Adeimantus of Collytus, Plato, Parmenides of Elea, Zeno of Elea, Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Parmenides-by-Plato" target="_blank" rel="noopener">https://www.britannica.com/topic/Parmenides-by-Plato</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-parmenides" target="_blank" rel="noopener">https://philpapers.org/browse/plato-parmenides</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-parmenides/1926/pb_LCL167.197.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-parmenides/1926/pb_LCL167.197.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+parm.+126a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+parm.+126a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/parmenides.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/parmenides.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.guten     ['<div class="terminologyEntry">    <div class="term">Pentemychos</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: A work on cosmogony by Pherecydes of Syros, Greek philosopher, 6th BC. Also known as Heptamychos.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Πεντέμυχος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: pentemychos</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Pherecydes of Syros</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Phaedo</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Plato&apos;s Phaedo depicts Socrates&apos; final moments before his execution, presenting arguments for the immortality of the soul, discussions on the theory of Forms, and Plato&apos;s own metaphysical and epistemological views.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/phaedo/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Φαίδων</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: phaedo_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Crito of Alopece, Ctesippus of Paeania, Echecrates of Phlius, Euclid of Megara, Menexenus, Phaedo of Elis, Apollodorus of Phalerum, Cebes of Thebes, Hermogenes of Alopece, Simmias of Thebes, Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Phaedo" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Phaedo</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/phaedo/" target="_blank" rel="noopener">https://iep.utm.edu/phaedo/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/phaedo.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/phaedo.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0169%3Atext%3DPhaedo" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0169%3Atext%3DPhaedo</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1658/1658-h/1658-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1658/1658-h/1658-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://chs.harvard.edu/primary-source/plato-phaedo-sb/" target="_blank" rel="noopener">https://chs.harvard.edu/primary-source/plato-phaedo-sb/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-phaedo" target="_blank" rel="noopener">https://philpapers.org/browse/plato-phaedo</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-phaedo/1914/pb_LCL036.199.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-phaedo/1914/pb_LCL036.199.xml</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Phaedrus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Plato&apos;s Phaedrus is a dialogue between Socrates and Phaedrus that explores the art of rhetoric, the nature of love, metempsychosis (reincarnation), and the soul.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://www.gutenberg.org/files/1636/1636-h/1636-h.htm</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Φαίδρος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: phaedrus_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Gorgias of Leontini, Hippias of Elis, Protagoras of Abdera, Prodicus, Simmias of Thebes, Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Phaedrus_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Phaedrus_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1636/1636-h/1636-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1636/1636-h/1636-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/phaedrus.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/phaedrus.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://users.uoa.gr/~nektar/history/tributes/plato/dial/PlatoPhaedrus.htm" target="_blank" rel="noopener">http://users.uoa.gr/~nektar/history/tributes/plato/dial/PlatoPhaedrus.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+phaedrus+227a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+phaedrus+227a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0173%3Atext%3DPhaedrus" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0173%3Atext%3DPhaedrus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg012" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg012</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Philebus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: A Socratic dialogue, in which the ethical evaluation of pleasure is discussed.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://librivox.org/philebus-by-plato/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Φίληβος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: philebus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Plato - The beginning of Philebus in the oldest surviving medieval manuscript Codex Oxoniensis Clarkianus 39, facsimile by Sijthoff with foreword by Allen., Public Domain, https://commons.wikimedia.org/w/index.php?curid=26910469</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Philebos_beginning._Clarke_Plato.jpg/800px-Philebos_beginning._Clarke_Plato.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Philebos_beginning._Clarke_Plato.jpg/800px-Philebos_beginning._Clarke_Plato.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Philebos_beginning._Clarke_Plato.jpg/800px-Philebos_beginning._Clarke_Plato.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/philebus.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/philebus.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0173%3Atext%3DPhileb." target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0173%3Atext%3DPhileb.</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1744/1744-h/1744-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1744/1744-h/1744-h.htm</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Physics (Aristotle)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Aristotle&apos;s Physics examines the principles governing change and motion in nature, proposing a framework of four types of causes—material, formal, efficient, and final—to explain how and why things come to be, change, and cease to be.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Bodnar, Istvan, "Aristotle’s Natural Philosophy", The Stanford Encyclopedia of Philosophy (Summer 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/sum2023/entries/aristotle-natphil/&gt;.<br></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Φυσικά (Αριστοτέλη)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: physics_aristotle</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aristotle</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/biography/Aristotle/Physics-and-metaphysics" target="_blank" rel="noopener">https://www.britannica.com/biography/Aristotle/Physics-and-metaphysics</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Aristotle/physics.html" target="_blank" rel="noopener">https://classics.mit.edu/Aristotle/physics.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Aristotelian_physics" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Aristotelian_physics</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://people.bu.edu/wwildman/WeirdWildWeb/courses/wphil/readings/wphil_rdg07_physics_entire.htm" target="_blank" rel="noopener">https://people.bu.edu/wwildman/WeirdWildWeb/courses/wphil/readings/wphil_rdg07_physics_entire.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/aristotle-natphil/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/aristotle-natphil/</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Poetics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Aristotle&apos;s "Poetics" analyzes the structure and elements of dramatic works, particularly tragedy. It explores how drama achieves emotional effects through plot, character, and language, emphasizing the importance of catharsis and the unity of action, character, and theme.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/aristotle-poetics/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ποιητική</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: poetics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aristotle</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.physics.ntua.gr/mourmouras/greats/aristoteles/peri_poihtikhs.html" target="_blank" rel="noopener">https://www.physics.ntua.gr/mourmouras/greats/aristoteles/peri_poihtikhs.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.greek-language.gr/digitalResources/ancient_greek/anthology/literature/browse.html?text_id=328" target="_blank" rel="noopener">https://www.greek-language.gr/digitalResources/ancient_greek/anthology/literature/browse.html?text_id=328</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Poetics_(Aristotle)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Poetics_(Aristotle)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/aristotle-poetics/" target="_blank" rel="noopener">https://iep.utm.edu/aristotle-poetics/</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Politics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: In Politics, Aristotle analyzes different forms of political communities, critiques existing political systems, and explores how they fall short of the ideal city that promotes virtuous living. He examines the roles of different classes, the nature of citizenship, and the best practical regimes for achieving a well-functioning and just society.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/aristotle-politics/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Πολιτικά</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: politics_aristotle</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aristotle</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/aristotle-politics/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/aristotle-politics/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/aristotle-politics/" target="_blank" rel="noopener">https://iep.utm.edu/aristotle-politics/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0058%3Abook%3D1%3Asection%3D1252a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0058%3Abook%3D1%3Asection%3D1252a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Politics_(Aristotle)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Politics_(Aristotle)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.physics.ntua.gr/mourmouras/greats/aristoteles/politika.html" target="_blank" rel="noopener">https://www.physics.ntua.gr/mourmouras/greats/aristoteles/politika.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.greek-language.gr/greekLang/ancient_greek/tools/corpora/anthology/content.html?t=43&amp;m=2" target="_blank" rel="noopener">https://www.greek-language.gr/greekLang/ancient_greek/tools/corpora/anthology/content.html?t=43&amp;m=2</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Posterior Analytics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Aristotle&apos;s "Posterior Analytics" applies the theory of syllogism to scientific knowledge, arguing that it must be based on demonstrations from true, necessary, and universal principles. These principles, akin to axioms in relation to theorems, define the subject matter of a science and necessitate its truths. The work emphasizes the importance of definitions, particularly in its second book.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Amadio, Anselm H. and Kenny, Anthony J.P.. "Aristotle". Encyclopedia Britannica, 25 May. 2024, https://www.britannica.com/biography/Aristotle. Accessed 24 July 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Αναλυτικά Ύστερα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: posterior_analytics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aristotle</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/history-of-logic/Aristotle#ref535344" target="_blank" rel="noopener">https://www.britannica.com/topic/history-of-logic/Aristotle#ref535344</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/biography/Aristotle/The-unmoved-mover#ref919849" target="_blank" rel="noopener">https://www.britannica.com/biography/Aristotle/The-unmoved-mover#ref919849</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/epistemology/The-history-of-epistemology#ref308908" target="_blank" rel="noopener">https://www.britannica.com/topic/epistemology/The-history-of-epistemology#ref308908</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Prior Analytics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: The "Prior Analytics" by Aristotle is dedicated to the theory of the syllogism, a central method of logical inference. It examines how propositions starting with Every, No, or Some are structured and linked in arguments. Unlike "De Interpretatione," which explores the compatibility of propositions, "Prior Analytics" emphasizes constructing propositions from terms used as subjects or predicates. This work is a fundamental part of Aristotle&apos;s contributions to logic, compiled in the collection known as the Organon.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Kenny, Anthony J.P. and Amadio, Anselm H.. "Aristotle". Encyclopedia Britannica, 25 May. 2024, https://www.britannica.com/biography/Aristotle. Accessed 24 July 2024.e ---</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Αναλυτικά Πρότερα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: prior_analytics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aristotle</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://data.perseus.org/catalog/urn:cts:greekLit:tlg0086.tlg001.opp-ara2" target="_blank" rel="noopener">http://data.perseus.org/catalog/urn:cts:greekLit:tlg0086.tlg001.opp-ara2</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Progression of Animals</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">On the Gait of Animals, </font></div>    <div class="textMediumMargin"><b>Comment</b>: A major work on biology of Aristotle.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://en.wikipedia.org/wiki/Progression_of_Animals</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Περί πορείας ζώων</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: progression_of_animals</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aristotle</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://aristotelistes.cti.gr/admin/Lexicon/6" target="_blank" rel="noopener">https://aristotelistes.cti.gr/admin/Lexicon/6</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://lsj.gr/index.php?title=%CF%80%CE%BF%CF%81%CE%B5%CE%AF%CE%B1&amp;mobileaction=toggle_view_desktop#:~:text=%CF%80%CE%B5%CF%81%E1%BD%B6%20%CF%80%CE%BF%CF%81%CE%B5%CE%AF%CE%B1%CF%82%20%CE%B6%E1%BF%B4%CF%89%CE%BD%2C%20title%20of%20work%20by%20Aristotle." target="_blank" rel="noopener">https://lsj.gr/index.php?title=%CF%80%CE%BF%CF%81%CE%B5%CE%AF%CE%B1&amp;mobileaction=toggle_view_desktop#:~:text=%CF%80%CE%B5%CF%81%E1%BD%B6%20%CF%80%CE%BF%CF%81%CE%B5%CE%AF%CE%B1%CF%82%20%CE%B6%E1%BF%B4%CF%89%CE%BD%2C%20title%20of%20work%20by%20Aristotle.</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://el.wikisource.org/wiki/%CE%A0%CE%B5%CF%81%CE%AF_%CE%B6%CF%8E%CF%89%CE%BD_%CE%BA%CE%B9%CE%BD%CE%AE%CF%83%CE%B5%CF%89%CF%82" target="_blank" rel="noopener">https://el.wikisource.org/wiki/%CE%A0%CE%B5%CF%81%CE%AF_%CE%B6%CF%8E%CF%89%CE%BD_%CE%BA%CE%B9%CE%BD%CE%AE%CF%83%CE%B5%CF%89%CF%82</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://remacle.org/bloodwolf/philosophes/Aristote/marche.htm" target="_blank" rel="noopener">https://remacle.org/bloodwolf/philosophes/Aristote/marche.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Progression_of_Animals" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Progression_of_Animals</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Protagoras (Plato)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Plato&apos;s Protagoras is a dialogue in which Socrates debates the renowned sophist Protagoras at the home of Callias, focusing on the nature of sophists, the unity and teachability of virtue, and includes a discussion with twenty-one participants.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Bonazzi, Mauro, "Protagoras", The Stanford Encyclopedia of Philosophy (Fall 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2023/entries/protagoras/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Πρωταγόρας (Πλάτωνος)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: protagoras_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Plato - Protagoras Codex Oxoniensis Clarkianus 39, facsimile by Sijthoff with foreword by Allen., Public Domain, https://commons.wikimedia.org/w/index.php?curid=26910471</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/59/Protagoras_beginning._Clarke_Plato.jpg/800px-Protagoras_beginning._Clarke_Plato.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Critias (philosopher), Hippias of Elis, Iccus of Tarentum, Prodicus, Protagoras of Abdera, Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/5/59/Protagoras_beginning._Clarke_Plato.jpg/800px-Protagoras_beginning._Clarke_Plato.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/5/59/Protagoras_beginning._Clarke_Plato.jpg/800px-Protagoras_beginning._Clarke_Plato.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-protagoras/1924/pb_LCL165.197.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-protagoras/1924/pb_LCL165.197.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Protagoras-by-Plato" target="_blank" rel="noopener">https://www.britannica.com/topic/Protagoras-by-Plato</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/protagoras/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/protagoras/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/protagoras.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/protagoras.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-protagoras/1924/pb_LCL165.93.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-protagoras/1924/pb_LCL165.93.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+prot.+309a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+prot.+309a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1591/1591-h/1591-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1591/1591-h/1591-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Protagoras_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Protagoras_(dialogue)</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Protrepticus (Clement of Alexandria)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: One of the most important surviving works of Clement that belongs to a trilogy.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Fredericksen, Linwood. "St. Clement of Alexandria". Encyclopedia Britannica, 22 Feb. 2024, https://www.britannica.com/biography/Clement-of-Alexandria. Accessed 7 August 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Προτρεπτικός προς Έλληνας</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: protrepticus_clement</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Clement of Alexandria</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Protrepticus (Iamblichus)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Exhortation to Philosophy (Iamblichus), </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Προτρεπτικός του Ιάμβλιχου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: protrepticus_iamblichus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Iamblichus of Chalcis</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Pyrrhonian Discourses</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Pyrrhonist Discourses, </font></div>    <div class="textMediumMargin"><b>Comment</b>: The Pyrrhonian Discourses is a treatise written by Aenesidemus, likely similar in structure to Sextus Empiricus&apos; Outlines of Pyrrhonism. It includes a general account of skepticism followed by discussions on particular philosophical questions. The work is partially preserved in a summary by Photius and was dedicated to Lucius Aelius Tubero. It became a central text in the Sceptical canon, influencing later skeptics like Sextus Empiricus.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Vogt, Katja, "Ancient Skepticism", The Stanford Encyclopedia of Philosophy (Winter 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/win2022/entries/skepticism-ancient/&gt;.</div>    <div class="textItalicSmallMargin"><b>2)</b> Britannica, T. Editors of Encyclopaedia (2024, February 7). Aenesidemus. Encyclopedia Britannica. https://www.britannica.com/biography/Aenesidemus</div>    <div class="textItalicSmallMargin"><b>3)</b> Curnow, T. (2006). The philosophers of the ancient world: An A to Z guide (p. 10). Bristol Classical Press.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Πυρρωνείων λόγων βιβλία οκτώ</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: pyrrhonian_discourses</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aenedidemus of Cnossus</div>    <div class="attributeIndividual"> <u>mentions</u>: Pyrrho of Elis</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Pyrrhonist Discourses</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Pyrrhonian Discourses, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Πυρρωνείων λόγων βιβλία οκτώ</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: pyrrhonian_discourses</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aenedidemus of Cnossus</div>    <div class="attributeIndividual"> <u>mentions</u>: Pyrrho of Elis</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Rhetoric (Aristotle)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Aristotle&apos;s Rhetoric explores the art of persuasion through three main means: the character of the speaker (ethos), the emotions of the audience (pathos), and the argument itself (logos). The work is structured around analyzing different genres of speeches—deliberative, judicial, and epideictic—and provides a detailed examination of rhetorical techniques and styles.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Rapp, Christof, "Aristotle’s Rhetoric", The Stanford Encyclopedia of Philosophy (Winter 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/win2023/entries/aristotle-rhetoric/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ρητορική (Αριστοτέλη)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: rhetoric_aristotle</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aristotle</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Rhetoric_(Aristotle)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Rhetoric_(Aristotle)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.greek-language.gr/greekLang/ancient_greek/tools/corpora/anthology/content.html?t=61&amp;m=1" target="_blank" rel="noopener">https://www.greek-language.gr/greekLang/ancient_greek/tools/corpora/anthology/content.html?t=61&amp;m=1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/aristotle-rhetoric/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/aristotle-rhetoric/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0060" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0060</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Aristotle/rhetoric.1.i.html" target="_blank" rel="noopener">https://classics.mit.edu/Aristotle/rhetoric.1.i.html</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Rival Lovers</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Erastai, Lovers, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ερασταί</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: erastai</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Own work Jebulon, Plato&apos;s Academy mosaic. Roman mosaic of the 1st century BCE from Pompeii, now at the Museo Nazionale Archeologico, Naples. Public Domain, https://commons.wikimedia.org/w/index.php?curid=45896144</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/MANNapoli_124545_plato%27s_academy_mosaic.jpg/1280px-MANNapoli_124545_plato%27s_academy_mosaic.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/MANNapoli_124545_plato%27s_academy_mosaic.jpg/1280px-MANNapoli_124545_plato%27s_academy_mosaic.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/MANNapoli_124545_plato%27s_academy_mosaic.jpg/1280px-MANNapoli_124545_plato%27s_academy_mosaic.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Rival_Lovers" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Rival_Lovers</a
