    ['<div class="terminologyEntry">    <div class="term">In Prophesying by Dreams</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">On Divination in Sleep, </font></div>    <div class="textMediumMargin"><b>Comment</b>: One of the 7 treatises that make up the collection "Parva Naturalia", that discusses precognitive dreams.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://en.wikipedia.org/wiki/On_Divination_in_Sleep</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Περί της καθ&apos; ύπνον μαντικής</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_divination_in_sleep</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.mikrosapoplous.gr/aristotle/mf/peri_mantikhs_a.htm" target="_blank" rel="noopener">https://www.mikrosapoplous.gr/aristotle/mf/peri_mantikhs_a.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.physics.ntua.gr/mourmouras/greats/aristoteles/peri_kath_ypnou_mantikhs.html" target="_blank" rel="noopener">https://www.physics.ntua.gr/mourmouras/greats/aristoteles/peri_kath_ypnou_mantikhs.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://intercapillaryspace.blogspot.com/2007/01/aristotles-styles-on-divination-in.html" target="_blank" rel="noopener">https://intercapillaryspace.blogspot.com/2007/01/aristotles-styles-on-divination-in.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Aristotle/prophesying.html" target="_blank" rel="noopener">https://classics.mit.edu/Aristotle/prophesying.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/On_Divination_in_Sleep" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/On_Divination_in_Sleep</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ion</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: In Plato&apos;s Ion, Socrates debates with Ion, a rhapsode, whether Ion&apos;s skill in performance comes from his expertise or from divine inspiration. This brief dialogue explores the nature of artistic ability and knowledge.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://www.gutenberg.org/files/1635/1635-h/1635-h.htm</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ιων</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: ion</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Ion-by-Plato" target="_blank" rel="noopener">https://www.britannica.com/topic/Ion-by-Plato</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-ion/1925/pb_LCL164.407.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-ion/1925/pb_LCL164.407.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.supersummary.com/ion-plato/summary/" target="_blank" rel="noopener">https://www.supersummary.com/ion-plato/summary/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+ion+530a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+ion+530a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1635/1635-h/1635-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1635/1635-h/1635-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/ion.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/ion.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg027" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg027</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Isagoge</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: The Isagoge, written by Porphyry, serves as an introduction to Aristotle&apos;s logical works, notably the Categories. It was highly influential in establishing Aristotle’s Categories as a fundamental introductory text in logic, shaping philosophical education in Byzantium, the Arabic world, and the Latin West. The Isagoge aimed to reconcile Aristotelian and Platonic thought by interpreting Aristotle’s categories as significant expressions rather than primary ontological entities, thus preserving Platonic notions while engaging with Aristotle’s logical framework.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Emilsson, Eyjólfur, "Porphyry", The Stanford Encyclopedia of Philosophy (Summer 2024 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/sum2024/entries/porphyry/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Εισαγωγή</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: isagoge_porphyry</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Porphyry</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Laches</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Α Socratic dialogue, whose articipants discuss the definitions of the concept of courage or "manliness", ἀνδρεία in Greek.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://www.gutenberg.org/files/1584/1584-h/1584-h.htm</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Λάχης</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: laches</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Damon of Athens, Protagoras of Abdera, Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Laches_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Laches_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1584/1584-h/1584-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1584/1584-h/1584-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/laches.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/laches.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+lach.+178a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+lach.+178a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-laches/1924/pb_LCL165.3.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-laches/1924/pb_LCL165.3.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-laches" target="_blank" rel="noopener">https://philpapers.org/browse/plato-laches</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Laches-by-Plato" target="_blank" rel="noopener">https://www.britannica.com/topic/Laches-by-Plato</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg019" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg019</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Laws</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: In Laws, Plato explores political philosophy through a dialogue among three men designing a constitution for Magnesia. The work blends democratic and authoritarian elements and addresses practical legal issues, emphasizing a balance of persuasion and compulsion in law.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/pla-laws/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Νόμοι</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: laws</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Iccus of Tarentum, Megillus, Protagoras of Abdera, Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Laws_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Laws_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1750/1750-h/1750-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1750/1750-h/1750-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/LCL192/1926/volume.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/LCL192/1926/volume.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0166" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0166</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Laws" target="_blank" rel="noopener">https://www.britannica.com/topic/Laws</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/laws.1.i.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/laws.1.i.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg034" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg034</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Lesser Hippias</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Hippias Minor, </font></div>    <div class="textMediumMargin"><b>Comment</b>: In Hippias Minor, Socrates argues that intentional lies are preferable to accidental ones, linking this to a debate on whether Homer’s heroes, Achilles and Odysseus, reflect their epics’ quality. Though he doesn’t pursue this idea further, he later suggests in the Republic that Homer’s stories would be better if the heroes were always virtuous.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://www.gutenberg.org/files/1673/1673-h/1673-h.htm#link2H_INTR</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ιππίας ελάττων</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: hippias_minor</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Hippias of Elis, Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-hippias-minor" target="_blank" rel="noopener">https://philpapers.org/browse/plato-hippias-minor</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Hippias-Minor" target="_blank" rel="noopener">https://www.britannica.com/topic/Hippias-Minor</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-lesser_hippias/1926/pb_LCL167.427.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-lesser_hippias/1926/pb_LCL167.427.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1673/1673-h/1673-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1673/1673-h/1673-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+hipp.+min.+363a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+hipp.+min.+363a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Hippias_Minor" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Hippias_Minor</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Letter to Herodotus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: In this letter, Epicurus offers a detailed explanation of his natural philosophy, emphasizing the importance of understanding the fundamental principles of the universe, including atoms and the void, to achieve a tranquil life.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Konstan, David, "Epicurus", The Stanford Encyclopedia of Philosophy (Fall 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2022/entries/epicurus/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Επιστολή προς Ηρόδοτο</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: letter_to_herodotus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Epicurus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Letter to Menoeceus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: This letter outlines Epicurus&apos; ethical teachings, particularly focusing on the pursuit of happiness through the cultivation of simple pleasures, the avoidance of unnecessary desires, and the practice of virtue.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Konstan, David, "Epicurus", The Stanford Encyclopedia of Philosophy (Fall 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2022/entries/epicurus/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Επιστολή προς Μενοικέα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: letter_to_menoeceus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Epicurus</div>    <div class="attributeIndividual"> <u>mentions</u>: Menoeceus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Letter to Pythocles</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Epicurus writes to Pythocles to address various natural phenomena, such as weather and celestial bodies, promoting a rational understanding of these events to dispel superstitious fears.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Konstan, David, "Epicurus", The Stanford Encyclopedia of Philosophy (Fall 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2022/entries/epicurus/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Επιστολή προς Πυθοκλή</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: letter_to_pythocles</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>mentions</u>: Pythocles</div>    <div class="attributeIndividual"> <u>authoredBy</u>: Epicurus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Li Chi</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient chinese philosophical work</font></div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Li Chi (“Record of Rites”), Chinese Confucian treatise, one of the three classics of li (rites, rules<br>of proper conduct). <br>[R. Audi, The Cambridge Dictionary of Philosophy, Third edition, 2015]</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: li chi</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Chinese-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Liezi - philosophical work</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient chinese philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: A Taoist text attributed to Lie Yukou, a c. 5th century BC Hundred Schools of Thought philosopher. Although there were references to Lie&apos;s Liezi from the 3rd and 2nd centuries BC, a number of Chinese and Western scholars believe that the content of the current text was compiled around the 4th century CE by Zhang Zhan.</div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q434429" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q434429</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://archive.org/search?query=%28%28subject%3A%22Liezi%22%20OR%20creator%3A%22Liezi%22%20OR%20description%3A%22Liezi%22%20OR%20title%3A%22Liezi%22%29%20OR%20%28%22450-375%22%20AND%20Liezi%29%29%20AND%20%28-mediatype:software%29" target="_blank" rel="noopener">https://archive.org/search?query=%28%28subject%3A%22Liezi%22%20OR%20creator%3A%22Liezi%22%20OR%20description%3A%22Liezi%22%20OR%20title%3A%22Liezi%22%29%20OR%20%28%22450-375%22%20AND%20Liezi%29%29%20AND%20%28-mediatype:software%29</a></div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: liezi - philosophical work</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Chinese-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Life of Pythagoras (Porphyry)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: A 3rd c. A.D. fully preserved work, which along with Iamblichus&apos; work and Diogenes Laertius&apos; Lives, is the main source for the philosopher&apos;s life.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Emilsson, Eyjólfur, "Porphyry", The Stanford Encyclopedia of Philosophy (Summer 2024 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/sum2024/entries/porphyry/&gt;.</div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg2034.tlg002" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg2034.tlg002</a></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Βίος του Πυθαγόρα (Πορφύριος)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: life_of_pythagoras_porphyry</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Porphyry</div>    <div class="attributeIndividual"> <u>mentions</u>: Pythagoras of Samos</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.1170" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.1170</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://themodernhermeticist.com/2022/01/22/the-life-of-pythagoras-porphyry/" target="_blank" rel="noopener">https://themodernhermeticist.com/2022/01/22/the-life-of-pythagoras-porphyry/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.tertullian.org/fathers/porphyry_life_of_pythagoras_02_text.htm" target="_blank" rel="noopener">https://www.tertullian.org/fathers/porphyry_life_of_pythagoras_02_text.htm</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Life of Pythagoras Iamblichus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: One of the two most known and well-preserved works of Iamblichus of Chalcis, along with the "Exhortation to Philosophy". Even though the historical reliabitity of the work is questionable, Iamblichus builds a role model and refers to Pythagoras as divinely inspired and a philosopher who was affected by the ancient teachings of Egypt and Mesopotamia. Lastly, the teacher of Iamblichus, i.e. Porphyri, also wrote a work concerning a Life of Pythagoras. </div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Curnow, T. (2006). The philosophers of the ancient world: An A to Z guide. Bristol Classical Press.<br></div>    <div class="textItalicSmallMargin"><b>2)</b> Chiaradonna, Riccardo and Adrien Lecerf, "Iamblichus", The Stanford Encyclopedia of Philosophy (Winter 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/win2023/entries/iamblichus/&gt;.<br></div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q29747023" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q29747023</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://topostext.org/work.php?work_id=487" target="_blank" rel="noopener">https://topostext.org/work.php?work_id=487</a></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Βίος του Πυθαγόρα Ιάμβλιχος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: life_of_pythagoras_iamblichus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-G     ['<div class="terminologyEntry">    <div class="term">Lovers</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Erastai, Rival Lovers, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ερασταί</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: erastai</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Own work Jebulon, Plato&apos;s Academy mosaic. Roman mosaic of the 1st century BCE from Pompeii, now at the Museo Nazionale Archeologico, Naples. Public Domain, https://commons.wikimedia.org/w/index.php?curid=45896144</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/MANNapoli_124545_plato%27s_academy_mosaic.jpg/1280px-MANNapoli_124545_plato%27s_academy_mosaic.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/MANNapoli_124545_plato%27s_academy_mosaic.jpg/1280px-MANNapoli_124545_plato%27s_academy_mosaic.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/MANNapoli_124545_plato%27s_academy_mosaic.jpg/1280px-MANNapoli_124545_plato%27s_academy_mosaic.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Rival_Lovers" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Rival_Lovers</a     ['<div class="terminologyEntry">    <div class="term">Lun-Yü</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient chinese philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Analects, </font></div>    <div class="textMediumMargin"><b>Comment</b>: See also &apos;Analects&apos;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ανάλεκτα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: analects</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Chinese-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Rongo_Analects_02.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Confucius</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/8/84/Rongo_Analects_02.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/8/84/Rongo_Analects_02.jpg</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Lushichunqiu</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient chinese philosophical work</font></div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Lushichunqiu (Lü-shih ch’un-ch’iu), a Chinese anthology of late Warring States (403–221 B.C.) philosophical writings. It was compiled by a patron, Lu Buwei, who became chancellor of the state of Qin in about 240 B.C. As the earliest example of the encyclopedic genre, and often associated with the later Huainanzi, it includes the full spectrum of philosophical schools, and covers topics from competing positions on human nature to contemporary farming procedures.<br>[R. Audi, The Cambridge Dictionary of Philosophy, Third edition, 2015]</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: lushichunqiu</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Chinese-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Lysis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: In Lysis, Socrates questions the nature of friendship, using his method of asking probing questions to explore what makes someone a true friend, but the dialogue ends without a clear answer.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Reeve, C. D. C., "Plato on Friendship and Eros", The Stanford Encyclopedia of Philosophy (Summer 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/sum2023/entries/plato-friendship/&gt;</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Λύσις</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: lysis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Ctesippus of Paeania, Hippothales of Athens, Menexenus, Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Lysis_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Lysis_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1579/1579-h/1579-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1579/1579-h/1579-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/lysis.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/lysis.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+lysis+203a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+lysis+203a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/plato-friendship/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/plato-friendship/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg020" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg020</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Meditations</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">To himself, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Τα εις εαυτόν</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: to_himself</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Marcus Aurelius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Menexenus (Plato)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: The Menexenus is a Platonic dialogue featuring a funeral oration delivered by Socrates, purportedly learned from Aspasia, reflecting Athenian funeral oratory and referencing Pericles&apos; famous oration as recounted by Thucydides.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://www.gutenberg.org/files/1682/1682-h/1682-h.htm</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Μενέξενος (Πλάτωνος)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: menexenus_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Menexenus, Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.routledge.com/Politics-and-Philosophy-in-Platos-Menexenus/Pappas-Zelcer/p/book/9780367256135" target="_blank" rel="noopener">https://www.routledge.com/Politics-and-Philosophy-in-Platos-Menexenus/Pappas-Zelcer/p/book/9780367256135</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-menexenus" target="_blank" rel="noopener">https://philpapers.org/browse/plato-menexenus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato-philosopher_menexenus/1929/pb_LCL234.331.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato-philosopher_menexenus/1929/pb_LCL234.331.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Plat.%20Menex.%20235&amp;lang=original" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Plat.%20Menex.%20235&amp;lang=original</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://users.uoa.gr/~nektar/history/tributes/plato/dial/Menexenus.htm" target="_blank" rel="noopener">http://users.uoa.gr/~nektar/history/tributes/plato/dial/Menexenus.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1682/1682-h/1682-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1682/1682-h/1682-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Menexenus_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Menexenus_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg028" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg028</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Meno</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Plato&apos;s Meno explores whether virtue can be taught through a dialogue that delves into Socratic and Platonic themes of knowledge, ignorance, and the nature of virtue, ultimately questioning if virtue is a form of knowledge or a divine gift.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/meno-2/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Μένων</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: meno</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Gorgias of Leontini, Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Meno" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Meno</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/meno.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/meno.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+meno+70a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+meno+70a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1643/1643-h/1643-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1643/1643-h/1643-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-meno/1924/pb_LCL165.265.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-meno/1924/pb_LCL165.265.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-meno" target="_blank" rel="noopener">https://philpapers.org/browse/plato-meno</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg024" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg024</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Metaphysics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Aristotle&apos;s Metaphysics is a seminal work that explores the nature of being, existence, and reality. The treatise, divided into books named by Greek letters, delves into topics such as the concept of substance, the nature of change, and the principles of causation. It investigates what it means for something to exist and the underlying structures of reality, laying the groundwork for much of Western metaphysical thought.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Cohen, S. Marc and C. D. C. Reeve, "Aristotle’s Metaphysics", The Stanford Encyclopedia of Philosophy (Winter 2021 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/win2021/entries/aristotle-metaphysics/&gt;.<br></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Μετά τα Φυσικά</div>    <div class="textMediumMarginBlue">- el: Μεταφυσικά</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: metaphysics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aristotle</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/aristotle-metaphysics/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/aristotle-metaphysics/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://aristotelistes.cti.gr/admin/bookSelection#:~:text=%CE%9A%CE%B1%CF%84%CE%B7%CE%B3%CE%BF%CF%81%CE%AF%CE%B1%CE%B9-,%CE%9C%CE%B5%CF%84%E1%BD%B0%20%CF%84%E1%BD%B0%20%CF%86%CF%85%CF%83%CE%B9%CE%BA%CE%AC,-%CE%9C%CE%B5%CF%84%CE%B5%CF%89%CF%81%CE%BF%CE%BB%CE%BF%CE%B3%CE%B9%CE%BA%CE%AC" target="_blank" rel="noopener">https://aristotelistes.cti.gr/admin/bookSelection#:~:text=%CE%9A%CE%B1%CF%84%CE%B7%CE%B3%CE%BF%CF%81%CE%AF%CE%B1%CE%B9-,%CE%9C%CE%B5%CF%84%E1%BD%B0%20%CF%84%E1%BD%B0%20%CF%86%CF%85%CF%83%CE%B9%CE%BA%CE%AC,-%CE%9C%CE%B5%CF%84%CE%B5%CF%89%CF%81%CE%BF%CE%BB%CE%BF%CE%B3%CE%B9%CE%BA%CE%AC</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Meteorology</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Aristotle&apos;s Meteorology (around 340 B.C.) explores air, water, and earth phenomena, including evaporation and earthquakes. It introduces the spherical universe theory and the Four-Element Theory, describing how water, earth, fire, and air interact. The work combines Greek, Egyptian, and Babylonian ideas, using observations and deductive reasoning.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://www.wikiwand.com/en/Meteorology_(Aristotle)</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Μετεωρολογικά</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: meteorology</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aristotle</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://isidore.co/aquinas/english/Meteora.htm" target="_blank" rel="noopener">https://isidore.co/aquinas/english/Meteora.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Aristotle/meteorology.mb.txt" target="_blank" rel="noopener">https://classics.mit.edu/Aristotle/meteorology.mb.txt</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/workstranslatedi03arisuoft/workstranslatedi03arisuoft/" target="_blank" rel="noopener">https://archive.org/details/workstranslatedi03arisuoft/workstranslatedi03arisuoft/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://web.archive.org/web/20040405074445/http://etext.library.adelaide.edu.au/a/a8met/" target="_blank" rel="noopener">https://web.archive.org/web/20040405074445/http://etext.library.adelaide.edu.au/a/a8met/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikiwand.com/en/Meteorology_(Aristotle)" target="_blank" rel="noopener">https://www.wikiwand.com/en/Meteorology_(Aristotle)</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Minos</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: The dialogue "Minos" is attributed to Plato and features Socrates and a companion searching for a definition of "law".</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Μίνως</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: minos</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Plato - Henri Omont, Page of the Codex Parisinus graecus 1807. Dialogue Minos. Oeuvres philosophiques de Platon: Facsimilé en phototypie, à la grandeur exacte de l’original du Ms. grec 1807 de la Bibliothèque Nationale. Paris 1908., Public Domain, https://commons.wikimedia.org/w/index.php?curid=28341701</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Minos_beginning._Codex_Parisinus_graecus_1807.jpg/800px-Minos_beginning._Codex_Parisinus_graecus_1807.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Minos_beginning._Codex_Parisinus_graecus_1807.jpg/800px-Minos_beginning._Codex_Parisinus_graecus_1807.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Minos_beginning._Codex_Parisinus_graecus_1807.jpg/800px-Minos_beginning._Codex_Parisinus_graecus_1807.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Minos_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Minos_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+minos+313a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+minos+313a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-minos/1927/pb_LCL201.387.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-minos/1927/pb_LCL201.387.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://monadnock.net/plato/minos.html" target="_blank" rel="noopener">https://monadnock.net/plato/minos.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.platonicfoundation.org/translation/minos/" target="_blank" rel="noopener">https://www.platonicfoundation.org/translation/minos/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0179%3Atext%3DMinos%3Asection%3D320e" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0179%3Atext%3DMinos%3Asection%3D320e</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/plato-the-minos" target="_blank" rel="noopener">https://archive.org/details/plato-the-minos</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg033" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg033</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Miscellanies</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: One of the most important surviving works of Clement that belongs to a trilogy.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Fredericksen, Linwood. "St. Clement of Alexandria". Encyclopedia Britannica, 22 Feb. 2024, https://www.britannica.com/biography/Clement-of-Alexandria. Accessed 7 August 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Στρωματείς</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: miscellanies_clement</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Clement of Alexandria</div></div></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">Moralia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: The Moralia is a collection of Plutarch&apos;s philosophical writings, named from a group of eleven ethical works preserved in the 14th-century manuscript Parisinus Graecus 1672. Over time, this collection was expanded to include a broader array of Plutarch&apos;s dialogues and treatises on topics beyond ethics, encompassing various areas of philosophy. The term Moralia thus reflects a somewhat misleading implication of primarily ethical content, while the collection itself represents a later aggregation of his diverse philosophical works.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Karamanolis, George, "Plutarch", The Stanford Encyclopedia of Philosophy (Summer 2020 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/sum2020/entries/plutarch/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ηθικά</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: moralia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Pseudo-Plutarchus - Moralia, 1531. Available in the BEIC digital library and uploaded in partnership with BEIC Foundation., Public Domain, https://commons.wikimedia.org/w/index.php?curid=40009280</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Plutarchus_-_Moralia._De_placitis_philosophorum%2C_1531_-_3020537.tif/lossy-page1-1024px-Plutarchus_-_Moralia._De_placitis_philosophorum%2C_1531_-_3020537.tif.jpg" alt="unsupported fo     ['<div class="terminologyEntry">    <div class="term">Nicomachean Ethics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Aristotle&apos;s Nicomachean Ethics explores happiness (eudaimonia) and virtue (aretê), examining traits needed for a good life, conditions for praise and blame, and the nature of pleasure and friendship. It discusses the relationship between ethics and politics, Solon&apos;s dictum on happiness, and the superiority of the philosophical life. It is considered a refined version of his earlier Eudemian Ethics.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Kraut, Richard, "Aristotle’s Ethics", The Stanford Encyclopedia of Philosophy (Fall 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2022/entries/aristotle-ethics/&gt;.<br></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ηθικά Νικομάχεια</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: nicomachean_ethics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aristotle</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://aristotelistes.cti.gr/admin/bookSelection#:~:text=%E1%BC%A8%CE%B8%CE%B9%CE%BA%E1%BD%B0%20%CE%95%E1%BD%90%CE%B4%CE%AE%CE%BC%CE%B9%CE%B1-,%E1%BC%A8%CE%B8%CE%B9%CE%BA%E1%BD%B0%20%CE%9D%CE%B9%CE%BA%CE%BF%CE%BC%CE%AC%CF%87%CE%B5%CE%B9%CE%B1,-%CE%9A%CE%B1%CF%84%CE%B7%CE%B3%CE%BF%CF%81%CE%AF%CE%B1%CE%B9" target="_blank" rel="noopener">https://aristotelistes.cti.gr/ad     ['<div class="terminologyEntry">    <div class="term">On Memory and Reminiscence</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Οn of the works that make up the "Parva Naturalia" </div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://aristotelistes.cti.gr/admin/Lexicon/393</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Περί μνήμης και αναμνήσεως</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_memory_and_reminiscene</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aristotle</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.mikrosapoplous.gr/aristotle/mf/peri_mnhmhs_a.htm" target="_blank" rel="noopener">https://www.mikrosapoplous.gr/aristotle/mf/peri_mnhmhs_a.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://web.archive.org/web/20080130161517/http://ebooks.adelaide.edu.au/a/aristotle/memory/complete.html" target="_blank" rel="noopener">https://web.archive.org/web/20080130161517/http://ebooks.adelaide.edu.au/a/aristotle/memory/complete.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikisource.org/wiki/On_Memory_and_Reminiscence" target="_blank" rel="noopener">https://en.wikisource.org/wiki/On_Memory_and_Reminiscence</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.physics.ntua.gr/mourmouras/greats/aristoteles/peri_mnhmhs_kai_anamnhseon.html" target="_blank" rel="noopener">https://www.physics.ntua.gr/mourmouras/greats/aristoteles/peri_mnhmhs_kai_anamnhseon.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://aristotelistes.cti.gr/admin/Lexicon/393" target="_blank" rel="noopener">https://aristotelistes.cti.gr/admin/Lexicon/393</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">On nature (Anaxagoras)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Anaxagora&apos;s philosophical work, from which only fragment of the first part have survived mainly from the work of Simplicius of Ciliakia (6th c. CE).</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Περί φύσεως (Αναξαγόρας)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_nature_anaxagoras</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Anaxagoras of Clazomenae</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/anaxagoras/#H1" target="_blank" rel="noopener">https://iep.utm.edu/anaxagoras/#H1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Anaxagoras" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Anaxagoras</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Anaxagoras#:~:text=%5Bedit%5D-,Fragments,-%5Bedit%5D" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Anaxagoras#:~:text=%5Bedit%5D-,Fragments,-%5Bedit%5D</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://el.wikisource.org/wiki/%CE%A0%CE%B5%CF%81%CE%AF_%CF%86%CF%8D%CF%83%CE%B5%CF%89%CF%82_(%CE%91%CE%BD%CE%B1%CE%BE%CE%B1%CE%B3%CF%8C%CF%81%CE%B1%CF%82)" target="_blank" rel="noopener">https://el.wikisource.org/wiki/%CE%A0%CE%B5%CF%81%CE%AF_%CF%86%CF%8D%CF%83%CE%B5%CF%89%CF%82_(%CE%91%CE%BD%CE%B1%CE%BE%CE%B1%CE%B3%CF%8C%CF%81%CE%B1%CF%82)</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">On nature (Diogenes)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: In On Nature, Diogenes of Apollonia argues that air is the fundamental substance of the universe, embodying both intelligence and divinity, and serving as the source of all life and natural phenomena. His work synthesizes earlier philosophies, blending metaphysical ideas with empirical observations.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/diogenes-of-apollonia/</div>    <div class="textItalicSmallMargin"><b>2)</b> Britannica, The Editors of Encyclopaedia. "Diogenes Of Apollonia". Encyclopedia Britannica, 27 Feb. 2024, https://www.britannica.com/biography/Diogenes-of-Apollonia. Accessed 10 August 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Περί Φύσεως (Διογένης)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_nature_diogenes</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Diogenes of Apollonia</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">On nature (Empedocles)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: On Nature by Empedocles is a philosophical poem that describes the cosmos as composed of four eternal elements—air, water, earth, and fire—governed by the forces of Love and Strife. It explores the creation of life and the nature of perception, offering a vision of the universe&apos;s eternal cycle.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Kingsley, K. Scarlett and Richard Parry, "Empedocles", The Stanford Encyclopedia of Philosophy (Summer 2020 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/sum2020/entries/empedocles/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Περί φύσεως (Εμπεδοκλής)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_nature_empedocles</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By ancient Greek copyist - The Strasbourg Empedocles papyrus contained over 50 lines from Empedocles&apos; work On Nature that were not published until 1999. 2D copy of a scan of an ancient Greek papyrus, Public Domain, https://commons.wikimedia.org/w/index.php?curid=12657541</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/1/13/Empedokles_fragment_Physika_I_262%E2%80%93300.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Empedocles of Akragas</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/1/13/Empedokles_fragment_Physika_I_262%E2%80%93300.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/1/13/Empedokles_fragment_Physika_I_262%E2%80%93300.jpg</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">On nature (Epicurus)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: In this extensive and fragmentary work, Epicurus delves into his natural philosophy, discussing the nature of the physical world, the human soul, and the principles that govern existence, aiming to provide a framework for achieving peace of mind.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Konstan, David, "Epicurus", The Stanford Encyclopedia of Philosophy (Fall 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2022/entries/epicurus/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Περί φύσεως (Επίκουρος)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_nature_epicurus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Epicurus</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.jstor.org/stable/4182694" target="_blank" rel="noopener">https://www.jstor.org/stable/4182694</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.epicurism.info/etexts/ier.html" target="_blank" rel="noopener">https://www.epicurism.info/etexts/ier.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Epicureanism#On_Nature" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Epicureanism#On_Nature</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">On nature (Gorgias)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">On the Nonexistent, </font></div>    <div class="textMediumMargin"><b>Comment</b>: On Nature by Gorgias is a work that argues, in a paradoxical and nihilistic manner, that nothing exists; if anything does exist, it cannot be known; and if it can be known, it cannot be communicated. That is why the work is also titled as "On the Nonexistent".</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/gorgias/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Περί του μη όντος</div>    <div class="textMediumMarginBlue">- el: Περί φύσεως (Γοργίας)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_nature_gorgias</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Gorgias of Leontini</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">On nature (Heraclitus)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: About 100 fragments have survived from Heraclitus&apos; work by quotations of later authors.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Patrick, G. T. W. (1889). The Fragments of the Work of Heraclitus of Ephesus on Nature; Translated from the Greek Text of Bywater, with an Introduction Historical and Critical. N. Murray – via Google Books.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Περί φύσεως (Ηράκλειτος)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_nature_heraclitus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Heraclitus of Ephesus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">On nature (Parmenides)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Parmenides&apos; poem "On Nature" is divided into three sections: the Proem, Reality, and Opinion. Reality presents his argument that "what is" cannot change, while Opinion offers a contradictory cosmological view that reflects flawed human beliefs. The challenge lies in reconciling these opposing ideas, which has puzzled scholars for centuries.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/parmenid/</div>    <div class="textItalicSmallMargin"><b>2)</b> Palmer, John, "Parmenides", The Stanford Encyclopedia of Philosophy (Winter 2020 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/win2020/entries/parmenides/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Περί φύσεως (Παρμενίδης)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_nature_parmenides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Parmenides of Elea</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://philoctetes.free.fr/parmenidesunicode.htm" target="_blank" rel="noopener">http://philoctetes.free.fr/parmenidesunicode.htm</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">On nature (Philolaus)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Philolaus of Croton (c. 470–c. 385 BCE) was a Pythagorean philosopher who wrote "On Nature," introducing ideas about cosmic structure based on numerical harmonies. He proposed that the Earth orbits a central fire rather than being at the cosmos&apos;s center, influencing later thinkers like Plato and Aristotle.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Huffman, Carl, "Philolaus", The Stanford Encyclopedia of Philosophy (Summer 2024 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/sum2024/entries/philolaus/&gt;.</div>    <div class="textItalicSmallMargin"><b>2)</b> Britannica, The Editors of Encyclopaedia. "Philolaus". Encyclopedia Britannica, 2 Apr. 2024, https://www.britannica.com/biography/Philolaus. Accessed 16 August 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Περί φύσεως (Φιλόλαος)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_nature_philolaus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Philolaus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">On Pythagorean Symbols</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: A fragmentary surviving philosophical work of Androcydes regarding the symbols of Pythagoras.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Curnow, T. (2006). The philosophers of the ancient world: An A to Z guide. Bristol Classical Press.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Περί των Πυθαγορείων Συμβόλων</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_pythagorean_symbols</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>mentions</u>: Pythagoras of Samos</div>    <div class="attributeIndividual"> <u>authoredBy</u>: Androcydes (Pythagorean)</div></div></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">On the Heavens</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Aristotle&apos;s "On the Heavens" explores the structure and movement of the universe, proposing that celestial bodies move in perfect circles and are made of a fifth element distinct from the four earthly elements. It describes the Earth as a stationary sphere at the universe&apos;s center, with a series of concentric spheres carrying the stars and other celestial bodies.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://www.greek-language.gr/digitalResources/ancient_greek/anthology/literature/browse.html?text_id=335</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Περί Ουρανού</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_the_heavens</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aristotle</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://el.wikisource.org/wiki/%CE%A0%CE%B5%CF%81%CE%AF_%CE%9F%CF%85%CF%81%CE%B1%CE%BD%CE%BF%CF%8D" target="_blank" rel="noopener">https://el.wikisource.org/wiki/%CE%A0%CE%B5%CF%81%CE%AF_%CE%9F%CF%85%CF%81%CE%B1%CE%BD%CE%BF%CF%8D</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.physics.ntua.gr/mourmouras/greats/aristoteles/peri_Ouranou.html" target="_blank" rel="noopener">https://www.physics.ntua.gr/mourmouras/greats/aristoteles/peri_Ouranou.html</a></div>    <div class= "externalLinkIndividual">rdfs:see     ['<div class="terminologyEntry">    <div class="term">On the Laws</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Epinomis, </font></div>    <div class="textMediumMargin"><b>Comment</b>: "Epinomis," possibly not by Plato, extols mathematics and astronomy as the highest forms of religious expression, claiming that God instilled mathematical tendencies in humans and that the stars are divinely influenced.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://archive.org/details/epinomis</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Επινομίς</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: epinomis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/epinomis" target="_blank" rel="noopener">https://archive.org/details/epinomis</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/WorksOfPlatoV6" target="_blank" rel="noopener">https://archive.org/details/WorksOfPlatoV6</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/cache/epub/36191/pg36191-images.html" target="_blank" rel="noopener">https://www.gutenberg.org/cache/epub/36191/pg36191-images.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.routledge.com/The-Theology-of-the-Epinomis/Calchi/p/book/9780367683214" target="_blan     ['<div class="terminologyEntry">    <div class="term">Outlines of Pyrrhonism</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: The "Outlines of Pyrrhonism" by Sextus Empiricus provides a comprehensive account of Pyrrhonian Skepticism, explaining the technique of suspension of judgment (epochê) and offering skeptical counterarguments to philosophical positions on logic, physics, and ethics.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Morison, Benjamin, "Sextus Empiricus", The Stanford Encyclopedia of Philosophy (Fall 2019 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/fall2019/entries/sextus-empiricus/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Πυρρωνείων υποτυπώσεις</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: outlines_of_pyrrhonism</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Sextus Empiricus</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/LCL273/1933/volume.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/LCL273/1933/volume.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://people.uvawise.edu/philosophy/phil205/Sextus.html" target="_blank" rel="noopener">https://people.uvawise.edu/philosophy/phil205/Sextus.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/rec/EMPOOP-2" target="_blank" rel="noopener">https://phil
