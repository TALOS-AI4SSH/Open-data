    ['<div class="terminologyEntry">    <div class="term">Analects</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient chinese philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Lun-Yü, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Chinese philosophical text composed of sayings and ideas attributed to Confucius and his contemporaries, traditionally believed to have been compiled by his followers. </div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> See also Lun-Yü</div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://oll.libertyfund.org/title/soothill-the-analects" target="_blank" rel="noopener">https://oll.libertyfund.org/title/soothill-the-analects</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://ctext.org/analects" target="_blank" rel="noopener">https://ctext.org/analects</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://human.libretexts.org/Bookshelves/Literature_and_Literacy/World_Literature_I_-_Beginnings_to_1650_Part_I_-_The_Ancient_World_(Getty_and_Kwon)/02%3A_China/2.02%3A_The_Analects" target="_blank" rel="noopener">https://human.libretexts.org/Bookshelves/Literature_and_Literacy/World_Literature_I_-_Beginnings_to_1650_Part_I_-_The_Ancient_World_(Getty_and_Kwon)/02%3A_China/2.02%3A_The_Analects</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://classics.mit.edu/Confucius/analects.html" target="_blank" rel="noopener">https://classics.mit.edu/Confucius/analects.html</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Analects#/media/File:Rongo_Analects_02.jpg" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Analects#/media/File:Rongo_Analects_02.jpg</a></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b     ['<div class="terminologyEntry">    <div class="term">Apology</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Plato&apos;s "Apology" depicts Socrates defending himself during his trial in Athens, addressing accusations of impiety and corrupting the youth, and critiquing Athenian democracy for its flaws and superficiality.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Britannica, The Editors of Encyclopaedia. "Apology". Encyclopedia Britannica, 3 Apr. 2023, https://www.britannica.com/topic/Apology-by-Plato. Accessed 16 August 2024.</div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://iiif.bodleian.ox.ac.uk/iiif/mirador/?iiif-content=https://iiif.bodleian.ox.ac.uk/iiif/manifest/f57d074b-cff1-4172-8236-797c7b8f0403.json" target="_blank" rel="noopener">https://iiif.bodleian.ox.ac.uk/iiif/mirador/?iiif-content=https://iiif.bodleian.ox.ac.uk/iiif/manifest/f57d074b-cff1-4172-8236-797c7b8f0403.json</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0170%3Atext%3DApol." target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0170%3Atext%3DApol.</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Apology_(Plato)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Apology_(Plato)</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="http://classics.mit.edu/Plato/apology.html" target="_blank" rel="noopener">http://classics.mit.edu/Plato/apology.html</a></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Απολογία</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: apology</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Adeimantus of Collytus, Chaerephon of Sphettus, Crito of Alopece, Apollodorus of Phalerum, Gorgias of Leontini, Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Apology_(Plato)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Apology_(Plato)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://chs.harvard.edu/primary-source/plato-the-apology-of-socrates-sb/" target="_blank" rel="noopener">https://chs.harvard.edu/primary-source/plato-the-apology-of-socrates-sb/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/apology.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/apology.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Apology-by-Plato" target="_blank" rel="noopener">https://www.britannica.com/topic/Apology-by-Plato</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+apol.+17a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+apol.+17a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.famous-trials.com/socrates" target="_blank" rel="noopener">https://www.famous-trials.com/socrates</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/biography/Socrates/Platos-Apology" target="_blank" rel="noopener">https://www.britannica.com/biography/Socrates/Platos-Apology</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg002" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg002</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Athenian Constitution</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Constitution of the Athenians, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Aristotle&apos;s Constitution of Athens details Athens&apos; political system and history, covering reforms from Solon to the 4th-century BC democracy. It offers insights into Athenian democracy, political institutions, elections, and justice, serving as a key source for understanding ancient Athens.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> The Athenian Constitution ; The Eudemian ethics ; On virtues and vices: https://archive.org/details/athenianconstitu00arisuoft/page/n6/mode/1up</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Αθηναίων Πολιτεία</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: athenian_constitution</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aristotle</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/26095/26095-h/26095-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/26095/26095-h/26095-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=aristot.+ath.+pol.+22" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=aristot.+ath.+pol.+22</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://aristotelistes.cti.gr/admin/bookSelection" target="_blank" rel="noopener">https://aristotelistes.cti.gr/admin/bookSelection</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Axiochus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: A Socratic dialogue attributed to Plato, but which has been considered spurious for over 400 years.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://topostext.org/work/758</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Αξίοχος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: axiochus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Callias of Alopece, Charmides of Athens, Clinias of Scambonidae, Prodicus, Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg038" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg038</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/axiochus" target="_blank" rel="noopener">https://archive.org/details/axiochus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikisource.org/wiki/Axiochus" target="_blank" rel="noopener">https://en.wikisource.org/wiki/Axiochus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/work/758" target="_blank" rel="noopener">https://topostext.org/work/758</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Axiochus_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Axiochus_(dialogue)</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Categories</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Aristotle&apos;s Categories classifies different types of being and predication, forming a foundational framework for his philosophy and influencing major philosophers like Aquinas and Kant. It prompts significant debate but remains essential for understanding existence and classification in philosophy.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Studtmann, Paul, "Aristotle’s Categories", The Stanford Encyclopedia of Philosophy (Spring 2024 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/spr2024/entries/aristotle-categories/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Κατηγορίες</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: categories</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aristotle</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://aristotelistes.cti.gr/admin/bookSelection#:~:text=%E1%BC%A8%CE%B8%CE%B9%CE%BA%E1%BD%B0%20%CE%9D%CE%B9%CE%BA%CE%BF%CE%BC%CE%AC%CF%87%CE%B5%CE%B9%CE%B1-,%CE%9A%CE%B1%CF%84%CE%B7%CE%B3%CE%BF%CF%81%CE%AF%CE%B1%CE%B9,-%CE%9A%CE%B5%CF%86.%201%2D3" target="_blank" rel="noopener">https://aristotelistes.cti.gr/admin/bookSelection#:~:text=%E1%BC%A8%CE%B8%CE%B9%CE%BA%E1%BD%B0%20%CE%9D%CE%B9%CE%BA%CE%BF%CE%BC%CE%AC%CF%87%CE%B5%CE%B9%CE%B1-,%CE%9A%CE%B1%CF%84%CE%B7%CE%B3%CE%BF%CF%81%CE%AF%CE%B1%CE%B9,-%CE%9A%CE%B5%CF%86.%201%2D3</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0086.tlg006" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0086.tlg006</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Charmides - philosophical work</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: A Greek philosophical work by Plato. &apos;Charmides&apos; is the earliest and most radical investigation of self-knowledge (σωφροσύνη, sophrosune/sophrosyne, variously translated as “moderation”, "temperance," “sound-mindedness”, "self-control").</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://philpapers.org/browse/plato-charmides</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Χαρμίδης- φιλοσοφικό έργο</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: charmides_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Plato -Charmides Codex Oxoniensis Clarkianus 39, facsimile by Sijthoff with foreword by Allen., Public Domain, https://commons.wikimedia.org/w/index.php?curid=26910417</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/0/01/Charmides_beginning._Clarke_Plato.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Charmides of Athens, Critias (philosopher), Chaerephon of Sphettus, Prodicus, Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/0/01/Charmides_beginning._Clarke_Plato.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/0/01/Charmides_beginning._Clarke_Plato.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-charmides" target="_blank" rel="noopener">https://philpapers.org/browse/plato-charmides</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Charmides-by-Plato" target="_blank" rel="noopener">https://www.britannica.com/topic/Charmides-by-Plato</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+charm.+153a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+charm.+153a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1580/1580-h/1580-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1580/1580-h/1580-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg018" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg018</a></div></div></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">Cleitophon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Clitophon, </font></div>    <div class="textMediumMargin"><b>Comment</b>: A brief dialogue attributed to Plato but possibly not authored by him, features Clitopho criticizing Socrates for urging justice without successfully making others just.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://archive.org/details/clitopho</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Κλειτοφών</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: clitophon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Thrasymachus of Chalcedon, Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://la.wikisource.org/wiki/Clitopho" target="_blank" rel="noopener">https://la.wikisource.org/wiki/Clitopho</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Clitophon_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Clitophon_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://monadnock.net/plato/clitophon.html" target="_blank" rel="noopener">https://monadnock.net/plato/clitophon.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+cleit.+406a" ta     ['<div class="terminologyEntry">    <div class="term">Constitution of the Athenians</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Athenian Constitution, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Αθηναίων Πολιτεία</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: athenian_constitution</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aristotle</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/26095/26095-h/26095-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/26095/26095-h/26095-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=aristot.+ath.+pol.+22" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=aristot.+ath.+pol.+22</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://aristotelistes.cti.gr/admin/bookSelection" target="_blank" rel="noopener">https://aristotelistes.cti.gr/admin/bookSelection</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Cratylus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: A Platonic dialogue focused exclusively on language and its relation to reality, explores whether the correctness of names is based on convention or a natural standard, with Socrates mediating between the views of Hermogenes and Cratylus.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Meißner, David, "Plato’s Cratylus", The Stanford Encyclopedia of Philosophy (Summer 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/sum2023/entries/plato-cratylus/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Κρατύλος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: cratylus_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>mentions</u>: Cratylus (philosopher), Hermogenes of Alopece, Callias of Alopece, Euthydemus of Chios, Prodicus, Protagoras of Abdera, Socrates</div>    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg005" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg005</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Cratylus-by-Plato" target="_blank" rel="noopener">https://www.britannica.com/topic/Cratylus-by-Plato</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-cratylus" target="_blank" rel="noopener">https://philpapers.org/browse/plato-cratylus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-cratylus/1926/pb_LCL167.5.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-cratylus/1926/pb_LCL167.5.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/cratylus.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/cratylus.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1616/1616-h/1616-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1616/1616-h/1616-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+crat.+383a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+crat.+383a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Cratylus_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Cratylus_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/plato-cratylus/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/plato-cratylus/</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Critias</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: The "Critias" is an incomplete dialogue by Plato, following the "Timaeus," where Critias continues his account of the conflict between Athens and Atlantis but the text cuts off abruptly.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://philpapers.org/browse/plato-critias</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Κριτίας</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: critias_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Timaeus of Locri</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg032" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg032</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-critias" target="_blank" rel="noopener">https://philpapers.org/browse/plato-critias</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+criti.+106a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+criti.+106a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Critias-by-Plato" target="_blank" rel=     ['<div class="terminologyEntry">    <div class="term">Crito</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: It depicts a conversation between Socrates and his wealthy friend Crito of Alopece about justice, injustice, and the appropriate response to injustice (following Socrates&apos;s imprisonment).</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/plato/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Κρίτων</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: crito_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By medieval author - Beginning of Crito in the Codex Oxoniensis Clarkianus 39 of the Bodleian library (dating from around 895). manuscript, Public Domain, https://commons.wikimedia.org/w/index.php?curid=28037771</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Kriton_beginning._Clarke_Plato.jpg/800px-Kriton_beginning._Clarke_Plato.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Crito of Alopece, Simmias of Thebes, Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Kriton_beginning._Clarke_Plato.jpg/800px-Kriton_beginning._Clarke_Plato.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Kriton_beginning._Clarke_Plato.jpg/800px-Kriton_beginning._Clarke_Plato.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://bacchicstage.wordpress.com/plato/platos-crito-3/" target="_blank" rel="noopener">https://bacchicstage.wordpress.com/plato/platos-crito-3/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg003" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg003</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.oxfordbibliographies.com/display/document/obo-9780195389661/obo-9780195389661-0368.xml" target="_blank" rel="noopener">https://www.oxfordbibliographies.com/display/document/obo-9780195389661/obo-9780195389661-0368.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Crito" target="_blank" rel="noopener">https://www.britannica.com/topic/Crito</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://academic.oup.com/aristotelian/article/123/1/26/7097506" target="_blank" rel="noopener">https://academic.oup.com/aristotelian/article/123/1/26/7097506</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-crito/1914/pb_LCL036.151.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-crito/1914/pb_LCL036.151.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+crito+43a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+crito+43a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/crito.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/crito.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Crito" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Crito</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Daodejing</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient chinese philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: A Chinese classic text and foundational work of Taoism written around 400 BC and traditionally credited to the sage Laozi. Also known as Tao Te Ching.</div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://ctext.org/dao-de-jing" target="_blank" rel="noopener">https://ctext.org/dao-de-jing</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Tao_Te_Ching" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Tao_Te_Ching</a></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- zh: 道德經</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: daodejing</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Chinese-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <img src="https://en.wikipedia.org/wiki/Tao_Te_Ching/media/File:Mawangdui_LaoTsu_Ms2.JPG" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Laozi</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://en.wikipedia.org/wiki/Tao_Te_Ching/media/File:Mawangdui_LaoTsu_Ms2.JPG" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Tao_Te_Ching/media/File:Mawangdui_LaoTsu_Ms2.JPG</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://ctext.org/dao-de-jing" target="_blank" rel="noopener">https://ctext.org/dao-de-jing</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Daxue</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient chinese philosophical work</font></div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Daxue (Ta-hsüeh), a part of the Chinese Confucian classic Book of Rites whose title is<br>standardly translated as Great Learning. Zhu Xi<br>significantly amended the text (composed in the<br>third or second century B.C.) and elevated it to<br>the status of an independent classic as one of the Four Books. He regarded it as a quotation from Confucius and a commentary by Confucius’s disciple Zengzi, but neither his emendations nor his interpretation of the text are beyond dispute.<br>The Daxue instructs a ruler in how to bring order to his state by self-cultivation.<br>[R. Audi, The Cambridge Dictionary of Philosophy, Third edition, 2015]</div>    <div class="textItalicSmallMargin"><b>2)</b> The Great Learning or Daxue was one of the "Four Books" in Confucianism attributed to one of Confucius&apos; disciples, Zengzi. The Great Learning had come from a chapter in the Book of Rites which formed one of the Five Classics. It consists of a short main text of the teachings of Confucius transcribed by Zengzi and then ten commentary chapters supposedly written by Zengzi.[2] The ideals of the book were attributed to Confucius, but the text was written by Zengzi after his death.<br><br>The "Four Books" were selected by the neo-Confucian Zhu Xi during the Song dynasty as a foundational introduction to Confucianism.<br>Source: Wikipedia https://en.wikipedia.org/wiki/Great_Learning</div>    <div class="textItalicSmallMargin"><b>3)</b> Chinese classic, preserved as a chapter in the Lijing; consists of a short main text attributed to Confucius and ten commentary chapters attributed to Zengzi<br>The Great Learning<br>Source: Wikidata https://www.wikidata.org/wiki/Q1069886</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: daxue</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Chinese-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Demodocus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: "Demodocus," possibly not a work by Plato, questions the need for advisors, the benefit of hearing liars, fault in lending refusals, and the wisdom of trusting strangers.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://archive.org/details/demodocus</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Δημόδοκος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: demodocus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Demodocus_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Demodocus_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://demonax.info/doku.php?id=text:demodocus" target="_blank" rel="noopener">http://demonax.info/doku.php?id=text:demodocus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/demodocus" target="_blank" rel="noopener">https://archive.org/details/demodocus</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Discourses</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: The "Discourses" are a series of more extensive lectures given by Epictetus and recorded by Arrian. These texts delve into various aspects of Stoic philosophy, such as ethics, logic, and theology, offering more in-depth discussions compared to the "Enchiridion."<br></div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/epicur/</div>    <div class="textItalicSmallMargin"><b>2)</b> Konstan, David, "Epicurus", The Stanford Encyclopedia of Philosophy (Fall 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2022/entries/epicurus/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Διατριβαί</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: discourses_epictetus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Epictetus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Elements of Harmony</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: A fragmentary work written by Aristoxenus of Tarentum concerning meter and rhythm.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Britannica, The Editors of Encyclopaedia. "Aristoxenus". Encyclopedia Britannica, 13 Feb. 2024, https://www.britannica.com/biography/Aristoxenus. Accessed 1 August 2024.</div>    <div class="textItalicSmallMargin"><b>2)</b> Curnow, T. (2006). The philosophers of the ancient world: An A to Z guide. Bristol Classical Press.<br></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Αρμονικά στοιχεία</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: elements_of_harmony</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aristoxenus of Tarentum</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Enchiridion</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">The Handbook, The Manual, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Εγχειρίδιον</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: the_handbook_epictetus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Epictetus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Enneads</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: The Enneads are 54 philosophical treatises by Plotinus, edited into six groups of nine by his student Porphyry. They cover topics like ethics, cosmology, psychology, and metaphysics, with Porphyry’s arrangement reflecting thematic rather than chronological order.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/plotinus/</div>    <div class="textItalicSmallMargin"><b>2)</b> Gerson, Lloyd, "Plotinus", The Stanford Encyclopedia of Philosophy (Fall 2018 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/fall2018/entries/plotinus/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Εννεάδες</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: enneads</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plotinus</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/PlotinusEnneads.ElectronicTextEdition" target="_blank" rel="noopener">https://archive.org/details/PlotinusEnneads.ElectronicTextEdition</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0062%3Aalphabetic+letter%3DP%3Aentry+group%3D18%3Aentry%3Dplotinus-harpers" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0062%3Aalphabetic+letter%3DP%3Aentry+group%3D18%3Aentry%3Dplotinus-harpers</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Enneads" target="_blank" rel="noopener">https://www.britannica.com/topic/Enneads</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plotinus-enneas/1966/pb_LCL444.287.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plotinus-enneas/1966/pb_LCL444.287.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plotinus/enneads.html" target="_blank" rel="noopener">https://classics.mit.edu/Plotinus/enneads.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Enneads" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Enneads</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Epinomis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">On the Laws, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Επινομίς</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: epinomis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/epinomis" target="_blank" rel="noopener">https://archive.org/details/epinomis</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/WorksOfPlatoV6" target="_blank" rel="noopener">https://archive.org/details/WorksOfPlatoV6</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/cache/epub/36191/pg36191-images.html" target="_blank" rel="noopener">https://www.gutenberg.org/cache/epub/36191/pg36191-images.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.routledge.com/The-Theology-of-the-Epinomis/Calchi/p/book/9780367683214" target="_blank" rel="noopener">https://www.routledge.com/The-Theology-of-the-Epinomis/Calchi/p/book/9780367683214</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-epinomis/1927/pb_LCL201.427.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-epinomis/1927/pb_LCL201.427.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-epinomis/1927/pb_LCL201.425.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-epinomis/1927/pb_LCL201.425.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0180%3Atext%3DEpin." target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0180%3Atext%3DEpin.</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Epinomis" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Epinomis</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg035" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg035</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Erastai</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Lovers, Rival Lovers, </font></div>    <div class="textMediumMargin"><b>Comment</b>: "Rival Lovers," possibly not by Plato, features Socrates discussing the usefulness of philosophers to society with an athlete and educator, leading to uncertain conclusions.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://archive.org/details/rivallovers</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ερασταί</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: erastai</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Own work Jebulon, Plato&apos;s Academy mosaic. Roman mosaic of the 1st century BCE from Pompeii, now at the Museo Nazionale Archeologico, Naples. Public Domain, https://commons.wikimedia.org/w/index.php?curid=45896144</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/MANNapoli_124545_plato%27s_academy_mosaic.jpg/1280px-MANNapoli_124545_plato%27s_academy_mosaic.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/MANNapoli_124545_plato%27s_academy_mosaic.jpg/1280px-MANNapoli_124545_plato%27s_academy_mosaic.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/MANNapoli_124545_plato%27s_academy_mosaic.jpg/1280px-MANNapoli_124545_plato%27s_academy_mosaic.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Rival_Lovers" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Rival_Lovers</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/plato-lovers-erastai-leake_2023099" target="_blank" rel="noopener">https://archive.org/details/plato-lovers-erastai-leake_2023099</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://monadnock.net/plato/erastai.html" target="_blank" rel="noopener">https://monadnock.net/plato/erastai.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-lovers/1927/pb_LCL201.313.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-lovers/1927/pb_LCL201.313.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Plat.%20Lovers%20132&amp;lang=original" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Plat.%20Lovers%20132&amp;lang=original</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.physics.ntua.gr/mourmouras/greats/platon/erastaiperifilosofias.html" target="_blank" rel="noopener">https://www.physics.ntua.gr/mourmouras/greats/platon/erastaiperifilosofias.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://users.uoa.gr/~nektar/history/tributes/plato/dial/index.htm" target="_blank" rel="noopener">http://users.uoa.gr/~nektar/history/tributes/plato/dial/index.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg016" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg016</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Eudemian Ethics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: The "Eudemian Ethics" by Aristotle examines virtue, happiness, and ethical principles, offering a perspective on moral philosophy similar to the Nicomachean Ethics.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Amadio, Anselm H. and Kenny, Anthony J.P.. "Aristotle". Encyclopedia Britannica, 25 May. 2024, https://www.britannica.com/biography/Aristotle. Accessed 24 July 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ηθικά Ευδήμεια</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: eudemian_ethics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aristotle</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikisource.org/wiki/Eudemian_Ethics" target="_blank" rel="noopener">https://en.wikisource.org/wiki/Eudemian_Ethics</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://aristotelistes.cti.gr/admin/bookSelection#:~:text=%E1%BC%88%CE%BD%CE%B1%CE%BB%CF%85%CF%84%CE%B9%CE%BA%E1%BD%B0%20%E1%BD%95%CF%83%CF%84%CE%B5%CF%81%CE%B1-,%E1%BC%A8%CE%B8%CE%B9%CE%BA%E1%BD%B0%20%CE%95%E1%BD%90%CE%B4%CE%AE%CE%BC%CE%B9%CE%B1,-%E1%BC%A8%CE%B8%CE%B9%CE%BA%E1%BD%B0%20%CE%9D%CE%B9%CE%BA%CE%BF%CE%BC%CE%AC%CF%87%CE%B5%CE%B9%CE%B1" target="_blank" rel="noopener">https://aristotelistes.cti.gr/admin/bookSelection#:~:text=%E1%BC%88%CE%BD%CE%B1%CE%BB%CF%85%CF%84%CE%B9%CE%BA%E1%     ['<div class="terminologyEntry">    <div class="term">Euthyphro</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: A Socratic dialogue (which occurs some weeks before the Socrates&apos; trial). The dialogue is about the meaning of piety and justice and ends in "ἀπορία".</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://www.gutenberg.org/files/1642/1642-h/1642-h.htm</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ευθύφρων</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: euthyphro</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Platon; Henricus Stephanus -Henri Estienne&apos;s 1578 edition of Euthyphro, parallel Latin and Greek text. Internet Archive. Digitalisat der Sloan Foundation nach einem Exemplar der John Adams Library at the Boston Public Library, Public Domain, https://commons.wikimedia.org/w/index.php?curid=6409219</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Euthyphro_Stephanus_1578_p_2.jpg/800px-Euthyphro_Stephanus_1578_p_2.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Euthyphro_Stephanus_1578_p_2.jpg/800px-Euthyphro_Stephanus_1578_p_2.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/c     ['<div class="terminologyEntry">    <div class="term">Exhortation to Philosophy (Iamblichus)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Protrepticus (Iamblichus), </font></div>    <div class="textMediumMargin"><b>Comment</b>: Exhortation to Philosophy (Protrepticus) by Iamblichus is a work urging readers to embrace philosophy as a path to personal and spiritual growth. It emphasizes the value of philosophical inquiry and ethical self-improvement.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Curnow, T. (2006). The philosophers of the ancient world: An A to Z guide. Bristol Classical Press.<br></div>    <div class="textItalicSmallMargin"><b>2)</b> Chiaradonna, Riccardo and Adrien Lecerf, "Iamblichus", The Stanford Encyclopedia of Philosophy (Winter 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/win2023/entries/iamblichus/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Προτρεπτικός του Ιάμβλιχου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: protrepticus_iamblichus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Iamblichus of Chalcis</div></div></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">Gorgias (Plato)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Plato’s Gorgias contrasts rhetoric, which seeks to persuade and manipulate, with Socratic dialogue, which pursues truth and justice. Socrates argues that it’s better to suffer injustice than to commit it, highlighting the importance of moral integrity over winning favor or avoiding harm.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Sheffield, Frisbee. “Plato’s Gorgias.” Classics for All, 1 July 2022, https://classicsforall.org.uk/reading-room/ad-familiares/platos-gorgias. Accessed 16 Aug. 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Γοργίας (Πλάτωνα)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: gorgias_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Callicles of Acharnae, Gorgias of Leontini, Chaerephon of Sphettus, &apos;polus_of_acragas&apos; Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-gorgias" target="_blank" rel="noopener">https://philpapers.org/browse/plato-gorgias</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/LCL166/1925/volume.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/LCL166/1925/volume.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a     ['<div class="terminologyEntry">    <div class="term">Greater Hippias</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Hippias Major, </font></div>    <div class="textMediumMargin"><b>Comment</b>: In the Hippias Major, Socrates and Hippias set out to find a definition for "beauty".</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://archive.org/details/hippiasmajor</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ιππίας μείζων</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: hippias_major</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Hippias of Elis, Gorgias of Leontini, Prodicus, Protagoras of Abdera, Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg025" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg025</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.hellenicaworld.com/Greece/Literature/en/HippiasMajor.html" target="_blank" rel="noopener">https://www.hellenicaworld.com/Greece/Literature/en/HippiasMajor.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Hippias-Major" target="_blank" rel="noopener">https://www.britannica.com/topic/Hippias-Major</a></div>    <div class= "externalLinkIndividual">rdfs:se     ['<div class="terminologyEntry">    <div class="term">Guanzi</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient chinese philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Guan-Zi is an ancient Chinese political and philosophical text. It is one of the most representative texts of the concepts of political economy that developed during the Warring States era. It is traditionally attributed to the 7th century BCE philosopher and statesman Guan Zhong, who served as Prime Minister to Duke Huan of Qi.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Guanzi (Kuan Tzu), also called Guan Zhong The Guanzi (Chinese: 管子) is an ancient Chinese political and philosophical text. At over 135,000 characters long, the Guanzi is one of the longest early Chinese philosophical texts. This anonymously written foundational text covers broad subject matter, notably including price regulation of commodities via the concept of "light and heavy" (轻重). It is one of the most representative texts of the concepts of political economy that developed during the Warring States era.<br>Source: Wikipedia https://en.wikipedia.org/wiki/Guanzi_(text)</div>    <div class="textItalicSmallMargin"><b>2)</b> The book Guanzi 管子 "Master Guan" is a collection of various philosophical treatises on statecraft collected in the state of Qi 齊 during the Spring and Autumn period 春秋 (770-5th cent. BCE).<br><br>The book<br>The author is said to have been Guan Zhong 管仲, counsellor of Duke Huan of Qi 齊桓公 (r. 685-643). The modern version was arranged by the Han period 漢 (206 BC-220 AD) scholar Liu Xiang 劉向 and consisted of 86 chapters (pian) of which only 76 survive (of the others, only the titles are known), arranged into 8 categories. Those are:<br><br>經言 Jingyan in 9 chapters<br>外言 Waiyan in 8 chapters<br>內言 Neiyan in 7 chapters<br>短語 Duanyu in 17 chapters<br>區言 Quyu in 5 chapters<br>雜篇 Zapian 10 chapters<br>管子解 Guanzi jie in 4 chapters<br>管子輕重 Guanzi qingzhong in 16 chapters<br>Source: ChinaKnowledge.de -<br>An Encyclopaedia on Chinese History and Literature http://www.chinaknowledge.de/Literature/Diverse/guanzi.html</div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="http://www.chinaknowledge.de/Literature/Diverse/guanzi.html" target="_blank" rel="noopener">http://www.chinaknowledge.de/Literature/Diverse/guanzi.html</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Guanzi_(text)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Guanzi_(text)</a></div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: guanzi</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Chinese-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Hipparch</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Hipparchus, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Plato&apos;s Hipparchus explores the love of gain. Socrates&apos; defense of it offers insights into the nature of the human good and its link to philosophy and morality.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Bellows, Samuel Palmer. "Plato&apos;s Hipparchus." UT Electronic Theses and Dissertations, University of Texas at Austin, 23 Sept. 2015, http://hdl.handle.net/2152/34042. Accessed 16 Aug. 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ίππαρχος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: hipparchus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://repositories.lib.utexas.edu/items/0a579fb6-00e4-4a67-abd1-9d7dae1b70f5" target="_blank" rel="noopener">https://repositories.lib.utexas.edu/items/0a579fb6-00e4-4a67-abd1-9d7dae1b70f5</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/rec/PLAHGA" target="_blank" rel="noopener">https://philpapers.org/rec/PLAHGA</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-hipparchus/1927/pb_LCL201.279.x
