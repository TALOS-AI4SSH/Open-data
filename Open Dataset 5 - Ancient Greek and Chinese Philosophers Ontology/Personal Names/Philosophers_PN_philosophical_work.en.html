    ['<div class="terminologyEntry">    <div class="term">Sense and Sensibilia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">On Sense and the Sensible, On Sense and What is Sensed, On Sense Perception, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Περί αισθήσεως και αισθητών</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sense_and_sensibilia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aristotle</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.mikrosapoplous.gr/aristotle/mf/peri_aisthisews_m.htm" target="_blank" rel="noopener">https://www.mikrosapoplous.gr/aristotle/mf/peri_aisthisews_m.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://aristotelistes.cti.gr/admin/Lexicon/388" target="_blank" rel="noopener">https://aristotelistes.cti.gr/admin/Lexicon/388</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://el.wikisource.org/wiki/%CE%A0%CE%B5%CF%81%CE%AF_%CE%B1%CE%B9%CF%83%CE%B8%CE%AE%CF%83%CE%B5%CF%89%CF%82_%CE%BA%CE%B1%CE%B9_%CE%B1%CE%B9%CF%83%CE%B8%CE%B7%CF%84%CF%8E%CE%BD" target="_blank" rel="noopener">https://el.wikisource.org/wiki/%CE%A0%CE%B5%CF%81%CE%AF_%CE%B1%CE%B9%CF%83%CE%B8%CE%AE%CF%83%CE%B5%CF%89%CF%82_%CE%BA%CE%B1%CE%B9_%CE%B1%CE%B9%CF%83%CE%B8%CE%B7%CF%84%CF%8E%CE%BD</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikisource.org/wiki/On_Sense_and_the_Sensible" target="_blank" rel="noopener">https://en.wikisource.org/wiki/On_Sense_and_the_Sensible</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Shiji</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient chinese philosophical work</font></div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: shiji</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Chinese-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Silloi</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Satirical poems, lampoons, of Timon of Phlius. They were written in hexameter verse. They consisted in three books, in the first of which he spoke in his own person, and the other two are in the form of a dialogue between the author and Xenophanes, in which Timon proposed questions, to which Xenophanes replied at length. The subject was a sarcastic account of the tenets of all philosophers, living and dead. </div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Timon_of_Phlius#Silloi" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Timon_of_Phlius#Silloi</a></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Σίλλοι</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: silloi</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Timon of Phlius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Sisyphus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: The Sisyphus dialogue, which is acknowledged to be spurious, explores the nature of deliberation and reveals Sisyphus&apos;s misunderstanding through his conversation with Socrates.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://archive.org/details/WorksOfPlatoV6/page/274/mode/1up</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Σίσυφος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sisyphus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikisource.org/wiki/Sisyphus" target="_blank" rel="noopener">https://en.wikisource.org/wiki/Sisyphus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philosophyaudiobooks.libsyn.com/sisyphus" target="_blank" rel="noopener">https://philosophyaudiobooks.libsyn.com/sisyphus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://academic.oup.com/book/39292/chapter-abstract/338877550?redirectedFrom=fulltext" target="_blank" rel="noopener">https://academic.oup.com/book/39292/chapter-abstract/338877550?redirectedFrom=fulltext</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.thelatinlibrary.com/psplato.sisyphus.html" target="_blank" rel="noopener">https://www.thelatinlibrary.com/psplato.sisyphus.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/upontakingcounsel" target="_blank" rel="noopener">https://archive.org/details/upontakingcounsel</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Sisyphus_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Sisyphus_(dialogue)</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Sophist</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: The dialogue Sophist by Plato focuses on defining what a sophist is, exploring the concept of "non-being," and addressing the problem of false statements, ultimately portraying the sophist as someone who creates false impressions and pretends to have knowledge without truly being a philosopher.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Gill, Mary-Louise, "Method and Metaphysics in Plato’s Sophist and Statesman", The Stanford Encyclopedia of Philosophy (Fall 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2023/entries/plato-sophstate/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Σοφιστής</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sophist_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Parmenides of Elea, Protagoras of Abdera, Zeno of Elea, Theodorus of Cyrene (mentioned by Plato), Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg007" target="_blank" rel="noopener">http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg007</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/sophist.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/sophist.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-sophist/1921/pb_LCL123.261.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-sophist/1921/pb_LCL123.261.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/plato-sophstate/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/plato-sophstate/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+soph.+216a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+soph.+216a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1735/1735-h/1735-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1735/1735-h/1735-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Sophist_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Sophist_(dialogue)</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Sophistical Refutations</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">On Sophistical Refutations, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Σοφιστικοί Έλεγχοι</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sophistical_refutations</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aristotle</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://aristotelistes.cti.gr/admin/Lexicon/407" target="_blank" rel="noopener">https://aristotelistes.cti.gr/admin/Lexicon/407</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://el.wikisource.org/wiki/%CE%A3%CE%BF%CF%86%CE%B9%CF%83%CF%84%CE%B9%CE%BA%CE%BF%CE%AF_%CE%88%CE%BB%CE%B5%CE%B3%CF%87%CE%BF%CE%B9/3" target="_blank" rel="noopener">https://el.wikisource.org/wiki/%CE%A3%CE%BF%CF%86%CE%B9%CF%83%CF%84%CE%B9%CE%BA%CE%BF%CE%AF_%CE%88%CE%BB%CE%B5%CE%B3%CF%87%CE%BF%CE%B9/3</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://aristotelistes.cti.gr/admin/Lexicon/459" target="_blank" rel="noopener">https://aristotelistes.cti.gr/admin/Lexicon/459</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://el.wikisource.org/wiki/%CE%A3%CE%BF%CF%86%CE%B9%CF%83%CF%84%CE%B9%CE%BA%CE%BF%CE%AF_%CE%88%CE%BB%CE%B5%CE%B3%CF%87%CE%BF%CE%B9/1" target="_blank" rel="noopener">https://el.wikisource.org/wiki/%CE%A3%CE%BF%CF%86%CE%B9%CF%83%CF%84%CE%B9%CE%BA%CE%BF%CE%AF_%CE%88%CE%BB%CE%B5%CE%B3%CF%87%CE%BF%CE%B9/1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Sophistical-Refutations" target="_blank" rel="noopener">https://www.britannica.com/topic/Sophistical-Refutations</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Sophistical_Refutations" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Sophistical_Refutations</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Statesman</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: The dialogue Statesman by Plato examines the nature of a true statesman, contrasting it with other roles and emphasizing the importance of proper methodology in political philosophy and dialectical practice.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Gill, Mary-Louise, "Method and Metaphysics in Plato’s Sophist and Statesman", The Stanford Encyclopedia of Philosophy (Fall 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2023/entries/plato-sophstate/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Πολιτικός</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: statesman</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>mentions</u>: Theodorus of Cyrene (mentioned by Plato), Socrates</div>    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg008" target="_blank" rel="noopener">http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg008</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/plato-sophstate/#PurSopSta" target="_blank" rel="noopener">https://plato.stanford.edu/entries/plato-sophstate/#PurSopSta</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/stateman.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/stateman.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-statesman/1925/pb_LCL164.3.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-statesman/1925/pb_LCL164.3.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Statesman-by-Plato" target="_blank" rel="noopener">https://www.britannica.com/topic/Statesman-by-Plato</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+stat.+257a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+stat.+257a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1738/1738-h/1738-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1738/1738-h/1738-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Statesman_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Statesman_(dialogue)</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Successions of Philosophers</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: "Successions of Philosophers" by Alexander Polyhistor documented the lineage, teachings, and contributions of various philosophers. Referenced by Diogenes Laertius, this work, though lost, is partially known through later quotations, preserving the philosophical heritage of ancient scholars.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Romanov, O. (n.d.). Alexander Polyhistor (1st cn. B.C.E.). Internet Encyclopedia of Philosophy. Retrieved from https://iep.utm.edu/alexander-polyhistor/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Φιλοσόφων διαδοχαί</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: philosophers_successions</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Lucius Cornelius Alexander Polyhistor</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/alexander-polyhistor/" target="_blank" rel="noopener">https://iep.utm.edu/alexander-polyhistor/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Doxography#Successions_of_Philosophers" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Doxography#Successions_of_Philosophers</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Symposium</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: The Symposium by Plato is a dialogue centered on a series of speeches given at a symposium (banquet), each exploring different aspects of love and beauty, culminating in Socrates&apos; discussion of love as a pursuit of the eternal and divine truth.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Reeve, C. D. C., "Plato on Friendship and Eros", The Stanford Encyclopedia of Philosophy (Summer 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/sum2023/entries/plato-friendship/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Συμπόσιο</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: symposium</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Plato - Symposion beginning. Editio princeps, Venice 1513, editio princeps, Public Domain, https://commons.wikimedia.org/w/index.php?curid=28037786</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Symposion_beginning._Editio_princeps.jpg/800px-Symposion_beginning._Editio_princeps.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Diotima of Mantinea, Apollodorus of Phalerum, Charmides of Athens, Gorgias of Leontini, Parmenides of Elea, Prodicus, Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Symposion_beginning._Editio_princeps.jpg/800px-Symposion_beginning._Editio_princeps.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Symposion_beginning._Editio_princeps.jpg/800px-Symposion_beginning._Editio_princeps.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg011" target="_blank" rel="noopener">http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg011</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://chs.harvard.edu/chapter/3-a-platonic-reading-of-platos-symposium-lloyd-p-gerson/" target="_blank" rel="noopener">https://chs.harvard.edu/chapter/3-a-platonic-reading-of-platos-symposium-lloyd-p-gerson/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/ebooks/1600" target="_blank" rel="noopener">https://www.gutenberg.org/ebooks/1600</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-symposium/1925/pb_LCL166.79.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-symposium/1925/pb_LCL166.79.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0174:text=Sym." target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0174:text=Sym.</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/plato-friendship/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/plato-friendship/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/symposium.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/symposium.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1600/1600-h/1600-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1600/1600-h/1600-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Symposium_(Plato)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Symposium_(Plato)</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">The Handbook</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Enchiridion, The Manual, </font></div>    <div class="textMediumMargin"><b>Comment</b>: This is a concise manual of ethical advice, distilling the core teachings of Epictetus. It serves as a guide to living a Stoic life, focusing on what is within our control and how to maintain tranquility.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Konstan, David, "Epicurus", The Stanford Encyclopedia of Philosophy (Fall 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2022/entries/epicurus/&gt;.</div>    <div class="textItalicSmallMargin"><b>2)</b> https://iep.utm.edu/epicur/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Εγχειρίδιον</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: the_handbook_epictetus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Epictetus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">The Interpretation of Dreams</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Oneirocritica, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Artemidorus&apos; Oneirocritica provides a valuable look into ancient dream interpretation, blending superstition and philosophy, and remains a key resource on historical beliefs and practices.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Britannica, The Editors of Encyclopaedia. "Artemidorus". Encyclopedia Britannica, 13 Feb. 2024, https://www.britannica.com/biography/Artemidorus-Ephesian-soothsayer. Accessed 1 August 2024.</div>    <div class="textItalicSmallMargin"><b>2)</b> Curnow, T. (2006). The philosophers of the ancient world: An A to Z guide. Bristol Classical Press.<br></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ονειροκριτικά</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: oneirocritica</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Artemidorus Ephesius</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.dream-dictionary.com/oneirocritica-artemidorus-daldianus/" target="_blank" rel="noopener">https://www.dream-dictionary.com/oneirocritica-artemidorus-daldianus/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Oneirocritica" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Oneirocritica</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">The Manual</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Enchiridion, The Handbook, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Εγχειρίδιον</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: the_handbook_epictetus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Epictetus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">The Republic</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Plato&apos;s Republic is a foundational philosophical dialogue that delves into the nature of justice, both in the individual and the state, by exploring the structure of the ideal society, which consists of three classes—rulers, guardians, and producers—each aligned with corresponding parts of the soul: reason, spirit, and appetite. The dialogue examines the philosopher-king&apos;s role, the theory of Forms, the Allegory of the Cave, and the relationship between knowledge, reality, and the Good, ultimately aiming to demonstrate why living a just life is in one&apos;s best interest.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/republic/</div>    <div class="textItalicSmallMargin"><b>2)</b> Britannica, The Editors of Encyclopaedia. "The Republic". Encyclopedia Britannica, 5 Jul. 2024, https://www.britannica.com/topic/The-Republic. Accessed 17 August 2024.</div>    <div class="textItalicSmallMargin"><b>3)</b> Brown, Eric, "Plato&apos;s Ethics and Politics in The Republic", The Stanford Encyclopedia of Philosophy (Fall 2017 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/fall2017/entries/plato-ethics-politics/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Πολιτεία</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: republic</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Plato - Henri Omont, Oeuvres philosophiques de Platon: Facsimilé en phototypie, à la grandeur exacte de l’original du Ms. grec 1807 de la Bibliothèque Nationale [Title page of the oldest complete manuscript: Paris, Bibliothèque Nationale, Gr. 1807 (late 9th century)]. Paris 1908., Public Domain, https://commons.wikimedia.org/w/index.php?curid=28341705</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Politeia_beginning._Codex_Parisinus_graecus_1807.jpg/800px-Politeia_beginning._Codex_Parisinus_graecus_1807.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>mentions</u>: Adeimantus of Collytus, Damon of Athens, Prodicus, Protagoras of Abdera</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Politeia_beginning._Codex_Parisinus_graecus_1807.jpg/800px-Politeia_beginning._Codex_Parisinus_graecus_1807.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Politeia_beginning._Codex_Parisinus_graecus_1807.jpg/800px-Politeia_beginning._Codex_Parisinus_graecus_1807.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/ENTRIES/plato-ethics-politics/" target="_blank" rel="noopener">https://plato.stanford.edu/ENTRIES/plato-ethics-politics/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Republic_(Plato)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Republic_(Plato)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/republic/" target="_blank" rel="noopener">https://iep.utm.edu/republic/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/The-Republic" target="_blank" rel="noopener">https://www.britannica.com/topic/The-Republic</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1497/1497-h/1497-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1497/1497-h/1497-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0168" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0168</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/republic.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/republic.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://books.openbookpublishers.com/10.11647/obp.0229/contents.xhtml" target="_blank" rel="noopener">https://books.openbookpublishers.com/10.11647/obp.0229/contents.xhtml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg030" target="_blank" rel="noopener">http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg030</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Theaetetus (Plato)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: The Theaetetus by Plato explores the nature of knowledge through a dialogue between Socrates, Theaetetus, and Theodorus, but ultimately fails to provide a definitive definition of knowledge, delving into various related philosophical issues such as perception, flux, and relativism.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/theatetu/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Θεαίτητος (Πλάτωνος)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: theaetetus_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Euclid of Megara, Callias of Alopece, Prodicus, Protagoras of Abdera, Theodorus of Cyrene (mentioned by Plato), Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/LCL123/1921/volume.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/LCL123/1921/volume.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/theatu.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/theatu.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0172%3Atext%3DTheaet.%3Apage%3D142" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0172%3Atext%3DTheaet.%3Apage%3D142</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/theatetu/" target="_blank" rel="noopener">https://iep.utm.edu/theatetu/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1726/1726-h/1726-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1726/1726-h/1726-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Theaetetus_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Theaetetus_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/plato-theaetetus/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/plato-theaetetus/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg006" target="_blank" rel="noopener">http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg006</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Theages</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: The Theages is a dialogue attributed to Plato that features Socrates discussing with Demodocus and his son Theages the nature of wisdom and the art of ruling, while there is scholarly debate over its authenticity.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://archive.org/details/theages</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Θεάγης</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: theages_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Plato - Codex Oxoniensis Clarkianus 39, facsimile by Sijthoff with foreword by Allen., Page of the Codex Oxoniensis Clarkianus 39 (aka "the Clarke Plato") a 9th century CE Greek manuscript. Showing the beginning of the dialogue. Public Domain, https://commons.wikimedia.org/w/index.php?curid=26910474</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Theages_beginning._Clarke_Plato.jpg/440px-Theages_beginning._Clarke_Plato.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Charmides of Athens, Gorgias of Leontini, Prodicus, Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Theages_beginning._Clarke_Plato.jpg/440px-Theages_beginning._Clarke_Plato.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Theages_beginning._Clarke_Plato.jpg/440px-Theages_beginning._Clarke_Plato.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Theages" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Theages</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-theages/1927/pb_LCL201.347.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-theages/1927/pb_LCL201.347.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/plato-the-theages-pangle" target="_blank" rel="noopener">https://archive.org/details/plato-the-theages-pangle</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://monadnock.net/plato/theages.html" target="_blank" rel="noopener">https://monadnock.net/plato/theages.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-theages/1927/pb_LCL201.343.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-theages/1927/pb_LCL201.343.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+theag.+121a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+theag.+121a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg017" target="_blank" rel="noopener">http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg017</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Timaeus (Plato)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: In Timaeus, Plato describes the creation of the universe as a divine act by a rational Craftsman who imposes mathematical order on chaos, presenting a teleological view where the universe is designed to maximize good and beauty, and offering an ethical model for rational souls to emulate.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Zeyl, Donald and Barbara Sattler, "Plato’s Timaeus", The Stanford Encyclopedia of Philosophy (Fall 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2023/entries/plato-timaeus/&gt;.<br></div>    <div class="textItalicSmallMargin"><b>2)</b> https://iep.utm.edu/timaeus/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Τίμαιος (Πλάτων)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: timaeus_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <img src="https://upload.wikimedia.org/wikipedia/commons/a/ab/Plato_Timaeus.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Plato</div>    <div class="attributeIndividual"> <u>mentions</u>: Timaeus of Locri, Socrates</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/a/ab/Plato_Timaeus.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/a/ab/Plato_Timaeus.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato-philosopher_timaeus/1929/pb_LCL234.3.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato-philosopher_timaeus/1929/pb_LCL234.3.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1572/1572-h/1572-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1572/1572-h/1572-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Timaeus-dialogue-by-Plato" target="_blank" rel="noopener">https://www.britannica.com/topic/Timaeus-dialogue-by-Plato</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/timaeus.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/timaeus.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/timaeus/" target="_blank" rel="noopener">https://iep.utm.edu/timaeus/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Timaeus_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Timaeus_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/ENTRIES/plato-timaeus/" target="_blank" rel="noopener">https://plato.stanford.edu/ENTRIES/plato-timaeus/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg031" target="_blank" rel="noopener">http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg031</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">To himself</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Meditations, </font></div>    <div class="textMediumMargin"><b>Comment</b>: "Meditations" by Marcus Aurelius is a collection of personal reflections written during his military campaigns around 171-175 CE. It explores his efforts to live according to Stoic principles, focusing on self-discipline, virtue, and inner peace. The work is valued for its practical wisdom and candid insights into the emperor&apos;s philosophical struggles and personal growth.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/marcus-aurelius/</div>    <div class="textItalicSmallMargin"><b>2)</b> Curnow, T. (2006). The philosophers of the ancient world: An A to Z guide. Bristol Classical Press.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Τα εις εαυτόν</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: to_himself</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Marcus Aurelius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Topics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: One of the works that make up the "Organon" collection.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Shields, Christopher, "Aristotle", The Stanford Encyclopedia of Philosophy (Winter 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/win2023/entries/aristotle/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Τοπικά</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: topics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Aristotle</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Topics_(Aristotle)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Topics_(Aristotle)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.physics.ntua.gr/mourmouras/greats/aristoteles/topika.html" target="_blank" rel="noopener">https://www.physics.ntua.gr/mourmouras/greats/aristoteles/topika.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Aristotle/topics.1.i.html" target="_blank" rel="noopener">https://classics.mit.edu/Aristotle/topics.1.i.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Topics" target="_blank" rel="noopener">https://www.britannica.com/topic/Topics</a></div>     ['<div class="terminologyEntry">    <div class="term">Xunzi - work</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient chinese philosophical work</font></div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/xunzi/#XunzXunz" target="_blank" rel="noopener">https://plato.stanford.edu/entries/xunzi/#XunzXunz</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q6722310" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q6722310</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Xunzi_(book)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Xunzi_(book)</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://ctext.org/xunzi" target="_blank" rel="noopener">https://ctext.org/xunzi</a></div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: xunzi - work</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Chinese-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e6/Ancient_prose_from_the_Xunzi%2C_in_seal_script.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Xunzi - person</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/e/e6/Ancient_prose_from_the_Xunzi%2C_in_seal_script.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/e/e6/Ancient_prose_from_the_Xunzi%2C_in_seal_script.jpg</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Zhuangzi - philosophical work</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient chinese philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Chinese classic of Daoism bearing the name of Zhuang Zi, an important figure of Chinese Daoism.</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> The Zhuang-Zi is one of the most important classical Daoist texts. The version of the text we have (thirty-three chapters) was compiled around 300 ce and is widely agreed to be the product of<br>multiple authors. The chapters are usually divided into three parts: (1) the inner chapters (Chapters 1–7) whose author is considered to be the historical fi gure Zhuang Zi; (2) the outer chapters (Chapters 8–22); and (3) the miscellaneous chapters (Chapters 23–33). The authors of the chapters in the second and third parts are considered to be Zhuang Zi’s followers. The most important chapters to gain an understanding of Zhuang Zi’s thought include Inner Chapter 2 Qi-Wu-Lun (On the Equality of<br>Things). The last chapter (Chapter 33) contains the first philosophical history of classical Chinese thought. [Bo Mou, Chinese Philosophy A–Z, Edinburgh University Press, 2009]</div>    <div class="textItalicSmallMargin"><b>2)</b> Zhuangzi, Chinese philosophical, literary, and religious classic bearing the name of the philosopher Zhuangzi (“Master Zhuang”), or Zhuang Zhou (flourished 4th century bce).</div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://upload.wikimedia.org/wikipedia/commons/c/c1/Dschuang-Dsi-Schmetterlingstraum-Zhuangzi-Butterfly-Dream.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/c/c1/Dschuang-Dsi-Schmetterlingstraum-Zhuangzi-Butterfly-Dream.jpg</a></div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: zhuangzi - work</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Chinese-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Dschuang-Dsi-Schmetterlingstraum-Zhuangzi-Butterfly-Dream.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Zhuangzi - person</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/c/c1/Dschuang-Dsi-Schmetterlingstraum-Zhuangzi-Butterfly-Dream.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/c/c1/Dschuang-Dsi-Schmetterlingstraum-Zhuangzi-Butterfly-Dream.jpg</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Οn nature (Anaximander)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek philosophical work</font></div>    <div class="textMediumMargin"><b>Comment</b>: Anaximander was the first to write a treatise in prose, which was called by tradition "On Nature".</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/anaximander/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Περί φύσεως (Αναξίμανδρος)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_nature_anaximander</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Anaximander of Miletus</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/anaximander/#:~:text=Life%20and%20Sources-,The,-history%20of%20written" target="_blank" rel="noopener">https://iep.utm.edu/anaximander/#:~:text=Life%20and%20Sources-,The,-history%20of%20written</a></div></div></div></div>'],
];
function show_selected() {
    var selector = document.getElementById('idTerm');
    var champ = dictionnaire[selector[selector.selectedIndex].value][0];
    document.getElementById('display').innerHTML = champ;
}
document.getElementById('idTerm').addEventListener('change', show_selected);

searchBox = document.querySelector("#searchBox");
entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});

</script>
