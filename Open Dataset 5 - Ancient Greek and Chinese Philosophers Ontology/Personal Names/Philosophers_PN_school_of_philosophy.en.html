    ['<div class="terminologyEntry">    <div class="term">Academic Skepticism school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient greek philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: Arcesilaus (316/5–241/0 BCE) led Plato’s Academy into a skeptical phase around 266/268 BCE. He revived the Socratic method of questioning, focusing on examining beliefs and seeking truth through reason. Arcesilaus argued that true knowledge is unattainable, challenging the Stoic and Epicurean idea of a criterion of truth. Despite this, he believed one could live and act rationally without firm beliefs, maintaining a life guided by reason and inquiry. The key representatives of this skeptical phase of the Academy include Arcesilaus, Carneades, and Philo of Larissa.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Vogt, Katja, "Ancient Skepticism", The Stanford Encyclopedia of Philosophy (Winter 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/win2022/entries/skepticism-ancient/&gt;.<br></div>    <div class="textItalicSmallMargin"><b>2)</b> https://iep.utm.edu/ancient-greek-skepticism/</div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Academic_skepticism" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Academic_skepticism</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/skepticism-ancient/#AcaSke" target="_blank" rel="noopener">https://plato.stanford.edu/entries/skepticism-ancient/#AcaSke</a></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Σκεπτικιστική περίοδος της Ακαδημίας</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: academic_skepticism_school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Carneades of Cyrene, Arcesilaus of Pitane, Philo of Larissa</div>    <div class="attributeIndividual"> <u>hasMember</u>: Clitomachus of Carthage, Dion of Alexandria, Hagnon of Tarsus, Evander of Phocaea, Heliodorus of Alexandria, Heraclitus of Tyre, Hipparchus of Soli, Jason of Athens, Jason of Paros, Lacydes of Cyrene, Leontius of Cyrene, Melanthius of Rhodes, Metrodorus of Stratonicea, Moschion of Mallus, Nicostratus of Alexandria, Paseas of Cyrene, Philo of Larissa, Agathocles of Tyre, Biton of Soli, Boethus of Paros, Demetrius of Alexandria (Platonist), Diogenes of Nicomedia, Euclides of Nicomedia, Eupeithes of Paphos, Demophanes of Megalopolis, Demosthenes of Megalopolis, Dionysius of Colophon, Ecdelus, Eudamus, Panaretus, Pythodorus (3rd century BCE)</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/skepticism-ancient/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/skepticism-ancient/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/ancient-greek-skepticism/" target="_blank" rel="noopener">https://iep.utm.edu/ancient-greek-skepticism/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Academic_skepticism" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Academic_skepticism</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/ancient-greek-philosophy/" target="_blank" rel="noopener">https://iep.utm.edu/ancient-greek-philosophy/</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Atomist school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient greek philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: Atomism (from ἄτομον, "uncuttable, indivisible") is an ancient Greek theory developed by Leucippus and Democritus in response to Parmenides, who argued that change is impossible because "what is not" cannot exist. Atomists countered this by proposing that everything is composed of tiny, indivisible particles called atoms, which move within an infinite void. These atoms are eternal, unchangeable, and vary in size and shape. Changes in the world result from the rearrangement and movement of these atoms within the void, allowing for the reality of motion and transformation in the visible world.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Berryman, Sylvia, "Democritus", The Stanford Encyclopedia of Philosophy (Spring 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/spr2023/entries/democritus/&gt;.</div>    <div class="textItalicSmallMargin"><b>2)</b> https://iep.utm.edu/ancient-greek-philosophy/</div>    <div class="textItalicSmallMargin"><b>3)</b> Melsen, Andrew G.M. van. "atomism". Encyclopedia Britannica, 3 Nov. 2023, https://www.britannica.com/topic/atomism. Accessed 19 August 2024.</div>    <div class="textItalicSmallMargin"><b>4)</b> https://lsj.gr/wiki/%E1%BC%84%CF%84%CE%BF%CE%BC%CE%BF%CF%82</div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q178668" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q178668</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Atomism" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Atomism</a></div>    <div class= "externalLinkTerm">     ['<div class="terminologyEntry">    <div class="term">Confucian school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient chinese philosophy</font></div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Hundred_Schools_of_Thought" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Hundred_Schools_of_Thought</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://chinatxt.sitehost.iu.edu/Thought/Confucian_School.pdf" target="_blank" rel="noopener">https://chinatxt.sitehost.iu.edu/Thought/Confucian_School.pdf</a></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Σχολή του Κομφούκιου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: confucian school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Chinese-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Xunzi - person, Mencius, Confucius</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Cynic school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient greek philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: The Cynics, beginning with Antisthenes and including notable figures like Diogenes of Sinope, Crates, emphasized living in alignment with nature and rejecting societal norms. They advocated for asceticism, self-sufficiency, and simplicity, viewing ethics as a practical way of life rather than a theoretical doctrine. Their lifestyle and teachings influenced subsequent philosophical schools, notably Stoicism. Despite limited surviving texts, their ethos is known through their distinctive way of life and the records of their practices.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/cynics/</div>    <div class="textItalicSmallMargin"><b>2)</b> https://xtf.lib.virginia.edu/xtf/view?docId=DicHist/uvaBook/tei/DicHist1.xml;chunk.id=dv1-75</div>    <div class="textItalicSmallMargin"><b>3)</b> https://en.wikisource.org/wiki/Catholic_Encyclopedia_(1913)/Cynic_School_of_Philosophy</div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Cynicism_(philosophy)#History_of_Cynicism" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Cynicism_(philosophy)#History_of_Cynicism</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://iep.utm.edu/cynics/" target="_blank" rel="noopener">https://iep.utm.edu/cynics/</a></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Κυνισμός</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: cynicism</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Diogenes of Sinope, Antisthenes, Crates of Thebes</div>    <div class="attributeIndividual"> <u>hasMember</u>: Bion of Borysthenes, Carneius of Megara, Cercidas of Megalopolis, Cynulcus, Demetrius of Alexandria (Cynic), Demetrius of Sunium, Demonax of Cyprus, Agathobulus of Alexandria, Demetrius of Corinth, Echecles of Ephesus, Hegesias of Sinope, Hipparchia of Maronea, Honoratus, Jason of Nysa, Meleager of Gadara, Menedemus of Lampsacus, Menippus of Gadara, Metrocles of Maronea, Monimus of Syracuse, Oenomaus of Gadara, Onesicritus of Astypalea, Pancrates, Pantaenus, Peregrinus Proteus, Philiscus of Aegina, Theombrotus, Thrasyllus the Cynic, Zoilus of Amphipolis</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/cynics/" target="_blank" rel="noopener">https://iep.utm.edu/cynics/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://xtf.lib.virginia.edu/xtf/view?docId=DicHist/uvaBook/tei/DicHist1.xml;chunk.id=dv1-75" target="_blank" rel="noopener">https://xtf.lib.virginia.edu/xtf/view?docId=DicHist/uvaBook/tei/DicHist1.xml;chunk.id=dv1-75</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikisource.org/wiki/Catholic_Encyclopedia_(1913)/Cynic_School_of_Philosophy" target="_blank" rel="noopener">https://en.wikisource.org/wiki/Catholic_Encyclopedia_(1913)/Cynic_School_of_Philosophy</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Cynicism_(philosophy)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Cynicism_(philosophy)</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Cyrenaic school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient greek philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: The Cyrenaic school, founded by Aristippus, was a minor Socratic school known for their empirical and skeptical epistemology and sensualist hedonism. They argued that while we can have certain knowledge of our immediate sensory experiences (e.g., seeing something as white), we cannot know the external objects or the external world beyond these experiences. They believed pleasure is the highest good, with immediate bodily pleasures being preferable over delayed or mental pleasures. Notable figures include Aristippus, his pupil Aristippus the Younger, and later Cyrenaics like Hegesias, Anniceris, and Theodorus. Their views influenced later philosophical debates, particularly in skepticism and hedonism.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/cynics/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Κυρηναϊκή σχολή</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: cyrenaic_school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Aristippus of Cyrene</div>    <div class="attributeIndividual"> <u>hasMember</u>: Anniceris of Cyrene, Antipater of Cyrene, Arete of Cyrene, Aristippus Metrodidactus, Aristotle of Cyrene, Dionysius of Heraclea, Epitimides of Cyrene, Hegesias of Cyrene, Paraebates, Theodorus of Cyrene</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Cyrenaics" target="_blank" rel="noopener">https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Cyrenaics</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://lucianofsamosata.info/wiki/doku.php?id=cyrenaics:cyrenaics" target="_blank" rel="noopener">http://lucianofsamosata.info/wiki/doku.php?id=cyrenaics:cyrenaics</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/cyrenaics/" target="_blank" rel="noopener">https://iep.utm.edu/cyrenaics/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikisource.org/wiki/Catholic_Encyclopedia_(1913)/Cyrenaic_School_of_Philosophy" target="_blank" rel="noopener">https://en.wikisource.org/wiki/Catholic_Encyclopedia_(1913)/Cyrenaic_School_of_Philosophy</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Daoist school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient chinese philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: Along with Confucianism, “Daoism” (sometimes called “Taoism“) is one of the two great indigenous philosophical traditions of China. As an English term, Daoism corresponds to both Daojia (“Dao family” or “school of the Dao”), an early Han dynasty (c. 100s B.C.E.) term which describes so-called “philosophical” texts and thinkers such as Laozi and Zhuangzi, and Daojiao (“teaching of the Dao”), which describes various so-called “religious” movements dating from the late Han dynasty (c. 100s CE) onward</div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://iep.utm.edu/daoismdaoist-philosophy/" target="_blank" rel="noopener">https://iep.utm.edu/daoismdaoist-philosophy/</a></div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: daoist school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Chinese-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Laozi, Zhuangzi - person</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Dialectical school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient greek philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: The &apos;Dialectical School&apos; refers to a group of early Hellenistic philosophers, including Diodorus Cronus and Philo the Logician, who focused on dialectical reasoning and logical paradoxes. They contributed significantly to propositional and modal logic, with Philo introducing material implication and Diodorus developing a form of strict implication. Known for their exploration of logical paradoxes and modal theories, they were active from the late 4th to mid-3rd centuries BC and are often associated with, but distinct from, the Megaric School. Their work laid foundational ideas for modern modal logic and propositional theory.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Bobzien, Susanne and Matthew Duncombe, "Dialectical School", The Stanford Encyclopedia of Philosophy (Fall 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2023/entries/dialectical-school/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Διαλεκτική σχολή</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: dialectical_school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Diodorus Cronus</div>    <div class="attributeIndividual"> <u>hasMember</u>: Aristotle the Dialectician, Dionysius of Chalcedon, Philo the Dialectician</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Early Platonism</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient greek philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: Early Platonism, or the Early Academy, is the phase of Platonic philosophy following Plato’s death, characterized by the work of his first successors like Speusippus, Xenocrates, and Polemo. This period focused on interpreting Plato’s texts and ethics, without the elaborate metaphysical systems of later Platonism, and integrated elements from Aristotle and Pythagoreanism.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Dillon, J. 1998, &apos;Platonism, Early and Middle&apos; In: Routledge Encyclopedia of Philosophy, Taylor and Francis, viewed 19 August 2024, &lt;https://www.rep.routledge.com/articles/thematic/platonism-early-and-middle/v-1&gt;. doi:10.4324/9780415249126-A089-1</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Πλατωνισμός</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: platonist school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Plato</div>    <div class="attributeIndividual"> <u>hasMember</u>: Adeimantus of Collytus, Aeschines of Neapolis, Aristus of Ascalon, Axiothea of Phlius, Boethus of Paros, Crantor of Soli, Crates of Athens, Crates of Tarsus, Damon of Cyrene, Demetrius of Phocaea, Demophanes of Megalopolis, Demosthenes of Megalopolis, Dercyllides, Delius of Ephesus, Diodorus of Alexandria, Dionysius of Colophon, Eubulus (2nd BCE), Eubulus (3rd CE), Eudamus, Eudoxus of Cnidus, Eumenes of Aspendus, Evander of Athens, Glaucon, Hestiaeus of Miletus, Menaechmus, Menedemus of Pyrrha, Nicostratus of Athens, Pamphilus, Philistius, Polemo of Athens, Sextus of Chaeronea, Speusippus, Telecles of Phocaea, Xenocrates of Chalcedon</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/platonism/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/platonism/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Platonism" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Platonism</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Eleatic school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient greek philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: Philosophical school agreed to have started with Parmenides of Elea in the 6th century bc. Its other members were Zeno, whose defence of the Parmenidean doctrine of the one indivisible and unchanging reality is the best-remembered work of the school (Zeno himself may have rejected both unity and plurality), and Melissus.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Chisholm, Hugh, ed. (1911). "Eleatic School". Encyclopædia Britannica. Vol. 9 (11th ed.). Cambridge University Press. pp. 168–169. Via: https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Eleatic_School</div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q214577" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q214577</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://www.oxfordreference.com/display/10.1093/oi/authority.20110803095745667" target="_blank" rel="noopener">https://www.oxfordreference.com/display/10.1093/oi/authority.20110803095745667</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Eleatics" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Eleatics</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://www.britannica.com/topic/Eleaticism" target="_blank" rel="noopener">https://www.britannica.com/topic/Eleaticism</a></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ελεατική σχολή</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: eleatic school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Zeno of Elea, Parmenides of Elea, Melissus of Samos</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Eleatic_School" target="_blank" rel="noopener">https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Eleatic_School</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/parmenides/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/parmenides/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/zeno-elea/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/zeno-elea/</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Epicurean school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient greek philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: Epicurus founded around 307 B.C. his school, the "Garden". For Epicurus, philosophy is intertwined with the study of natural phenomena and is both instructive, as it helps man to moderate his needs in order to reach ἡδονή (pleasure), and therapeutic, as it liberates human beings from the fear of death, the gods and pain.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Konstan, David, "Epicurus", The Stanford Encyclopedia of Philosophy (Fall 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2022/entries/epicurus/&gt;.</div>    <div class="textItalicSmallMargin"><b>2)</b> Diano, Carlo and Duignan, Brian. "Epicureanism". Encyclopedia Britannica, 16 Jul. 2024, https://www.britannica.com/topic/Epicureanism. Accessed 19 August 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Επικούρεια σχολή</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: epicurean school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Epicurus</div>    <div class="attributeIndividual"> <u>hasMember</u>: Albucius Titus, Apollodorus the Epicurean, Bates of Lampsacus, Carneiscus, Colotes of Lampsacus, Damophanes, Demetria, Demetrius Lacon, Diodorus (Epicurean), Diogenes (Epicurean), Diogenes of Oenoanda, Diogenes of Seleucia (Epicurean), Diogenes of Tarsus, Dionysius of Rhodes, Eucratidas of Rhodes, Eudemus, Hedeia, Heliodorus (Epicurean), Hermarch, Hippoclides, Idomeneus of Lampsacus, Irenaeus of Miletus, Leontion, Leontius of Lampsacus, Lepidus of Amastris, Mammarion, Menestratus, Metrodorus of Lampsacus (Epicurean), Orion, Patro the Epicurean, Phaedrus the Epicurean, Philiscus, Philodemus of Gadara, Philonides, Polyaenus of Lampsacus, Polystratus the Epicurean, Ptolemy the Black, Ptolemy the White, Zeno of Sidon</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikisource.org/wiki/Lives_of_the_Eminent_Philosophers/Book_X" target="_blank" rel="noopener">https://en.wikisource.org/wiki/Lives_of_the_Eminent_Philosophers/Book_X</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://epicurus.net/" target="_blank" rel="noopener">https://epicurus.net/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://web.archive.org/web/20040404213456/http://epicurus.info/" target="_blank" rel="noopener">https://web.archive.org/web/20040404213456/http://epicurus.info/</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Hundred Schools of Thought</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient chinese philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: Philosophies and schools that flourished from the 6th century BC to 221 BC during the late Spring and Autumn period and the Warring States period of ancient China.</div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Hundred_Schools_of_Thought" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Hundred_Schools_of_Thought</a></div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: hundred schools of thought</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Chinese-Philosophy&gt;</font></div>    <div class="textMediumMargin"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ionian school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient greek philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: The Ionian School of philosophy, active during the 6th and 5th centuries BCE, comprised early Greek thinkers such as Thales, Anaximander, Anaximenes, Heraclitus, and others. Centered in the Ionian cities of Asia Minor, this school sought to explain the natural world through fundamental substances and physical processes, contrasting with the later abstract metaphysical approaches of the Eleatics and Pythagoreans. While their specific theories varied—ranging from Thales&apos; water as the primary substance to Heraclitus&apos; concept of perpetual change—they shared a focus on material explanations for natural phenomena. Their work laid foundational concepts in both scientific and metaphysical thought.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Britannica, The Editors of Encyclopaedia. "Ionian school". Encyclopedia Britannica, 6 Mar. 2012, https://www.britannica.com/topic/Ionian-school. Accessed 19 August 2024.</div>    <div class="textItalicSmallMargin"><b>2)</b> "Ionian School of Philosophy" . Encyclopædia Britannica. Vol. 14 (11th ed.). 1911. pp. 731–732. Via https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Ionian_School_of_Philosophy</div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q190279" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q190279</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://simple.wikipedia.org/wiki/Milesian_school" target="_blank" rel="noopener">https://simple.wikipedia.org/wiki/Milesian_school</a></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Σχολή της Ιωνίας</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: ionian_school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Alexikoua - Greek settlements in Asia Minor. Ionia in green.  Own workData taken from: [1], [2]Topography taken from DEMIS Mapserver, which are public domain, other wise self-made., CC BY-SA 3.0, https://commons.wikimedia.org/w/index.php?curid=30582147</div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Anaxagoras of Clazomenae, Thales of Miletus, Anaximander of Miletus, Anaximenes of Miletus, Heraclitus of Ephesus, Archelaus of Athens</div>    <div class="attributeIndividual"> <u>hasMember</u>: Diogenes of Apollonia</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://dbpedia.org/page/Ionian_School_(philosophy)" target="_blank" rel="noopener">https://dbpedia.org/page/Ionian_School_(philosophy)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.newworldencyclopedia.org/entry/Ionian_school" target="_blank" rel="noopener">https://www.newworldencyclopedia.org/entry/Ionian_school</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Ionian-school" target="_blank" rel="noopener">https://www.britannica.com/topic/Ionian-school</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Legalist school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient chinese philosophy</font></div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: legalist school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Chinese-Philosophy&gt;</font></div>    <div class="textMediumMargin"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Megarian School</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient greek philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: The Megarian school of philosophy, which flourished in the 4th century BC, was founded by Euclides of Megara, one of the pupils of Socrates. Its ethical teachings were derived from Socrates, recognizing a single good. </div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Bobzien, Susanne and Matthew Duncombe, "Dialectical School", The Stanford Encyclopedia of Philosophy (Fall 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2023/entries/dialectical-school/&gt;.</div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q1145454" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q1145454</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Megarian_school" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Megarian_school</a></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Μεγαρική σχολή</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: megarian school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Euclid of Megara, Stilpo of Megara, Dionysius of Chalcedon</div>    <div class="attributeIndividual"> <u>hasMember</u>: Alexinus of Elis, Apollonius Cronus, Clinomachus of Thurii, Diocleides (Megarian philosopher), Eubulides of Miletus, Euphantus of Olynthus, Ichthyas, Menelaus, Pasicles of Thebes, Thrasymachus of Corinth</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Middle Platonism</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient greek philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: Middle Platonism (ca. 130 B.C.E. - 70 C.E.) began with Antiochus of Ascalon and ended with Plotinus, the founder of Neoplatonism. This period focused on interpreting Plato&apos;s works, especially his Unwritten Doctrines and their relation to the Timaeus. The Middle Platonists, like Antiochus and Eudorus of Alexandria, aimed to reconcile Platonic, Aristotelian, and Stoic philosophies. Key figures included Philo of Alexandria, who influenced Christianity, and Plutarch, known for his Greco-Egyptian syncretism. The period also encompassed esoteric systems such as Gnosticism and the Corpus Hermeticum.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/midplato/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Μέσος πλατωνισμός</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: middle_platonism</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Antiochus of Ascalon</div>    <div class="attributeIndividual"> <u>hasMember</u>: Eudorus of Alexandria, Harpocration of Argos, Atticus, Lysimachus (pupil of Theophrastus), Mnaseas of Tyre, Onasander, Philo Judaeus, Plutarch of Chaeronea, Taurus of Tyre, Theon of Smyrna</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Mohist school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient chinese philosophy</font></div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/mohism/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/mohism/</a></div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: mohist school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Chinese-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:label <a href="mohism" target="_blank" rel="noopener">mohism</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Mozi</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient chinese philosophy</font></div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Mozi (Mo Tzu), also known as Master Mo, Mo Di (fifth century B.C.), Chinese philosopher and founder of the Mohist school of thought, which was a major rival to Confucianism in ancient China. The text Mozi contains different versions of his teachings as well as subsequent developments of his thought. Mozi regarded rightness (yi) as determined by what benefits (li) the public, where benefit is understood in terms of such things as order and increased resources in society. He opposed the musical activities and ritual practices of the Confucians on the ground that such practices are detrimental to the public good. He is probably best known for advocating the ideal of an equal concern to benefit and avoid harm to every human being.<br>[R. Audi, The Cambridge Dictionary of Philosophy, Third edition, 2015]</div>    <div class="textItalicSmallMargin"><b>2)</b> Mozi (/ˈmoʊˈtsiː/; Chinese: 墨子; pinyin: Mòzǐ; Wade–Giles: Mo Tzu /ˈmoʊˈtsuː/; Latinized as Micius[3] /ˈmɪsiəs/; c. 470 – c. 391 BCE),[4] original name Mo Di (墨翟), was a Chinese essayist and philosopher who founded the school of Mohism during the Hundred Schools of Thought period (the early portion of the Warring States period, c. 475–221 BCE). The ancient text Mozi contains material ascribed to him and his followers.<br>Source: Wkipedia https://en.wikipedia.org/wiki/Mozi</div>    <div class="textItalicSmallMargin"><b>3)</b> 5th-century BC Chinese philosopher and founder of Mohism<br>Source: Wikidata https://www.wikidata.org/wiki/Q272411</div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q272411" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q272411</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Mozi" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Mozi</a></div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: mozi</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Chinese-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a4/%D0%A4%D0%B8%D0%BB%D0%BE%D1%81%D0%BE%D1%84_%D0%9C%D0%BE-%D0%A6%D0%B7%D1%8B.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/a/a4/%D0%A4%D0%B8%D0%BB%D0%BE%D1%81%D0%BE%D1%84_%D0%9C%D0%BE-%D0%A6%D0%B7%D1%8B.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/a/a4/%D0%A4%D0%B8%D0%BB%D0%BE%D1%81%D0%BE%D1%84_%D0%9C%D0%BE-%D0%A6%D0%B7%D1%8B.jpg</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Neoplatonist school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient greek philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: A philosophical movement launched by Plotinus in the 3rd c. AD, which reinterpreted the ideas of Plato.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Wildberg, Christian, "Neoplatonism", The Stanford Encyclopedia of Philosophy (Winter 2021 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/win2021/entries/neoplatonism/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Νεοπλατωνική σχολή</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: neoplatonist school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Iamblichus of Chalcis, Plotinus</div>    <div class="attributeIndividual"> <u>hasMember</u>: Hierius, Maximus of Nicaea, Origen of Alexandria, Paterius, Plotinus, Ptolemy, Theodorus of Asine</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/neoplatonism/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/neoplatonism/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/neoplato/" target="_blank" rel="noopener">https://iep.utm.edu/neoplato/</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Neopythagoreanism</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient greek philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: A school of Hellenistic and Roman philosophy about the beginning of the first century a.d. which revived Pythagorean doctrines.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Huffman, Carl, "Pythagoreanism", The Stanford Encyclopedia of Philosophy (Summer 2024 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/sum2024/entries/pythagoreanism/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Νεοπυθαγορισμός</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: neopythagorean school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Apollonius of Tyana, Moderatus of Gades</div>    <div class="attributeIndividual"> <u>hasMember</u>: Lucius Cornelius Alexander Polyhistor, Isagoras of Thessaly, Nicomachus of Gerasa</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/pythagoreanism/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/pythagoreanism/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Neopythagoreanism" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Neopythagoreanism</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Peripatetic School</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient greek philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: The Peripatetic School of Aristotle was founded in 335 BCE at the Lyceum in Athens. At 50 years old, Aristotle established a substantial library and gathered a group of students known as "peripatetics" because they walked and discussed in the Lyceum&apos;s colonnades. Unlike the Academy, the Lyceum was open to the public with lectures. Most of Aristotle&apos;s surviving works were likely written during this period, with ongoing revisions. The Peripatetic School engaged in philosophical and scientific inquiries, and the Lyceum included various structures such as a gymnasium, palestra, and sanctuaries.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/lyceum/</div>    <div class="textItalicSmallMargin"><b>2)</b> Lynch, J. (1997), "Lyceum", in Zeyl, Donald J.; Devereux, Daniel; Mitsis, Phillip (eds.), Encyclopedia of Classical Philosophy, Greenwood Press, ISBN 0-313-28775-9. Via https://archive.org/details/encyclopediaofcl00zeyl</div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q194414" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q194414</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Peripatetic_school" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Peripatetic_school</a></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Περιπατική σχολή</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: peripatetic school</div>    <div class="textMediumMargin"><b>is a</b>: <f     ['<div class="terminologyEntry">    <div class="term">Presocratic school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient greek philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: Pre-Socratic or Early Greek philosophers are the Western thinkers preceding Socrates (c. 469-c. 399 BC). These category includes some thinkers who were roughly contemporary with Socrates, such as Protagoras (c. 490-c. 420 BC). They were mostly interested in cosmology, the beginning and the substance of the universe.</div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://iep.utm.edu/presocra/" target="_blank" rel="noopener">https://iep.utm.edu/presocra/</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Pre-Socratic_philosophy#Pre-Socratic_philosophers" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Pre-Socratic_philosophy#Pre-Socratic_philosophers</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/presocratics/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/presocratics/</a></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Προσωκρατικοί</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: presocratic school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Democritus, Empedocles of Akragas, Xenophanes of Colophon, Parmenides of Elea, Zeno of Elea</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Pyrrhonism</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient greek philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: Pyrrhonism is an ancient skeptical philosophy founded by Pyrrho of Elis. It advocates achieving tranquility (ataraxia) by suspending judgment (epoché) on all beliefs and opinions, focusing only on appearances (phainomena). Unlike Academic skepticism, which engages in dialectical argumentation, Pyrrhonism aims for personal peace of mind through a stance of non-commitment to definitive truths.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Britannica, The Editors of Encyclopaedia. "Pyrrhonism". Encyclopedia Britannica, 30 Sep. 2023, https://www.britannica.com/topic/Pyrrhonism. Accessed 19 August 2024.</div>    <div class="textItalicSmallMargin"><b>2)</b> Vogt, Katja, "Ancient Skepticism", The Stanford Encyclopedia of Philosophy (Winter 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/win2022/entries/skepticism-ancient/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Πυρρωνισμός</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: pyrrhonian skeptics school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Pyrrho of Elis, Aenedidemus of Cnossus, Timon of Phlius</div>    <div class="attributeIndividual"> <u>hasMember</u>: Ptolemy of Cyrene, Pyrrho of Phlius, Sarpedon, Sextus Empiricus</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Pythagorean school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient greek philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: Pythagoreanism is an ancient Greek philosophical and spiritual system founded by Pythagoras, emphasizing the role of numbers in understanding the universe, a disciplined way of life, and the transmigration of souls. It later evolved into Neopythagoreanism, which integrated Pythagorean ideas into broader metaphysical and mystical traditions.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Huffman, Carl, "Pythagoreanism", The Stanford Encyclopedia of Philosophy (Summer 2024 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/sum2024/entries/pythagoreanism/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Πυθαγορική Σχολή</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: pythagorean school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Alcmaeon of Croton, Anaxilaus of Larissa, Pythagoras of Samos</div>    <div class="attributeIndividual"> <u>hasMember</u>: Acmonidas of Tarentum, Acusiladas of Tarentum, Aeneas of Metapontum, Aesara of Lucania, Anaxilaus of Larissa, Androcydes (Pythagorean), Archedemus of Syracuse, Archytas of Tarentum, Aresas of Lucania, Arignote of Croton, Aristaeus of Croton, Brotinus of Metapontum, Calliphon of Croton, Cebes of Thebes, Charondas of Catana, Cleinias of Tarentum, Damippus, Damon of Syracuse, Deinarchus of Paros, Deinocrates of Tarentum, Dexitheus     ['<div class="terminologyEntry">    <div class="term">School of Elis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient greek philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: The School of Elis was founded by Phaedo, a student of Socrates, but existed only briefly in Elis. It was later moved to Eretria by Menedemus, where it became known as the Eretrian School.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Chisholm, Hugh, ed. (1911). "Elis, Philosophical School of" . Encyclopædia Britannica. Vol. 9 (11th ed.). Cambridge University Press. p. 279. Via: https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Elis,_Philosophical_School_of</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Σχολή της Ήλιδος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: school_of_elis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Menedemus of Eretria, Phaedo of Elis</div>    <div class="attributeIndividual"> <u>hasMember</u>: Anchipylus of Elis, Asclepiades of Phlius</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Elis,_Philosophical_School_of" target="_blank" rel="noopener">https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Elis,_Philosophical_School_of</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Eretrian_school" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Eretrian_school</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">School of Names</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient chinese philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: The “School of Names” (Ming Jia) is the traditional Chinese label for a diverse group of Warring States (479-221 BCE) thinkers who shared an interest in language, disputation, and metaphysics.</div>    <div class="textMediumMargin"><b>Context(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> The School of Names is concerned with the general issue of the relation between names and actuality. Its members are also known as dialecticians or sophists because of their emphasis on rational argumentations and their focus on the deep structures of concepts. They carried out the study of how language works. Two major fi gures in this school are Gong-sun Long and Hui Shi. [Bo Mou, Chinese Philosophy A–Z, Edinburgh University Press, 2009]</div>    <div class="textItalicSmallMargin"><b>2)</b> The “School of Names” (ming jia) is the traditional Chinese label for a diverse group of Warring States (479–221 B.C.E.) thinkers who shared an interest in language, disputation, and metaphysics. They were notorious for logic-chopping, purportedly idle conceptual puzzles, and paradoxes such as “Today go to Yue but arrive yesterday” and “A white horse is not a horse.” Because reflection on language in ancient China centered on “names” (ming, words) and their relation to “stuff” (shi, objects, events, situations), 2nd-century B.C.E. Han dynasty archivists dubbed these thinkers the “School of Names,” one of six recognized philosophical movements. The “school” is a taxonomical fiction, however. The varied figures assigned to it—Deng Xi, Yin Wen, Hui Shi, and Gongsun Long, among others—never formed a distinct circle or movement devoted to any particular doctrine or way of life, and their intellectual interests overlapped extensively with those of the later Mohists, Zhuangzi, and Xunzi. Several of these men were active politically: Hui Shi was a government minister, Yin Wen and Gongsun Long political advisors and peace activists. Still, in the eyes of Han historians, they devoted themselves to no signature ethical or political doctrines. Hence they became known primarily for their interest in language and disputation and on that basis were deemed a “school.” [Fraser, Chris (2008). School of names. Stanford Encyclopedia of Philosophy.]<br></div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q61906" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q61906</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/school-names/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/school-names/</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/School_of_Names#/media/File:Birth_Places_of_Chinese_Philosophers.png" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/School_of_Names#/media/File:Birth_Places_of_Chinese_Philosophers.png</a></div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: school of names</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Chinese-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <img src="http://ontologia.fr/Images/KELKIP/Birth_Places_of_Chinese_Philosophers.png" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Gongsun, Long</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="http://ontologia.fr/Images/KELKIP/Birth_Places_of_Chinese_Philosophers.png" target="_blank" rel="noopener">http://ontologia.fr/Images/KELKIP/Birth_Places_of_Chinese_Philosophers.png</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Sophist school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient greek philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: The Sophist school of the 5th century BCE included notable figures such as Protagoras, Gorgias, and Hippias, who offered instruction in rhetoric and practical wisdom. This new class of intellectuals emerged in response to the growing demand for advanced education and success in democratic and political spheres, flourishing in an era of intellectual and social change. Unlike traditional schools, sophists operated independently, without a unified organization or shared beliefs.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/sophists/</div>    <div class="textItalicSmallMargin"><b>2)</b> Taylor, C.C.W. and Mi-Kyoung Lee, "The Sophists", The Stanford Encyclopedia of Philosophy (Fall 2020 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/fall2020/entries/sophists/&gt;.<br></div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://iep.utm.edu/sophists/" target="_blank" rel="noopener">https://iep.utm.edu/sophists/</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/sophists/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/sophists/</a></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Σοφιστές</div>    <div class="textMediumMarginBlue">- el: Σοφιστική σχολή</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sophist school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Protagoras of Abdera, Gorgias of Leontini, Prodicus, Hippias of Elis, Lucius Flavius Philostratus, Thrasymachus of Chalcedon</div>    <div class="attributeIndividual"> <u>hasMember</u>: Demophilus, Diagoras of Melos, Dionysius of Miletus, Hippon, Leon of Byzantium, Lesbonax, Lycophron</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/sophists/" target="_blank" rel="noopener">https://iep.utm.edu/sophists/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Sophist-philosophy" target="_blank" rel="noopener">https://www.britannica.com/topic/Sophist-philosophy</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/sophists/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/sophists/</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Stoic school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">school of ancient greek philosophy</font></div>    <div class="textMediumMargin"><b>Comment</b>: Stoicism, founded by Zeno of Citium around 300 BCE, is a philosophical system that explores the interplay of physics, logic, and ethics. Major figures include Zeno, Cleanthes, and Chrysippus from the Early Stoa, who established key Stoic doctrines such as the interconnectedness of these philosophical areas and the idea of living in accordance with nature. The Middle Stoa, with Panaetius and Posidonius, emphasized practical ethics and religious aspects, influencing Roman Stoicism. The Late Stoa, including Seneca, Epictetus, and Marcus Aurelius, focused on personal virtue and resilience, addressing moral and existential concerns. Stoicism highlights rationality, the acceptance of fate, and the pursuit of virtue as pathways to a flourishing life.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Durand, Marion, Simon Shogry, and Dirk Baltzly, "Stoicism", The Stanford Encyclopedia of Philosophy (Spring 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/spr2023/entries/stoicism/&gt;.</div>    <div class="textItalicSmallMargin"><b>2)</b> https://iep.utm.edu/stoicism/</div>    <div class="textItalicSmallMargin"><b>3)</b> Saunders, Jason Lewis. "Stoicism". Encyclopedia Britannica, 23 Jul. 2024, https://www.britannica.com/topic/Stoicism. Accessed 19 August 2024.</div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://youtu.be/yu7n0XzqtfA?t=6" target="_blank" rel="noopener">https://youtu.be/yu7n0XzqtfA?t=6</a></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Στωική σχολή</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: stoic_school</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;School-of-Ancient-Greek-Philosophy&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>representedBy</u>: Zeno of Citium, Chrysippus of Soli, Marcus Aurelius, Posidonius of Rhodes, Panaetius of Rhodes</div>    <div class="attributeIndividual"> <u>hasMember</u>: Antipater of Tarsus, Antipater of Tyre, Apollodorus of Seleucia, Archedemus of Tarsus, Ariston of Chios, Arius Didymus, Asclepiodotus Tacticus, Athenodorus Cananites, Athenodorus of Soli, Athenodorus Cordylion, Boethus of Sidon- Stoic, Chaeremon of Alexandria, Chremonides of Athens, Chrysermus of Alexandria, Crates of Mallus, Damocles of Messene, Dardanus of Athens, Dicaeus of Tarsus, Diodorus (Stoic), Diodotus the Stoic, Diogenes of Babylon, Dion of Heraclea, Dionysius of Alexandria, Dionysius of Cyrene, Eubius of Ascalon, Eudromus, Euphrates the Stoic, Gorgus of Sparta, Hecaton of Rhodes, Heraclides (3rd BCE), Heraclides Aurelius, Herillus of Carthage, Hermagoras, Hierocles, Hyllus of Soli, Leonides of Rhodes, Medius, Mnasagoras, Mnesarchus of Athens, Nestor of Tarsus, Nicander of Bithynia, Philonides of Thebes, Sosigenes, Zeno of Tarsus, Zenodotus the Stoic, Theagenes of Patras, Cleanthes of Assus, Teles of Megara, Stratocles of Rhodes, Proclus of Mallus, Plato of Rhodes, Phanias, Paramonus of Tarsus</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/ENTRIES/stoicism/" target="_blank" rel="noopener">https://plato.stanford.edu/ENTRIES/stoicism/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/stoicism/" target="_blank" rel="noopener">https://iep.utm.edu/stoicism/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica. function show_selected() {
    var selector = document.getElementById('idTerm');
    var champ = dictionnaire[selector[selector.selectedIndex].value][0];
    document.getElementById('display').innerHTML = champ;
}
document.getElementById('idTerm').addEventListener('change', show_selected);

searchBox = document.querySelector("#searchBox");
entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});

</script>
