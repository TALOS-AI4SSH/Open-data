    ['<div class="terminologyEntry">    <div class="term">Αφροδισιάδα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Μικρή αρχαία ελληνική ελληνιστική πόλη στην ιστορική πολιτιστική περιοχή της Καρίας στη δυτική Ανατολία της Τουρκίας. Ήταν η γενέτειρα του αρχαίου Έλληνα φιλοσόφου Αλέξανδρου.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, S. Mitchell, talbert, Sean Gillies, Jeffrey Becker, Joe User, DARMC, Katelin McCullough, Brian Turner, Tom Elliott, R. Talbert, Rob Chavez, Gabriel Bodard, and Gabriel Moss, &apos;Aphrodisias: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/638753&gt; [accessed: 21 July 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Aphrodisias</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: aphrodisias</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.7085832624,28.7237779096&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Αλέξανδρος ο Αφροδισιεύς</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/place/3586" target="_blank" rel="noopener">https://www.trismegistos.org/place/3586</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.geonames.org/7733053/aphrodisias.html" target="_blank" rel="noopener">https://www.geonames.org/7733053/aphrodisias.html</a></div>    <div class= "externalLinkIndividu     ['<div class="terminologyEntry">    <div class="term">Βορυσθένης</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Ολβία Ποντική, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Η «Ολβία Ποντική» αναφέρεται σε έναν αρχαίο οικισμό κοντά στο σημερινό ουκρανικό χωριό Παρουτίνε, στη δυτική όχθη του εκβολέων Δνείπερου-Μπουγκ.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> David Braund, Brady Kiesling, Sean Gillies, Chris de Lisle, Jeffrey Becker, Tom Elliott, DARMC, R. Talbert, and Diane Braund, &apos;Borysthenes/Olbia: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/226546&gt; [accessed: 02 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Pontic Olbia</div>    <div class="textMediumMarginBlue">- en: Parutyne</div>    <div class="textMediumMarginBlue">- en: Borysthenes</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: olbia_pontica</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;46.6923856639,31.9058567704&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Βίων ο Βορυσθενίτης, Σφαίρος ο Βορυσθενίτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/467319UOlb" target="_blank" rel="noopener">https://topostext.org/place/467319UOlb</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.     ['<div class="terminologyEntry">    <div class="term">Βυζάντιο</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ένας αρχαίος ελληνικός οικισμός στο νότιο άκρο του Βοσπόρου, όπου βρίσκεται η σημερινή Κωνσταντινούπολη της Τουρκίας. Ευδοκίμησε κατά την ελληνική και τη ρωμαϊκή περίοδο και μετονομάστηκε σε Κωνσταντινούπολη από τον αυτοκράτορα Κωνσταντίνο τον τέταρτο αιώνα, ο οποίος την επέκτεινε σημαντικά.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, DARMC, R. Talbert, Brady Kiesling, Sean Gillies, Jeffrey Becker, Ingrid Luo, and Tom Elliott, &apos;Byzantium: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2022 &lt;https://pleiades.stoa.org/places/520985&gt; [accessed: 24 July 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Byzantium</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: byzantium</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;41.005902,28.9738815&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Αριστοφάνης ο Βυζάντιος, Δημήτριος ο Βυζάντιος, Λέων ο Βυζάντιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/478" target="_blank" rel="noopener">http://www.trismegistos.org/place/478</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q23725" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q23725</a></div>    <d     ['<div class="terminologyEntry">    <div class="term">Γάδαρα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ένα κέντρο ελληνικού πολιτισμού κατά την ελληνιστική και ρωμαϊκή περίοδο, τα ερείπια του οποίου βρίσκονται στο σημερινό Umm Qais ή Qays της Ιορδανίας. Στην πόλη αυτή γεννήθηκαν σπουδαίες προσωπικότητες, όπως ο Μελέαγρος, ο Μένιππος και ο Φιλόδημος.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> E.M. Meyers, J.P. Brown, DARMC, Brady Kiesling, R. Talbert, Johan Åhlfeldt, Sean Gillies, Jeffrey Becker, and Tom Elliott, &apos;Gadara/Pompeia: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2020 &lt;https://pleiades.stoa.org/places/678142&gt; [accessed: 15 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Gadara</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: gadara</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;32.655922,35.6781455&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Μελέαγρος o Γαδαρεύς, Μένιππος ο Γαδαρεύς, Οινόμαος ο Γαδαρηνός, Φιλόδημος ο Γαδαρεύς</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DG%3Aentry+group%3D1%3Aentry%3Dgadara-geo" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DG%3Aentry+group%3D1%3Aentry%3Dgadara-g     ['<div class="terminologyEntry">    <div class="term">Γάδειρα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Κάδιθ, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Μια αρχαία πόλη στην Ισπανία, της οποίας η προέλευση μπορεί να είναι φοινικική.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Jr., F.H. Stanley, R.C. Knapp, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Jeffrey Becker, Tom Elliott, DARMC, R. Warner, R. Talbert, and David Mimno, &apos;Gadeira/Gades/Col. Augusta Gaditana: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2020 &lt;https://pleiades.stoa.org/places/256177&gt; [accessed: 19 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Cádiz</div>    <div class="textMediumMarginBlue">- en: Gadeira</div>    <div class="textMediumMarginBlue">- en: Gades</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: gades</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;36.5292776667,-6.29312066667&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Μοδεράτος από τα Γάδειρα</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Cadiz" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Cadiz</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/365-063PGad" target="_blank" rel="noopener">https://topostext.org/place/3     ['<div class="terminologyEntry">    <div class="term">Γέρασα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Γέρασα έγινε σημαντικό κέντρο υπό τον Αντίοχο Δ΄ Επιφανή και ονομάστηκε "Αντιόχεια επί Χρυσορρόα". Εντάχθηκε στη Δεκάπολη υπό τον Πομπήιο το 63 π.Χ. και έγινε ρωμαϊκή αποικία τον τρίτο αιώνα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> E.M. Meyers, J.P. Brown, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Jeffrey Becker, Tom Elliott, DARMC, R. Talbert, and jfu, &apos;Gerasa/Antiochia ad Chrysorhoam: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/678158&gt; [accessed: 15 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Gerasa</div>    <div class="textMediumMarginBlue">- en: Jerash</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: gerasa</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;32.2800898764,35.8910921282&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Νικόμαχος από τα Γέρασα</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DG%3Aentry+group%3D3%3Aentry%3Dgerasa-geo" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DG%3Aentry+group%3D3%3Aentry%3Dgerasa-geo</a></div>    <div class= "ext     ['<div class="terminologyEntry">    <div class="term">Ελέα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η αρχαία πόλη της Ελέας λέγεται ότι ιδρύθηκε από Φωκαείς Έλληνες και στη συνέχεια έγινε σύμμαχος της Ρώμης.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> I.E.M. Edlund Berry, A.M. Small, DARMC, R. Talbert, Brady Kiesling, Sean Gillies, Jeffrey Becker, and Tom Elliott, &apos;Velia/Elea: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/452488&gt; [accessed: 19 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Elea</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: elea</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;40.1605007372,15.1561568475&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isDeathPlaceOf</u>: Ζήνων ο Ελεάτης</div>    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Παρμενίδης ο Ελεάτης, Ζήνων ο Ελεάτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Velia" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Velia</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.geonames.org/3164641/velia.html" target="_blank" rel="noopener">http://www.geonames.org/3164641/velia.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/2495" target="_blank" r     ['<div class="terminologyEntry">    <div class="term">Ερεσός</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ένα χωριό που βρίσκεται στο νοτιοδυτικό τμήμα της Λέσβου, ένα ελληνικό νησί στο βορειοανατολικό Αιγαίο Πέλαγος. Ο Θεόφραστος και ο δάσκαλός του, ο Άλκιππος, κατάγονταν από αυτό το χωριό.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, S. Mitchell, DARMC, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Jeffrey Becker, Tom Elliott, Catherine Bouras, and R. Talbert, &apos;Eresos: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/550533&gt; [accessed: 21 July 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Eresos</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: eresus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;39.133148,25.935414&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Θεόφραστος, Άλκιππος ο Ερέσιος, Φαινίας o Eρέσιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q1018197" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q1018197</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/place/658" target="_blank" rel="noopener">https://www.trismegistos.org/place/658</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org     ['<div class="terminologyEntry">    <div class="term">Καρχηδόνα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Αρχαία πόλη στην ανατολική πλευρά της λίμνης της Τύνιδας στη σημερινή Τυνησία. Η Καρχηδόνα ήταν ένας από τους σημαντικότερους εμπορικούς σταθμούς της Αρχαίας Μεσογείου και μια από τις πιο εύπορες πόλεις του κλασικού κόσμου. Γενέτειρα του Κλιτόμαχου, διευθυντή της Ακαδημίας, από το 127/6 π.Χ., δύο χρόνια μετά το θάνατο του Καρνεάδη.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> R.B. Hitchner, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Jeffrey Becker, Tom Elliott, DARMC, Jonathan Prag, R. Warner, R. Talbert, and Ingrid Luo, &apos;Carthago: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/314921&gt; [accessed: 15 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Carthage</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: carthage</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;36.853056,10.323056&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isDeathPlaceOf</u>: Κλειτόμαχος ο Καρχηδόνιος</div>    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Κλειτόμαχος ο Καρχηδόνιος, Ήριλλος ο Χαλκηδών, Μιλτιάδης ο Καρχηδόνιος, Άνθης ο Καρχηδόνιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.geonames.org/2468244/carthage.html" target="_blank" rel="noopener">http://www.geona     ['<div class="terminologyEntry">    <div class="term">Κήπος του Επικούρου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Επίκουρος ίδρυσε γύρω στο 307 π.Χ. τη σχολή του, τον "Κήπο". Για τον Επίκουρο, η φιλοσοφία είναι άρρηκτα συνδεδεμένη με τη μελέτη των φυσικών φαινομένων και είναι τόσο διδακτική, καθώς βοηθά τον άνθρωπο να μετριάσει τις ανάγκες του προκειμένου να φτάσει στην ἡδονή (ηδονή), όσο και θεραπευτική, καθώς απελευθερώνει τον άνθρωπο από το φόβο του θανάτου, των θεών και του πόνου.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Garden of Epicurus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: garden</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin"></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">Κλαζομενές</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Αρχαία ελληνική πόλη στις ακτές της Ιωνίας και μέλος της Συμμαχίας των Ιώνων. Ήταν μία από τις πρώτες πόλεις που εξέδωσαν ασημένιο νόμισμα. Τα ερείπιά της βρίσκονται σήμερα στη σύγχρονη πόλη Urla κοντά στην επαρχία της Σμύρνης, στην Τουρκία. Τόπος γέννησης του αρχαίου Έλληνα φιλοσόφου Αναξαγόρα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, S. Mitchell, Peter Cobb, Sean Gillies, Jeffrey Becker, Tom Elliott, Brady Kiesling, R. Talbert, Rob Chavez, and Ryan Horne, &apos;Klazomenai (later): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/550651&gt; [accessed: 22 July 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Clazomenae</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: clazomenae</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.3730477505,26.7866198434&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Αναξαγόρας ο Κλαζομενεύς</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/384268PKla" target="_blank" rel="noopener">https://topostext.org/place/384268PKla</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Klazomenai" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Klazomenai</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q536598" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q536598</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/550650" target="_blank" rel="noopener">https://pleiades.stoa.org/places/550650</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/550651" target="_blank" rel="noopener">https://pleiades.stoa.org/places/550651</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Κνίδος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Τεκίρ, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Κνίδος, αρχαία ελληνική πόλη της Καρίας και μέλος της Δωρικής Εξάπολης, της οποίας το πολιτικό κέντρο, στα τέλη του 4ου αιώνα,  μετακινήθηκε από το Μπουργκάζ στο Τεκίρ.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, DARMC, R. Talbert, Sean Gillies, Jeffrey Becker, Noah Kaye, and Tom Elliott, &apos;Cnidus: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/599576&gt; [accessed: 11 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Knidus</div>    <div class="textMediumMarginBlue">- en: Cnidus</div>    <div class="textMediumMarginBlue">- en: Yazıköy</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: cnidus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;36.73328265,27.69261325&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isDeathPlaceOf</u>: Εύδοξος ο Κνίδιος</div>    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Εύδοξος ο Κνίδιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/599576" target="_blank" rel="noopener">https://pleiades.stoa.org/places/599576</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Κνωσός</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ανακτορικό συγκρότημα (πολλαπλών περιόδων), που βρίσκεται στην κεντρική Κρήτη, νότια της σύγχρονης πόλης του Ηρακλείου. Από την Κνωσό καταγόταν ο Αινεσίδημος, ο πρώτος Πυρρώνειος φιλόσοφος.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Tom Elliott, Andrew Shapland, and Maija Gierhart, &apos;Minoan Palatial Center (Knossos): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2022 &lt;https://pleiades.stoa.org/places/238779098&gt; [accessed: 19 July 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Knossos</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: knossos</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;35.2980390648,25.162860542&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Αινησίδημος ο Κνώσιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/238779098" target="_blank" rel="noopener">https://pleiades.stoa.org/places/238779098</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q9054457" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q9054457</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.geonames.org/259627/knosos.html" target="_blank" rel="noopener">https://www.geonames.org/2     ['<div class="terminologyEntry">    <div class="term">Κολοφών</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Αρχαία πόλη της Ιωνίας στις ακτές της Μικράς Ασίας, της οποίας τα ερείπια βρίσκονται νότια της πόλης Değirmendere της επαρχίας της Σμύρνης στην Τουρκία. Από αυτήν την πόλη καταγόταν ο λυρικός ποιητής Μίμνερμος, αλλά και ο φιλόσοφος Ξενοφάνης.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, DARMC, R. Talbert, Sean Gillies, Ryan Horne, Jeffrey Becker, and Tom Elliott, &apos;Colophon: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2022 &lt;https://pleiades.stoa.org/places/599577&gt; [accessed: 10 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Colophon</div>    <div class="textMediumMarginBlue">- en: Değirmendere</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: colophon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.108253,27.1483085&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Επίκουρος</div>    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Διονύσιος ο Κολοφώνιος, Ξενοφάνης ο Κολοφώνιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Colophon_(city)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Colophon_(city)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.geonames.org/9794266/colophon-gree     ['<div class="terminologyEntry">    <div class="term">Κύπρος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ένα από τα μεγαλύτερα νησιά της Μεσογείου, τόπος αιχμαλωσίας και θανάτου του Αναξάρχου του Αβδηρίτη.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> D. Rupp, R. Talbert, Sean Gillies, Jamie Novotny, Tom Elliott, and Jeffrey Becker, &apos;Cyprus (island): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/707498&gt; [accessed: 22 July 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Cyprus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: cyprus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;34.9723105975,33.160154151&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isDeathPlaceOf</u>: Ανάξαρχος ο Αβδηρίτης</div>    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Δημώναξ ο Κύπριος, Ευπείθης από την Πάφο</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DC%3Aentry+group%3D26%3Aentry%3Dcyprus-geo" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DC%3Aentry+group%3D26%3Aentry%3Dcyprus-geo</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/528" target="_blank" rel="noo     ['<div class="terminologyEntry">    <div class="term">Λάμψακος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Αρχαία ελληνική πόλη που βρισκόταν στην ανατολική πλευρά του Ελλήσποντου και κυριαρχούνταν διαδοχικά από τη Λυδία, την Περσία, την Αθήνα και τη Σπάρτη. Από τη Λάμψακο κατάγονταν μορφές όπως ο Λεόντιος, ο Στράτος, ο Αναξιμένης κ.ά.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> E.N. Borza, Brady Kiesling, R. Talbert, Sean Gillies, Jeffrey Becker, Tom Elliott, DARMC, G. Reger, R. Scott Smith, and Greta Hawes, &apos;Pityoussa/Lampsacus: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/501570&gt; [accessed: 22 July 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Lampsacus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: lampsacus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;40.346685,26.699162&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isDeathPlaceOf</u>: Αναξαγόρας ο Κλαζομενεύς</div>    <div class="attributeIndividual"> <u>residentedBy</u>: Επίκουρος</div>    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Βατίς από τη Λάμψακο, Κωλώτης ο Λαμψακηνός, Ευαίων o Λαμψακηνός, Ιδομενεύς ο Λαμψακηνός, Λεόντιος από τη Λάμψακο, Μενέδημος ο Κυνικός, Μητρόδωρος ο Λαμψακηνός, Μητρόδωρος ο Λαμψακηνός (Επικούρειος), Πoλύαινoς o Λαμψακηνός, Στράτων o Λαμψακηνός</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rd     ['<div class="terminologyEntry">    <div class="term">Λοκροί Επιζεφύριοι</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Αποικία που ιδρύθηκε από Έλληνες Λοκρούς στη νότια ακτή της Ιταλίας (στη σημερινή περιοχή της Καλαβρίας). Πολλοί φιλόσοφοι λέγεται ότι κατάγονταν από τους Λοκρούς, ο πιο γνωστός από τους οποίους είναι ο Τίμαιος από τους Λοκρούς, ο οποίος συμμετέχει στους διαλόγους του Πλάτωνα ( δηλαδή τον Τίμαιο και τον Κριτία) και αναφέρεται ως Πυθαγόρειος φιλόσοφος. Άλλοι φιλόσοφοι που κατάγονται από τη Λοκρίδα είναι ο Τιμάρατος, ο Αρίων, ο Εύδικος κ.ά.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> I.E.M. Edlund Berry, A.M. Small, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Jeffrey Becker, Tom Elliott, DARMC, K. Bender, and R. Talbert, &apos;Lokroi Epizephyrioi: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/452369&gt; [accessed: 19 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Locri Epizefiri</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: locri</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.2262955,16.2443395&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Γύττιος ο Λοκρός, Τίμαιος ο Λοκρός</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q3836325" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q3836325</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/33081" target="_blank" rel="noopener">http://www.trismegistos.org/place/33081</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/382162PLoc" target="_blank" rel="noopener">https://topostext.org/place/382162PLoc</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Locri" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Locri</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/452369" target="_blank" rel="noopener">https://pleiades.stoa.org/places/452369</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Λουκανία</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Λευκανία, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Αρχαίος τόπος της νότιας Ιταλίας, τόπος καταγωγής της Αισάρας, μιας Πυθαγόρειας φιλοσόφου.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> I.E.M. Edlund Berry, A.M. Small, R. Talbert, Sean Gillies, Tom Elliott, and Jeffrey Becker, &apos;Lucania (region): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2020 &lt;https://pleiades.stoa.org/places/442639&gt; [accessed: 19 July 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Lucania</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: lucania</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;39.885,17.276944&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Φιλόλαος ο Κροτωνιάτης</div>    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Αισάρα από τη Λουκανία, Αρέσας από τη Λουκανία, Οκελλώ η Λευκανή, Όκελλος ο Λευκανός, Όκκιλος ο Λευκανός, Αρέσανδρος ο Λευκανός</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/442639" target="_blank" rel="noopener">https://pleiades.stoa.org/places/442639</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/place/Lucania" target="_blank" rel="noopener">https://www.britannica.com/place/Lucania</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://el.wikipedia.org/wiki/%CE%9B%CE%BF%CF%85%CE%BA%CE%B1%CE%BD%CE%AF%CE%B1" target="_blank" rel="noopener">https://el.wikipedia.org/wiki/%CE%9B%CE%BF%CF%85%CE%BA%CE%B1%CE%BD%CE%AF%CE%B1</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Λύκειο</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Ένα κέντρο φιλοσοφίας και συστηματικής έρευνας στην επιστήμη και την ιστορία που οργανώθηκε εκεί από τον Αριστοτέλη και τους συνεργάτες του, το οποίο ξεκίνησε ως άτυπη ομάδα και δεν είχε κανένα νομική υπόσταση μέχρι που ο Θεόφραστος, συνάδελφος και κύριος κληρονόμος του Αριστοτέλη, απέκτησε γη και κτίρια εκεί γύρω στο 315 π.Χ.<br>[R. Audi, The Cambridge Dictionary of Philosophy, Third edition, 2015]</div>    <div class="textItalicSmallMargin"><b>2)</b> Ήταν περισσότερο γνωστό για την περιπατητική φιλοσοφική σχολή που ίδρυσε εκεί ο Αριστοτέλης το 334 π.Χ. Ο Αριστοτέλης εγκατέλειψε την Αθήνα το 323 π.Χ. και το πανεπιστήμιο συνέχισε να λειτουργεί και μετά τη ζωή του υπό διάφορους διευθυντές, μέχρι που ο Ρωμαίος στρατηγός Σύλλας το κατέστρεψε κατά την επίθεσή του στην Αθήνα το 86 π.Χ.<br>Πηγή: Wikipedia https://en.wikipedia.org/wiki/Lyceum_(classical)</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Lyceum</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: lyceum</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d1/Sanzio_01_cropped.png" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/d/d1/Sanzio_01_cropped.png" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/d/d1/Sanzio_01_cropped.png</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Μαγνησία</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Μαγνησία, μια παράκτια περιοχή της Θεσσαλίας με μακρόστενη χερσόνησο στο Αιγαίο, δίνει το όνομά της στη σύγχρονη περιφερειακή ενότητα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> J. Fossey, J. Morin, R. Talbert, G. Reger, Sean Gillies, Tom Elliott, and Jeffrey Becker, &apos;Magnesia (region): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/540923&gt; [accessed: 09 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Magnesia</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: magnesia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;39.5066786008,22.920519021&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Διοκλής ο Μάγνης, Πάμφιλος από τη Μαγνησία</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/540923" target="_blank" rel="noopener">https://pleiades.stoa.org/places/540923</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Μαλλός</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Μαλλός, γνωστή και ως Αντιόχεια επί Πύραμω, ήταν μια αρχαία παραθαλάσσια πόλη στην Κιλικία.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> S. Mitchell, DARMC, R. Talbert, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Jeffrey Becker, and Tom Elliott, &apos;Mallos/Antiochia ad Pyramum: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/648702&gt; [accessed: 07 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Mallos</div>    <div class="textMediumMarginBlue">- en: Antiochia ad Pyramum</div>    <div class="textMediumMarginBlue">- en: Mallus</div>    <div class="textMediumMarginBlue">- en: Karataş</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: mallos</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;36.756188,35.4852&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Κράτης o Μαλλώτης, Ηλιόδωρος από τη Μαλλό, Μοσχίων ο Μαλλώτης, Πρόκλος Μαλλώτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Mallus" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Mallus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/place/1300" target="_blank" rel="noopener">https://www.trismegistos.org/place/1300</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/368355PMal" target="_blank" rel="noopener">https://topostext.org/place/368355PMal</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q1425353" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q1425353</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/648702" target="_blank" rel="noopener">https://pleiades.stoa.org/places/648702</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Μαντίνεια</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Αντιγόνεια, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Μαντινεία, που ονομαζόταν επίσης Αντιγόνεια, ήταν ένας αρχαίος ελληνικός οικισμός γνωστός για δύο μεγάλες μάχες: τη μεγαλύτερη χερσαία μάχη του Πελοποννησιακού Πολέμου το 418 π.Χ. και τη μάχη που έθεσε τέρμα στη θηβαϊκή ηγεμονία το 362 π.Χ.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> G. Reger, J. McK. Camp II, DARMC, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Jeffrey Becker, Tom Elliott, Catherine Bouras, and R. Talbert, &apos;Mantineia/Antigoneia: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/570459&gt; [accessed: 01 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Mantineia</div>    <div class="textMediumMarginBlue">- en: Antigoneia</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: mantineia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.6173785,22.3925775&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Αριστόξενος ο Ταραντίνος</div>    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Λασθένεια</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0064:entry=mantineia-geo" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0064:entry=mantineia-geo</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/376224UMan" target="_blank" rel="noopener">https://topostext.org/place/376224UMan</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Mantineia" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Mantineia</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/15750" target="_blank" rel="noopener">http://www.trismegistos.org/place/15750</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.geonames.org/257819/mantineia.html" target="_blank" rel="noopener">https://www.geonames.org/257819/mantineia.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/570459" target="_blank" rel="noopener">https://pleiades.stoa.org/places/570459</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Μαραθώνας</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Μαραθώνας, ένας δήμος στη βορειοανατολική Αττική, ήταν ο τόπος της μάχης του Μαραθώνα το 490 π.Χ..</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> J.S. Traill, Catherine Bouras, Brady Kiesling, Sean Gillies, Chris de Lisle, Jeffrey Becker, Tom Elliott, DARMC, R. Scott Smith, Pierre Motylewicz, R. Talbert, and Greta Hawes, &apos;Marathon: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/580021&gt; [accessed: 02 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Marathon</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: marathon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.1465515,23.970146&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Βόηθος από τον Μαραθώνα</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/place/37768" target="_blank" rel="noopener">https://www.trismegistos.org/place/37768</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Marathon,_Greece" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Marathon,_Greece</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q13423602" target="_blank" rel="noopener">http     ['<div class="terminologyEntry">    <div class="term">Μοσούλη</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Νινευή, Νινευί, </font></div>    <div class="textMediumMargin"><b>Comment</b>: <br>Η Νινευή, που σήμερα αποτελεί προάστιο της σύγχρονης Μοσούλης, ήταν σημαντικό θρησκευτικό κέντρο της θεάς Ιστάρ, έγινε πρωτεύουσα της Ασσυρίας υπό τον Σενναχειρείμ το 704 π.Χ., και παρέμεινε τέτοια μέχρι την καταστροφή της το 612 π.Χ. από συμμαχία Βαβυλωνίων και Μήδων.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> M. Roaf, T. Sinclair, S.E. Kroll, St J. Simpson, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Valeria Vitale, Jeffrey Becker, Carolin Johansson, Jamie Novotny, Tom Elliott, DARMC, Gabriel Bodard, R. Talbert, Francis Deblauwe, and Rune Rattenborg, &apos;Nineveh/Ninos: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/874621&gt; [accessed: 08 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Nineveh</div>    <div class="textMediumMarginBlue">- en: Mosul</div>    <div class="textMediumMarginBlue">- en: Ninos</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: nineveh</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;36.3607615238,43.1599368897&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Δάμις (μαθητής του Απολλωνίου Τυανέως)</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:see     ['<div class="terminologyEntry">    <div class="term">Σπάρτη</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Μια εξέχουσα πόλη-κράτος στη Λακωνία στην αρχαία Ελλάδα.Στην αρχαιότητα, η πόλη-κράτος ήταν γνωστή ως Λακεδαίμονας (Λακεδαίμων, Λακεδαίμονος), ενώ το όνομα Σπάρτη αναφερόταν στον κύριο οικισμό της στις όχθες του ποταμού Ευρώτα στη Λακωνία, στη νοτιοανατολική Πελοπόννησο. Γύρω στο 650 π.Χ. αναδείχθηκε σε κυρίαρχη στρατιωτική χερσαία δύναμη στην αρχαία Ελλάδα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> G. Reger, J. McK. Camp II, DARMC, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Jeffrey Becker, Danielle Hoyer, Adam Rabinowitz, Tom Elliott, Catherine Bouras, Danielle Hoyer, R. Talbert, and Paul Cochran, &apos;Sparta: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/570685&gt; [accessed: 03 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Sparta</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sparta</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.0818455246,22.4246825462&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Χείλων ο Λακεδαιμόνιος, Δημήτριος ο Λάκων, Γόργος ο Σπαρτιάτης, Αυτοχαρίδας ο Λάκων, Τιμύχα η Λακεδαιμονία, Κρατησίκλεια η Λάκαινα</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Sparta" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Sparta</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/371224PSpa" target="_blank" rel="noopener">https://topostext.org/place/371224PSpa</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.geonames.org/253394/sparta.html" target="_blank" rel="noopener">https://www.geonames.org/253394/sparta.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/2181" target="_blank" rel="noopener">http://www.trismegistos.org/place/2181</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q5690" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q5690</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/570685" target="_blank" rel="noopener">https://pleiades.stoa.org/places/570685</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Στάγειρα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Αρχαία ελληνική πόλη που βρίσκεται κοντά στην ανατολική ακτή της χερσονήσου της Χαλκιδικής, η οποία σήμερα αποτελεί μέρος της ελληνικής επαρχίας της Κεντρικής Μακεδονίας, στην Ελλάδα. Είναι κυρίως γνωστή ως γενέτειρα του Αριστοτέλη, του Έλληνα φιλόσοφου και πολυμαθούς, μαθητή του Πλάτωνα και δασκάλου του Μεγάλου Αλεξάνδρου.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> E.N. Borza, Brady Kiesling, R. Talbert, Johan Åhlfeldt, Jeffrey Becker, Tom Elliott, DARMC, G. Reger, and Sean Gillies, &apos;Stageira: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/501625&gt; [accessed: 19 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Stagira</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: stagira</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;40.5917869176,23.795327785&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Αριστοτέλης, Ίππαρχος ο Σταγειρίτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/501625#:~:text=Smith%201854%20(Perseus)%2C%20STAGEIRA%20or%20STAGEIRUS" target="_blank" rel="noopener">https://pleiades.stoa.org/places/501625#:~:text=Smith%201854%20(Perseus)%2C%20STAGEIRA%20or%20STAGEIRUS</a></div>    <div class= "externalLin     ['<div class="terminologyEntry">    <div class="term">Στρατονίκεια</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Αρχαία πόλη στην Καρία, ιδρυμένη από τον Αντίοχο Α΄ Σωτήρα, με επιρροές από τη Ρόδο και αργότερα υπό ρωμαϊκή διοίκηση, ήταν γνωστή για την εντυπωσιακή τέχνη και αρχιτεκτονική της.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, Jeffrey Becker, DARMC, Tom Elliott, Sean Gillies, Brady Kiesling, R. Talbert, and Johan Åhlfeldt, &apos;Stratonikeia: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2018 &lt;https://pleiades.stoa.org/places/599947&gt; [accessed: 15 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Stratoniceia</div>    <div class="textMediumMarginBlue">- en: Stratonike</div>    <div class="textMediumMarginBlue">- en: Stratoniki</div>    <div class="textMediumMarginBlue">- en: Stratonikeia</div>    <div class="textMediumMarginBlue">- en: Eskihisar</div>    <div class="textMediumMarginBlue">- en: Stratonicea</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: stratonicea</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.3137095,28.061849&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Μητρόδωρος της Στρατονικείας</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/2201" target="_blank" rel="noopener">http://www.trismegistos.org/place/2201</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0006:entry=stratonikeia" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0006:entry=stratonikeia</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/2201" target="_blank" rel="noopener">http://www.trismegistos.org/place/2201</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Stratonicea_(Caria)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Stratonicea_(Caria)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/599947" target="_blank" rel="noopener">https://pleiades.stoa.org/places/599947</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Συρακούσες</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Μία σημαντική αρχαία πόλη, που βρισκόταν στο νησί της Σικελίας.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> R.J.A. Wilson, DARMC, Brady Kiesling, Sean Gillies, Valeria Vitale, Rajas Pradhan, Jeffrey Becker, Adam Rabinowitz, Tom Elliott, Faith Lubeck, Jonathan Prag, Kali Kocian, R. Talbert, David Mimno, and Jeffrey Mayfield, &apos;Syracusae/Syrakousai: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/462503&gt; [accessed: 24 July 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Syracuse</div>    <div class="textMediumMarginBlue">- en: Syrakousai</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: syracuse</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.0700365425,15.2831354804&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Αρχέδημος ο Συρακούσιος, Δάμων ο Συρακούσιος, Δίων ο Συρακούσιος, Έκφαντος, Ευρύφαμος από τις Συρακούσες, Ερμόδωρος, Ικέτης, Μόνιμος ο Συρακούσιος, Σιμίας ο Συρακούσιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q13670" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q13670</a></div>    <div class= "externalLinkIndividual">rdfs:s     ['<div class="terminologyEntry">    <div class="term">Σύρος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ελληνικό νησί του Αιγαίου.Τόπος γέννησης του Φερεκύδη του Σύριου, Έλληνα φιλόσοφου, 6ος αι. π.Χ.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> J. Bennet, G. Reger, Catherine Bouras, R. Talbert, Brady Kiesling, Sean Gillies, Jeffrey Becker, Noah Kaye, and Tom Elliott, &apos;Syros (island): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/590067&gt; [accessed: 16 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Syros</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: syros</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.4328651466,24.909459433&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Φερεκύδης ο Σύριος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0064:entry=cyclades-geo&amp;highlight=syros" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0064:entry=cyclades-geo&amp;highlight=syros</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.geonames.org/253775/nisi-syros.html" target="_blank" rel="noopener">https://www.geonames.org/253775/nisi-syros.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a h     ['<div class="terminologyEntry">    <div class="term">Τάραντας</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαία ελληνική περιοχή</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ελληνική αποικιακή πόλη στη Μεγάλη Ελλάδα που ιδρύθηκε το 706 π.Χ., πατρίδα των Ελλήνων πυθαγορείων φιλοσόφων Αβροτέλια, Ακμονίδα και Αρχύτα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> I.E.M. Edlund Berry, A.M. Small, DARMC, R. Talbert, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Jeffrey Becker, and Tom Elliott, &apos;Taras/Tarentum/Neptunia: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/442810&gt; [accessed: 19 July 2024] </div>    <div class="textItalicSmallMargin"><b>2)</b> Curnow, T. (2006). The philosophers of the ancient world: An A to Z guide (p. 7). Bristol Classical Press.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Tarentum</div>    <div class="textMediumMarginBlue">- en: Taras</div>    <div class="textMediumMarginBlue">- en: Neptunia</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: tarentum</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;40.4737866,17.2330416&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Ακμονίδας ο Ταραντίνος, Ακουσιλάδας ο Ταραντίνος, Αρχύτας ο Ταραντίνος, Αριστόξενος ο Ταραντίνος, Κλεινίας ο Ταραντίνος, Δικαίαρχος ο Ταραντίνος, Εχεκράτης ο Ταραντίνος, Επιχαρίδης ο Ταραντίνος, Εύρυτος ο Ταραντίνος, Αβροτέλης, Εστιαίος ο Ταραντίνος, Ίκκος ο Ταραντίνος, Μιμνόμαχος ο Ταραντίνος, Νέαρχος ο function show_selected() {
    var selector = document.getElementById('idTerm');
    var champ = dictionnaire[selector[selector.selectedIndex].value][0];
    document.getElementById('display').innerHTML = champ;
}
document.getElementById('idTerm').addEventListener('change', show_selected);

searchBox = document.querySelector("#searchBox");
entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});

</script>
