ttps://librivox.org/search?title=De+Anima&amp;author=ARISTOTLE&amp;reader=&amp;keywords=&amp;genre_id=0&amp;status=all&amp;project_type=either&amp;recorded_language=&amp;sort_order=catalog_date&amp;search_page=1&amp;search_form=advanced</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.mikrosapoplous.gr/aristotle/psyxhs/contents.html" target="_blank" rel="noopener">https://www.mikrosapoplous.gr/aristotle/psyxhs/contents.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://web.archive.org/web/20080907161558/http://etext.lib.virginia.edu/toc/modeng/public/AriSoul.html" target="_blank" rel="noopener">https://web.archive.org/web/20080907161558/http://etext.lib.virginia.edu/toc/modeng/public/AriSoul.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/On_the_Soul" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/On_the_Soul</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ποιητική</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Ποιητική του Αριστοτέλη αναλύει τη δομή και τα στοιχεία των δραματικών έργων, ιδίως της τραγωδίας. Διερευνά πώς το δράμα επιτυγχάνει συναισθηματικά αποτελέσματα μέσω της πλοκής, του χαρακτήρα και της γλώσσας, δίνοντας έμφαση στη σημασία της κάθαρσης και της ενότητας της δράσης, του χαρακτήρα και του θέματος.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/aristotle-poetics/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Poetics</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: poetics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αριστοτέλης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.physics.ntua.gr/mourmouras/greats/aristoteles/peri_poihtikhs.html" target="_blank" rel="noopener">https://www.physics.ntua.gr/mourmouras/greats/aristoteles/peri_poihtikhs.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.greek-language.gr/digitalResources/ancient_greek/anthology/literature/browse.html?text_id=328" target="_blank" rel="noopener">https://www.greek-language.gr/digitalResources/ancient_greek/anthology/literature/browse.html?text_id=328</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Poetics_(Aristotle)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Poetics_(Aristotle)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/aristotle-poetics/" target="_blank" rel="noopener">https://iep.utm.edu/aristotle-poetics/</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Πολιτεία</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Πολιτεία του Πλάτωνα είναι ένας θεμελιώδης φιλοσοφικός διάλογος που εξετάζει τη φύση της δικαιοσύνης, τόσο στο άτομο όσο και στην πόλη-κράτος, διερευνώντας τη δομή της ιδανικής Πολιτείας και κοινωνίας, η οποία αποτελείται από τρεις τάξεις, που αντιστοιχούν στα τρία μέρη της ψυχής: το λογιστικόν, το θυμοειδές και το επιθυμητικόν. Ο διάλογος εξετάζει τον ρόλο του Φιλοσόφου-βασιλέως, τη θεωρία των Ιδεών, την Αλληγορία του Σπηλαίου και τη σχέση μεταξύ γνώσης, πραγματικότητας και του Αγαθού, με στόχο να δείξει γιατί η δίκαιη ζωή είναι προς το συμφέρον του ατόμου.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Brown, Eric, "Plato&apos;s Ethics and Politics in The Republic", The Stanford Encyclopedia of Philosophy (Fall 2017 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/fall2017/entries/plato-ethics-politics/&gt;.</div>    <div class="textItalicSmallMargin"><b>2)</b> https://iep.utm.edu/republic/</div>    <div class="textItalicSmallMargin"><b>3)</b> Britannica, The Editors of Encyclopaedia. "The Republic". Encyclopedia Britannica, 5 Jul. 2024, https://www.britannica.com/topic/The-Republic. Accessed 17 August 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: The Republic</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: republic</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Plato - Henri Omont, Oeuvres philosophiques de Platon: Facsimilé en phototypie, à la grandeur exacte de l’original du Ms. grec 1807 de la Bibliothèque Nationale [Title page of the oldest complete manuscript: Paris, Bibliothèque Nationale, Gr. 1807 (late 9th century)]. Paris 1908., Public Domain, https://commons.wikimedia.org/w/index.php?curid=28341705</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Politeia_beginning._Codex_Parisinus_graecus_1807.jpg/800px-Politeia_beginning._Codex_Parisinus_graecus_1807.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>mentions</u>: Αδείμαντος του Κολλυτού, Δάμων ο Αθηναίος, Πρόδικος ο Κείος, Πρωταγόρας ο Αβδηρίτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Politeia_beginning._Codex_Parisinus_graecus_1807.jpg/800px-Politeia_beginning._Codex_Parisinus_graecus_1807.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Politeia_beginning._Codex_Parisinus_graecus_1807.jpg/800px-Politeia_beginning._Codex_Parisinus_graecus_1807.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/ENTRIES/plato-ethics-politics/" target="_blank" rel="noopener">https://plato.stanford.edu/ENTRIES/plato-ethics-politics/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Republic_(Plato)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Republic_(Plato)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/republic/" target="_blank" rel="noopener">https://iep.utm.edu/republic/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/The-Republic" target="_blank" rel="noopener">https://www.britannica.com/topic/The-Republic</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1497/1497-h/1497-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1497/1497-h/1497-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0168" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0168</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/republic.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/republic.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://books.openbookpublishers.com/10.11647/obp.0229/contents.xhtml" target="_blank" rel="noopener">https://books.openbookpublishers.com/10.11647/obp.0229/contents.xhtml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg030" target="_blank" rel="noopener">http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg030</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Πολιτικά</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Στα Πολιτικά, ο Αριστοτέλης αναλύει διάφορες μορφές πολιτικών κοινοτήτων, ασκεί κριτική στα υπάρχοντα πολιτικά συστήματα και διερευνά πώς αυτά υπολείπονται της ιδανικής πόλης που προάγει την ενάρετη ζωή. Εξετάζει τους ρόλους των διαφόρων τάξεων, τη φύση της ιδιότητας του πολίτη και τα καλύτερα πρακτικά καθεστώτα για την επίτευξη μιας καλά οργανωμένης και δίκαιης κοινωνίας.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/aristotle-politics/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Politics</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: politics_aristotle</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αριστοτέλης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/aristotle-politics/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/aristotle-politics/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/aristotle-politics/" target="_blank" rel="noopener">https://iep.utm.edu/aristotle-politics/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0058%3Abook%3D1%3Asection%3D1252a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0058%3Abook%3D1%3Asection%3D1252a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Politics_(Aristotle)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Politics_(Aristotle)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.physics.ntua.gr/mourmouras/greats/aristoteles/politika.html" target="_blank" rel="noopener">https://www.physics.ntua.gr/mourmouras/greats/aristoteles/politika.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.greek-language.gr/greekLang/ancient_greek/tools/corpora/anthology/content.html?t=43&amp;m=2" target="_blank" rel="noopener">https://www.greek-language.gr/greekLang/ancient_greek/tools/corpora/anthology/content.html?t=43&amp;m=2</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Πολιτικός</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο διάλογος Πολιτικός του Πλάτωνα εξετάζει τη φύση του αληθινού πολιτικού, συγκρίνοντάς τον με άλλους ρόλους και τονίζοντας τη σημασία της κατάλληλης μεθοδολογίας στη πολιτική φιλοσοφία και στη διαλεκτική πρακτική.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Gill, Mary-Louise, "Method and Metaphysics in Plato’s Sophist and Statesman", The Stanford Encyclopedia of Philosophy (Fall 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2023/entries/plato-sophstate/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Statesman</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: statesman</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>mentions</u>: Θεόδωρος ο Κυρηναίος (αναφέρεται από τον Πλάτωνα), Σωκράτης</div>    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg008" target="_blank" rel="noopener">http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg008</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/plato-sophstate/#PurSopSta" target="_blank" rel="noopener">https://plato.stanford.edu/entries/plato-sophstate/#PurSopSta</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/stateman.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/stateman.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-statesman/1925/pb_LCL164.3.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-statesman/1925/pb_LCL164.3.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Statesman-by-Plato" target="_blank" rel="noopener">https://www.britannica.com/topic/Statesman-by-Plato</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+stat.+257a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+stat.+257a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1738/1738-h/1738-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1738/1738-h/1738-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Statesman_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Statesman_(dialogue)</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Προτρεπτικός προς Έλληνας</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ένα από τα σημαντικότερα σωζόμενα έργα του Κλήμη που ανήκει σε τριλογία.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Fredericksen, Linwood. "St. Clement of Alexandria". Encyclopedia Britannica, 22 Feb. 2024, https://www.britannica.com/biography/Clement-of-Alexandria. Accessed 7 August 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Protrepticus (Clement of Alexandria)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: protrepticus_clement</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Κλήμης ο Αλεξανδρεύς</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Προτρεπτικός του Ιάμβλιχου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Έργο που ενθαρρύνει τους αναγνώστες να υιοθετήσουν τη φιλοσοφία ως δρόμο για προσωπική και πνευματική ανάπτυξη, επισημαίνοντας τη σημασία της φιλοσοφικής έρευνας και της ηθικής αυτοβελτίωσης.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Curnow, T. (2006). The philosophers of the ancient world: An A to Z guide. Bristol Classical Press.<br></div>    <div class="textItalicSmallMargin"><b>2)</b> Chiaradonna, Riccardo and Adrien Lecerf, "Iamblichus", The Stanford Encyclopedia of Philosophy (Winter 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/win2023/entries/iamblichus/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Protrepticus (Iamblichus)</div>    <div class="textMediumMarginBlue">- en: Exhortation to Philosophy (Iamblichus)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: protrepticus_iamblichus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Ιάμβλιχος ο Χαλκιδεύς</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Πρωταγόρας (Πλάτωνος)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Πρωταγόρας του Πλάτωνα είναι διάλογος όπου ο Σωκράτης συζητά με τον διάσημο σοφιστή Πρωταγόρα στο σπίτι του Καλλία, εστιάζοντας στη φύση των σοφιστών, την ενότητα και τη διδασκαλία της αρετής, με συνοδεία είκοσι ενός ατόμων.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Bonazzi, Mauro, "Protagoras", The Stanford Encyclopedia of Philosophy (Fall 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2023/entries/protagoras/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Protagoras (Plato)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: protagoras_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Plato - Protagoras Codex Oxoniensis Clarkianus 39, facsimile by Sijthoff with foreword by Allen., Public Domain, https://commons.wikimedia.org/w/index.php?curid=26910471</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/59/Protagoras_beginning._Clarke_Plato.jpg/800px-Protagoras_beginning._Clarke_Plato.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Κριτίας (φιλόσοφος), Ιππίας ο Ηλείος, Ίκκος ο Ταραντίνος, Πρόδικος ο Κείος, Πρωταγόρας ο Αβδηρίτης, Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/5/59/Protagoras_beginning._Clarke_Plato.jpg/800px-Protagoras_beginning._Clarke_Plato.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/5/59/Protagoras_beginning._Clarke_Plato.jpg/800px-Protagoras_beginning._Clarke_Plato.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-protagoras/1924/pb_LCL165.197.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-protagoras/1924/pb_LCL165.197.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Protagoras-by-Plato" target="_blank" rel="noopener">https://www.britannica.com/topic/Protagoras-by-Plato</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/protagoras/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/protagoras/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/protagoras.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/protagoras.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-protagoras/1924/pb_LCL165.93.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-protagoras/1924/pb_LCL165.93.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+prot.+309a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+prot.+309a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1591/1591-h/1591-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1591/1591-h/1591-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Protagoras_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Protagoras_(dialogue)</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Πυρρωνείων λόγων βιβλία οκτώ</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Οι Πυρρώνιοι Λόγοι είναι μια πραγματεία που γράφτηκε από τον Αινησίδημο, πιθανότατα παρόμοιας δομής με το έργο του Σέξτου Εμπειρίκου. Περιλαμβάνει μια γενική περιγραφή του σκεπτικισμού, συνοδευόμενη από συζητήσεις για συγκεκριμένα φιλοσοφικά ζητήματα. Το έργο σώζεται μερικώς σε περίληψη από τον Φώτιο και αφιερώθηκε στον Lucius Aelius Tubero. Έγινε κεντρικό κείμενο του σκεπτικιστικού κανόνα, επηρεάζοντας μεταγενέστερους σκεπτικιστές όπως ο Σέξτος Εμπειρίκος.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Vogt, Katja, "Ancient Skepticism", The Stanford Encyclopedia of Philosophy (Winter 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/win2022/entries/skepticism-ancient/&gt;.</div>    <div class="textItalicSmallMargin"><b>2)</b> Britannica, T. Editors of Encyclopaedia (2024, February 7). Aenesidemus. Encyclopedia Britannica. https://www.britannica.com/biography/Aenesidemus</div>    <div class="textItalicSmallMargin"><b>3)</b> Curnow, T. (2006). The philosophers of the ancient world: An A to Z guide (p. 10). Bristol Classical Press.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Pyrrhonist Discourses</div>    <div class="textMediumMarginBlue">- en: Pyrrhonian Discourses</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: pyrrhonian_discourses</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αινησίδημος ο Κνώσιος</div>    <div class="attributeIndividual"> <u>mentions</u>: Πύρρων ο Ηλείος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Πυρρωνείων υποτυπώσεις</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Το έργο "Πυρρωνείων υποτυπώσεων" του Σέξτου Εμπειρικού περιγράφει τη φιλοσοφία του Πυρρώνιου Σκεπτικισμού, εξηγώντας την τεχνική της αναστολής της κρίσης (ἐποχή) και προσφέροντας αντεπιχειρήματα σε φιλοσοφικές θέσεις σχετικά με τη λογική, τη φυσική και την ηθική.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Morison, Benjamin, "Sextus Empiricus", The Stanford Encyclopedia of Philosophy (Fall 2019 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/fall2019/entries/sextus-empiricus/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Outlines of Pyrrhonism</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: outlines_of_pyrrhonism</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Σέξτος ο Εμπειρικός</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/LCL273/1933/volume.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/LCL273/1933/volume.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://people.uvawise.edu/philosophy/phil205/Sextus.html" target="_blank" rel="noopener">https://people.uvawise.edu/philosophy/phil205/Sextus.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/rec/EMPOOP-2" target="_blank" rel="noopener">https://philpapers.org/rec/EMPOOP-2</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/sextus_empiricus-outlines_pyrrhonism/1933/pb_LCL273.3.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/sextus_empiricus-outlines_pyrrhonism/1933/pb_LCL273.3.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/sextus-empiricus/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/sextus-empiricus/</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ρητορική (Αριστοτέλη)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Ρητορική του Αριστοτέλη διερευνά την τέχνη της πειθούς μέσω τριών βασικών μέσων: του χαρακτήρα του ομιλητή (ήθος), των συναισθημάτων του ακροατηρίου (πάθος) και του ίδιου του επιχειρήματος (λόγος). Το έργο είναι δομημένο γύρω από την ανάλυση διαφορετικών ειδών λόγων -συμβουλευτικών, δικανικών και επιδεικτικών- και παρέχει λεπτομερή εξέταση των ρητορικών τεχνικών και υφών.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Rapp, Christof, "Aristotle’s Rhetoric", The Stanford Encyclopedia of Philosophy (Winter 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/win2023/entries/aristotle-rhetoric/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Rhetoric (Aristotle)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: rhetoric_aristotle</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αριστοτέλης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Rhetoric_(Aristotle)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Rhetoric_(Aristotle)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.greek-language.gr/greekLang/ancient_greek/tools/corpora/anthology/content.html?t=61&amp;m=1" target="_blank" rel="noopener">https://www.greek-language.gr/greekLang/ancient_greek/tools/corpora/anthology/content.html?t=61&amp;m=1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/aristotle-rhetoric/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/aristotle-rhetoric/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0060" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0060</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Aristotle/rhetoric.1.i.html" target="_blank" rel="noopener">https://classics.mit.edu/Aristotle/rhetoric.1.i.html</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σίλλοι</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Σατιρικά ποιήματα, σκωπτικά, του Τίμωνος του Φλίου. Γράφτηκαν σε εξάμετρο στίχο. Αποτελούνταν από τρία βιβλία, στο πρώτο από τα οποία μιλούσε στο ίδιο του το πρόσωπο, και τα άλλα δύο έχουν τη μορφή διαλόγου μεταξύ του συγγραφέα και του Ξενοφάνη, όπου ο Τίμων πρότεινε ερωτήσεις, στις οποίες ο Ξενοφάνης απαντούσε εκτενώς. Το θέμα ήταν ένας σαρκαστικός απολογισμός των δοξασιών όλων των φιλοσόφων, ζωντανών και νεκρών. </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Silloi</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: silloi</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Τίμων ο Φλιάσιος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σίσυφος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο διάλογος του Σίσυφου, ο οποίος αναγνωρίζεται ως πλαστός, διερευνά τη φύση της διαβούλευσης και αποκαλύπτει την παρανόηση του Σίσυφου μέσα από τη συνομιλία του με τον Σωκράτη.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://archive.org/details/WorksOfPlatoV6/page/274/mode/1up</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Sisyphus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sisyphus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikisource.org/wiki/Sisyphus" target="_blank" rel="noopener">https://en.wikisource.org/wiki/Sisyphus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philosophyaudiobooks.libsyn.com/sisyphus" target="_blank" rel="noopener">https://philosophyaudiobooks.libsyn.com/sisyphus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://academic.oup.com/book/39292/chapter-abstract/338877550?redirectedFrom=fulltext" target="_blank" rel="noopener">https://academic.oup.com/book/39292/chapter-abstract/338877550?redirectedFrom=fulltext</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.thelatinlibrary.com/psplato.sisyphus.html" target="_blank" rel="noopener">https://www.thelatinlibrary.com/psplato.sisyphus.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/upontakingcounsel" target="_blank" rel="noopener">https://archive.org/details/upontakingcounsel</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Sisyphus_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Sisyphus_(dialogue)</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σοφιστής</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο διάλογος Σοφιστής του Πλάτωνα εστιάζει στον ορισμό του σοφιστή, εξετάζοντας την έννοια του "μη όντος" και αντιμετωπίζοντας τα προβλήματα της ψευδούς δήλωσης, καθώς ορίζει τον σοφιστή ως κάποιον που δημιουργεί ψευδείς εντυπώσεις και εμφανίζεται ως γνώστης χωρίς να είναι πραγματικός φιλόσοφος.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Gill, Mary-Louise, "Method and Metaphysics in Plato’s Sophist and Statesman", The Stanford Encyclopedia of Philosophy (Fall 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2023/entries/plato-sophstate/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Sophist</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sophist_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Παρμενίδης ο Ελεάτης, Πρωταγόρας ο Αβδηρίτης, Ζήνων ο Ελεάτης, Θεόδωρος ο Κυρηναίος (αναφέρεται από τον Πλάτωνα), Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg007" target="_blank" rel="noopener">http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg007</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/sophist.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/sophist.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-sophist/1921/pb_LCL123.261.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-sophist/1921/pb_LCL123.261.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/plato-sophstate/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/plato-sophstate/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+soph.+216a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+soph.+216a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1735/1735-h/1735-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1735/1735-h/1735-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Sophist_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Sophist_(dialogue)</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σοφιστικοί Έλεγχοι</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ένα από τα έργα που συνθέτουν τη συλλογή "Όργανον" στο οποίο προσδιόρισε δεκατρείς πλάνες.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://en.wikipedia.org/wiki/Sophistical_Refutations</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: On Sophistical Refutations</div>    <div class="textMediumMarginBlue">- en: Sophistical Refutations</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sophistical_refutations</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αριστοτέλης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://aristotelistes.cti.gr/admin/Lexicon/407" target="_blank" rel="noopener">https://aristotelistes.cti.gr/admin/Lexicon/407</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://el.wikisource.org/wiki/%CE%A3%CE%BF%CF%86%CE%B9%CF%83%CF%84%CE%B9%CE%BA%CE%BF%CE%AF_%CE%88%CE%BB%CE%B5%CE%B3%CF%87%CE%BF%CE%B9/3" target="_blank" rel="noopener">https://el.wikisource.org/wiki/%CE%A3%CE%BF%CF%86%CE%B9%CF%83%CF%84%CE%B9%CE%BA%CE%BF%CE%AF_%CE%88%CE%BB%CE%B5%CE%B3%CF%87%CE%BF%CE%B9/3</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://aristotelistes.cti.gr/admin/Lexicon/459" target="_blank" rel="noopener">https://aristotelistes.cti.gr/admin/Lexicon/459</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://el.wikisource.org/wiki/%CE%A3%CE%BF%CF%86%CE%B9%CF%83%CF%84%CE%B9%CE%BA%CE%BF%CE%AF_%CE%88%CE%BB%CE%B5%CE%B3%CF%87%CE%BF%CE%B9/1" target="_blank" rel="noopener">https://el.wikisource.org/wiki/%CE%A3%CE%BF%CF%86%CE%B9%CF%83%CF%84%CE%B9%CE%BA%CE%BF%CE%AF_%CE%88%CE%BB%CE%B5%CE%B3%CF%87%CE%BF%CE%B9/1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Sophistical-Refutations" target="_blank" rel="noopener">https://www.britannica.com/topic/Sophistical-Refutations</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Sophistical_Refutations" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Sophistical_Refutations</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Στρωματείς</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ένα από τα σημαντικότερα σωζόμενα έργα του Κλήμη που ανήκει σε τριλογία.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Fredericksen, Linwood. "St. Clement of Alexandria". Encyclopedia Britannica, 22 Feb. 2024, https://www.britannica.com/biography/Clement-of-Alexandria. Accessed 7 August 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Miscellanies</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: miscellanies_clement</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Κλήμης ο Αλεξανδρεύς</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Συμπόσιο</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: To Συμπόσιον του Πλάτωνα είναι διάλογος που επικεντρώνεται σε μια σειρά από λόγους που δίνονται σε ένα συμπόσιο, εξετάζοντας διάφορες πτυχές του έρωτα και της ομορφιάς, καταλήγοντας στη συζήτηση του Σωκράτη για τον έρωτα ως αναζήτηση της αιώνιας και θείας αλήθειας.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Reeve, C. D. C., "Plato on Friendship and Eros", The Stanford Encyclopedia of Philosophy (Summer 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/sum2023/entries/plato-friendship/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Symposium</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: symposium</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Plato - Symposion beginning. Editio princeps, Venice 1513, editio princeps, Public Domain, https://commons.wikimedia.org/w/index.php?curid=28037786</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Symposion_beginning._Editio_princeps.jpg/800px-Symposion_beginning._Editio_princeps.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Διοτίμα η Μαντινική, Απολλόδωρος ο Φαληρεύς, Χαρμίδης ο Αθηναίος, Γοργίας ο Λεοντίνος, Παρμενίδης ο Ελεάτης, Πρόδικος ο Κείος, Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Symposion_beginning._Editio_princeps.jpg/800px-Symposion_beginning._Editio_princeps.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Symposion_beginning._Editio_princeps.jpg/800px-Symposion_beginning._Editio_princeps.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg011" target="_blank" rel="noopener">http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg011</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://chs.harvard.edu/chapter/3-a-platonic-reading-of-platos-symposium-lloyd-p-gerson/" target="_blank" rel="noopener">https://chs.harvard.edu/chapter/3-a-platonic-reading-of-platos-symposium-lloyd-p-gerson/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/ebooks/1600" target="_blank" rel="noopener">https://www.gutenberg.org/ebooks/1600</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-symposium/1925/pb_LCL166.79.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-symposium/1925/pb_LCL166.79.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0174:text=Sym." target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0174:text=Sym.</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/plato-friendship/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/plato-friendship/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/symposium.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/symposium.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1600/1600-h/1600-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1600/1600-h/1600-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Symposium_(Plato)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Symposium_(Plato)</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Σωκρατικοί διάλογοι του Αισχίνη του Σφήττιου</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Λίγα αποσπάσματα σώζονται από τους φιλοσοφικούς διαλόγους που έγραψε ο Αισχίνης.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Curnow, T. (2006). The philosophers of the ancient world: An A to Z guide. Bristol Classical Press.</div>    <div class="textItalicSmallMargin"><b>2)</b> Nails, Debra and S. Sara Monoson, "Socrates", The Stanford Encyclopedia of Philosophy (Summer 2022 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/sum2022/entries/socrates/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Aeschines of Spettus&apos; Socratic dialogues</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: aeschines_socratic_dialogues</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αισχίνης ο Σφήττιος</div>    <div class="attributeIndividual"> <u>mentions</u>: Σωκράτης</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Τα εις εαυτόν</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: “Τα εις εαυτόν" του Μάρκου Αυρηλίου είναι μια συλλογή προσωπικών σημειώσεων γραμμένων κατά τη διάρκεια των στρατιωτικών του εκστρατειών γύρω στο 171-175 μ.Χ. Εξετάζει τις προσπάθειές του να ζήσει σύμφωνα με τις Στωικές αρχές, εστιάζοντας στην αυτοπειθαρχία, την αρετή και την εσωτερική γαλήνη. Το έργο εκτιμάται για τη πρακτική του σοφία και τις ειλικρινείς προσεγγίσεις του αυτοκράτορα για την προσωπική του ανάπτυξη.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/marcus-aurelius/</div>    <div class="textItalicSmallMargin"><b>2)</b> Curnow, T. (2006). The philosophers of the ancient world: An A to Z guide. Bristol Classical Press.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: To himself</div>    <div class="textMediumMarginBlue">- en: Meditations</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: to_himself</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Μάρκος Αυρήλιος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Τίμαιος (Πλάτων)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Στον Τίμαιο, ο Πλάτωνας περιγράφει τη δημιουργία του κόσμου ως θεία πράξη από έναν λογικό Δημιουργό που επιβάλλει μαθηματική τάξη στο χάος, παρουσιάζοντας μια τελολογική άποψη όπου ο κόσμος είναι σχεδιασμένος για να μεγιστοποιεί το Αγαθόν και την ομορφιά, προσφέροντας ένα ηθικό πρότυπο για τις λογικές ψυχές να μιμηθούν.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Zeyl, Donald and Barbara Sattler, "Plato’s Timaeus", The Stanford Encyclopedia of Philosophy (Fall 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2023/entries/plato-timaeus/&gt;.<br></div>    <div class="textItalicSmallMargin"><b>2)</b> https://iep.utm.edu/timaeus/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Timaeus (Plato)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: timaeus_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <img src="https://upload.wikimedia.org/wikipedia/commons/a/ab/Plato_Timaeus.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Τίμαιος ο Λοκρός, Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/a/ab/Plato_Timaeus.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/a/ab/Plato_Timaeus.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato-philosopher_timaeus/1929/pb_LCL234.3.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato-philosopher_timaeus/1929/pb_LCL234.3.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1572/1572-h/1572-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1572/1572-h/1572-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Timaeus-dialogue-by-Plato" target="_blank" rel="noopener">https://www.britannica.com/topic/Timaeus-dialogue-by-Plato</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/timaeus.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/timaeus.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/timaeus/" target="_blank" rel="noopener">https://iep.utm.edu/timaeus/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Timaeus_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Timaeus_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/ENTRIES/plato-timaeus/" target="_blank" rel="noopener">https://plato.stanford.edu/ENTRIES/plato-timaeus/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg031" target="_blank" rel="noopener">http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg031</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Τοπικά</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ένα από τα έργα που αποτελούν τη συλλογή "Όργανον".</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Shields, Christopher, "Aristotle", The Stanford Encyclopedia of Philosophy (Winter 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/win2023/entries/aristotle/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Topics</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: topics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αριστοτέλης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Topics_(Aristotle)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Topics_(Aristotle)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.physics.ntua.gr/mourmouras/greats/aristoteles/topika.html" target="_blank" rel="noopener">https://www.physics.ntua.gr/mourmouras/greats/aristoteles/topika.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Aristotle/topics.1.i.html" target="_blank" rel="noopener">https://classics.mit.edu/Aristotle/topics.1.i.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Topics" target="_blank" rel="noopener">https://www.britannica.com/topic/Topics</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/aristotle-topics" target="_blank" rel="noopener">https://philpapers.org/browse/aristotle-topics</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/aristotle/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/aristotle/</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Φαίδρος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Φαίδρος του Πλάτωνα είναι διάλογος μεταξύ του Σωκράτη και του Φαίδρου που εξετάζει την τέχνη της ρητορικής, τη φύση του έρωτα, τη μετενσάρκωση και την ψυχή.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://www.gutenberg.org/files/1636/1636-h/1636-h.htm</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Phaedrus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: phaedrus_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Γοργίας ο Λεοντίνος, Ιππίας ο Ηλείος, Πρωταγόρας ο Αβδηρίτης, Πρόδικος ο Κείος, Σιμίας ο Θηβαίος, Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Phaedrus_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Phaedrus_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1636/1636-h/1636-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1636/1636-h/1636-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/phaedrus.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/phaedrus.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://users.uoa.gr/~nektar/history/tributes/plato/dial/PlatoPhaedrus.htm" target="_blank" rel="noopener">http://users.uoa.gr/~nektar/history/tributes/plato/dial/PlatoPhaedrus.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+phaedrus+227a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+phaedrus+227a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0173%3Atext%3DPhaedrus" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0173%3Atext%3DPhaedrus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg012" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg012</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Φαίδων</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Φαίδων του Πλάτωνα περιγράφει τις τελευταίες στιγμές του Σωκράτη πριν την εκτέλεσή του, παρουσιάζοντας επιχειρήματα για την αθανασία της ψυχής, συζητήσεις για τη θεωρία των Ιδεών και τις μεταφυσικές και γνωσιολογικές απόψεις του Πλάτωνα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/phaedo/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Phaedo</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: phaedo_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Κρίτων από τον δήμο Αλωπεκίδος, Κτέσιππος από την Παιανία, Εχεκράτης ο Φλειάσιος, Ευκλείδης ο Μεγαρεύς, Μενέξενος, Φαίδων o Hλείος, Απολλόδωρος ο Φαληρεύς, Κέβης ο Θηβαίος, Ερμογένης από τον δήμο Αλωπεκής, Σιμίας ο Θηβαίος, Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Phaedo" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Phaedo</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/phaedo/" target="_blank" rel="noopener">https://iep.utm.edu/phaedo/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/phaedo.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/phaedo.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0169%3Atext%3DPhaedo" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0169%3Atext%3DPhaedo</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1658/1658-h/1658-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1658/1658-h/1658-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://chs.harvard.edu/primary-source/plato-phaedo-sb/" target="_blank" rel="noopener">https://chs.harvard.edu/primary-source/plato-phaedo-sb/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-phaedo" target="_blank" rel="noopener">https://philpapers.org/browse/plato-phaedo</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-phaedo/1914/pb_LCL036.199.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-phaedo/1914/pb_LCL036.199.xml</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Φίληβος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ένας σωκρατικός διάλογος, στον οποίο συζητείται η ηθική αξιολόγηση της ηδονής.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://librivox.org/philebus-by-plato/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Philebus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: philebus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Plato - The beginning of Philebus in the oldest surviving medieval manuscript Codex Oxoniensis Clarkianus 39, facsimile by Sijthoff with foreword by Allen., Public Domain, https://commons.wikimedia.org/w/index.php?curid=26910469</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Philebos_beginning._Clarke_Plato.jpg/800px-Philebos_beginning._Clarke_Plato.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Philebos_beginning._Clarke_Plato.jpg/800px-Philebos_beginning._Clarke_Plato.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Philebos_beginning._Clarke_Plato.jpg/800px-Philebos_beginning._Clarke_Plato.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/philebus.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/philebus.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0173%3Atext%3DPhileb." target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0173%3Atext%3DPhileb.</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1744/1744-h/1744-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1744/1744-h/1744-h.htm</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Φιλοσόφων διαδοχαί</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Το βιβλίο "Διαδοχές φιλοσόφων" του Αλέξανδρου Πολυίστορος κατέγραφε την καταγωγή, τις διδασκαλίες και τις συνεισφορές διαφόρων φιλοσόφων. Αναφερόμενο από τον Διογένη Λαέρτιο, το έργο αυτό, αν και χαμένο, είναι μερικώς γνωστό μέσω μεταγενέστερων παραθεμάτων, διατηρώντας τη φιλοσοφική κληρονομιά των αρχαίων λογίων.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Successions of Philosophers</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: philosophers_successions</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Λούκιος Κορνήλιος Αλέξανδρος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/alexander-polyhistor/" target="_blank" rel="noopener">https://iep.utm.edu/alexander-polyhistor/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Doxography#Successions_of_Philosophers" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Doxography#Successions_of_Philosophers</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Φυσικά (Αριστοτέλη)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Τα Φυσικά του Αριστοτέλη εξετάζουν τις αρχές που διέπουν την αλλαγή και την κίνηση στη φύση, προτείνοντας ένα πλαίσιο τεσσάρων τύπων αιτιών - υλικών, τυπικών, αποτελεσματικών και τελικών - για να εξηγήσουν πώς και γιατί τα πράγματα δημιουργούνται, αλλάζουν και παύουν να υπάρχουν.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Bodnar, Istvan, "Aristotle’s Natural Philosophy", The Stanford Encyclopedia of Philosophy (Summer 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/sum2023/entries/aristotle-natphil/&gt;.<br></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Physics (Aristotle)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: physics_aristotle</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αριστοτέλης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/biography/Aristotle/Physics-and-metaphysics" target="_blank" rel="noopener">https://www.britannica.com/biography/Aristotle/Physics-and-metaphysics</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Aristotle/physics.html" target="_blank" rel="noopener">https://classics.mit.edu/Aristotle/physics.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Aristotelian_physics" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Aristotelian_physics</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://people.bu.edu/wwildman/WeirdWildWeb/courses/wphil/readings/wphil_rdg07_physics_entire.htm" target="_blank" rel="noopener">https://people.bu.edu/wwildman/WeirdWildWeb/courses/wphil/readings/wphil_rdg07_physics_entire.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/aristotle-natphil/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/aristotle-natphil/</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Χαρμίδης- φιλοσοφικό έργο</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ελληνικό φιλοσοφικό έργο του Πλάτωνα. Ο "Χαρμίδης" είναι η πρώτη και πιο ριζοσπαστική έρευνα της αυτογνωσίας (σωφροσύνη, που μεταφράζεται ποικιλοτρόπως ως "μετριοπάθεια", "εγκράτεια", "υγιής σκέψη", "αυτοέλεγχος").</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://philpapers.org/browse/plato-charmides</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Charmides - philosophical work</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: charmides_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Plato -Charmides Codex Oxoniensis Clarkianus 39, facsimile by Sijthoff with foreword by Allen., Public Domain, https://commons.wikimedia.org/w/index.php?curid=26910417</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/0/01/Charmides_beginning._Clarke_Plato.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Χαρμίδης ο Αθηναίος, Κριτίας (φιλόσοφος), Χαιρεφών, Πρόδικος ο Κείος, Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/0/01/Charmides_beginning._Clarke_Plato.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/0/01/Charmides_beginning._Clarke_Plato.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-charmides" target="_blank" rel="noopener">https://philpapers.org/browse/plato-charmides</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Charmides-by-Plato" target="_blank" rel="noopener">https://www.britannica.com/topic/Charmides-by-Plato</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+charm.+153a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+charm.+153a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1580/1580-h/1580-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1580/1580-h/1580-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg018" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg018</a></div></div></div></div>'],
];
function show_selected() {
    var selector = document.getElementById('idTerm');
    var champ = dictionnaire[selector[selector.selectedIndex].value][0];
    document.getElementById('display').innerHTML = champ;
}
document.getElementById('idTerm').addEventListener('change', show_selected);

searchBox = document.querySelector("#searchBox");
entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});

</script>
