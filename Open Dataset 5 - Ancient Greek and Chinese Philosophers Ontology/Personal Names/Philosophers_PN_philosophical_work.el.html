    ['<div class="terminologyEntry">    <div class="term">Ιων</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Στον Ίωνα, ο Σωκράτης συζητά μαζί του (ραψωδός), αν η ικανότητά του  στην ερμηνεία προέρχεται από την τεχνική του ή από θεία έμπνευση. Ο διάλογος αυτός είναι από τους πιο σύντομους του Πλάτωνα και εξετάζει τη φύση της καλλιτεχνικής ικανότητας και γνώσης.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://www.gutenberg.org/files/1635/1635-h/1635-h.htm</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Ion</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: ion</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Ion-by-Plato" target="_blank" rel="noopener">https://www.britannica.com/topic/Ion-by-Plato</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-ion/1925/pb_LCL164.407.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-ion/1925/pb_LCL164.407.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.supersummary.com/ion-plato/summary/" target="_blank" rel="noopener">https://www.supersummary.com/ion-plato/summary/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+ion+530a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+ion+530a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1635/1635-h/1635-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1635/1635-h/1635-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/ion.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/ion.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg027" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg027</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Κατηγορίες</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Οι "Κατηγορίες" του Αριστοτέλη ταξινομούν τους διάφορους τύπους του όντος και της πρόβλεψης, αποτελώντας ένα θεμελιώδες πλαίσιο για τη φιλοσοφία του και επηρεάζοντας σημαντικούς φιλοσόφους όπως ο Ακινάτης και ο Καντ. Προκαλεί σημαντικές συζητήσεις, αλλά παραμένει ουσιώδης για την κατανόηση της ύπαρξης και της ταξινόμησης στη φιλοσοφία.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Studtmann, Paul, "Aristotle’s Categories", The Stanford Encyclopedia of Philosophy (Spring 2024 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/spr2024/entries/aristotle-categories/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Categories</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: categories</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αριστοτέλης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://aristotelistes.cti.gr/admin/bookSelection#:~:text=%E1%BC%A8%CE%B8%CE%B9%CE%BA%E1%BD%B0%20%CE%9D%CE%B9%CE%BA%CE%BF%CE%BC%CE%AC%CF%87%CE%B5%CE%B9%CE%B1-,%CE%9A%CE%B1%CF%84%CE%B7%CE%B3%CE%BF%CF%81%CE%AF%CE%B1%CE%B9,-%CE%9A%CE%B5%CF%86.%201%2D3" target="_blank" rel="noopener">https://aristotelistes.cti.gr/admin/bookSelection#:~:text=%E1%BC%A8%CE%B8%CE%B9%CE%BA%E1%BD%B0%20%CE%9D%CE%B9%CE%BA%CE%BF%CE%BC%CE%AC%CF%87%CE%B5%CE%B9%CE%B1-,%CE%9A%CE%B1%CF%84%CE%B7%CE%B3%CE%BF%CF%81%CE%AF%CE%B1%CE%B9,-%CE%9A%CE%B5%CF%86.%201%2D3</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0086.tlg006" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0086.tlg006</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Κλειτοφών</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Σύντομος διάλογος που αποδίδεται στον Πλάτωνα αλλά ίσως να μην είναι δικό του έργο. Αυτός παρουσιάζει τον Κλειτόφωνα να επικρίνει τον Σωκράτη για το ότι προτρέπει τη δικαιοσύνη χωρίς να καταφέρνει να καταστήσει τους άλλους δίκαιους.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://archive.org/details/clitopho</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Clitophon</div>    <div class="textMediumMarginBlue">- en: Cleitophon</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: clitophon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Θρασύμαχος ο Χαλκηδόνιος, Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://la.wikisource.org/wiki/Clitopho" target="_blank" rel="noopener">https://la.wikisource.org/wiki/Clitopho</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Clitophon_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Clitophon_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://monadnock.net/plato/clitophon.html" target="_blank" rel="noopener">https://monadnock.net/plato/clitophon.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+cleit.+406a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+cleit.+406a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-clitophon" target="_blank" rel="noopener">https://philpapers.org/browse/plato-clitophon</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0179%3Atext%3DCleit." target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0179%3Atext%3DCleit.</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg029" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg029</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Κρατύλος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Διάλογος του Πλάτωνα που επικεντρώνεται αποκλειστικά στη γλώσσα και τη σχέση της με την πραγματικότητα, εξετάζει αν η ορθότητα των ονομάτων βασίζεται στη σύμβαση ή σε φυσικό πρότυπο, με τον Σωκράτη να μεσολαβεί ανάμεσα στις απόψεις του Ερμογένη και του Κρατύλου.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Meißner, David, "Plato’s Cratylus", The Stanford Encyclopedia of Philosophy (Summer 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/sum2023/entries/plato-cratylus/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Cratylus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: cratylus_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>mentions</u>: Κρατύλος (φιλόσοφος), Ερμογένης από τον δήμο Αλωπεκής, Καλλίας ο Αλωπεκεύς, Ευθύδημος ο Χίος, Πρόδικος ο Κείος, Πρωταγόρας ο Αβδηρίτης, Σωκράτης</div>    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg005" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg005</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Cratylus-by-Plato" target="_blank" rel="noopener">https://www.britannica.com/topic/Cratylus-by-Plato</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-cratylus" target="_blank" rel="noopener">https://philpapers.org/browse/plato-cratylus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-cratylus/1926/pb_LCL167.5.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-cratylus/1926/pb_LCL167.5.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/cratylus.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/cratylus.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1616/1616-h/1616-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1616/1616-h/1616-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+crat.+383a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+crat.+383a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Cratylus_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Cratylus_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/plato-cratylus/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/plato-cratylus/</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Κριτίας</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο «Κριτίας» είναι ένας ατελής διάλογος του Πλάτωνα, που ακολουθεί τον «Τίμαιο», όπου ο Κριτίας συνεχίζει την αφήγηση για την αντιπαράθεση μεταξύ Αθήνας και Ατλαντίδας, αλλά το κείμενο διακόπτεται.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://philpapers.org/browse/plato-critias</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Critias</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: critias_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Τίμαιος ο Λοκρός</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg032" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg032</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-critias" target="_blank" rel="noopener">https://philpapers.org/browse/plato-critias</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+criti.+106a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+criti.+106a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Critias-by-Plato" target="_blank" rel="noopener">https://www.britannica.com/topic/Critias-by-Plato</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato-philosopher_critias/1929/pb_LCL234.259.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato-philosopher_critias/1929/pb_LCL234.259.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/critias.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/critias.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1571/1571-h/1571-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1571/1571-h/1571-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Critias_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Critias_(dialogue)</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Κρίτων</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Διάλογος που απεικονίζει μια συζήτηση μεταξύ του Σωκράτη και του πλούσιου φίλου του Κρίτωνα και αφορά τη δικαιοσύνη, την αδικία και την κατάλληλη αντίδραση στην αδικία (μετά τη φυλάκιση του Σωκράτη).</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/plato/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Crito</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: crito_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By medieval author - Beginning of Crito in the Codex Oxoniensis Clarkianus 39 of the Bodleian library (dating from around 895). manuscript, Public Domain, https://commons.wikimedia.org/w/index.php?curid=28037771</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Kriton_beginning._Clarke_Plato.jpg/800px-Kriton_beginning._Clarke_Plato.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Κρίτων από τον δήμο Αλωπεκίδος, Σιμίας ο Θηβαίος, Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Kriton_beginning._Clarke_Plato.jpg/800px-Kriton_beginning._Clarke_Plato.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Kriton_beginning._Clarke_Plato.jpg/800px-Kriton_beginning._Clarke_Plato.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://bacchicstage.wordpress.com/plato/platos-crito-3/" target="_blank" rel="noopener">https://bacchicstage.wordpress.com/plato/platos-crito-3/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg003" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg003</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.oxfordbibliographies.com/display/document/obo-9780195389661/obo-9780195389661-0368.xml" target="_blank" rel="noopener">https://www.oxfordbibliographies.com/display/document/obo-9780195389661/obo-9780195389661-0368.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Crito" target="_blank" rel="noopener">https://www.britannica.com/topic/Crito</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://academic.oup.com/aristotelian/article/123/1/26/7097506" target="_blank" rel="noopener">https://academic.oup.com/aristotelian/article/123/1/26/7097506</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-crito/1914/pb_LCL036.151.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-crito/1914/pb_LCL036.151.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+crito+43a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+crito+43a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/crito.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/crito.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Crito" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Crito</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Κύριαι Δόξαι</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Αυτή η συλλογή συνοπτικών δηλώσεων συνοψίζει τις βασικές φιλοσοφικές διδασκαλίες του Επίκουρου, προσφέροντας καθοδήγηση για την επίτευξη μιας ζωής ευτυχίας μέσω της κατανόησης της φύσης, της διαχείρισης των επιθυμιών και της καλλιέργειας των αρετών.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Konstan, David, "Epicurus", The Stanford Encyclopedia of Philosophy (Fall 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2022/entries/epicurus/&gt;.</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: principal_doctrines</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Επίκουρος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Λάχης</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Σωκρατικός διάλογος, του οποίου οι συμμετέχοντες συζητούν τους ορισμούς της έννοιας του θάρρους ή της «ανδρείας», της ἀνδρείας στα Αρχαία Ελληνικά.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://www.gutenberg.org/files/1584/1584-h/1584-h.htm</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Laches</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: laches</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Δάμων ο Αθηναίος, Πρωταγόρας ο Αβδηρίτης, Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Laches_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Laches_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1584/1584-h/1584-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1584/1584-h/1584-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/laches.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/laches.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+lach.+178a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+lach.+178a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-laches/1924/pb_LCL165.3.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-laches/1924/pb_LCL165.3.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-laches" target="_blank" rel="noopener">https://philpapers.org/browse/plato-laches</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Laches-by-Plato" target="_blank" rel="noopener">https://www.britannica.com/topic/Laches-by-Plato</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg019" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg019</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Λύσις</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Στη "Λύσιδα", ο Σωκράτης συζητά με τους δύο συνομιλητές του για τη φύση της φιλίας, χρησιμοποιώντας τη μέθοδο των διερευνητικών ερωτήσεων για να διερευνήσει τι κάνει κάποιον αληθινό φίλο, αλλά ο διάλογος τελειώνει χωρίς σαφή απάντηση.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Reeve, C. D. C., "Plato on Friendship and Eros", The Stanford Encyclopedia of Philosophy (Summer 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/sum2023/entries/plato-friendship/&gt;</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Lysis</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: lysis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Κτέσιππος από την Παιανία, Ιπποθαλής ο Αθηναίος, Μενέξενος, Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Lysis_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Lysis_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1579/1579-h/1579-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1579/1579-h/1579-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/lysis.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/lysis.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+lysis+203a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+lysis+203a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/plato-friendship/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/plato-friendship/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg020" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg020</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Μενέξενος (Πλάτωνος)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Μενέξενος είναι διάλογος του Πλάτωνα που περιλαμβάνει μια επικήδεια ομιλία που υποτίθεται ότι έμαθε ο Σωκράτης από την Ασπασία, αναφερόμενος στην επικήδεια ομιλία του Περικλή, όπως περιγράφεται από τον Θουκυδίδη.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://www.gutenberg.org/files/1682/1682-h/1682-h.htm</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Menexenus (Plato)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: menexenus_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Μενέξενος, Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.routledge.com/Politics-and-Philosophy-in-Platos-Menexenus/Pappas-Zelcer/p/book/9780367256135" target="_blank" rel="noopener">https://www.routledge.com/Politics-and-Philosophy-in-Platos-Menexenus/Pappas-Zelcer/p/book/9780367256135</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-menexenus" target="_blank" rel="noopener">https://philpapers.org/browse/plato-menexenus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato-philosopher_menexenus/1929/pb_LCL234.331.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato-philosopher_menexenus/1929/pb_LCL234.331.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Plat.%20Menex.%20235&amp;lang=original" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Plat.%20Menex.%20235&amp;lang=original</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://users.uoa.gr/~nektar/history/tributes/plato/dial/Menexenus.htm" target="_blank" rel="noopener">http://users.uoa.gr/~nektar/history/tributes/plato/dial/Menexenus.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1682/1682-h/1682-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1682/1682-h/1682-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Menexenus_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Menexenus_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg028" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg028</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Μένων</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Μένων του Πλάτωνα εξετάζει αν η αρετή μπορεί να διδαχθεί μέσω ενός διαλόγου που διερευνά τα θέματα της γνώσης, της άγνοιας και της φύσης της αρετής, καταλήγοντας στο αν η αρετή είναι είδος γνώσης ή θεϊκό δώρο.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/meno-2/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Meno</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: meno</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Γοργίας ο Λεοντίνος, Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Meno" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Meno</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/meno.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/meno.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+meno+70a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+meno+70a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1643/1643-h/1643-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1643/1643-h/1643-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-meno/1924/pb_LCL165.265.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-meno/1924/pb_LCL165.265.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-meno" target="_blank" rel="noopener">https://philpapers.org/browse/plato-meno</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg024" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg024</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Μετά τα Φυσικά</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Μεταφυσικά, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Τα "Μετά τα Φυσικά" του Αριστοτέλη είναι ένα θεμελιώδες έργο που διερευνά τη φύση του όντος, της ύπαρξης και της πραγματικότητας. Η πραγματεία, η οποία χωρίζεται σε βιβλία που ονομάζονται με ελληνικά γράμματα, εμβαθύνει σε θέματα όπως η έννοια της ουσίας, η φύση της αλλαγής και οι αρχές της αιτιότητας. Διερευνά τι σημαίνει να υπάρχει κάτι και τις υποκείμενες δομές της πραγματικότητας, θέτοντας τις βάσεις για μεγάλο μέρος της δυτικής μεταφυσικής σκέψης.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Cohen, S. Marc and C. D. C. Reeve, "Aristotle’s Metaphysics", The Stanford Encyclopedia of Philosophy (Winter 2021 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/win2021/entries/aristotle-metaphysics/&gt;.<br></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Metaphysics</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: metaphysics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αριστοτέλης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/aristotle-metaphysics/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/aristotle-metaphysics/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://aristotelistes.cti.gr/admin/bookSelection#:~:text=%CE%9A%CE%B1%CF%84%CE%B7%CE%B3%CE%BF%CF%81%CE%AF%CE%B1%CE%B9-,%CE%9C%CE%B5%CF%84%E1%BD%B0%20%CF%84%E1%BD%B0%20%CF%86%CF%85%CF%83%CE%B9%CE%BA%CE%AC,-%CE%9C%CE%B5%CF%84%CE%B5%CF%89%CF%81%CE%BF%CE%BB%CE%BF%CE%B3%CE%B9%CE%BA%CE%AC" target="_blank" rel="noopener">https://aristotelistes.cti.gr/admin/bookSelection#:~:text=%CE%9A%CE%B1%CF%84%CE%B7%CE%B3%CE%BF%CF%81%CE%AF%CE%B1%CE%B9-,%CE%9C%CE%B5%CF%84%E1%BD%B0%20%CF%84%E1%BD%B0%20%CF%86%CF%85%CF%83%CE%B9%CE%BA%CE%AC,-%CE%9C%CE%B5%CF%84%CE%B5%CF%89%CF%81%CE%BF%CE%BB%CE%BF%CE%B3%CE%B9%CE%BA%CE%AC</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Μεταφυσικά</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Μετά τα Φυσικά, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Metaphysics</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: metaphysics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αριστοτέλης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/aristotle-metaphysics/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/aristotle-metaphysics/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://aristotelistes.cti.gr/admin/bookSelection#:~:text=%CE%9A%CE%B1%CF%84%CE%B7%CE%B3%CE%BF%CF%81%CE%AF%CE%B1%CE%B9-,%CE%9C%CE%B5%CF%84%E1%BD%B0%20%CF%84%E1%BD%B0%20%CF%86%CF%85%CF%83%CE%B9%CE%BA%CE%AC,-%CE%9C%CE%B5%CF%84%CE%B5%CF%89%CF%81%CE%BF%CE%BB%CE%BF%CE%B3%CE%B9%CE%BA%CE%AC" target="_blank" rel="noopener">https://aristotelistes.cti.gr/admin/bookSelection#:~:text=%CE%9A%CE%B1%CF%84%CE%B7%CE%B3%CE%BF%CF%81%CE%AF%CE%B1%CE%B9-,%CE%9C%CE%B5%CF%84%E1%BD%B0%20%CF%84%E1%BD%B0%20%CF%86%CF%85%CF%83%CE%B9%CE%BA%CE%AC,-%CE%9C%CE%B5%CF%84%CE%B5%CF%89%CF%81%CE%BF%CE%BB%CE%BF%CE%B3%CE%B9%CE%BA%CE%AC</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Μετεωρολογικά</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Τα Μετεωρολογικά του Αριστοτέλη (γύρω στο 340 π.Χ.) διερευνούν τα φαινόμενα του αέρα, του νερού και της γης, συμπεριλαμβανομένης της εξάτμισης και των σεισμών. Εισάγουν στη θεωρία του σφαιρικού σύμπαντος και τη θεωρία των τεσσάρων στοιχείων, περιγράφοντας πώς αλληλεπιδρούν το νερό, η γη, η φωτιά και ο αέρας. Το έργο συνδυάζει ελληνικές, αιγυπτιακές και βαβυλωνιακές ιδέες, χρησιμοποιώντας παρατηρήσεις και επαγωγικούς συλλογισμούς.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://www.wikiwand.com/en/Meteorology_(Aristotle)</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Meteorology</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: meteorology</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αριστοτέλης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://isidore.co/aquinas/english/Meteora.htm" target="_blank" rel="noopener">https://isidore.co/aquinas/english/Meteora.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Aristotle/meteorology.mb.txt" target="_blank" rel="noopener">https://classics.mit.edu/Aristotle/meteorology.mb.txt</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/workstranslatedi03arisuoft/workstranslatedi03arisuoft/" target="_blank" rel="noopener">https://archive.org/details/workstranslatedi03arisuoft/workstranslatedi03arisuoft/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://web.archive.org/web/20040405074445/http://etext.library.adelaide.edu.au/a/a8met/" target="_blank" rel="noopener">https://web.archive.org/web/20040405074445/http://etext.library.adelaide.edu.au/a/a8met/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikiwand.com/en/Meteorology_(Aristotle)" target="_blank" rel="noopener">https://www.wikiwand.com/en/Meteorology_(Aristotle)</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Μίνως</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο διάλογος «Μίνωας» αποδίδεται στον Πλάτωνα και παρουσιάζει τον Σωκράτη και έναν συνομιλητή του να αναζητούν τον ορισμό του «νόμου».</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Minos</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: minos</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Plato - Henri Omont, Page of the Codex Parisinus graecus 1807. Dialogue Minos. Oeuvres philosophiques de Platon: Facsimilé en phototypie, à la grandeur exacte de l’original du Ms. grec 1807 de la Bibliothèque Nationale. Paris 1908., Public Domain, https://commons.wikimedia.org/w/index.php?curid=28341701</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Minos_beginning._Codex_Parisinus_graecus_1807.jpg/800px-Minos_beginning._Codex_Parisinus_graecus_1807.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Minos_beginning._Codex_Parisinus_graecus_1807.jpg/800px-Minos_beginning._Codex_Parisinus_graecus_1807.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Minos_beginning._Codex_Parisinus_graecus_1807.jpg/800px-Minos_beginning._Codex_Parisinus_graecus_1807.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Minos_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Minos_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+minos+313a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+minos+313a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-minos/1927/pb_LCL201.387.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-minos/1927/pb_LCL201.387.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://monadnock.net/plato/minos.html" target="_blank" rel="noopener">https://monadnock.net/plato/minos.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.platonicfoundation.org/translation/minos/" target="_blank" rel="noopener">https://www.platonicfoundation.org/translation/minos/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0179%3Atext%3DMinos%3Asection%3D320e" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0179%3Atext%3DMinos%3Asection%3D320e</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/plato-the-minos" target="_blank" rel="noopener">https://archive.org/details/plato-the-minos</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg033" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg033</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Νόμοι</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Στους Νόμους, ο Πλάτωνας συζητά την πολιτική φιλοσοφία του μέσω ενός διαλόγου τριών ανδρών που σχεδιάζουν ένα σύνταγμα για τη Μαγνησία (μία Πολιτεία στην Κρήτη). Το έργο συνδυάζει δημοκρατικά και αυταρχικά στοιχεία, εστιάζοντας σε πρακτικά νομικά ζητήματα και τονίζοντας τη σημασία της ισορροπίας μεταξύ πειθούς και αναγκαστικότητας στο νόμο.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/pla-laws/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Laws</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: laws</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Ίκκος ο Ταραντίνος, Μέγιλλος, Πρωταγόρας ο Αβδηρίτης, Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Laws_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Laws_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1750/1750-h/1750-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1750/1750-h/1750-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/LCL192/1926/volume.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/LCL192/1926/volume.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0166" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0166</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Laws" target="_blank" rel="noopener">https://www.britannica.com/topic/Laws</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/laws.1.i.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/laws.1.i.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg034" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg034</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ονειροκριτικά</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Τα Ονειροκριτικά του Αρτεμίδωρου παρέχουν μια σημαντική ματιά στην αρχαία ερμηνεία των ονείρων, συνδυάζοντας δεισιδαιμονίες και φιλοσοφία, και παραμένουν βασική πηγή για τις ιστορικές πεποιθήσεις και πρακτικές.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Britannica, The Editors of Encyclopaedia. "Artemidorus". Encyclopedia Britannica, 13 Feb. 2024, https://www.britannica.com/biography/Artemidorus-Ephesian-soothsayer. Accessed 1 August 2024.</div>    <div class="textItalicSmallMargin"><b>2)</b> Curnow, T. (2006). The philosophers of the ancient world: An A to Z guide. Bristol Classical Press.<br></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Oneirocritica</div>    <div class="textMediumMarginBlue">- en: The Interpretation of Dreams</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: oneirocritica</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αρτεμίδωρος Εφέσιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.dream-dictionary.com/oneirocritica-artemidorus-daldianus/" target="_blank" rel="noopener">https://www.dream-dictionary.com/oneirocritica-artemidorus-daldianus/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Oneirocritica" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Oneirocritica</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Παιδαγωγός (Κλήμης ο Αλεξανδρεύς)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ένα από τα σημαντικότερα σωζόμενα έργα του Κλήμη που ανήκει σε τριλογία.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Fredericksen, Linwood. "St. Clement of Alexandria". Encyclopedia Britannica, 22 Feb. 2024, https://www.britannica.com/biography/Clement-of-Alexandria. Accessed 7 August 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Paedagogus (Clement of Alexandria)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: paedagogus_clement</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Κλήμης ο Αλεξανδρεύς</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Παρμενίδης- φιλοσοφικό έργο</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Παρμενίδης του Πλάτωνα περιγράφει μια περίπλοκη συζήτηση, κατά την οποία ο Παρμενίδης αμφισβητεί τη θεωρία των ιδεών του νεαρού Σωκράτη και συμμετέχει σε σύνθετους συλλογισμούς για να εξετάσει και να υπερασπιστεί αυτή τη θεωρία, επηρεάζοντας τη μετέπειτα νεοπλατωνική σκέψη.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Rickless, Samuel, "Plato’s Parmenides", The Stanford Encyclopedia of Philosophy (Spring 2020 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/spr2020/entries/plato-parmenides/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Parmenides - philosophical work</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: parmenides_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Αδείμαντος του Κολλυτού, Πλάτων, Παρμενίδης ο Ελεάτης, Ζήνων ο Ελεάτης, Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Parmenides-by-Plato" target="_blank" rel="noopener">https://www.britannica.com/topic/Parmenides-by-Plato</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-parmenides" target="_blank" rel="noopener">https://philpapers.org/browse/plato-parmenides</a></div>    <div class= "exter     ['<div class="terminologyEntry">    <div class="term">Περί Ερμηνείας</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Το δεύτερο έργο της συλλογής "Organon", συνήθως γνωστό με τον λατινικό του τίτλο, δηλαδή "De Interpretatione".</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://www.britannica.com/topic/On-Interpretation</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: On Interpretation</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_interpretation</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αριστοτέλης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Aristotle/interpretation.html" target="_blank" rel="noopener">https://classics.mit.edu/Aristotle/interpretation.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/aristotle/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/aristotle/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/rec/ARIOI" target="_blank" rel="noopener">https://philpapers.org/rec/ARIOI</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/On-Interpretation" target="_blank" rel="noopener">https://www.britannica.com/topic/On-Interpretation</a></div></div></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">Περί Ουρανού</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Το έργο αυτό διερευνά τη δομή και την κίνηση του σύμπαντος, προτείνοντας ότι τα ουράνια σώματα κινούνται σε τέλειους κύκλους και αποτελούνται από ένα πέμπτο στοιχείο που διαφέρει από τα τέσσερα γήινα στοιχεία. Περιγράφει τη Γη ως μια ακίνητη σφαίρα στο κέντρο του σύμπαντος, με μια σειρά ομόκεντρων σφαιρών που φέρουν τα αστέρια και άλλα ουράνια σώματα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://www.greek-language.gr/digitalResources/ancient_greek/anthology/literature/browse.html?text_id=335</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: On the Heavens</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_the_heavens</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αριστοτέλης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://el.wikisource.org/wiki/%CE%A0%CE%B5%CF%81%CE%AF_%CE%9F%CF%85%CF%81%CE%B1%CE%BD%CE%BF%CF%8D" target="_blank" rel="noopener">https://el.wikisource.org/wiki/%CE%A0%CE%B5%CF%81%CE%AF_%CE%9F%CF%85%CF%81%CE%B1%CE%BD%CE%BF%CF%8D</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.physics.ntua.gr/mourmouras/greats/aristoteles/peri_Ouranou.html" target="_blank" rel="noopener">https://www.physics.ntua.gr/mourmouras/greats/aristoteles/peri_Ouranou.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https:/     ['<div class="terminologyEntry">    <div class="term">Περί της καθ&apos; ύπνον μαντικής</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Μία από τις 7 πραγματείες που συνθέτουν τη συλλογή "Parva Naturalia", η οποία πραγματεύεται τα προγνωστικά όνειρα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://en.wikipedia.org/wiki/On_Divination_in_Sleep</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: In Prophesying by Dreams</div>    <div class="textMediumMarginBlue">- en: On Divination in Sleep</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_divination_in_sleep</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.mikrosapoplous.gr/aristotle/mf/peri_mantikhs_a.htm" target="_blank" rel="noopener">https://www.mikrosapoplous.gr/aristotle/mf/peri_mantikhs_a.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.physics.ntua.gr/mourmouras/greats/aristoteles/peri_kath_ypnou_mantikhs.html" target="_blank" rel="noopener">https://www.physics.ntua.gr/mourmouras/greats/aristoteles/peri_kath_ypnou_mantikhs.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://intercapillaryspace.blogspot.com/2007/01/aristotles-styles-on-divination-in.html" target="_blank" rel="noopener">https://intercapillaryspace.blogspot.com/2007/01/aristotles-styles-on-divination-in.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Aristotle/prophesying.html" target="_blank" rel="noopener">https://classics.mit.edu/Aristotle/prophesying.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/On_Divination_in_Sleep" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/On_Divination_in_Sleep</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Περί του μη όντος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Περί φύσεως (Γοργίας), </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: On the Nonexistent</div>    <div class="textMediumMarginBlue">- en: On nature (Gorgias)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_nature_gorgias</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Γοργίας ο Λεοντίνος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Περί των Πυθαγορείων Συμβόλων</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ένα αποσπασματικά σωζόμενο φιλοσοφικό έργο του Ανδροκύδη σχετικά με τα σύμβολα του Πυθαγόρα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Curnow, T. (2006). The philosophers of the ancient world: An A to Z guide. Bristol Classical Press.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: On Pythagorean Symbols</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_pythagorean_symbols</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>mentions</u>: Πυθαγόρας ο Σάμιος</div>    <div class="attributeIndividual"> <u>authoredBy</u>: Ανδροκύδης (Πυθαγόρειος)</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Περί ύπνου και εγρηγόρσεως</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Μία από τις 7 πραγματείες που αποτελούν τη συλλογή "Parva Naturalia".</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://books.google.gr/books/about/On_Sleep_and_Sleeplessness.html?id=Sn8_ygEACAAJ&amp;redir_esc=y</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: On Sleep and Sleeplessness</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_sleep_and_sleeplessness</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αριστοτέλης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://aristotelistes.cti.gr/admin/Lexicon/396" target="_blank" rel="noopener">https://aristotelistes.cti.gr/admin/Lexicon/396</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.mikrosapoplous.gr/aristotle/mf/peri_ypnoy_a.htm" target="_blank" rel="noopener">https://www.mikrosapoplous.gr/aristotle/mf/peri_ypnoy_a.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/On_Sleep" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/On_Sleep</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Aristotle/sleep.html" target="_blank" rel="noopener">https://classics.mit.edu/Aristotle/sleep.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://books.google.gr/books/about/On_Sleep_and_Sleeplessness.html?id=Sn8_ygEACAAJ&amp;redir_esc=y" target="_blank" rel="noopener">https://books.google.gr/books/about/On_Sleep_and_Sleeplessness.html?id=Sn8_ygEACAAJ&amp;redir_esc=y</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Περί φύσεως (Αναξαγόρας)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Το φιλοσοφικό έργο του Αναξαγόρα, από το οποίο έχουν διασωθεί μόνο αποσπάσματα του πρώτου μέρους, κυρίως από το έργο του Σιμπλικίου της Κιλιακίας (6ος αι. μ.Χ.).</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Curd, Patricia, "Anaxagoras", The Stanford Encyclopedia of Philosophy (Winter 2019 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/win2019/entries/anaxagoras/&gt;.</div>    <div class="textItalicSmallMargin"><b>2)</b> Britannica, T. Editors of Encyclopaedia (2024, February 13). Anaxagoras. Encyclopedia Britannica. https://www.britannica.com/biography/Anaxagoras</div>    <div class="textItalicSmallMargin"><b>3)</b> Curnow, T. (2006). The philosophers of the ancient world: An A to Z guide. Bristol Classical Press.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: On nature (Anaxagoras)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_nature_anaxagoras</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αναξαγόρας ο Κλαζομενεύς</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/anaxagoras/#H1" target="_blank" rel="noopener">https://iep.utm.edu/anaxagoras/#H1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Anaxagoras" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Anaxagoras</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Anaxagoras#:~:text=%5Bedit%5D-,Fragments,-%5Bedit%5D" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Anaxagoras#:~:text=%5Bedit%5D-,Fragments,-%5Bedit%5D</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://el.wikisource.org/wiki/%CE%A0%CE%B5%CF%81%CE%AF_%CF%86%CF%8D%CF%83%CE%B5%CF%89%CF%82_(%CE%91%CE%BD%CE%B1%CE%BE%CE%B1%CE%B3%CF%8C%CF%81%CE%B1%CF%82)" target="_blank" rel="noopener">https://el.wikisource.org/wiki/%CE%A0%CE%B5%CF%81%CE%AF_%CF%86%CF%8D%CF%83%CE%B5%CF%89%CF%82_(%CE%91%CE%BD%CE%B1%CE%BE%CE%B1%CE%B3%CF%8C%CF%81%CE%B1%CF%82)</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Περί φύσεως (Αναξίμανδρος)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Αναξίμανδρος ήταν ο πρώτος, που έγραψε μια πραγματεία σε πεζό λόγο και η οποία ονομάστηκε από την παράδοση "Περί Φύσεως".</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/anaximander/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Οn nature (Anaximander)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_nature_anaximander</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αναξίμανδρος ο Μιλήσιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/anaximander/#:~:text=Life%20and%20Sources-,The,-history%20of%20written" target="_blank" rel="noopener">https://iep.utm.edu/anaximander/#:~:text=Life%20and%20Sources-,The,-history%20of%20written</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Περί φύσεως (Γοργίας)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Περί του μη όντος, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Το έργο Περί Φύσεως του Γοργία είναι ένα κείμενο που υποστηρίζει, με παράδοξο και μηδενιστικό τρόπο, ότι τίποτα δεν υπάρχει· αν κάτι υπάρχει, δεν μπορεί να γίνει γνωστό· και αν μπορεί να γίνει γνωστό, δεν μπορεί να μεταδοθεί. Αυτός είναι ο λόγος για τον οποίο το έργο τιτλοφορείται επίσης ως "Περί του μη όντος.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/gorgias/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: On the Nonexistent</div>    <div class="textMediumMarginBlue">- en: On nature (Gorgias)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_nature_gorgias</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Γοργίας ο Λεοντίνος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Περί Φύσεως (Διογένης)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: <br>Στο έργο του Περί Φύσεως, ο Διογένης από την Απολλωνία υποστηρίζει ότι ο αέρας είναι η θεμελιώδης ουσία του σύμπαντος, ενσωματώνοντας τόσο τη νοημοσύνη όσο και το θείο, και αποτελεί την πηγή της ζωής και των φυσικών φαινομένων. Το έργο του συνδυάζει προγενέστερες φιλοσοφίες με εμπειρικές παρατηρήσεις.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/diogenes-of-apollonia/</div>    <div class="textItalicSmallMargin"><b>2)</b> Britannica, The Editors of Encyclopaedia. "Diogenes Of Apollonia". Encyclopedia Britannica, 27 Feb. 2024, https://www.britannica.com/biography/Diogenes-of-Apollonia. Accessed 10 August 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: On nature (Diogenes)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_nature_diogenes</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Διογένης ο Απολλωνιάτης</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Περί φύσεως (Εμπεδοκλής)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: <br>Το έργο Περί Φύσεως του Εμπεδοκλή είναι ένα φιλοσοφικό ποίημα που περιγράφει το σύμπαν ως αποτελούμενο από τέσσερα αιώνια στοιχεία—αέρα, νερό, γη και φωτιά—τα οποία κυβερνώνται από τις δυνάμεις της Αγάπης και της Έριδας. Εξετάζει τη δημιουργία της ζωής και τη φύση της αντίληψης, προσφέροντας μια εικόνα του αιώνιου κύκλου του σύμπαντος.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Kingsley, K. Scarlett and Richard Parry, "Empedocles", The Stanford Encyclopedia of Philosophy (Summer 2020 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/sum2020/entries/empedocles/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: On nature (Empedocles)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_nature_empedocles</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By ancient Greek copyist - The Strasbourg Empedocles papyrus contained over 50 lines from Empedocles&apos; work On Nature that were not published until 1999. 2D copy of a scan of an ancient Greek papyrus, Public Domain, https://commons.wikimedia.org/w/index.php?curid=12657541</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/1/13/Empedokles_fragment_Physika_I_262%E2%80%93300.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Εμπεδοκλής ο Ακραγαντινός</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/1/13/Empedokles_fragment_Physika_I_262%E2%80%93300.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/1/13/Empedokles_fragment_Physika_I_262%E2%80%93300.jpg</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Περί φύσεως (Επίκουρος)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Στο εκτενές και αποσπασματικά σωζόμενο αυτό έργο, ο Επίκουρος εξετάζει τη φυσική του φιλοσοφία, συζητώντας τη φύση του φυσικού κόσμου, της ανθρώπινης ψυχής και τις αρχές που διέπουν την ύπαρξη, με στόχο να προσφέρει ένα πλαίσιο για την επίτευξη της ψυχικής ηρεμίας.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Konstan, David, "Epicurus", The Stanford Encyclopedia of Philosophy (Fall 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2022/entries/epicurus/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: On nature (Epicurus)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_nature_epicurus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Επίκουρος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.jstor.org/stable/4182694" target="_blank" rel="noopener">https://www.jstor.org/stable/4182694</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.epicurism.info/etexts/ier.html" target="_blank" rel="noopener">https://www.epicurism.info/etexts/ier.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Epicureanism#On_Nature" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Epicureanism#On_Nature</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Περί φύσεως (Ηράκλειτος)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Από το έργο του Ηράκλειτου έχουν σωθεί περίπου 100 αποσπάσματα από παραθέσεις μεταγενέστερων συγγραφέων.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Patrick, G. T. W. (1889). The Fragments of the Work of Heraclitus of Ephesus on Nature; Translated from the Greek Text of Bywater, with an Introduction Historical and Critical. N. Murray – via Google Books.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: On nature (Heraclitus)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_nature_heraclitus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Ηράκλειτος ο Εφέσιος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Περί φύσεως (Παρμενίδης)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Το ποίημα του Παρμενίδη, Περὶ φύσεως, χωρίζεται σε τρία μέρη: το Πρόλογο, την Αλήθεια και την Άποψη. Στην Αλήθεια, ο Παρμενίδης υποστηρίζει ότι το "είναι" δεν μπορεί να αλλάξει, ενώ στην Άποψη παρέχει μια αντιφατική κοσμολογική περιγραφή που αντικατοπτρίζει τις λανθασμένες ανθρώπινες πεποιθήσεις. Η πρόκληση είναι η συμφιλίωση αυτών των αντίθετων ιδεών, ένα πρόβλημα που έχει απασχολήσει τους μελετητές για αιώνες.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/parmenid/</div>    <div class="textItalicSmallMargin"><b>2)</b> Palmer, John, "Parmenides", The Stanford Encyclopedia of Philosophy (Winter 2020 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/win2020/entries/parmenides/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: On nature (Parmenides)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_nature_parmenides</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Παρμενίδης ο Ελεάτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://philoctetes.free.fr/parmenidesunicode.htm" target="_blank" rel="noopener">http://philoctetes.free.fr/parmenidesunicode.htm</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Περί φύσεως (Φιλόλαος)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Φιλόλαος ο Κροτωνιάτης (περ. 470–περ. 385 π.Χ.) ήταν Πυθαγόρειος φιλόσοφος που έγραψε το έργο «Περί φύσεως», εισάγοντας ιδέες για τη δομή του κόσμου βασισμένες σε αριθμητικές αρμονίες. Πρότεινε ότι η Γη περιφέρεται γύρω από μια κεντρική φωτιά αντί να βρίσκεται στο κέντρο του σύμπαντος, επηρεάζοντας μεταγενέστερους στοχαστές όπως ο Πλάτων και ο Αριστοτέλης.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Huffman, Carl, "Philolaus", The Stanford Encyclopedia of Philosophy (Summer 2024 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/sum2024/entries/philolaus/&gt;.</div>    <div class="textItalicSmallMargin"><b>2)</b> Britannica, The Editors of Encyclopaedia. "Philolaus". Encyclopedia Britannica, 2 Apr. 2024, https://www.britannica.com/biography/Philolaus. Accessed 16 August 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: On nature (Philolaus)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_nature_philolaus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Φιλόλαος ο Κροτωνιάτης</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Περί Ψυχής</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Πραγματεία του Αριστοτέλη, στην οποία συζητά τα είδη των ψυχών των διάφορων έμβιων όντων.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://www.britannica.com/topic/On-the-Soul-by-Aristotle</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: On the Soul</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: on_the_soul</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αριστοτέλης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://aristotelistes.cti.gr/admin/Lexicon/337" target="_blank" rel="noopener">https://aristotelistes.cti.gr/admin/Lexicon/337</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/On-the-Soul-by-Aristotle" target="_blank" rel="noopener">https://www.britannica.com/topic/On-the-Soul-by-Aristotle</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Aristotle/soul.html" target="_blank" rel="noopener">https://classics.mit.edu/Aristotle/soul.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://librivox.org/search?title=De+Anima&amp;author=ARISTOTLE&amp;reader=&amp;keywords=&amp;genre_id=0&amp;status=all&amp;project_type=either&amp;recorded_language=&amp;sort_order=catalog_date&amp;search_page=1&amp;search_form=advanced" target="_blank" rel="noopener">h
