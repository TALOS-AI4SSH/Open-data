ς, Κλεόφρων ο Κροτωνιάτης, Δαμοκλής ο Κροτωνιάτης, Βροντίνος ο Μεταποντίνος, Θεόδωρος ο Ταραντίνος, Λύκων ο Ταραντίνος, Πολέμαρχος ο Ταραντίνος, Καινίας ο Ταραντίνος, Κλέων ο Ταραντίνος, Ευρυμέδων ο Ταραντίνος, Κλειναγόρας ο Ταραντίνος, Ζώπυρος ο Ταραντίνος, Εύθυνος ο Ταραντίνος, Φιλωνίδης ο Ταραντίνος, Λύσις ο Ταραντίνος, Λυσίβιος ο Ταραντίνος, Πακτίων ο Ταραντίνος, Πεισικράτης ο Ταραντίνος, Κλεάρατος ο Ταραντίνος, Λεοντεύς ο Ταραντίνος, Φρύνιχος ο Ταραντίνος, Σιμιχίας ο Ταραντίνος, Πεισίρροδος ο Ταραντίνος, Έλανδρος ο Ταραντίνος, Δικάς ο Ταραντίνος, Καροφαντίδας ο Ταραντίνος, Τιμύχα η Λακεδαιμονία, Φίλτυς από τον Κρότωνα, Χειλωνίς, Κρατησίκλεια η Λάκαινα, Θεανώ</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0258%3Abook%3D8" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0258%3Abook%3D8</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/63300/63300-h/63300-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/63300/63300-h/63300-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/work.php?work_id=487" target="_blank" rel="noopener">https://topostext.org/work.php?work_id=487</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/ebooks/63300" target="_blank" rel="noopener">https://www.gutenberg.org/ebooks/63300</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Γοργίας (Πλάτωνα)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Γοργίας του Πλάτωνα αντιπαραβάλλει τη ρητορική, η οποία επιδιώκει να πείσει και να χειραγωγήσει, με τον σωκρατικό διάλογο, ο οποίος επιδιώκει την αλήθεια και τη δικαιοσύνη. Ο Σωκράτης υποστηρίζει ότι είναι προτιμότερο να υποστείς την αδικία παρά να τη διαπράξεις, τονίζοντας τη σημασία της ηθικής ακεραιότητας έναντι της εύνοιας που κερδίζεις ή της αποφυγής βλάβης.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Sheffield, Frisbee. “Plato’s Gorgias.” Classics for All, 1 July 2022, https://classicsforall.org.uk/reading-room/ad-familiares/platos-gorgias. Accessed 16 Aug. 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Gorgias (Plato)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: gorgias_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Καλλικλής ο Αχαρνεύς, Γοργίας ο Λεοντίνος, Χαιρεφών, &apos;polus_of_acragas&apos; Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-gorgias" target="_blank" rel="noopener">https://philpapers.org/browse/plato-gorgias</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/LCL166/1925/volume.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/LCL166/1925/volume.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Gorgias" target="_blank" rel="noopener">https://www.britannica.com/topic/Gorgias</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0178%3Atext%3DGorg." target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0178%3Atext%3DGorg.</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/gorgias.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/gorgias.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1672/1672-h/1672-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1672/1672-h/1672-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Gorgias_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Gorgias_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg023" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg023</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Δημόδοκος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο «Δημόδοκος», που ενδέχεται να μην είναι έργο του Πλάτωνα, θέτει ερωτήματα για την ανάγκη συμβούλων, το όφελος της ακρόασης των ψευτών και τη σοφία της εμπιστοσύνης σε ξένους.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://archive.org/details/demodocus</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Demodocus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: demodocus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Demodocus_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Demodocus_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://demonax.info/doku.php?id=text:demodocus" target="_blank" rel="noopener">http://demonax.info/doku.php?id=text:demodocus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/demodocus" target="_blank" rel="noopener">https://archive.org/details/demodocus</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Διατριβαί</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Οι «Διατριβές» είναι μια σειρά από εκτενέστερες διαλέξεις που έδωσε ο Επίκτητος και κατέγραψε ο Αρριανός. Αυτά τα κείμενα εμβαθύνουν σε διάφορες πτυχές της Στωικής φιλοσοφίας, όπως η ηθική, η λογική και η θεολογία, προσφέροντας πιο λεπτομερείς συζητήσεις σε σύγκριση με το «Εγχειρίδιον».</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Konstan, David, "Epicurus", The Stanford Encyclopedia of Philosophy (Fall 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2022/entries/epicurus/&gt;.</div>    <div class="textItalicSmallMargin"><b>2)</b> https://iep.utm.edu/epicur/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Discourses</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: discourses_epictetus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Επίκτητος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Εγχειρίδιον</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Πρόκειται για ένα συνοπτικό εγχειρίδιο ηθικών συμβουλών, που αποστάζει τις βασικές διδασκαλίες του Επίκτητου. Χρησιμεύει ως οδηγός για να ζούμε μια στωική ζωή, εστιάζοντας σε ό,τι είναι υπό τον έλεγχό μας και πώς να διατηρούμε την ηρεμία.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Konstan, David, "Epicurus", The Stanford Encyclopedia of Philosophy (Fall 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2022/entries/epicurus/&gt;.</div>    <div class="textItalicSmallMargin"><b>2)</b> https://iep.utm.edu/epicur/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Enchiridion</div>    <div class="textMediumMarginBlue">- en: The Manual</div>    <div class="textMediumMarginBlue">- en: The Handbook</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: the_handbook_epictetus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Επίκτητος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Εισαγωγή</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Εισαγωγή του Πορφύριου είναι μια εισαγωγή στα λογικά έργα του Αριστοτέλη, κυρίως στις Κατηγορίες. Ήταν εξαιρετικά επιδραστική στη θεμελίωση των Κατηγοριών του Αριστοτέλη ως βασικού εισαγωγικού κειμένου στη λογική, επηρεάζοντας την φιλοσοφική εκπαίδευση στη Βυζαντινή Αυτοκρατορία, τον αραβικό κόσμο και τη Λατινική Δύση. Σκοπός της Εισαγωγής ήταν να εναρμονίσει τη σκέψη του Αριστοτέλη με αυτήν του Πλάτωνα, ερμηνεύοντας τις κατηγορίες του Αριστοτέλη ως σημαντικές εκφράσεις αντί ως πρωταρχικά οντολογικά είδη, διατηρώντας έτσι τις πλατωνικές έννοιες ενώ αλληλεπιδρούσε με το λογικό πλαίσιο του Αριστοτέλη.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Emilsson, Eyjólfur, "Porphyry", The Stanford Encyclopedia of Philosophy (Summer 2024 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/sum2024/entries/porphyry/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Isagoge</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: isagoge_porphyry</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πορφύριος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Εννεάδες</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Οι Εννεάδες είναι 54 φιλοσοφικές πραγματείες του Πλωτίνου, που επιμελήθηκε ο μαθητής του Πορφύριος σε έξι ομάδες των εννέα. Καλύπτουν θέματα όπως η ηθική, η κοσμολογία, η ψυχολογία και η μεταφυσική, με την οργάνωση του Πορφύριου να αντανακλά θεματική, όχι χρονολογική σειρά.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/plotinus/</div>    <div class="textItalicSmallMargin"><b>2)</b> Gerson, Lloyd, "Plotinus", The Stanford Encyclopedia of Philosophy (Fall 2018 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/fall2018/entries/plotinus/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Enneads</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: enneads</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλωτίνος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/PlotinusEnneads.ElectronicTextEdition" target="_blank" rel="noopener">https://archive.org/details/PlotinusEnneads.ElectronicTextEdition</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0062%3Aalphabetic+letter%3DP%3Aentry+group%3D18%3Aentry%3Dplotinus-harpers" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0062%3Aalphabetic+letter%3DP%3Aentry+group%3D18%3Aentry%3Dplotinus-harpers</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Enneads" target="_blank" rel="noopener">https://www.britannica.com/topic/Enneads</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plotinus-enneas/1966/pb_LCL444.287.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plotinus-enneas/1966/pb_LCL444.287.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plotinus/enneads.html" target="_blank" rel="noopener">https://classics.mit.edu/Plotinus/enneads.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Enneads" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Enneads</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Επινομίς</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ίσως δεν είναι έργο του Πλάτωνα, το οποίο, όμως, επαινεί τα μαθηματικά και την αστρονομία ως τις πιο καθαρές μορφές θρησκευτικής έκφρασης, υποστηρίζοντας ότι ο Θεός έχει εμφυσήσει μαθηματικές τάσεις στους ανθρώπους και ότι τα αστέρια υπόκεινται στη θεία επιρροή.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://archive.org/details/epinomis</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Epinomis</div>    <div class="textMediumMarginBlue">- en: On the Laws</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: epinomis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/epinomis" target="_blank" rel="noopener">https://archive.org/details/epinomis</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/WorksOfPlatoV6" target="_blank" rel="noopener">https://archive.org/details/WorksOfPlatoV6</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/cache/epub/36191/pg36191-images.html" target="_blank" rel="noopener">https://www.gutenberg.org/cache/epub/36191/pg36191-images.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.routledge.com/The-Theology-of-the-Epinomis/Calchi/p/book/9780367683214" target="_blank" rel="noopener">https://www.routledge.com/The-Theology-of-the-Epinomis/Calchi/p/book/9780367683214</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-epinomis/1927/pb_LCL201.427.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-epinomis/1927/pb_LCL201.427.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-epinomis/1927/pb_LCL201.425.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-epinomis/1927/pb_LCL201.425.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0180%3Atext%3DEpin." target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0180%3Atext%3DEpin.</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Epinomis" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Epinomis</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg035" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg035</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Επιστολή προς Ηρόδοτο</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Στην επιστολή αυτή, ο Επίκουρος προσφέρει μια λεπτομερή εξήγηση της φυσικής του φιλοσοφίας, υπογραμμίζοντας τη σημασία της κατανόησης των θεμελιωδών αρχών του σύμπαντος, συμπεριλαμβανομένων των ατόμων και του κενού, για την επίτευξη μιας γαλήνιας ζωής. Όλες οι επιστολές του Επικούρου σώθηκαν από το Διογένη τον Λαέρτιο, ο οποίος τις παραθέτει στους "Βίους των Φιλοσόφων".</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Konstan, David, "Epicurus", The Stanford Encyclopedia of Philosophy (Fall 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2022/entries/epicurus/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Letter to Herodotus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: letter_to_herodotus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Επίκουρος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Επιστολή προς Μενοικέα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Αυτή η επιστολή περιγράφει τις ηθικές διδασκαλίες του Επίκουρου, με ιδιαίτερη έμφαση στην επιδίωξη της ευτυχίας μέσω της καλλιέργειας απλών απολαύσεων, της αποφυγής περιττών επιθυμιών και της άσκησης της αρετής. Όλες οι επιστολές του Επικούρου σώθηκαν από το Διογένη τον Λαέρτιο, ο οποίος τις παραθέτει στους "Βίους των Φιλοσόφων".</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Konstan, David, "Epicurus", The Stanford Encyclopedia of Philosophy (Fall 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2022/entries/epicurus/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Letter to Menoeceus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: letter_to_menoeceus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Επίκουρος</div>    <div class="attributeIndividual"> <u>mentions</u>: Μενοικέας</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Επιστολή προς Πυθοκλή</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Επίκουρος γράφει στον Πυθοκλή για να εξετάσει διάφορα φυσικά φαινόμενα, όπως ο καιρός και τα ουράνια σώματα, προωθώντας μια λογική κατανόηση αυτών των γεγονότων για την εξάλειψη των δεισιδαιμονικών φόβων. Όλες οι επιστολές του Επικούρου σώθηκαν από το Διογένη τον Λαέρτιο, ο οποίος τις παραθέτει στους "Βίους των Φιλοσόφων".</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Konstan, David, "Epicurus", The Stanford Encyclopedia of Philosophy (Fall 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2022/entries/epicurus/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Letter to Pythocles</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: letter_to_pythocles</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>mentions</u>: Πυθοκλής</div>    <div class="attributeIndividual"> <u>authoredBy</u>: Επίκουρος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ερασταί</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: «Οι Εραστές», που ίσως δεν είναι έργο του Πλάτωνα, παρουσιάζει τον Σωκράτη να συζητά την χρησιμότητα των φιλοσόφων στην κοινωνία με έναν αθλητή και εκπαιδευτικό, καταλήγοντας σε αβέβαια συμπεράσματα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://archive.org/details/rivallovers</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Erastai</div>    <div class="textMediumMarginBlue">- en: Lovers</div>    <div class="textMediumMarginBlue">- en: Rival Lovers</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: erastai</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Own work Jebulon, Plato&apos;s Academy mosaic. Roman mosaic of the 1st century BCE from Pompeii, now at the Museo Nazionale Archeologico, Naples. Public Domain, https://commons.wikimedia.org/w/index.php?curid=45896144</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/MANNapoli_124545_plato%27s_academy_mosaic.jpg/1280px-MANNapoli_124545_plato%27s_academy_mosaic.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/MANNapoli_124545_plato%27s_academy_mosaic.jpg/1280px-MANNapoli_124545_plato%27s_academy_mosaic.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/MANNapoli_124545_plato%27s_academy_mosaic.jpg/1280px-MANNapoli_124545_plato%27s_academy_mosaic.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Rival_Lovers" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Rival_Lovers</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/plato-lovers-erastai-leake_2023099" target="_blank" rel="noopener">https://archive.org/details/plato-lovers-erastai-leake_2023099</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://monadnock.net/plato/erastai.html" target="_blank" rel="noopener">https://monadnock.net/plato/erastai.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-lovers/1927/pb_LCL201.313.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-lovers/1927/pb_LCL201.313.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Plat.%20Lovers%20132&amp;lang=original" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Plat.%20Lovers%20132&amp;lang=original</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.physics.ntua.gr/mourmouras/greats/platon/erastaiperifilosofias.html" target="_blank" rel="noopener">https://www.physics.ntua.gr/mourmouras/greats/platon/erastaiperifilosofias.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://users.uoa.gr/~nektar/history/tributes/plato/dial/index.htm" target="_blank" rel="noopener">http://users.uoa.gr/~nektar/history/tributes/plato/dial/index.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg016" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg016</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ευθύδημος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο «Ευθύδημος» είναι ένας πλατωνικός διάλογος όπου ο Σωκράτης αποκαλύπτει τη λανθασμένη λογική δύο αδελφών σοφιστών, του Ευθύδημου και του Διονυσόδωρου, υπογραμμίζοντας την ανωτερότητα της αληθινής φιλοσοφίας έναντι της σοφιστείας.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Kraut, Richard, "Plato", The Stanford Encyclopedia of Philosophy (Spring 2022 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/spr2022/entries/plato/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Euthydemus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: euthydemus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>mentions</u>: Κλεινίας από τις Σκαμβωνίδες, Κρίτων από τον δήμο Αλωπεκίδος, Κτέσιππος από την Παιανία, Ευθύδημος ο Χίος, Πρόδικος ο Κείος, Πρωταγόρας ο Αβδηρίτης, Σωκράτης</div>    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://podcasts.ox.ac.uk/series/euthydemus-platonic-dialogue" target="_blank" rel="noopener">https://podcasts.ox.ac.uk/series/euthydemus-platonic-dialogue</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-euthydemus/1924/pb_LCL165.377.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-euthydemus/1924/pb_LCL165.377.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Euthydemus-by-Plato" target="_blank" rel="noopener">https://www.britannica.com/topic/Euthydemus-by-Plato</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-euthydemus" target="_blank" rel="noopener">https://philpapers.org/browse/plato-euthydemus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-euthydemus/1924/pb_LCL165.375.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-euthydemus/1924/pb_LCL165.375.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/euthydemus.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/euthydemus.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+euthyd.+271a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+euthyd.+271a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1598/1598-h/1598-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1598/1598-h/1598-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Euthydemus_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Euthydemus_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg021" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg021</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ευθύφρων</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Σωκρατικός διάλογος (ο οποίος λαμβάνει χώρα μερικές εβδομάδες πριν από τη δίκη του Σωκράτη). Ο διάλογος αφορά την έννοια της ευσέβειας και της δικαιοσύνης και καταλήγει στην «ἀπορία».</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://www.gutenberg.org/files/1642/1642-h/1642-h.htm</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Euthyphro</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: euthyphro</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Platon; Henricus Stephanus -Henri Estienne&apos;s 1578 edition of Euthyphro, parallel Latin and Greek text. Internet Archive. Digitalisat der Sloan Foundation nach einem Exemplar der John Adams Library at the Boston Public Library, Public Domain, https://commons.wikimedia.org/w/index.php?curid=6409219</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Euthyphro_Stephanus_1578_p_2.jpg/800px-Euthyphro_Stephanus_1578_p_2.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Euthyphro_Stephanus_1578_p_2.jpg/800px-Euthyphro_Stephanus_1578_p_2.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Euthyphro_Stephanus_1578_p_2.jpg/800px-Euthyphro_Stephanus_1578_p_2.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1642/1642-h/1642-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1642/1642-h/1642-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.jstor.org/stable/4181633" target="_blank" rel="noopener">https://www.jstor.org/stable/4181633</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Euthyphro" target="_blank" rel="noopener">https://www.britannica.com/topic/Euthyphro</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Euthyphro_dilemma" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Euthyphro_dilemma</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0169%3Atext%3DEuthyph." target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0169%3Atext%3DEuthyph.</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/euthyfro.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/euthyfro.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Euthyphro" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Euthyphro</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ηθικά</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Τα Ηθικά είναι μια συλλογή φιλοσοφικών πραγματειών του Πλουτάρχου, ήτοι μία ομάδα έντεκα ηθικών πραγματειών που διασώθηκαν στο χειρόγραφο Parisinus Graecus 1672 του 14ου αιώνα. Με την πάροδο του χρόνου, η συλλογή αυτή επεκτάθηκε για να περιλάβει ένα ευρύτερο φάσμα διαλόγων και πραγματειών του Πλουτάρχου σε διάφορους φιλοσοφικούς τομείς. Ο όρος Ηθικά συνεπώς αντικατοπτρίζει μια ελαφρώς παραπλανητική εντύπωση περί κυρίως ηθικού περιεχομένου.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Karamanolis, George, "Plutarch", The Stanford Encyclopedia of Philosophy (Summer 2020 Edition), Edward N. Zalta (ed.), URL = &lt;https://plato.stanford.edu/archives/sum2020/entries/plutarch/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Moralia</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: moralia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Pseudo-Plutarchus - Moralia, 1531. Available in the BEIC digital library and uploaded in partnership with BEIC Foundation., Public Domain, https://commons.wikimedia.org/w/index.php?curid=40009280</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Plutarchus_-_Moralia._De_placitis_philosophorum%2C_1531_-_3020537.tif/lossy-page1-1024px-Plutarchus_-_Moralia._De_placitis_philosophorum%2C_1531_-_3020537.tif.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλούταρχος ο Χαιρωνεύς</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Plutarchus_-_Moralia._De_placitis_philosophorum%2C_1531_-_3020537.tif/lossy-page1-1024px-Plutarchus_-_Moralia._De_placitis_philosophorum%2C_1531_-_3020537.tif.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Plutarchus_-_Moralia._De_placitis_philosophorum%2C_1531_-_3020537.tif/lossy-page1-1024px-Plutarchus_-_Moralia._De_placitis_philosophorum%2C_1531_-_3020537.tif.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.attalus.org/info/moralia.html" target="_blank" rel="noopener">https://www.attalus.org/info/moralia.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0260" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A2008.01.0260</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.academyofathens.gr/el/node/2033" target="_blank" rel="noopener">http://www.academyofathens.gr/el/node/2033</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/LCL429/1969/volume.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/LCL429/1969/volume.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Moralia" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Moralia</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ηθικά Ευδήμεια</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Τα "Ηθικά Ευδήμεια" του Αριστοτέλη εξετάζουν την αρετή, την ευτυχία και τις ηθικές αρχές, προσφέροντας μια προοπτική ηθικής φιλοσοφίας παρόμοια με τα Νικομαχειανά Ηθικά.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Amadio, Anselm H. and Kenny, Anthony J.P.. "Aristotle". Encyclopedia Britannica, 25 May. 2024, https://www.britannica.com/biography/Aristotle. Accessed 24 July 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Eudemian Ethics</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: eudemian_ethics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αριστοτέλης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikisource.org/wiki/Eudemian_Ethics" target="_blank" rel="noopener">https://en.wikisource.org/wiki/Eudemian_Ethics</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://aristotelistes.cti.gr/admin/bookSelection#:~:text=%E1%BC%88%CE%BD%CE%B1%CE%BB%CF%85%CF%84%CE%B9%CE%BA%E1%BD%B0%20%E1%BD%95%CF%83%CF%84%CE%B5%CF%81%CE%B1-,%E1%BC%A8%CE%B8%CE%B9%CE%BA%E1%BD%B0%20%CE%95%E1%BD%90%CE%B4%CE%AE%CE%BC%CE%B9%CE%B1,-%E1%BC%A8%CE%B8%CE%B9%CE%BA%E1%BD%B0%20%CE%9D%CE%B9%CE%BA%CE%BF%CE%BC%CE%AC%CF%87%CE%B5%CE%B9%CE%B1" target="_blank" rel="noopener">https://aristotelistes.cti.gr/admin/bookSelection#:~:text=%E1%BC%88%CE%BD%CE%B1%CE%BB%CF%85%CF%84%CE%B9%CE%BA%E1%BD%B0%20%E1%BD%95%CF%83%CF%84%CE%B5%CF%81%CE%B1-,%E1%BC%A8%CE%B8%CE%B9%CE%BA%E1%BD%B0%20%CE%95%E1%BD%90%CE%B4%CE%AE%CE%BC%CE%B9%CE%B1,-%E1%BC%A8%CE%B8%CE%B9%CE%BA%E1%BD%B0%20%CE%9D%CE%B9%CE%BA%CE%BF%CE%BC%CE%AC%CF%87%CE%B5%CE%B9%CE%B1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/p2workstranslat09aris" target="_blank" rel="noopener">https://archive.org/details/p2workstranslat09aris</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Aristot.+Eud.+Eth.+toc&amp;redirect=true" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Aristot.+Eud.+Eth.+toc&amp;redirect=true</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ηθικά Νικομάχεια</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Τα "Ηθικά Νικομάχεια" του Αριστοτέλη διερευνά την ευτυχία (ευδαιμονία) και την αρετή, εξετάζοντας τα χαρακτηριστικά που απαιτούνται για μια καλή ζωή, τις προϋποθέσεις για έπαινο και μομφή και τη φύση της ηδονής και της φιλίας. Συζητά τη σχέση μεταξύ ηθικής και πολιτικής, τη ρήση του Σόλωνα για την ευτυχία και την ανωτερότητα της φιλοσοφικής ζωής. Θεωρείται μια επεξεργασμένη εκδοχή των προγενέστερων "Ηθικών Ευδημίων" του.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Kraut, Richard, "Aristotle’s Ethics", The Stanford Encyclopedia of Philosophy (Fall 2022 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/fall2022/entries/aristotle-ethics/&gt;.<br></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Nicomachean Ethics</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: nicomachean_ethics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αριστοτέλης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://aristotelistes.cti.gr/admin/bookSelection#:~:text=%E1%BC%A8%CE%B8%CE%B9%CE%BA%E1%BD%B0%20%CE%95%E1%BD%90%CE%B4%CE%AE%CE%BC%CE%B9%CE%B1-,%E1%BC%A8%CE%B8%CE%B9%CE%BA%E1%BD%B0%20%CE%9D%CE%B9%CE%BA%CE%BF%CE%BC%CE%AC%CF%87%CE%B5%CE%B9%CE%B1,-%CE%9A%CE%B1%CF%84%CE%B7%CE%B3%CE%BF%CF%81%CE%AF%CE%B1%CE%B9" target="_blank" rel="noopener">https://aristotelistes.cti.gr/admin/bookSelection#:~:text=%E1%BC%A8%CE%B8%CE%B9%CE%BA%E1%BD%B0%20%CE%95%E1%BD%90%CE%B4%CE%AE%CE%BC%CE%B9%CE%B1-,%E1%BC%A8%CE%B8%CE%B9%CE%BA%E1%BD%B0%20%CE%9D%CE%B9%CE%BA%CE%BF%CE%BC%CE%AC%CF%87%CE%B5%CE%B9%CE%B1,-%CE%9A%CE%B1%CF%84%CE%B7%CE%B3%CE%BF%CF%81%CE%AF%CE%B1%CE%B9</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0053" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0053</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0054" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0054</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Θεάγης</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Θεάγης είναι διάλογος αποδιδόμενος στον Πλάτωνα, όπου ο Σωκράτης συζητά με τον Δημόδοκο και τον γιο του Θεάγη για τη φύση της σοφίας και την τέχνη της διακυβέρνησης, ενώ η αυθεντικότητα του διαλόγου αμφισβητείται.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://archive.org/details/theages</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Theages</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: theages_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: By Plato - Codex Oxoniensis Clarkianus 39, facsimile by Sijthoff with foreword by Allen., Page of the Codex Oxoniensis Clarkianus 39 (aka "the Clarke Plato") a 9th century CE Greek manuscript. Showing the beginning of the dialogue. Public Domain, https://commons.wikimedia.org/w/index.php?curid=26910474</div>    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Theages_beginning._Clarke_Plato.jpg/440px-Theages_beginning._Clarke_Plato.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Χαρμίδης ο Αθηναίος, Γοργίας ο Λεοντίνος, Πρόδικος ο Κείος, Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Theages_beginning._Clarke_Plato.jpg/440px-Theages_beginning._Clarke_Plato.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Theages_beginning._Clarke_Plato.jpg/440px-Theages_beginning._Clarke_Plato.jpg</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Theages" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Theages</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-theages/1927/pb_LCL201.347.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-theages/1927/pb_LCL201.347.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/plato-the-theages-pangle" target="_blank" rel="noopener">https://archive.org/details/plato-the-theages-pangle</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://monadnock.net/plato/theages.html" target="_blank" rel="noopener">https://monadnock.net/plato/theages.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-theages/1927/pb_LCL201.343.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-theages/1927/pb_LCL201.343.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+theag.+121a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+theag.+121a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg017" target="_blank" rel="noopener">http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg017</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Θεαίτητος (Πλάτωνος)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Στον Θεαίτητο του Πλάτωνα, ο Σωκράτης προσπαθεί να προσδιορίσει τι είναι η γνώση μέσω της συζήτησης με τον Θεαίτητο και τον Θεόδωρο, αλλά δεν καταλήγει σε μια σαφή οριστική απάντηση, ενώ εξετάζει διάφορα φιλοσοφικά ζητήματα όπως η αντίληψη, η ροή και ο σχετικισμός.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/theatetu/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Theaetetus (Plato)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: theaetetus_plato</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Ευκλείδης ο Μεγαρεύς, Καλλίας ο Αλωπεκεύς, Πρόδικος ο Κείος, Πρωταγόρας ο Αβδηρίτης, Θεόδωρος ο Κυρηναίος (αναφέρεται από τον Πλάτωνα), Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/LCL123/1921/volume.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/LCL123/1921/volume.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/theatu.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/theatu.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0172%3Atext%3DTheaet.%3Apage%3D142" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0172%3Atext%3DTheaet.%3Apage%3D142</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://iep.utm.edu/theatetu/" target="_blank" rel="noopener">https://iep.utm.edu/theatetu/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1726/1726-h/1726-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1726/1726-h/1726-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Theaetetus_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Theaetetus_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plato.stanford.edu/entries/plato-theaetetus/" target="_blank" rel="noopener">https://plato.stanford.edu/entries/plato-theaetetus/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg006" target="_blank" rel="noopener">http://data.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg006</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ίππαρχος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ο Ίππαρχος του Πλάτωνα διερευνά την αγάπη για το κέρδος. Ο λόγος του Σωκράτη προσφέρει γνώσεις για τη φύση του ανθρώπινου αγαθού και τη σύνδεσή του με τη φιλοσοφία και την ηθική.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Bellows, Samuel Palmer. "Plato&apos;s Hipparchus." UT Electronic Theses and Dissertations, University of Texas at Austin, 23 Sept. 2015, http://hdl.handle.net/2152/34042. Accessed 16 Aug. 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Hipparch</div>    <div class="textMediumMarginBlue">- en: Hipparchus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: hipparchus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://repositories.lib.utexas.edu/items/0a579fb6-00e4-4a67-abd1-9d7dae1b70f5" target="_blank" rel="noopener">https://repositories.lib.utexas.edu/items/0a579fb6-00e4-4a67-abd1-9d7dae1b70f5</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/rec/PLAHGA" target="_blank" rel="noopener">https://philpapers.org/rec/PLAHGA</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-hipparchus/1927/pb_LCL201.279.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-hipparchus/1927/pb_LCL201.279.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-hipparchus/1927/pb_LCL201.277.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-hipparchus/1927/pb_LCL201.277.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://monadnock.net/plato/hipparchus.html" target="_blank" rel="noopener">https://monadnock.net/plato/hipparchus.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+hipparch.+225a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+hipparch.+225a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Hipparchus_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Hipparchus_(dialogue)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg015" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg015</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ιππίας ελάττων</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Στον "Ιππία ελάττονα", ο Σωκράτης υποστηρίζει ότι τα συνειδητά ψέματα είναι καλύτερα από τα τυχαία. Συνδέει τη συζήτηση με την ερώτηση αν οι ήρωες του Ομήρου, Αχιλλέας και Οδυσσέας, αντικατοπτρίζουν την ποιότητα των επών τους. Αν και δεν το αναπτύσσει περαιτέρω, αργότερα στην "Πολιτεία" προτείνει ότι τα έργα του Ομήρου θα ήταν καλύτερα αν οι ήρωες ήταν πάντα ενάρετοι.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://www.gutenberg.org/files/1673/1673-h/1673-h.htm#link2H_INTR</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Lesser Hippias</div>    <div class="textMediumMarginBlue">- en: Hippias Minor</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: hippias_minor</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Ιππίας ο Ηλείος, Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-hippias-minor" target="_blank" rel="noopener">https://philpapers.org/browse/plato-hippias-minor</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Hippias-Minor" target="_blank" rel="noopener">https://www.britannica.com/topic/Hippias-Minor</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-lesser_hippias/1926/pb_LCL167.427.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-lesser_hippias/1926/pb_LCL167.427.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1673/1673-h/1673-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1673/1673-h/1673-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+hipp.+min.+363a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+hipp.+min.+363a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Hippias_Minor" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Hippias_Minor</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ιππίας μείζων</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Στον "Ιππία μείζονα", ο Σωκράτης και ο Ιππίας προσπαθούν να βρουν έναν ορισμό για την «ομορφιά».</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://archive.org/details/hippiasmajor</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Hippias Major</div>    <div class="textMediumMarginBlue">- en: Greater Hippias</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: hippias_major</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Ιππίας ο Ηλείος, Γοργίας ο Λεοντίνος, Πρόδικος ο Κείος, Πρωταγόρας ο Αβδηρίτης, Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg025" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg025</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.hellenicaworld.com/Greece/Literature/en/HippiasMajor.html" target="_blank" rel="noopener">https://www.hellenicaworld.com/Greece/Literature/en/HippiasMajor.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Hippias-Major" target="_blank" rel="noopener">https://www.britannica.com/topic/Hippias-Major</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-hippias-major" target="_blank" rel="noopener">https://philpapers.org/browse/plato-hippias-major</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://academic.oup.com/book/26775/chapter-abstract/195689052?redirectedFrom=fulltext" target="_blank" rel="noopener">https://academic.oup.com/book/26775/chapter-abstract/195689052?redirectedFrom=fulltext</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-greater_hippias/1926/pb_LCL167.335.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-greater_hippias/1926/pb_LCL167.335.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+hipp.+maj.+281a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+hipp.+maj.+281a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Hippias_Major" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Hippias_Major</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ιστορία των Ζώων</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Περί τα ζώα ιστορίαι, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: History of Animals</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: history_of_animals</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αριστοτέλης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Aristotle/history_anim.html" target="_blank" rel="noopener">https://classics.mit.edu/Aristotle/history_anim.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://penelope.uchicago.edu/aristotle/histanimals1.html" target="_blank" rel="noopener">https://penelope.uchicago.edu/aristotle/histanimals1.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0086.tlg014" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0086.tlg014</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/work/101" target="_blank" rel="noopener">https://topostext.org/work/101</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://librivox.org/search?title=History+of+Animals&amp;author=ARISTOTLE&amp;reader=&amp;keywords=&amp;genre_id=0&amp;status=all&amp;project_type=either&amp;recorded_language=&amp;sort_order=catalog_date&amp;search_page=1&amp;search_form=
