<script language="JavaScript">
var dictionnaire = [
    ['<div class="terminologyEntry">    <div class="term">Αθηναίων Πολιτεία</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η Αθηναίων Πολιτεία του Αριστοτέλη παρέχει μια αναλυτική περιγραφή του πολιτικού συστήματος και της ιστορίας της Αθήνας, εστιάζοντας στις μεταρρυθμίσεις από τον Σόλωνα μέχρι τη δημοκρατία του 4ου αιώνα π.Χ. Προσφέρει γνώσεις για τη λειτουργία της αθηναϊκής δημοκρατίας, τα πολιτικά θεσμικά όργανα, τις εκλογές και τη δικαιοσύνη, αποτελώντας μια κρίσιμη πηγή για την κατανόηση της αρχαίας Αθήνας.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> The Athenian Constitution ; The Eudemian ethics ; On virtues and vices: https://archive.org/details/athenianconstitu00arisuoft/page/n6/mode/1up</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Athenian Constitution</div>    <div class="textMediumMarginBlue">- en: Constitution of the Athenians</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: athenian_constitution</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αριστοτέλης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/26095/26095-h/26095-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/26095/26095-h/26095-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=aristot.+ath.+pol.+22" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=aristot.+ath.+pol.+22</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://aristotelistes.cti.gr/admin/bookSelection" target="_blank" rel="noopener">https://aristotelistes.cti.gr/admin/bookSelection</a></div></div></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">Αλκιβιάδης β΄</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ένας διάλογος που παραδοσιακά αποδίδεται στον Πλάτωνα και παρουσιάζει τον Σωκράτη να προτρέπει τον Αλκιβιάδη να μην προσεύχεται στους θεούς αν δεν ξέρει αν οι προσευχές του είναι πράγματι ωφέλιμες ή επιβλαβείς.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://iep.utm.edu/plato/</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Alcibiades II</div>    <div class="textMediumMarginBlue">- en: Second Alcibiades</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: alcibiades_ii</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.physics.ntua.gr/mourmouras/greats/platon/alkiviadesbperiproseyxhs.html" target="_blank" rel="noopener">https://www.physics.ntua.gr/mourmouras/greats/platon/alkiviadesbperiproseyxhs.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/ebooks/1677" target="_blank" rel="noopener">https://www.gutenberg.org/ebooks/1677</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Second_Alcibiades" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Second_Alcibiades</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1677/1677-h/1677-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1677/1677-h/1677-h.htm</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-alcibiades_ii/1927/pb_LCL201.229.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-alcibiades_ii/1927/pb_LCL201.229.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+alc.+2+138a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+alc.+2+138a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikisource.org/wiki/Alcibiades_II" target="_blank" rel="noopener">https://en.wikisource.org/wiki/Alcibiades_II</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg014" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg014</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Αλκιβιάδης μείζων</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Αλκιβιάδης α´, </font></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Alcibiades I</div>    <div class="textMediumMarginBlue">- en: Alcibiades Major</div>    <div class="textMediumMarginBlue">- en: First Alcibiades</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: alcibiades_i</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://el.wikisource.org/wiki/%CE%91%CE%BB%CE%BA%CE%B9%CE%B2%CE%B9%CE%AC%CE%B4%CE%B7%CF%82_%CE%B1" target="_blank" rel="noopener">https://el.wikisource.org/wiki/%CE%91%CE%BB%CE%BA%CE%B9%CE%B2%CE%B9%CE%AC%CE%B4%CE%B7%CF%82_%CE%B1</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg013" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg013</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://philpapers.org/browse/plato-alcibiades-i" target="_blank" rel="noopener">https://philpapers.org/browse/plato-alcibiades-i</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.loebclassics.com/view/plato_philosopher-alcibiades_i/1927/pb_LCL201.99.xml" target="_blank" rel="noopener">https://www.loebclassics.com/view/plato_philosopher-alcibiades_i/1927/pb_LCL201.99.xml</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+alc.+1+103a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+alc.+1+103a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.gutenberg.org/files/1676/1676-h/1676-h.htm" target="_blank" rel="noopener">https://www.gutenberg.org/files/1676/1676-h/1676-h.htm</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Ανάλεκτα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο κινεζικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Κινεζικό φιλοσοφικό κείμενο που αποτελείται από ρήσεις και ιδέες που αποδίδονται στον Κομφούκιο και τους συγχρόνους του, το οποίο παραδοσιακά πιστεύεται ότι συντάχθηκε από τους υποστηρικτές του. </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Analects</div>    <div class="textMediumMarginBlue">- en: Lun-Yü</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: analects</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Chinese-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Rongo_Analects_02.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Κομφούκιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/8/84/Rongo_Analects_02.jpg" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/8/84/Rongo_Analects_02.jpg</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Αναλυτικά Πρότερα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Τα "Αναλυτικά Πρότερα" του Αριστοτέλη είναι αφιερωμένα στη θεωρία του συλλογισμού, μια κεντρική μέθοδος λογικής συμπερασματολογίας. Εξετάζει πώς οι προτάσεις που αρχίζουν με "Κάθε" (πᾶς), "Κανένας" (οὐδεὶς) ή "Μερικοί" (τίς) είναι δομημένες και συνδεδεμένες στα επιχειρήματα. Σε αντίθεση με το "Περί Ἑρμηνείας," που εξετάζει τη συμβατότητα των προτάσεων, τα "Αναλυτικά Πρότερα" τονίζουν την κατασκευή προτάσεων από όρους που χρησιμοποιούνται ως υποκείμενα ή κατηγορούμενα. Αυτό το έργο αποτελεί θεμελιώδες μέρος της συνεισφοράς του Αριστοτέλη στη λογική, που συγκεντρώνεται στη συλλογή γνωστή ως το "ὄργανον" (ὄργανον).</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Kenny, Anthony J.P. and Amadio, Anselm H.. "Aristotle". Encyclopedia Britannica, 25 May. 2024, https://www.britannica.com/biography/Aristotle. Accessed 24 July 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Prior Analytics</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: prior_analytics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αριστοτέλης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://data.perseus.org/catalog/urn:cts:greekLit:tlg0086.tlg001.opp-ara2" target="_blank" rel="noopener">http://data.perseus.org/catalog/urn:cts:greekLit:tlg0086.tlg001.opp-ara2</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Αναλυτικά Ύστερα</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Τα "Αναλυτικά Ύστερα" του Αριστοτέλη εφαρμόζουν τη θεωρία του συλλογισμού στην επιστημονική γνώση, υποστηρίζοντας ότι αυτή πρέπει να βασίζεται σε αποδείξεις από αληθείς, αναγκαίες και καθολικές αρχές. Αυτές οι αρχές, παρόμοιες με τα αξιώματα σε σχέση με τα θεωρήματα, ορίζουν το αντικείμενο μιας επιστήμης και καθορίζουν τις αλήθειες της. Το έργο τονίζει τη σημασία των ορισμών, ιδιαίτερα στο δεύτερο βιβλίο του.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Amadio, Anselm H. and Kenny, Anthony J.P.. "Aristotle". Encyclopedia Britannica, 25 May. 2024, https://www.britannica.com/biography/Aristotle. Accessed 24 July 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Posterior Analytics</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: posterior_analytics</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αριστοτέλης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/history-of-logic/Aristotle#ref535344" target="_blank" rel="noopener">https://www.britannica.com/topic/history-of-logic/Aristotle#ref535344</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/biography/Aristotle/The-unmoved-mover#ref919849" target="_blank" rel="noopener">https://www.britannica.com/biography/Aristotle/The-unmoved-mover#ref919849</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/epistemology/The-history-of-epistemology#ref308908" target="_blank" rel="noopener">https://www.britannica.com/topic/epistemology/The-history-of-epistemology#ref308908</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Αξίοχος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ένας σωκρατικός διάλογος που αποδίδεται στον Πλάτωνα, αλλά θεωρείται πλαστός εδώ και πάνω από 400 χρόνια.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> https://topostext.org/work/758</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Axiochus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: axiochus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Καλλίας ο Αλωπεκεύς, Χαρμίδης ο Αθηναίος, Κλεινίας από τις Σκαμβωνίδες, Πρόδικος ο Κείος, Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg038" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg038</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://archive.org/details/axiochus" target="_blank" rel="noopener">https://archive.org/details/axiochus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikisource.org/wiki/Axiochus" target="_blank" rel="noopener">https://en.wikisource.org/wiki/Axiochus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/work/758" target="_blank" rel="noopener">https://topostext.org/work/758</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Axiochus_(dialogue)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Axiochus_(dialogue)</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Απολογία</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Η «Απολογία» του Πλάτωνα παρουσιάζει τον Σωκράτη να υπερασπίζεται τον εαυτό του κατά τη διάρκεια της δίκης του στην Αθήνα, απαντώντας στις κατηγορίες για ασέβεια και διαφθορά της νεολαίας, ενώ ασκεί κριτική στη δημοκρατία της Αθήνας για τις αδυναμίες και την επιφανειακότητά της.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Britannica, The Editors of Encyclopaedia. "Apology". Encyclopedia Britannica, 3 Apr. 2023, https://www.britannica.com/topic/Apology-by-Plato. Accessed 16 August 2024.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Apology</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: apology</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πλάτων</div>    <div class="attributeIndividual"> <u>mentions</u>: Αδείμαντος του Κολλυτού, Χαιρεφών, Κρίτων από τον δήμο Αλωπεκίδος, Απολλόδωρος ο Φαληρεύς, Γοργίας ο Λεοντίνος, Σωκράτης</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Apology_(Plato)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Apology_(Plato)</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://chs.harvard.edu/primary-source/plato-the-apology-of-socrates-sb/" target="_blank" rel="noopener">https://chs.harvard.edu/primary-source/plato-the-apology-of-socrates-sb/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://classics.mit.edu/Plato/apology.html" target="_blank" rel="noopener">https://classics.mit.edu/Plato/apology.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/topic/Apology-by-Plato" target="_blank" rel="noopener">https://www.britannica.com/topic/Apology-by-Plato</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.perseus.tufts.edu/hopper/text?doc=plat.+apol.+17a" target="_blank" rel="noopener">https://www.perseus.tufts.edu/hopper/text?doc=plat.+apol.+17a</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.famous-trials.com/socrates" target="_blank" rel="noopener">https://www.famous-trials.com/socrates</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/biography/Socrates/Platos-Apology" target="_blank" rel="noopener">https://www.britannica.com/biography/Socrates/Platos-Apology</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg002" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0059.tlg002</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Αρμονικά στοιχεία</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ένα αποσπασματικό έργο γραμμένο από τον Αριστόξενο τον Ταραντίνο σχετικά με το μέτρο και το ρυθμό.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Britannica, The Editors of Encyclopaedia. "Aristoxenus". Encyclopedia Britannica, 13 Feb. 2024, https://www.britannica.com/biography/Aristoxenus. Accessed 1 August 2024.</div>    <div class="textItalicSmallMargin"><b>2)</b> Curnow, T. (2006). The philosophers of the ancient world: An A to Z guide. Bristol Classical Press.<br></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Elements of Harmony</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: elements_of_harmony</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Αριστόξενος ο Ταραντίνος</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Βίος του Πυθαγόρα (Πορφύριος)</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ένα πλήρως σωζόμενο έργο του 3ου αι. μ.Χ., το οποίο μαζί με το έργο του Ιάμβλιχου και τους Βίους του Διογένη Λαέρτιου αποτελεί την κύρια πηγή για τη ζωή του Πυθαγόρα.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Emilsson, Eyjólfur, "Porphyry", The Stanford Encyclopedia of Philosophy (Summer 2024 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/sum2024/entries/porphyry/&gt;.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Life of Pythagoras (Porphyry)</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: life_of_pythagoras_porphyry</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Πορφύριος</div>    <div class="attributeIndividual"> <u>mentions</u>: Πυθαγόρας ο Σάμιος</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://catalog.perseus.org/catalog/urn:cite:perseus:author.1170" target="_blank" rel="noopener">https://catalog.perseus.org/catalog/urn:cite:perseus:author.1170</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://themodernhermeticist.com/2022/01/22/the-life-of-pythagoras-porphyry/" target="_blank" rel="noopener">https://themodernhermeticist.com/2022/01/22/the-life-of-pythagoras-porphyry/</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.tertullian.org/fathers/porphyry_life_of_pythagoras_02_text.htm" target="_blank" rel="noopener">https://www.tertullian.org/fathers/porphyry_life_of_pythagoras_02_text.htm</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Βίος του Πυθαγόρα Ιάμβλιχος</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">αρχαίο ελληνικό φιλοσοφικό έργο</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ένα από τα δύο πιο γνωστά έργα του Ιάμβλιχου του Χαλκιδέως μαζί με τον Προτρεπτικό του. Αν και η ιστορική αξιοπιστία του έργου αμφισβητείται, ο Ιάμβλιχος οικοδομεί ένα πρότυπο και αναφέρεται στον Πυθαγόρα ως θεόπνευστο και ως έναν φιλόσοφο που επηρεάστηκε από τις αρχαίες διδασκαλίες της Αιγύπτου και της Μεσοποταμίας. Τέλος, ο δάσκαλος του Ιάμβλιχου, δηλαδή ο Πορφύριος, έγραψε επίσης ένα Βίο του Πυθαγόρα. </div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> Curnow, T. (2006). The philosophers of the ancient world: An A to Z guide. Bristol Classical Press.<br></div>    <div class="textItalicSmallMargin"><b>2)</b> Chiaradonna, Riccardo and Adrien Lecerf, "Iamblichus", The Stanford Encyclopedia of Philosophy (Winter 2023 Edition), Edward N. Zalta &amp; Uri Nodelman (eds.), URL = &lt;https://plato.stanford.edu/archives/win2023/entries/iamblichus/&gt;.<br></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- en: Life of Pythagoras Iamblichus</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: life_of_pythagoras_iamblichus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Philosophical-Work&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>authoredBy</u>: Ιάμβλιχος ο Χαλκιδεύς</div>    <div class="attributeIndividual"> <u>mentions</u>: Άβαρις ο Υπερβόρειος, Ακουσιλάδας ο Ταραντίνος, Ακμονίδας ο Ταραντίνος, Αινέας ο Μεταποντίνος, Αρισταίος ο Δαμοφώντος, Κλεινίας ο Ταραντίνος, Κύλων, Δάμων ο Συρακούσιος, Δείναρχος ο Πάριος, Δεινοκράτης
