    ['<div class="terminologyEntry">    <div class="term">Borysthenes</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Parutyne, Pontic Olbia, </font></div>    <div class="textMediumMargin"><b>Comment</b>: "Olbia Pontica" refers to an ancient settlement near the modern Ukrainian village of Parutyne, on the west bank of the Dnieper–Bug Estuary.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> David Braund, Brady Kiesling, Sean Gillies, Chris de Lisle, Jeffrey Becker, Tom Elliott, DARMC, R. Talbert, and Diane Braund, &apos;Borysthenes/Olbia: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/226546&gt; [accessed: 02 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Βορυσθένης</div>    <div class="textMediumMarginBlue">- el: Ολβία Ποντική</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: olbia_pontica</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;46.6923856639,31.9058567704&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Bion of Borysthenes, Sphaerus of Borysthenes</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/467319UOlb" target="_blank" rel="noopener">https://topostext.org/place/467319UOlb</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/451" target="_blank" rel="noopener">http://www     ['<div class="terminologyEntry">    <div class="term">Byzantium</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div>    <div class="textMediumMargin"><b>Comment</b>: An ancient Greek settlement at the southern end of the Bosphorus, where modern-day Istanbul, Turkey, is located. It thrived during the Greek and Roman periods and was renamed Constantinopolis by Emperor Constantine in the fourth century, who greatly expanded it.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, DARMC, R. Talbert, Brady Kiesling, Sean Gillies, Jeffrey Becker, Ingrid Luo, and Tom Elliott, &apos;Byzantium: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2022 &lt;https://pleiades.stoa.org/places/520985&gt; [accessed: 24 July 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Βυζάντιο</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: byzantium</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;41.005902,28.9738815&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Aristophanes of Byzantium, Demetrius of Byzantium, Leon of Byzantium</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/478" target="_blank" rel="noopener">http://www.trismegistos.org/place/478</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q23725" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q23725</a></div>    <div class= "externalLinkIndivid     ['<div class="terminologyEntry">    <div class="term">Carthage</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ancient city on the eastern side of the Lake of Tunis in what is now Tunisia. Carthage was one of the most important trading hubs of the Ancient Mediterranean and one of the most affluent cities of the classical world. Birthplace of Clitomachus, head (scholarch) of the Academy, from 127/6 BC, two years after the death of Carneades.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> R.B. Hitchner, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Jeffrey Becker, Tom Elliott, DARMC, Jonathan Prag, R. Warner, R. Talbert, and Ingrid Luo, &apos;Carthago: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/314921&gt; [accessed: 15 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Καρχηδόνα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: carthage</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;36.853056,10.323056&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isDeathPlaceOf</u>: Clitomachus of Carthage</div>    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Clitomachus of Carthage, Herillus of Carthage, Miltiades of Carthage, Anthes of Carthage</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.geonames.org/2468244/carthage.html" target="_blank" rel="noopener">http://www.geonames.org/2     ['<div class="terminologyEntry">    <div class="term">Clazomenae</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div>    <div class="textMediumMargin"><b>Comment</b>: An ancient Greek city on the coast of Ionia and a member of the Ionian League. It was one of the first cities to issue silver coinage. Its ruins are now located in the modern town Urla near Izmir in Izmir Province, Turkey. Birth place of the ancient Greek philosopher, Anaxagoras.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, S. Mitchell, Peter Cobb, Sean Gillies, Jeffrey Becker, Tom Elliott, Brady Kiesling, R. Talbert, Rob Chavez, and Ryan Horne, &apos;Klazomenai (later): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/550651&gt; [accessed: 22 July 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Κλαζομενές</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: clazomenae</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.3730477505,26.7866198434&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Anaxagoras of Clazomenae</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/384268PKla" target="_blank" rel="noopener">https://topostext.org/place/384268PKla</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Klazomenai" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Klazomenai</     ['<div class="terminologyEntry">    <div class="term">Cyprus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div>    <div class="textMediumMargin"><b>Comment</b>: One of the largest islands in the Mediterranean Sea, place of capture and death of Anaxarchus of Abdera.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> D. Rupp, R. Talbert, Sean Gillies, Jamie Novotny, Tom Elliott, and Jeffrey Becker, &apos;Cyprus (island): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/707498&gt; [accessed: 22 July 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Κύπρος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: cyprus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;34.9723105975,33.160154151&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isDeathPlaceOf</u>: Anaxarchus of Abdera</div>    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Demonax of Cyprus, Eupeithes of Paphos</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DC%3Aentry+group%3D26%3Aentry%3Dcyprus-geo" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DC%3Aentry+group%3D26%3Aentry%3Dcyprus-geo</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/528" target="_blank" rel="noopen     ['<div class="terminologyEntry">    <div class="term">Cyrene</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div>    <div class="textMediumMargin"><b>Comment</b>: A Greek colony had been founded in Cyrene, North Africa, by the Greeks of Thera. In the 3rd century, Aristippus, a pupil of Socrates, founded the philosophical school of Cyrene, while Eratosthenes, Kallimachus, Karneades etc. came from this place.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> D. Rupp, R. Talbert, Sean Gillies, Jamie Novotny, Tom Elliott, and Jeffrey Becker, &apos;Cyprus (island): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/707498&gt; [accessed: 19 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Κυρήνη</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: cyrene</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;32.8200266273,21.8565385134&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Demophanes of Megalopolis</div>    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Antipater of Cyrene, Arete of Cyrene, Anniceris of Cyrene, Carneades of Cyrene, Aristippus Metrodidactus, Aristippus of Cyrene, Aristotle of Cyrene, Aristoxenus of Cyrene, Damon of Cyrene, Dionysius of Cyrene, Epitimides of Cyrene, Hegesias of Cyrene, Lacydes of Cyrene, Leontius of Cyrene, Melanippus of Cyrene, Paseas of Cyrene, Ptolemy of Cyrene, Theodorus of Cyrene (mentioned by Plato), Theodorus of Cyrene, Aristangelus of Cyrene</div>     ['<div class="terminologyEntry">    <div class="term">Elea</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div>    <div class="textMediumMargin"><b>Comment</b>: The ancient city of Elea is said to have been founded by Phocaean Greeks and then became an ally of Rome.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> I.E.M. Edlund Berry, A.M. Small, DARMC, R. Talbert, Brady Kiesling, Sean Gillies, Jeffrey Becker, and Tom Elliott, &apos;Velia/Elea: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/452488&gt; [accessed: 19 August 2024] </div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Velia" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Velia</a></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ελέα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: elea</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;40.1605007372,15.1561568475&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isDeathPlaceOf</u>: Zeno of Elea</div>    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Parmenides of Elea, Zeno of Elea</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Velia" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Velia</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.geonames.org/3164641/velia.html" target="_bl     ['<div class="terminologyEntry">    <div class="term">Elis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Ilia, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Elis or Ilia is a historic region in the western part of the Peloponnese peninsula of Greece. Birth place of Hippias, Greek sophist of the 5th c. BC.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> G. Reger, J. McK. Camp II, R. Talbert, Sean Gillies, Tom Elliott, and Jeffrey Becker, &apos;Elis (region): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/570221&gt; [accessed: 21 July 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ηλεία</div>    <div class="textMediumMarginBlue">- el: Ήλις</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: elis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.7476735676,21.6883960595&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Aegimius of Elis, Alexinus of Elis, Anchipylus of Elis, Hippias of Elis, Phaedo of Elis, Pleistanus of Elis, Pyrrho of Elis</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Elis" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Elis</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q217667" target="_blank" rel="noopener">https://www.wikidata.or     ['<div class="terminologyEntry">    <div class="term">Gadara</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div>    <div class="textMediumMargin"><b>Comment</b>: A center of Greek culture during the Hellenistic and Roman periods, whose ruins are located at Umm Qais or Qays, Jordan. In this city, great figures were born, such as Meleager, Menippus and Philodemus.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> E.M. Meyers, J.P. Brown, DARMC, Brady Kiesling, R. Talbert, Johan Åhlfeldt, Sean Gillies, Jeffrey Becker, and Tom Elliott, &apos;Gadara/Pompeia: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2020 &lt;https://pleiades.stoa.org/places/678142&gt; [accessed: 15 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Γάδαρα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: gadara</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;32.655922,35.6781455&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Meleager of Gadara, Menippus of Gadara, Oenomaus of Gadara, Philodemus of Gadara</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DG%3Aentry+group%3D1%3Aentry%3Dgadara-geo" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DG%3Aentry+group%3D1%3Aentry%3Dgadara-geo</a></div>    <div class= "externalLinkIndividual">rd     ['<div class="terminologyEntry">    <div class="term">Garden of Epicurus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div>    <div class="textMediumMargin"><b>Comment</b>: Epicurus founded around 307 B.C. his school, the "Garden". For Epicurus, philosophy is intertwined with the study of natural phenomena and is both instructive, as it helps man to moderate his needs in order to reach ἡδονή (pleasure), and therapeutic, as it liberates human beings from the fear of death, the gods and pain.</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Κήπος του Επικούρου</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: garden</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Gerasa</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Jerash, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Gerasa (modern Jerash, Jordan) became a major center under Antiochos IV Epiphanes, known then as Antioch on the Chrysorhoas. It joined the Decapolis under Pompey in 63 B.C. and became a Roman colony in the third century.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> E.M. Meyers, J.P. Brown, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Jeffrey Becker, Tom Elliott, DARMC, R. Talbert, and jfu, &apos;Gerasa/Antiochia ad Chrysorhoam: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/678158&gt; [accessed: 15 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Γέρασα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: gerasa</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;32.2800898764,35.8910921282&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Nicomachus of Gerasa</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DG%3Aentry+group%3D3%3Aentry%3Dgerasa-geo" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DG%3Aentry+group%3     ['<div class="terminologyEntry">    <div class="term">Lampsacus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div>    <div class="textMediumMargin"><b>Comment</b>: An ancient Greek city located in the eastern side of the Hellespont and was successively dominated by Lydia, Persia, Athens, and Sparta. Figures such as Leontius, Strato, Anaximenes et. al. were originated by Lampsacus.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> E.N. Borza, Brady Kiesling, R. Talbert, Sean Gillies, Jeffrey Becker, Tom Elliott, DARMC, G. Reger, R. Scott Smith, and Greta Hawes, &apos;Pityoussa/Lampsacus: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/501570&gt; [accessed: 22 July 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Λάμψακος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: lampsacus</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;40.346685,26.699162&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isDeathPlaceOf</u>: Anaxagoras of Clazomenae</div>    <div class="attributeIndividual"> <u>residentedBy</u>: Epicurus</div>    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Bates of Lampsacus, Colotes of Lampsacus, Evaeon of Lampsacus, Idomeneus of Lampsacus, Leontius of Lampsacus, Menedemus of Lampsacus, Metrodorus of Lampsacus, Metrodorus of Lampsacus (Epicurean), Polyaenus of Lampsacus, Strato of Lampsacus</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="     ['<div class="terminologyEntry">    <div class="term">Larissa</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div>    <div class="textMediumMargin"><b>Comment</b>: A Greek place, hometown of Anaxilaus and Philo, the last known head of Plato’s Academy during its skeptical phase.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> J. Fossey, J. Morin, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Jeffrey Becker, Tom Elliott, DARMC, R. Talbert, G. Reger, R. Scott Smith, and Greta Hawes, &apos;Larissa: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/540905&gt; [accessed: 22 July 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Λάρισα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: larissa</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;39.634851,22.42097025&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isDeathPlaceOf</u>: Philo of Larissa</div>    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Anaxilaus of Larissa, Philo of Larissa</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/place/1224" target="_blank" rel="noopener">https://www.trismegistos.org/place/1224</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/396224PLar" target="_blank" rel="noopener">https://topostext.org/place/396224PLar</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://plei     ['<div class="terminologyEntry">    <div class="term">Leontinoi</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ancient Greek colony in Sicily. The sophist Gorgias was born in the Leontines.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> R.J.A. Wilson, Brady Kiesling, Sean Gillies, Valeria Vitale, Jeffrey Becker, Tom Elliott, DARMC, Jonathan Prag, and R. Talbert, &apos;Leontini: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/462279&gt; [accessed: 11 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Λεοντίνοι</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: leontinoi</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.285478,14.998115&apos;</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DL%3Aentry+group%3D5%3Aentry%3Dleontini-geo" target="_blank" rel="noopener">http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.04.0064%3Aalphabetic+letter%3DL%3Aentry+group%3D5%3Aentry%3Dleontini-geo</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/373150PLeo" target="_blank" rel="noopener">https://topostext.org/place/373150PLeo</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/462279" target="_blank" rel="noopener">https://pleiades.stoa     ['<div class="terminologyEntry">    <div class="term">Lesbos</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div>    <div class="textMediumMargin"><b>Comment</b>: An island of the northeastern Aegean Sea, Greece.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, G. Reger, S. Mitchell, R. Talbert, Sean Gillies, Tom Elliott, and Jeffrey Becker, &apos;Lesbos (island): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/550696&gt; [accessed: 15 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Λέσβος</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: lesbos</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;39.1776238819,26.2373333884&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Menedemus of Pyrrha</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/1242" target="_blank" rel="noopener">http://www.trismegistos.org/place/1242</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.geonames.org/258466/nisos-lesvos.html" target="_blank" rel="noopener">http://www.geonames.org/258466/nisos-lesvos.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/1242" target="_blank" rel="noopener">http://www.trismegistos.org/place/1242</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/" targe     ['<div class="terminologyEntry">    <div class="term">Locri Epizefiri</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div>    <div class="textMediumMargin"><b>Comment</b>: A colony founded by Greek Locrians on south shore of Italy (in today&apos;s Calabria region). Many philosophers are said to have originated from Locri, the best known of whom is Timaeus of Locri, who participates in Plato&apos;s dialogues (i.e. Timaeus and Critias) and is mentioned as a Pythagorean philosopher. Other philosophers originated from Locri are Timaratus, Arion, Eudicus et.al.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> I.E.M. Edlund Berry, A.M. Small, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Jeffrey Becker, Tom Elliott, DARMC, K. Bender, and R. Talbert, &apos;Lokroi Epizephyrioi: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/452369&gt; [accessed: 19 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Λοκροί Επιζεφύριοι</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: locri</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.2262955,16.2443395&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Gythius of Locri, Timaeus of Locri</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q3836325" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q3836325</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/33081" target="_blank" rel="noopener">http://www.trismegistos.org/place/33081</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/382162PLoc" target="_blank" rel="noopener">https://topostext.org/place/382162PLoc</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Locri" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Locri</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/452369" target="_blank" rel="noopener">https://pleiades.stoa.org/places/452369</a></div></div></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">Lucania</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div>    <div class="textMediumMargin"><b>Comment</b>: An ancient place of south Italy, place of origin of Aesara, a Pythagorean philosopher.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> I.E.M. Edlund Berry, A.M. Small, R. Talbert, Sean Gillies, Tom Elliott, and Jeffrey Becker, &apos;Lucania (region): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2020 &lt;https://pleiades.stoa.org/places/442639&gt; [accessed: 19 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Λευκανία</div>    <div class="textMediumMarginBlue">- el: Λουκανία</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: lucania</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;39.885,17.276944&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Philolaus</div>    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Aesara of Lucania, Aresas of Lucania, Occelo of Lucania, Occelus of Lucania, Occilus of Lucania, Aresandrus of Lucania</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/442639" target="_blank" rel="noopener">https://pleiades.stoa.org/places/442639</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.britannica.com/place/Lucania" target="_blank" rel="noopener">https://www.britannica.com/place/Lucania</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://el.wikipedia.org/wiki/%CE%9B%CE%BF%CF%85%CE%BA%CE%B1%CE%BD%CE%AF%CE%B1" target="_blank" rel="noopener">https://el.wikipedia.org/wiki/%CE%9B%CE%BF%CF%85%CE%BA%CE%B1%CE%BD%CE%AF%CE%B1</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Lyceum</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> A center for philosophy and systematic research in science and history organized there by Aristotle and his associates, which began as an informal group and lacked any legal status until Theophrastus, Aristotle’s colleague and principal heir, acquired land and buildings there c.315 B.C.<br>[R. Audi, The Cambridge Dictionary of Philosophy, Third edition, 2015]</div>    <div class="textItalicSmallMargin"><b>2)</b> It was best known for the Peripatetic school of philosophy founded there by Aristotle in 334 BC. Aristotle fled Athens in 323 BC, and the university continued to function after his lifetime under a series of leaders until the Roman general Sulla destroyed it during his assault on Athens in 86 BC.<br>Source: Wikipedia https://en.wikipedia.org/wiki/Lyceum_(classical)</div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Lyceum_(classical)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Lyceum_(classical)</a></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Λύκειο</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: lyceum</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d1/Sanzio_01_cropped.png" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://upload.wikimedia.org/wikipedia/commons/d/d1/Sanzio_01_cropped.png" target="_blank" rel="noopener">https://upload.wikimedia.org/wikipedia/commons/d/d1/Sanzio_01_cropped.png</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Magnesia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div>    <div class="textMediumMargin"><b>Comment</b>: Magnesia, a coastal region of Thessaly with a long peninsula extending into the Aegean, names the modern Greek regional unit.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> J. Fossey, J. Morin, R. Talbert, G. Reger, Sean Gillies, Tom Elliott, and Jeffrey Becker, &apos;Magnesia (region): a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/540923&gt; [accessed: 09 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Μαγνησία</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: magnesia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;39.5066786008,22.920519021&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Diocles of Magnesia, Pamphilus of Magnesia</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/540923" target="_blank" rel="noopener">https://pleiades.stoa.org/places/540923</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Mallos</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Antiochia ad Pyramum, Karataş, Mallus, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Mallos, also known as Antiochia ad Pyramum, was an ancient coastal city located in Cilicia.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> S. Mitchell, DARMC, R. Talbert, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Jeffrey Becker, and Tom Elliott, &apos;Mallos/Antiochia ad Pyramum: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/648702&gt; [accessed: 07 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Μαλλός</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: mallos</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;36.756188,35.4852&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Crates of Mallus, Heliodorus of Mallus, Moschion of Mallus, Proclus of Mallus</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Mallus" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Mallus</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/place/1300" target="_blank" rel="noopener">https://www.trismegistos.org/place/1300</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a     ['<div class="terminologyEntry">    <div class="term">Mantineia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Antigoneia, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Mantineia, also called Antigoneia, was an ancient Greek settlement known for two major battles: the largest land battle of the Peloponnesian War in 418 B.C. and the battle that ended Theban hegemony in 362 B.C.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> G. Reger, J. McK. Camp II, DARMC, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Jeffrey Becker, Tom Elliott, Catherine Bouras, and R. Talbert, &apos;Mantineia/Antigoneia: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/570459&gt; [accessed: 01 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Μαντίνεια</div>    <div class="textMediumMarginBlue">- el: Αντιγόνεια</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: mantineia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.6173785,22.3925775&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>residentedBy</u>: Aristoxenus of Tarentum</div>    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Lasthenia</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0064:entry=mantineia-geo" target="_blank" rel="noopener">http://www.perseus.tuft     ['<div class="terminologyEntry">    <div class="term">Marathon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div>    <div class="textMediumMargin"><b>Comment</b>: Marathon, a deme in northeastern Attica, was the site of the Battle of Marathon in 490 BC.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> J.S. Traill, Catherine Bouras, Brady Kiesling, Sean Gillies, Chris de Lisle, Jeffrey Becker, Tom Elliott, DARMC, R. Scott Smith, Pierre Motylewicz, R. Talbert, and Greta Hawes, &apos;Marathon: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2024 &lt;https://pleiades.stoa.org/places/580021&gt; [accessed: 02 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Μαραθώνας</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: marathon</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.1465515,23.970146&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Boethus of Marathon</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/place/37768" target="_blank" rel="noopener">https://www.trismegistos.org/place/37768</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Marathon,_Greece" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Marathon,_Greece</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q13423602" target="_blank" rel="noopener">https://www.wikidata.o     ['<div class="terminologyEntry">    <div class="term">Megalopolis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ancient settlement in Arcadia, Peloponnese, Greece. Aenesias, student of Theophrastus and Peripatetic philosopher came from Megalopolis.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> G. Reger, J. McK. Camp II, DARMC, R. Talbert, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Jeffrey Becker, and Tom Elliott, &apos;Megalopolis: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/570467&gt; [accessed: 19 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Μεγαλόπολη</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: megalopolis</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.414271211,22.1263961621&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Aenesias of Megalopolis, Cercidas of Megalopolis, Demophanes of Megalopolis, Demosthenes of Megalopolis, Ecdelus</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://referenceworks.brillonline.com/entries/brill-s-new-pauly/megalopolis-e729130" target="_blank" rel="noopener">https://referenceworks.brillonline.com/entries/brill-s-new-pauly/megalopolis-e729130</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.trismegistos.org/place/1327" target="_blank" rel="noopener">https://www.trismegistos.org/     ['<div class="terminologyEntry">    <div class="term">Nicomedia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">İzmit, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Nicomedia, rebuilt by Nicomedes I in 264 BC, was a key Roman administrative center and was located in today&apos;s Ismid, Turkey.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> C. Foss, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Jeffrey Becker, W. Röllig, Tom Elliott, H. Kopp, DARMC, R. Talbert, B. Siewert-Mayer, Francis Deblauwe, and Eric Kansa, &apos;Nicomedia: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/511337&gt; [accessed: 10 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ιζμίτ</div>    <div class="textMediumMarginBlue">- el: Νικομήδεια</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: nicomedia</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;40.7651905,29.919887&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Diogenes of Nicomedia, Euclides of Nicomedia</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.geonames.org/745028/izmit.html" target="_blank" rel="noopener">http://www.geonames.org/745028/izmit.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/408299PNik" target="_blank" rel="noopener">https://to     ['<div class="terminologyEntry">    <div class="term">Nineveh</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Mosul, Ninos, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Nineveh, now a suburb of modern Mosul, was a key religious center for the goddess Ištar, became Assyria&apos;s capital under Sennacherib in 704 B.C., and remained so until its destruction in 612 B.C. by a Babylonian-Median alliance.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> M. Roaf, T. Sinclair, S.E. Kroll, St J. Simpson, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Valeria Vitale, Jeffrey Becker, Carolin Johansson, Jamie Novotny, Tom Elliott, DARMC, Gabriel Bodard, R. Talbert, Francis Deblauwe, and Rune Rattenborg, &apos;Nineveh/Ninos: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/874621&gt; [accessed: 08 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Νινευή</div>    <div class="textMediumMarginBlue">- el: Μοσούλη</div>    <div class="textMediumMarginBlue">- el: Νινευί</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: nineveh</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;36.3607615238,43.1599368897&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Damis (student of Apollonius of Tyana)</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/N     ['<div class="terminologyEntry">    <div class="term">Rhegium</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div><div class="textMediumMargin"><b>allonym(s)</b>: <font color="blue">Reggio Calabria, Regium, Rhegion, </font></div>    <div class="textMediumMargin"><b>Comment</b>: Rhegion, originally settled in ancient times during the Bronze and Iron Ages, was later colonized by Chalcis around 730 or 743 BC, in modern Reggio di Calabria.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> I.E.M. Edlund Berry, A.M. Small, DARMC, R. Talbert, Brady Kiesling, Sean Gillies, Ryan Horne, Jeffrey Becker, and Tom Elliott, &apos;Rhegion/Regium: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2022 &lt;https://pleiades.stoa.org/places/452416&gt; [accessed: 19 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Ρήγιο της Καλαβρίας</div>    <div class="textMediumMarginBlue">- el: Ρήγιο</div>    <div class="textMediumMarginBlue">- el: Ρέτζο</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: rhegium</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;38.109279,15.64393&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Hipparchides of Rhegium, Mnesibulus of Rhegium, Aristides of Rhegium, Aristocrates of Rhegium</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/381156PRhe" target="_blank" rel="noopener">https://topostext.org/place/381156PRhe</a></div>    <div class= "externalLin     ['<div class="terminologyEntry">    <div class="term">Sparta</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div>    <div class="textMediumMargin"><b>Comment</b>: A prominent city-state in Laconia in ancient Greece. In antiquity, the city-state was known as Lacedaemon (Λακεδαίμων, Lakedaímōn), while the name Sparta referred to its main settlement on the banks of the Eurotas River in Laconia, in south-eastern Peloponnese. Around 650 BC, it rose to become the dominant military land-power in ancient Greece.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> G. Reger, J. McK. Camp II, DARMC, Brady Kiesling, Sean Gillies, Johan Åhlfeldt, Jeffrey Becker, Danielle Hoyer, Adam Rabinowitz, Tom Elliott, Catherine Bouras, Danielle Hoyer, R. Talbert, and Paul Cochran, &apos;Sparta: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/570685&gt; [accessed: 03 August 2024] </div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Σπάρτη</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: sparta</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordinates</u>: &apos;37.0818455246,22.4246825462&apos;</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isBirthPlaceOf</u>: Chilon of Sparta, Demetrius Lacon, Gorgus of Sparta, Autocharidas of Laconia, Timycha of Sparta, Cratesicleia of Sparta</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Sparta" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Sparta</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://topostext.org/place/371224PSpa" target="_blank" rel="noopener">https://topostext.org/place/371224PSpa</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.geonames.org/253394/sparta.html" target="_blank" rel="noopener">https://www.geonames.org/253394/sparta.html</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="http://www.trismegistos.org/place/2181" target="_blank" rel="noopener">http://www.trismegistos.org/place/2181</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q5690" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q5690</a></div>    <div class= "externalLinkIndividual">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/570685" target="_blank" rel="noopener">https://pleiades.stoa.org/places/570685</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Stagira</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">ancient greek place</font></div>    <div class="textMediumMargin"><b>Comment</b>: Ancient Greek city located near the eastern coast of the peninsula of Chalkidice, which is now part of the Greek province of Central Macedonia, in Greece. It is chiefly known for being the birthplace of Aristotle, the Greek philosopher and polymath, student of Plato, and teacher of Alexander the Great.</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> E.N. Borza, Brady Kiesling, R. Talbert, Johan Åhlfeldt, Jeffrey Becker, Tom Elliott, DARMC, G. Reger, and Sean Gillies, &apos;Stageira: a Pleiades place resource&apos;, Pleiades: A Gazetteer of Past Places, 2023 &lt;https://pleiades.stoa.org/places/501625&gt; [accessed: 19 August 2024] </div></div><div class="terminologyEntry">    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://pleiades.stoa.org/places/501625" target="_blank" rel="noopener">https://pleiades.stoa.org/places/501625</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://www.wikidata.org/wiki/Q846127" target="_blank" rel="noopener">https://www.wikidata.org/wiki/Q846127</a></div>    <div class= "externalLinkTerm">rdfs:seeAlso <a href="https://en.wikipedia.org/wiki/Stagira_(ancient_city)" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Stagira_(ancient_city)</a></div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: Στάγειρα</div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: stagira</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Ancient-Greek-Place&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>pleiadesCoordin function show_selected() {
    var selector = document.getElementById('idTerm');
    var champ = dictionnaire[selector[selector.selectedIndex].value][0];
    document.getElementById('display').innerHTML = champ;
}
document.getElementById('idTerm').addEventListener('change', show_selected);

searchBox = document.querySelector("#searchBox");
entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});

</script>
