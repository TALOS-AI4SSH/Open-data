    ['<div class="terminologyEntry">    <div class="term">philosopher</div>    <div class="definitionNL"><b>Definition</b>: Person philosopher.</div>    <div class="textMediumMargin"><b>Status</b>: preferred</div>    <div class="textMediumMargin"><b>Note(s)</b>: </div>    <div class="textItalicSmallMargin"><b>1)</b> “Philosophy” is a word invented by the ancient Greeks, most likely by Pythagoras in the late sixth century BCE. Before the time of Pythagoras, there was a lively tradition, shared with other literate cultures around the Mediterranean, of collections of “wisdom” literature (“Sophia”). In Greece, lists were made of outstanding contributors to such collections, that is, of “wise” people, or sophoi. The story goes that when Leon of Phlius asked Pythagoras what he was, he replied, “a philosophos,” a lover of or seeker for wisdom. <br>[A. Preus, Historical Dictionary of Ancient Greek Philosophy, 2007, p. 1]</div></div><div class="terminologyEntry">    <div class="textMediumMarginBlue"><b>Equivalent(s)</b>: </div>    <div class="textMediumMarginBlue">- el: φιλόσοφος (preferred)</div></div><div class="conceptEntry">    <div class="concept"><b>Concept</b>: &lt;Philosopher&gt;</div>    <div class="definitionFormal"><b>essential characteristic(s)</b>:  /person/, /philosopher/</div><div class="definitionFormal"><b>a kind of</b>: &lt;Person&gt;</div><div class="definitionFormal"><b>relation(s): </b> </div><div class="definitionFormal"> <u><i>stayedIn</i></u>: &lt;Place&gt;</div><div class="definitionFormal"> <u><i>pupilOf</i></u>: &lt;Person&gt;</div><div class="definitionFormal"> <u><i>teacherOf</i></u>: &lt;Person&gt;</div><div class="definitionFormal"> <u><i>authorOf</i></u>: &lt;Philosophical-Work&gt;</div><div class="definitionFormal"> <u><i>centuryOfLiving</i></u>: &lt;Period&gt;</div><div class="definitionFormal"> <u><i>memberOfPhilosophicalSchool</i></u>: &lt;School-of-Philosophy&gt;</div><div class="definitionFormal"> <u><i>mentionedBy</i></u>: &lt;Philosoph function show_selected() {
    var selector = document.getElementById('idTerm');
    var champ = dictionnaire[selector[selector.selectedIndex].value][0];
    document.getElementById('display').innerHTML = champ;
}
document.getElementById('idTerm').addEventListener('change', show_selected);

searchBox = document.querySelector("#searchBox");
entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});

</script>
