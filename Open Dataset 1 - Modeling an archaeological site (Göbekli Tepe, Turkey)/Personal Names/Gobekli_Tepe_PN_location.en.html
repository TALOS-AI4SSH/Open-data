<script language="JavaScript">
var dictionnaire = [
    ['<div class="terminologyEntry">    <div class="term">Enclosure A</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">enclosure</font></div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: enclosure A</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Enclosure&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: Enclosure A has a more rectangular and unusual shape in contrast with the other circular shapes of the rest of the enclosures.  Its pillars have mostly reliefs that depict snakes.</div>    <img src="https://whc.unesco.org/uploads/thumbs/site_1572_0007-1000-669-20180220154058.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>belongsToLayer</u>: Layer III</div>    <div class="attributeIndividual"> <u>hasPillar</u>: Pillar 1, Pillar 2</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://whc.unesco.org/uploads/thumbs/site_1572_0007-1000-669-20180220154058.jpg" target="_blank" rel="noopener">https://whc.unesco.org/uploads/thumbs/site_1572_0007-1000-669-20180220154058.jpg</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Enclosure B</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">enclosure</font></div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: enclosure B</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Enclosure&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: Enclosure B has 8 pillars in circular arrangement. This enclosure rarely has reliefs.</div>    <img src="https://whc.unesco.org/uploads/thumbs/site_1572_0008-1000-652-20180220154204.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>belongsToLayer</u>: Layer III</div>    <div class="attributeIndividual"> <u>hasPillar</u>: Pillar 10, Pillar 14, Pillar 15, Pillar 16, Pillar 6, Pillar 7, Pillar 8, Pillar 9</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://whc.unesco.org/uploads/thumbs/site_1572_0008-1000-652-20180220154204.jpg" target="_blank" rel="noopener">https://whc.unesco.org/uploads/thumbs/site_1572_0008-1000-652-20180220154204.jpg</a></div></div></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">Enclosure D</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">enclosure</font></div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: enclosure D</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Enclosure&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: In enclosure D, the 2 central pillars are surrounded by a ring formed by 11 smaller pillars, most of which are decorated with depictions of animals (such as foxes, boars, gazelles and larger carnivores), birds and snakes, as well as a wide variety of other representations.</div>    <img src="https://whc.unesco.org/uploads/thumbs/site_1572_0010-1000-668-20180220154419.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>belongsToLayer</u>: Layer III</div>    <div class="attributeIndividual"> <u>hasPillar</u>: Pillar 18, Pillar 30, Pillar 31, Pillar 33, Pillar 38, Pillar 43, Slab of Pillar</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://whc.unesco.org/uploads/thumbs/site_1572_0010-1000-668-20180220154419.jpg" target="_blank" rel="noopener">https://whc.unesco.org/uploads/thumbs/site_1572_0010-1000-668-20180220154419.jpg</a></div></div></div></div>'],

    ['<div class="terminologyEntry">    <div class="term">Enclosure F</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">enclosure</font></div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: enclosure F</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Enclosure&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: Enclosure F on the SW summit shares typical features of older PPNA  (Pre-pottery Neolithic A period)  structures. Its association with the enclosures of Layer III is not certain yet.</div>    <img src="https://whc.unesco.org/uploads/thumbs/site_1572_0015-1000-563-20180220155656.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>belongsToLayer</u>: Layer II</div>    <div class="attributeIndividual"> <u>hasPillar</u>: Pillar XXIV, Pillar XXVI, Pillar XXXVI, Pillar XXXV, Pillar XXV, Pillar XXXIV, Pillar XXXVII, Pillar XXXVIII</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://whc.unesco.org/uploads/thumbs/site_1572_0015-1000-563-20180220155656.jpg" target="_blank" rel="noopener">https://whc.unesco.org/uploads/thumbs/site_1572_0015-1000-563-20180220155656.jpg</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Enclosure G</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">enclosure</font></div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: enclosure G</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Enclosure&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: Enclosure  G is located in the main excavation area and shares typical features of older PPNA (Pre-pottery Neolithic A period) structures. Its association with the enclosures of Layer III is not certain yet.</div>    <img src="https://whc.unesco.org/uploads/thumbs/site_1572_0016-1000-1479-20180220155754.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>belongsToLayer</u>: Layer II</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://whc.unesco.org/uploads/thumbs/site_1572_0016-1000-1479-20180220155754.jpg" target="_blank" rel="noopener">https://whc.unesco.org/uploads/thumbs/site_1572_0016-1000-1479-20180220155754.jpg</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Enclosure H</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">enclosure</font></div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: enclosure H</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Enclosure&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: In enclosure H, 5 pillars of the surrounding ring have been exposed and a central pillar with a galloping feline has been excavated.</div>    <img src="https://whc.unesco.org/uploads/thumbs/site_1572_0017-1000-665-20180220155851.jpg" alt="unsupported format" style="width=175px;height:175px;">    <div class="objectEntry">    <div class="attributeIndividual"> <u>belongsToLayer</u>: Layer II</div>    <div class="attributeIndividual"> <u>hasPillar</u>: Pillar Enclosure H</div></div>    <div class="objectEntry">    <div class= "externalLinkIndividual">foaf:depiction <a href="https://whc.unesco.org/uploads/thumbs/site_1572_0017-1000-665-20180220155851.jpg" target="_blank" rel="noopener">https://whc.unesco.org/uploads/thumbs/site_1572_0017-1000-665-20180220155851.jpg</a></div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Enclosure I</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">enclosure</font></div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: enclosure I</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Enclosure&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry">    <div class="attributeIndividual"> <u>belongsToLayer</u>: Layer III</div></div></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Layer I</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">layer</font></div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: layer I</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Layer&gt;</font></div>    <div class="textMediumMargin"></div></div>'],
    ['<div class="terminologyEntry">    <div class="term">Layer II</div>    <div class="textMediumMargin"><b>is a</b>: <font color="blue">layer</font></div></div><div class="objectEntry">    <div class="objectEntry"><b>Denoted object</b>: layer II</div>    <div class="textMediumMargin"><b>is a</b>: <font color="green">&lt;Layer&gt;</font></div>    <div class="textMediumMargin">    <div class="objectEntry"><b>Comment</b>: It contains a series of rectangular rooms, probably sanctuaries. The numbers and size of the pillars are smaller than those of Layer II.</div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>isDatedTo</u>: 8000</div>    <div class="attributeIndividual"> <u>isDatedFrom</u>: -9000</div></div>    <div class="objectEntry">    <div class="attributeIndividual"> <u>hasRectangularBuilding</u>: Lion Pillar Building (Lowenpfeilergebaude), Snake Pillar Building (Schlangenpfeilergebaude)</div>    <div class="attributeIndividual"> <u>hasEnclosure</u>: Enclosure E, Enclosure F, Enclosure H, Enclosure G</div></div></div></div>'],

}

entries = document.querySelector("#idTerm");
var when = "keyup"; //You can change this to keydown, keypress or change

searchBox.addEventListener("keyup", function (e) {
    var text = e.target.value;
    var options = entries.options;
    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var optionText = option.text;
        var lowerOptionText = optionText.toLowerCase();
        var lowerText = text.toLowerCase();
        var regex = new RegExp("^" + text, "i");
        var match = optionText.match(regex);
        var contains = lowerOptionText.indexOf(lowerText) != -1;
        if (match || contains) {
            option.selected = true;
            show_selected();
            return;
        }
        searchBox.selectedIndex = 0;
    }
});
